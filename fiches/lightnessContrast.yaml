note_joint: 'Au joint de deux parties, le contraste de couleur n’est pas un type propre : on écrit une assertion de contraste de clarté (ou de teinte) dont les deux termes sont les deux parties qui se rejoignent
  (spec §9.7 A). Exemple : le joint entre un plateau clair et un piétement sombre a un contraste de clarté évident ; le joint lui-même a, en plus, un espacement (ppp:jointSpacing) et un décalage de niveau
  (ppp:jointLevelOffset).'
