etat_de_l_art: 'Le contraste de clarté entre deux zones touche à la perception du clair et du sombre, sujet du livre de Gilchrist (2006) [[gilchrist2006]], dont le résumé rappelle que la lumière renvoyée
  par une surface ne dit pas sa nuance de gris (livre non lu). Tamura, Mori et Yamawaki (1978) [[tamura1978]] ont une mesure de contraste calculée sur une image, rapprochée de ce type. Albers (*Interaction
  of Color*, 1963) [[albers1963]] est un ouvrage repéré sur l''interaction des couleurs (titre ; contenu non lu). Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-contrastes
axiomes:
- conceptuel: Tout contraste particulier médie exactement deux termes.
  validation: Toute assertion de type ppp:lightnessContrast a exactement deux ppp:about, chacun avec un ppp:role.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Tout contraste de clarté est un contraste perceptif dont la dimension comparée est ppp:lightness.
  validation: Toute assertion de type ppp:lightnessContrast relève aussi de ppp:perceptualContrast ; elle ne déclare pas de ppp:comparedDimension, ou déclare ppp:lightness.
nanay: Oui — passer de « deux couleurs » à « l’écart de clarté entre elles » modifie la description (ce qui se détache à distance, ce qui se fond).
