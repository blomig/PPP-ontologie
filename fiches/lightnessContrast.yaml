# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:lightnessContrast
label_fr: contraste de clarté
label_en: lightness contrast
label_court: contraste de clarté
labels_alternatifs: []
patron: P2
sorte: relateur
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:lightness
  facteurs_non_perceptuels: []
facettes:
- couleur
- organisation
définition: 'Différence perçue entre deux zones, parties ou objets sur une seule qualité, la clarté : combien chacun paraît clair ou sombre, quelle que soit sa couleur ; de deux gris presque identiques
  au noir contre le blanc.'
question_attentionnelle: Si l’on ne regarde que le clair et le sombre (comme sur une photo en noir et blanc), la différence entre ces deux zones est-elle faible (deux gris voisins), modérée (un gris moyen
  sur un gris clair), évidente (un gris foncé sur un fond clair) ou maximale (du noir sur du blanc) ?
contre_exemple: 'Un rouge et un vert qui donneraient le même gris sur une photo en noir et blanc diffèrent fortement de teinte, mais leur contraste de clarté est faible. Une surface claire unie, prise seule,
  a une clarté élevée : ce n’est pas un contraste, il faut une seconde zone.'
grandeur_physique_homonyme: '« contraste » désigne aussi le contraste de luminance, calculé à partir des luminances de deux plages ou, localement, sur une image (voir la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: Une différence de clarté entre deux zones peut se calculer à partir de mesures colorimétriques de chacune (écart de L*), et un contraste de luminance se mesure au luminancemètre ou sur une image.
    Le premier vise un aspect proche de ce type ; le second porte sur la luminance, pas sur la clarté perçue, et n’est bien défini que pour des images simples [[peli1990]]. Ni l’un ni l’autre ne saisit
    l’entourage, l’éclairage de l’épisode ou la distance entre les zones.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie_ilv_cielab
    nom: écart de clarté L* entre deux zones
    grandeur: différence entre les clartés L* calculées pour chaque zone (CIELAB)
    unite_ou_echelle: unités L* (0 pour le noir, 100 pour le blanc de référence, e-ILV 17-23-076)
    references:
    - cie_ilv_cielab
    - cie015
    proximite: proche
    ecart: compare deux valeurs calculées pour un observateur et un illuminant de référence, sur des échantillons isolés ; ne saisit ni l’entourage, ni l’éclairage de l’épisode, ni la distance entre les
      zones, qui changent la clarté perçue de chacune
    conditions: géométries d’éclairage et d’observation, observateur et illuminant normalisés, pour chacune des deux zones
    statut_lecture: résumé public lu (CIE 015:2018) ; e-ILV lu (17-23-076)
  - id: peli1990
    nom: contraste de luminance
    grandeur: 'contraste de luminance, calculé à partir des luminances de deux plages ou, localement, sur une image'
    unite_ou_echelle: 'nombre sans dimension'
    references:
    - peli1990
    proximite: indirecte
    ecart: porte sur la luminance, pas sur la clarté perçue ; bien défini et en accord avec le contraste perçu pour des images simples (réseau, plage sur fond uniforme), pas pour des images complexes ;
      ne saisit ni l’observateur, ni l’entourage, ni la distance
    conditions: luminances mesurées (luminancemètre ou image calibrée) ; image simple
    statut_lecture: résumé lu (Peli 1990, Crossref et OpenAlex)
  non_retenues:
  - nom: différence de couleur ΔE*ab (CIELAB)
    references:
    - cie_ilv_cielab_difference
    raison: 'différence globale de couleur (distance euclidienne dans CIELAB), qui mêle la clarté, le chroma et la teinte : elle ne sépare pas la qualité que juge ce type'
    statut_lecture: e-ILV lu (17-23-077)
  - nom: calcul des tolérances et petites différences de couleur (ASTM D2244)
    references:
    - astm_d2244
    raison: pratique conçue pour des tolérances et de petites différences entre éprouvettes opaques comparées côte à côte, alors que le type va jusqu’aux différences les plus fortes ; la norme note elle-même
      que la proximité des éprouvettes, le brillant et la texture changent le lien entre différence mesurée et acceptabilité
    statut_lecture: 'résumé public lu (Scope sections 1.1 et 1.2, Significance and Use sections 5.1 et 5.2)'
