note_echelle: 'quatre régions, comme pour l’amer, au féminin. ISO 3972 ne donne pas de solution pour l’astringence ; le repère retenu pour « nette » est l’alun à 1 g/l, recommandé comme matériau de référence (Lee et Lawless, 1991 [[lee_lawless1991]]) ; des repères de région plutôt que des exemplaires, comme décidé le 2026-10-19. Choix de relecture (2026-11-20) : le cran « nette » est gardé pour l’alun à 1 g/l, et non « forte » : le résumé de Lee et Lawless dit « pronounced » (marqué), qui ne dit pas « fort » ; sur les courbes de la figure 1 de Fleming et al. (2016) [[fleming2016]], lues approximativement, la note d’astringence d’ensemble de l’alun de 1,5 à 6 g/l va d’environ 11 à environ 18 sur une échelle générale d’intensité (gLMS : « faible » 6, « modérée » 17, « forte » 35, ce dernier cran valant pour toutes les sensations, et « astringence » y étant définie par des aliments, non par un étalon), ce qui n’est qu’indicatif et ne place aucun cran de la fiche ; le cran reste douteux, puisqu’aucune source lue ne le confirme et que 1 g/l est sous la plage testée. Plusieurs sous-qualités (sécheresse, râpeux, bouche qui se resserre) sont réunies ici ; des types distincts pourraient les séparer si l’épreuve d’accord ne passe pas, et le calage d’un seul cran d’intensité ne tranche pas ce point. Comme décidé le 2026-11-02, la solution d’alun est préparée dans l’eau neutre d’ISO 3972 [[iso3972]] (5.1), vers 20 °C (7.2 d). Sa forme est un choix de protocole (choix de relecture (2026-11-20)) : sulfate d’aluminium et de potassium dodécahydraté de qualité alimentaire (E 522, masse molaire 474,38 g/mol, d’après l’avis de l’EFSA de 2018 [[efsa2018]]) ; c’est la forme retenue pour la préparation, non donnée par les sources lues (Lee et Lawless ne la précisent pas dans leur résumé), à confirmer par l’épreuve d’accord ; le cran « aucune » est calé sur cette eau. Les crans « à peine perceptible » et « forte » ne sont pas calés : aucune source lue ne donne de solution pour l’un ni pour l’autre, et l’alun n’est pas interchangeable avec les tanins (un acide baisse l’astringence de l’alun et augmente celle des composés phénoliques : Peleg et al., 1998 [[peleg1998]]), si bien qu’un repère d’alun peut mal représenter un thé ou un vin ; aucune autre substance n’est proposée à goûter, et le repère n’est pas un aliment. Les candidats sont des suppositions à éprouver, chacun marqué `doute: oui` dans son épisode : pour « à peine perceptible », des dilutions à 0,125, 0,25 et 0,50 g/l de la solution à 1 g/l ; pour « forte », des solutions à 3,00 g/l, puis 4,50 g/l au besoin, 6,00 g/l restant en réserve ; la solution à 1,50 g/l sert de contrôle pour « nette » (épisode 10) et n’est pas candidate à « forte ». Ces concentrations viennent de la série publiée de Fleming et al. (2016), reprises comme candidates et non comme crans ; leur protocole n’est pas repris (gorgées de 10 ml, eau d’osmose inverse, au moins 2 min entre deux prises ; ici, 15 ml, eau d’ISO 3972, 5 min) ; les quatre régions de la fiche sont ordonnées entre elles et ne sont pas rapportées aux crans de l’échelle générale d’intensité, et l’on ne convertit pas l’une dans l’autre ; il se peut qu’aucune de ces concentrations ne soit jugée « forte » par les observateurs. Critères écrits avant la séance de calage : « à peine perceptible » serait la plus forte des dilutions sous 1 g/l que tous les observateurs distinguent de l’eau et que les deux tiers au moins jugent « à peine perceptible » ; « forte » serait la plus faible des candidates (3,00 g/l, puis 4,50 g/l, puis 6,00 g/l si besoin) que les deux tiers au moins jugent « forte » et que tous jugent au moins « nette » ; « nette » serait la concentration que les deux tiers au moins jugent « nette » : si le 1 g/l n’est pas jugé « nette » par les deux tiers au moins, le cran « nette » est recalé sur la concentration qui répond à ce critère, sans préjuger de laquelle ; si aucune concentration ne remplit ces conditions, aucun repère n’est fixé. La décision se prend sur le dépouillement, selon ces critères et sur l’effectif annoncé avant la séance. La sensation pouvant s’accumuler d’une prise à l’autre (Green, 1993 [[green1993astr]]), l’ordre est croissant, les séances sont limitées, et les crans calés vaudront pour les conditions déclarées (`avant`, délai de jugement), non « en soi ».'
identite: 'La force avec laquelle la bouche elle-même se sèche, râpe ou se resserre, état cumulatif qui reste après la gorgée ; pas une saveur (amer, acide en réserve), pas une texture de la bouchée (dureté
  en bouche, épaisseur en bouche : une résistance à la mastication), pas la longueur (une durée de trace), pas l’agrément.'
