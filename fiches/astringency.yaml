remarque:
- 'série 119 bis (choix de relecture (2026-11-20), corrections de la série 119) : phrase « entre faible et modérée » revenue dans `motif_doute` du repère « nette » (FR, EN) remplacée par la lecture approximative de la figure 1 de Fleming et al. (2016), indicative ; « forte » : candidats 3,00 puis 4,50 g/l, 6,00 g/l en réserve, 1,50 g/l contrôle de « nette », plus aucune phrase sur un 1 g/l qui relèverait de « forte » ; régions ordonnées entre elles, non rapportées aux crans de l’échelle générale ; critère de « nette » recalable sur la concentration qui y répond ; manques complété ; à relire'
- 'série 119 (choix de relecture (2026-11-20), repères candidats et épisodes) : forme de l’alun déclarée comme choix de protocole (dodécahydraté de qualité alimentaire, E 522 ; identité et masse molaire vérifiées sur l’avis de l’EFSA 2018, texte lu en partie), non donnée par les sources lues ; « à peine perceptible » et « forte » : des candidats à éprouver (0,125, 0,25, 0,50 g/l ; 3,00, 4,50 g/l, 6,00 g/l en réserve ; 1,50 g/l contrôle de « nette » : corrigé en 119 bis), sans préparation déclarée dans le repère de région, pour qu’une valeur sans source ne compte pas comme repère calé ; critères de décision écrits dans la note de l’échelle ; six épisodes « à réaliser » ajoutés (07 à 12 : les épisodes 01 à 06 d’un document de travail ne sont pas dans le dépôt) ; acide tannique et vin tannique exclus des épisodes ; références ajoutées : EFSA 2018, Peleg et al. 1998 ; à relire'
- 'série 118 bis (choix de relecture (2026-11-20), corrections de la série 118) : citation de Fleming et al. (2016) complétée (41(7), 601–610, vérifiés sur PubMed et PMC) ; Drobna et al. (2004) : formulation corrigée (« étalon proposé pour l’évaluation sensorielle du thé noir ») ; lecture de Fleming reformulée : lecture approximative de la figure 1 (astringence d’ensemble, gLMS), indicative seulement, plus aucune formule qui place « forte » au-dessus de 6 g/l ; lecture à refaire (manques) ; à relire'
- 'série 118 (choix de relecture (2026-11-20), repères et relecture explicative) : cran « nette » gardé pour l’alun à 1 g/l (« pronounced » ne dit pas « fort » ; lecture approximative de la figure 1 de Fleming et al., 2016, indicative seulement) avec `doute: oui` et un motif mis à jour ; forme de l’alun toujours non déclarée par une source lue ; repères « à peine perceptible » et « forte » non calés (aucune source lue ne donne de solution) ; échelle étiquetée et alun du thé noir classés non retenus ; relation avec l’épaisseur ou la dureté en bouche : aucune écrite ; vingt champs relus en langage courant ; la fiche reste en préparation'
- 'série 116 (choix de relecture (2026-11-17), préparation de la relecture explicative) : état de l’art ramené à cinq phrases avec le statut de lecture de chaque source ; revue de Wang et al. (2024) ajoutée (résumé lu) ; mesures de laboratoire classées non retenues (aucune norme) ; renvois internes retirés de note_echelle et note_conditions ; repères « à peine perceptible » et « forte » toujours à caler ; à relire'
- 'série 78 bis (choix de relecture (2026-10-20), corrections de relecture) : cran « nette » de l’alun provisoire, « forte » possible (repère, note_echelle, manques) ; à relire'
- 'série 90 (choix de relecture (2026-11-02), suivant la décision de l’éditeur du projet (2026-11-02) : « B : les repères de région (solutions ISO 3972, alun 1 g/l) ») : eau et alun à 1 g/l calés (Lee et Lawless 1991, résumé relu ; eau et température d’ISO 3972, ajoutée aux références) ; à relire'
