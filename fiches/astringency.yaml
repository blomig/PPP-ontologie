etat_de_l_art: 'L’astringence se sent même entre la gencive et la lèvre, où il n’y a pas de papilles, et diminue quand on lubrifie la bouche : c’est surtout un toucher (Breslin et al., 1993 [[breslin1993]]).
  Green (1993) [[green1993astr]] l’attribue à une hausse du frottement, quand les protéines de la salive précipitent ; elle s’accumule d’une gorgée à l’autre. Lee et Lawless (1991) [[lee_lawless1991]] y
  distinguent plusieurs sous-qualités, notées pendant cinq à six minutes, et recommandent l’alun à 1 g/l comme matériau de référence ; Bajec et Pickering (2008) [[bajec2008]] en font la revue. Dans un vin
  modèle, l’éthanol et le pH changent l’astringence (Fontoin et al., 2008 [[fontoin2008]]). La seule mesure associée trouvée, ISO 14502-1:2005 [[iso14502_1]], porte sur les polyphénols du thé ; le temps-intensité
  (ASTM E1909-24 [[astm_e1909]]) et la TDS (Pineau et al., 2009 [[pineau2009]]) sont des jugements de jury. Aucune source lue ne teste l’accord entre observateurs sur des crans d’astringence. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:astringency a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je bois ce thé » à « je regarde si ma bouche se sèche ou râpe » change la description (on suit l’état de la bouche après la gorgée, et non ce qu’on goûte).
transfert: objet conçu oui (une boisson, une infusion, un vin) | tableau non | cuisine oui (vin rouge jeune, thé fort, kaki pas mûr) | high-tech non | architecture non
enonces_testables:
- id: E1
  nature: existence
  enonce: 'sur 6 à 10 produits identifiés (portions du même lot, au même moment), accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales (`avant`
    : première prise ou après rinçage ; spec §9.7 H, règle 12), la solution d’alun de référence goûtée avant de juger, à temps égal après la prise'
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les produits (ceux qui aiment et ceux qui n’aiment pas)
  statut_epistemique: non éprouvé
  epreuve: null
