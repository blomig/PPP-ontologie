statut_note: 'en préparation (2026-11-20) : vingt champs relus en langage courant le 2026-11-20 ; restent à relire la mesure, les repères et la note d’échelle, les références, l’état de l’art, les énoncés testables, les épisodes à réaliser et ce statut ; les repères « à peine perceptible » et « forte » ne sont pas calés (des candidats à éprouver sont proposés), le cran « nette » est douteux, aucune épreuve d’accord ; six épisodes à réaliser, aucun encore réalisé'
