# Fiche de type PPP — ppp:astringency — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:astringency
label_fr: astringence
label_en: astringency
labels_alternatifs: []
labels_alternatifs_en: []
note_label_alternatif: '« sec » est écarté des labels : un biscuit sec manque d’eau (texture), un vin « sec » au sens courant est peu sucré (saveur) ; seul un vin qui « assèche » la bouche est astringent
  (proposition « Goût », 2.7).'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- gout
définition: 'La force avec laquelle la bouche se sèche, râpe ou se resserre après avoir goûté une portion du produit (vin tannique, thé fort) : un toucher en bouche, et non une saveur.'
question_attentionnelle: Après la gorgée ou la bouchée, la bouche se sèche-t-elle, râpe-t-elle, se resserre-t-elle ? À peine, nettement, ou fortement ?
contre_exemple: 'Ce n’est pas l’amer : l’astringence se sent même entre la gencive et la lèvre, où il n’y a pas de papilles. Ce n’est pas une texture : la texture est une résistance de la bouchée quand
  on la mâche ; l’astringence est un état de la bouche, qui reste après que l’aliment est parti et s’accumule d’une gorgée à l’autre. « Ce thé est nettement astringent, et c’est un défaut » se dit comme
  « …et c’est une qualité ».'
grandeur_physique_homonyme: 'la teneur en polyphénols totaux (« tanins ») d’un thé ou d’un vin [[iso14502_1]] : une composition, pas l’astringence perçue ; aucune région ne s’en déduit. Voir la rubrique
  « mesure ».'
mesure:
  etat: methodes
  synthese: 'Une mesure associée indirecte existe pour le thé seulement : les polyphénols totaux par la méthode au réactif de Folin-Ciocalteu (ISO 14502-1). Les polyphénols totaux ne sont pas l’astringence
    perçue. Les mesures physiques (frottement, précipitation des protéines salivaires) sont citées par une revue, mais non lues. Aucune méthode proche n’est connue (recherche du 2026-10-19).'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso14502_1
    nom: polyphénols totaux du thé, méthode colorimétrique au réactif de Folin-Ciocalteu (ISO 14502-1:2005)
    grandeur: absorbance à 765 nm
    unite_ou_echelle: équivalent acide gallique, en % de la matière sèche
    references:
    - iso14502_1
    proximite: indirecte
    ecart: les polyphénols totaux ne sont pas l’astringence perçue ; le réactif répond à un large éventail de composés, avec des réponses variables (la norme le dit) ; thé seulement (feuilles et thé instantané,
      vert et noir)
    conditions: celles de la norme
    statut_lecture: 'extraits (aperçu public : domaine, principe, réactifs ; page de l’ISO : confirmée en 2025)'
  non_retenues:
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - lee_lawless1991
    - pineau2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1) ; le guide ASTM suit une seule sensation après une seule prise, ce qui exclut les prises
      répétées
    statut_lecture: extrait d’index (page de l’ASTM) ; résumés (Lee et Lawless, 1991 ; Pineau et al., 2009)
  - nom: mesures physiques (frottement, précipitation des protéines salivaires)
    references:
    - bajec2008
    raison: 'citées par une revue, non lues : non vérifié'
    statut_lecture: non vérifié (revue lue en résumé seulement)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- avant
note_conditions: 'règle 12 (spec §9.7 H) : `avant` est critique, parce que l’astringence s’accumule d’une gorgée à l’autre (Green, 1993 [[green1993astr]]) ; on suit l’ordre des gorgées avec cette facette.
  `moment` n’est pas critique (proposition « Goût », 5.1). `nez` n’est pas critique (ce n’est pas une saveur) ; `temperature_bouchee` est à éprouver. `duree` : les sous-qualités se notent pendant cinq à
  six minutes et décroissent à peu près de façon exponentielle (Lee et Lawless, 1991 [[lee_lawless1991]]) : le temps entre la prise et le jugement est déclaré. La salive va en note d’épisode.'
porteur: le produit identifié dont on goûte une portion (nature, origine, lot, date de production ou d’ouverture, conservation, concentration pour une boisson préparée) ; la portion goûtée n’est pas le
  porteur
note_porteur: même porteur que les types de saveur (proposition « Goût », section 6 ; choix de relecture du 2026-10-19, 8.1 point 4), bien que l’astringence soit un toucher et qu’elle se sente sur la bouche
  elle-même.
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `none` (rang 1) vers `strong` (rang 4), la bouche se sèche, râpe ou se resserre de plus en plus
  numerique: non
  regions:
  - cle: none
    label_fr: aucune
    label_en: none
    rang: 1
    repere: 'de l’eau neutre : la bouche reste comme avant'
    exemplaires: []
  - cle: faint
    label_fr: à peine perceptible
    label_en: faint
    rang: 2
    repere: aucun repère fixé (à choisir avant l’épreuve, par dilution de la solution d’alun du cran « nette » ?)
    exemplaires: []
  - cle: distinct
    label_fr: nette
    label_en: distinct
    rang: 3
    repere: une solution d’alun à 1 g/l, matériau de référence peu amer et peu acide mais nettement asséchant (cran provisoire, à caler avant E1 ; « forte » reste possible)
    exemplaires: []
  - cle: strong
    label_fr: forte
    label_en: strong
    rang: 4
    repere: aucun repère fixé (à choisir avant l’épreuve)
    exemplaires: []
note_echelle: 'quatre régions, comme pour l’amer, au féminin (proposition « Goût », 2.4). ISO 3972 ne donne pas de solution pour l’astringence ; le repère proposé est l’alun à 1 g/l, recommandé comme matériau
  de référence (Lee et Lawless, 1991 [[lee_lawless1991]] ; décision 5 de l’éditeur du projet, 2026-10-19). Le cran « nette » est un choix de relecture provisoire (2026-10-20), à caler avant E1 : le résumé
  de la source dit que l’alun à 1 g/l produit des sensations « pronounced » (asséchantes, râpeuses, qui resserrent la bouche), si bien que le cran « forte » reste possible (choix de relecture (2026-10-20),
  série 78 bis). Plusieurs sous-qualités (sécheresse, râpeux, bouche qui se resserre) sont réunies ici ; un deuxième lot pourrait les séparer si l’épreuve E1 ne passe pas.'
identite: 'La force avec laquelle la bouche elle-même se sèche, râpe ou se resserre, état cumulatif qui reste après la gorgée ; pas une saveur (amer, acide en réserve), pas une texture de la bouchée (dureté
  en bouche, épaisseur en bouche : une résistance à la mastication), pas la longueur (une durée de trace), pas l’agrément.'
