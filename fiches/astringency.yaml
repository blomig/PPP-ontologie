episodes_a_realiser:
- id: ppp-a:ep-astringency-07
  realisation: a_realiser
  region_attendue: faint
  objet: 'solution d’alun (sulfate d’aluminium et de potassium dodécahydraté) à 0,125 g/l dans l’eau neutre, vers 20 °C'
  objet_en: 'alum solution (aluminium potassium sulphate dodecahydrate) at 0.125 g/l in neutral water, at about 20 °C'
  preparation: 'sulfate d’aluminium et de potassium dodécahydraté de qualité alimentaire (E 522), AlK(SO4)2·12H2O ; forme, lot et qualité notés ; solution mère à 1,00 g/l pesée au centième de gramme dans l’eau neutre, plate, sans goût ni odeur, de dureté connue de préférence (ISO 3972, 5.1), vers 20 °C (7.2 d) ; dilution au huitième dans la même eau (125 ml de mère complétés à 1 l) ; préparée le jour même'
  preparation_en: 'food-grade aluminium potassium sulphate dodecahydrate (E 522), AlK(SO4)2·12H2O; form, batch and grade noted; stock solution at 1.00 g/l weighed to the hundredth of a gram in neutral still water, tasteless and odourless, preferably of known hardness (ISO 3972, 5.1), at about 20 °C (7.2 d); diluted eightfold in the same water (125 ml of stock made up to 1 l); prepared the same day'
  consigne: 'Prenez la gorgée, faites-la passer dans toute la bouche environ 5 s, recrachez, puis attendez 15 s sans boire. La bouche se sèche-t-elle, râpe-t-elle, se resserre-t-elle ? Pas du tout, à peine, nettement, ou fortement ? Ne jugez ni l’amer ni l’acide.'
  consigne_en: 'Take the sip, move it around the whole mouth for about 5 s, spit it out, then wait 15 s without drinking. Does your mouth dry, feel rough or pucker? Not at all, faintly, distinctly, or strongly? Judge neither bitterness nor sourness.'
  conditions:
    presentation: unknown
    lumiere: unknown
    distance: contact
    angle: unknown
    duree: exam
    nez: open
    temperature_bouchee: ambient
    avant: afterRinse
    moment: residual
    yeux: ouverts
    yeux_en: open
    note: 'série basse, ordre croissant : eau neutre (première prise de la séance), 0,125, 0,25, 0,50, puis 1,00 g/l ; `avant` suit cet ordre ; gorgée d’environ 15 ml, tenue environ 5 s dans toute la bouche puis recrachée dans un crachoir individuel ; jugement 15 s après avoir recraché ; rinçage à l’eau neutre vers 20 °C, puis pause de 5 min entre deux prises ; ordre croissant (l’astringence s’accumule d’une prise à l’autre) ; gobelets à code de trois chiffres, préparateur différent de l’observateur ; solution incolore ; sécurité : adultes volontaires seulement, hors mineurs, personnes enceintes ou qui allaitent ; arrêt libre dès une gêne ; six prises au plus par séance ; une seule série au-dessus de 1 g/l par jour ; solutions étiquetées, jamais confondues avec l’eau de boisson'
    note_en: 'low series, ascending order: neutral water (first sample of the session), 0.125, 0.25, 0.50, then 1.00 g/l; `avant` follows that order; sip of about 15 ml, held about 5 s around the whole mouth then spat into an individual spittoon; judgement 15 s after spitting; rinse with neutral water at about 20 °C, then a 5 min break between two samples; ascending order (astringency builds up from one sample to the next); cups with a three-digit code, preparer different from the observer; colourless solution; safety: adult volunteers only, not minors, pregnant or breastfeeding people; free to stop at the first discomfort; six samples at most per session; one series above 1 g/l per day only; solutions labelled, never mixed up with drinking water'
  doute: oui
  motif_doute: 'aucune source lue ne place 0,125 g/l à un cran ; cette dilution peut ne pas être distinguée de l’eau'
  motif_doute_en: 'no source read places 0.125 g/l at a scale step; this dilution may not be distinguished from water'
  note: 'candidate de la série de calage du cran « à peine perceptible » (facteur 2 à partir de 1 g/l) ; critères écrits dans la note de l’échelle'
  note_en: 'candidate in the calibration series for the “faint” step (factor of 2 from 1 g/l); criteria written in the scale note'
  texte_fr: 'Une solution d’alun à 0,125 g/l : la bouche se sèche à peine (prédiction, à éprouver ; peut aussi n’être pas distinguée de l’eau).'
  texte_en: 'A 0.125 g/l alum solution: the mouth dries faintly (prediction, to be tested; it may also not be distinguished from water).'
