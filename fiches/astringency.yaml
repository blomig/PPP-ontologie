manques:
- 'exemplaires : aucun. Décidé le 2026-10-19 : pas d’exemplaire pour le goût dans la première version, des repères de région à la place. Si des exemples sont cherchés plus tard, ce seront des objets publics seulement (produits identifiés, sans marque citée), jamais des objets privés ; six épisodes « à réaliser » (episodes_a_realiser), des solutions d’alun, portent le calage des repères : ils ne sont pas des exemplaires d’aliments et aucun n’est réalisé'
- 'épreuve d’accord à faire : portions du même lot, au même moment, repères de région goûtés avant de juger (proposition « Goût »)'
- 'repère « à peine perceptible » : non calé ; aucune source lue ne donne de solution (alun ou autre) jugée « à peine perceptible » ; candidats, à éprouver : dilutions à 0,125, 0,25 et 0,50 g/l de la solution à 1 g/l (épisodes 07 à 09) ; critères de décision dans la note de l’échelle ; effectif des observateurs du calage à fixer avant la séance (choix de relecture (2026-11-20))'
- 'repère « forte » : non calé ; aucune source lue ne place une concentration d’alun à ce cran ; candidats, à éprouver : 3,00 g/l, puis 4,50 g/l au besoin (épisodes 11 et 12), 6,00 g/l en réserve, non déposé ; 1,50 g/l (épisode 10) sert de contrôle pour « nette » ; la lecture approximative des courbes de Fleming et al. (2016) (environ 11 à 18 sur le gLMS pour l’alun de 1,5 à 6 g/l) n’est qu’indicative, sur une échelle générale, sans lien établi avec les régions de la fiche : elle laisse penser que « forte » pourrait demander plus de 4,50 g/l (supposition, non un fait) ; il se peut qu’aucune de ces concentrations ne soit jugée « forte » par les observateurs (choix de relecture (2026-11-20))'
- 'lecture de la figure 1 de Fleming et al. (2016) à refaire : valeurs d’alun lues approximativement sur les courbes (astringence d’ensemble, moyennes du groupe) ; les moyennes de chaque point ne sont pas transcrites dans le texte lu ; échelle générale d’intensité, donc indicative seulement ; discussion de l’article non lue (choix de relecture (2026-11-20))'
- 'cran « nette » (alun à 1 g/l) douteux, marqué `doute: oui` : gardé de préférence à « forte » (« pronounced » dans le résumé de Lee et Lawless ; texte non lu), mais 1 g/l est sous la plage testée par Fleming et al. (2016) ; forme de l’alun : choix de protocole (dodécahydraté de qualité alimentaire, E 522, d’après l’avis de l’EFSA de 2018), non donné par les sources lues, à confirmer par l’épreuve d’accord (choix de relecture (2026-11-20)) ; le texte de Lee et Lawless (1991) pourrait la donner'
- 'acide tannique et vin tannique : non proposés à goûter, hors épisodes (substance non alimentaire d’un côté ; de l’autre alcool, et aucune source lue ne place un vin à « forte ») ; l’alun et les tanins ne sont pas interchangeables (Peleg et al., 1998) : un repère d’alun peut mal représenter un thé ou un vin (choix de relecture (2026-11-20))'
- 'relation avec l’épaisseur en bouche ou la dureté en bouche : aucune écrite ; aucune source lue ne la soutient avec un type de relation du patron (le résumé de Smith et al., 1996, seul lu, dit que l’épaississement d’une solution de tanin baisse l’astringence jugée ; Gawel et al., 2000, texte en libre accès lu en partie, non en entier, listent les sensations comme distinctes) ; à trancher par une relecture humaine (choix de relecture (2026-11-20))'
- 'mesures physiques de l’astringence (frottement, précipitation des protéines salivaires) : non lues'
