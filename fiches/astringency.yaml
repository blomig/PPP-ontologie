    - lee_lawless1991
    - pineau2009
    raison: 'jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord ; le guide ASTM suit une seule sensation après une seule prise, ce qui exclut les prises répétées'
    statut_lecture: extrait d’index (page de l’ASTM) ; résumés (Lee et Lawless, 1991 ; Pineau et al., 2009)
  - nom: échelle générale d’intensité appliquée à des solutions (alun, acide tannique, acide malique) et alun à 0,7 g/l comme étalon proposé pour l’évaluation sensorielle du thé noir
    references:
    - fleming2016
    - drobna2004
    raison: 'un jugement de jury (échelle générale d’intensité gLMS, de « à peine détectable » à « la plus forte sensation imaginable », dont « forte » vaut pour toutes les sensations et où « astringence » est définie par des aliments) et un étalon de matière apparié à un produit (l’alun à 0,7 g/l, retenu pour l’évaluation sensorielle du thé noir parce qu’il est peu amer et peu acide) ; ni l’un ni l’autre ne se rapporte à une référence physique normalisée, et aucun ne donne un niveau sur l’échelle à quatre régions de la fiche ; utiles pour situer des solutions, mais ils ne définissent pas une région'
    statut_lecture: 'Fleming et al. (2016) : texte en libre accès lu en partie (méthode, résultats, figure 1 lue approximativement ; discussion non lue) ; Drobna et al. (2004) : résumé lu le 2026-11-20 ; texte non lu'
  - nom: mesures de laboratoire (frottement, indice de précipitation des protéines de la salive)
    references:
    - bajec2008
    - wang2024astr
    raison: 'méthodes de recherche sans norme ni référence physique normalisée ; chacune ne suit qu’un mécanisme, et aucune ne suffit seule à prédire l’astringence perçue (Wang et al., 2024, résumé)'
    statut_lecture: 'résumés seulement (Bajec et Pickering, 2008 ; Wang et al., 2024, relu le 2026-11-17) ; les méthodes elles-mêmes ne sont pas lues'
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- avant
note_conditions: 'conditions d’observation en bouche (spécification) : `avant` est critique, parce que l’astringence s’accumule d’une gorgée à l’autre (Green, 1993 [[green1993astr]]) ; on suit l’ordre des gorgées avec cette facette. `moment` n’est pas critique. `nez` n’est pas critique (ce n’est pas une saveur) ; `temperature_bouchee` est à éprouver. `duree` : les sous-qualités se notent pendant cinq à six minutes et décroissent à peu près de façon exponentielle (Lee et Lawless, 1991 [[lee_lawless1991]]) : le temps entre la prise et le jugement est déclaré. La salive va en note d’épisode.'
porteur: le produit identifié dont on goûte une portion (nature, origine, lot, date de production ou d’ouverture, conservation, concentration pour une boisson préparée) ; la portion goûtée n’est pas le
  porteur
note_porteur: 'même porteur que les types de saveur (proposition « Goût » ; choix de relecture du 2026-10-19), bien que l’astringence soit un toucher et qu’elle se sente sur la bouche elle-même.'
