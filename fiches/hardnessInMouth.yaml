# Fiche de type PPP — ppp:hardnessInMouth — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:hardnessInMouth
label_fr: dureté en bouche
label_en: hardness in the mouth
label_court: dureté
labels_alternatifs: []
labels_alternatifs_en: []
note_label_alternatif: '« tendre » va au lexique d’atelier (§9.7 K), qui mène au type (choix de relecture (2026-10-20), série 78 bis) : il nomme le bas de l’échelle (peu de force au premier coup de dent)
  et mêle souvent description et jugement (une viande « tendre ») ; ce n’est ni un label alternatif ni une région.'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- gout
définition: 'La force qu’il faut, au premier coup de dent (ou, pour un semi-solide, à la première pression de la langue contre le palais), pour enfoncer la bouchée : de la bouchée qui cède sans effort à
  celle qui demande beaucoup de force. Un toucher en bouche, jugé au moment `firstBite`.'
question_attentionnelle: Quelle force faut-il, au premier coup de dent (ou de langue), pour enfoncer la bouchée ? Très peu, peu, une force nette, ou beaucoup ?
contre_exemple: 'Ce n’est pas la mâche : un steak peut céder vite au premier coup de dent et demander longtemps à mâcher. La croûte et la mie d’un même pain sont deux bouchées à juger à part. Ce n’est pas
  la dureté au toucher : on ne presse pas la bouchée du doigt, on la mord. « Cette carotte crue demande beaucoup de force, et c’est un défaut » se dit comme « …et c’est une qualité ».'
grandeur_physique_homonyme: 'dureté des minéralogistes (résistance à la rayure) ou des métaux (empreinte laissée) : d’autres grandeurs. La dureté de la TPA (force maximale de la première compression, en
  newtons) relève de la rubrique « mesure » : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'Une mesure associée proche existe : la force maximale de la première compression de l’analyse instrumentale du profil de texture (TPA), qui vise expressément l’attribut perçu et suit le jury
    sur la dureté sans le suivre parfaitement. Sa valeur dépend du réglage et ne saisit ni la salive ni la mastication réelle. Les échelles du profil de texture, faites d’aliments de référence, servent
    de repères de région, pas de mesure (recherche du 2026-10-19).'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: tpa_durete
    nom: TPA, force maximale de la première compression
    grandeur: une force (pic de la première de deux compressions d’un morceau de la taille d’une bouchée)
    unite_ou_echelle: newton (N)
    references:
    - friedman1963
    - meullenet1998
    - rosenthal2010
    - peleg2019
    - stokes2013
    proximite: proche
    ecart: 'l’écart commun de la TPA : pas de salive, pas de température de bouche, pas de vraie mastication (deux compressions verticales, sans langue ni mouvement latéral), une valeur qui dépend de la
      taille de l’échantillon, de la vitesse et du taux d’écrasement, et seulement le début de la bouchée. La corrélation avec le jury n’est pas parfaite : 0,76, ou 0,96 après passage au logarithme, sur
      21 aliments. Sans procédure normalisée lue, la valeur ne se compare qu’à réglage égal. Les définitions détaillées des paramètres (Bourne, 1978, métadonnées) sont à vérifier sur le texte'
    conditions: taille de l’échantillon, vitesse et taux d’écrasement à déclarer
    statut_lecture: 'résumés (Friedman et al., 1963 ; Meullenet et al., 1998 ; Rosenthal, 2010 ; Peleg, 2019 ; Stokes et al., 2013) ; Bourne (1978) : métadonnées, sans DOI'
  non_retenues:
  - nom: échelle standard de dureté du profil de texture
    references:
    - szczesniak_brandt_friedman1963
    - munoz1986
    - iso11036
    raison: échelle de jugement ancrée par des aliments de référence, dont les crans sont fixés par un jury et non par une grandeur physique ; à reprendre comme repères de région dans le protocole de l’épreuve
      d’accord (E1)
    statut_lecture: 'résumés (Szczesniak, Brandt et Friedman, 1963 ; Muñoz, 1986) ; ISO 11036:2020 : extraits (6.4 et annexe A non lues)'
  - nom: cohésion, mâche et gommeux de la TPA
    references:
    - meullenet1998
    - rosenthal2010
    - peleg2019
    raison: la TPA ne suit pas le jury sur la cohésion ; elle ne le suit pas sur la mâche dans les données brutes (après logarithmes des deux variables, r = 0,54, P < 0,05) ; le gommeux est le produit de
      la dureté et de la cohésion, et dépend du réglage ; ce ne sont pas des mesures de ce type
    statut_lecture: résumés
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - pineau2009
    - lenfant2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumés (Pineau et al., 2009 ; Lenfant et al., 2009)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- moment
conditions_fixees:
  moment: firstBite
note_conditions: 'règle 12 (spec §9.7 H) : `moment` est critique pour les types de texture ; la définition fixe `firstBite` (la première bouchée, ou la première pression) : une assertion faite à une autre
  phase que celle que fixe la définition est invalide pour ce type, et le contrôle du site la refuse ; l’observation reste en note d’épisode. `unknown` est accepté, mais exclu de E1 (choix
  de relecture (2026-10-20), série 78 bis). Juger la dureté puis une autre texture d’une même bouchée donne deux épisodes. `nez` n’est pas critique ; `temperature_bouchee` et `avant` sont à éprouver. Le
  nombre de coups de dent et la taille de la bouchée vont dans l’épisode, sans facette ; la salive est une note d’épisode ; la dentition relève de l’état de l’observateur (note facultative), chacun mâchant
  à sa façon (Brown et al., 1994 [[brown1994]] ; Kohyama et al., 2002 [[kohyama2002]]).'
porteur: la bouchée (la portion en bouche) d’un produit identifié, au premier coup de dent
note_porteur: 'porteur des types de texture : la bouchée ou la gorgée (choix de relecture, 2026-10-20 ; proposition « Goût », 2.7). Ce porteur change pendant qu’on le juge, puisque la mastication le détruit
  : d’où la facette `moment`. L’objet du registre reste le produit identifié (« ce pain ») ; la bouchée en est la portion sur laquelle porte l’assertion, à la manière d’une partie (§9.7 I).'
arité: 1
condition_NA: 'liquide (rien à enfoncer sous la dent) ; objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description)
  : une photo ne compte jamais'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `veryLittleForce` (rang 1) vers `muchForce` (rang 4), il faut de plus en plus de force pour enfoncer la bouchée
  numerique: non
  regions:
  - cle: veryLittleForce
    label_fr: très peu de force
    label_en: very little force
    rang: 1
    repere: la bouchée s’écrase entre la langue et le palais, sans les dents (une purée, un flan)
    exemplaires: []
  - cle: littleForce
    label_fr: peu de force
    label_en: little force
    rang: 2
    repere: la dent entre sans effort (une banane mûre, la mie d’un pain frais)
    exemplaires: []
  - cle: clearForce
    label_fr: une force nette
    label_en: noticeable force
    rang: 3
    repere: la dent rencontre une résistance nette avant d’entrer (une pomme crue, un fromage à pâte pressée)
    exemplaires: []
  - cle: muchForce
    label_fr: beaucoup de force
    label_en: a lot of force
    rang: 4
    repere: il faut serrer fort pour entamer la bouchée (une carotte crue, une amande, un bonbon dur)
    exemplaires: []
note_echelle: 'quatre régions, écrites avec la fiche (la proposition « Goût », 2.7, les laissait à écrire). Les quatre crans et leurs repères sont des choix de relecture provisoires (2026-10-20, série 78
  bis), à caler avant E1 sur les échelles standard du profil de texture, ici l’échelle standard de dureté [[szczesniak_brandt_friedman1963]] [[munoz1986]], dont les aliments de référence n’ont pas été lus.
  Les repères sont des aliments courants, sans marque, et non des exemplaires (décision 5 de l’éditeur du projet, 2026-10-19). Un aliment naturel varie d’un lot à l’autre : le repère est goûté le jour de
  l’épreuve.'
identite: 'La force pour enfoncer la bouchée au premier coup de dent ; pas la mâche ni la cohésion (des paramètres secondaires ou à revoir), pas le croustillant (en lot suivant : une rupture sonore), pas
  l’épaisseur d’un liquide (épaisseur en bouche), pas l’astringence (un état de la bouche). Rapprochement avec la dureté au toucher (`ppp:hardnessToTouch`, famille Toucher), sans relation : l’instrument
  diffère (les dents et la mâchoire, pas le bout du doigt), l’aliment est détruit pendant qu’on le juge, et le son passe par les os ; un test de transfert (Q13, option c) pourra revoir cette séparation.'
