etat_de_l_art: 'Le profil de texture de Brandt et al. (1963) [[brandt1963]] décrit les caractéristiques dans leur ordre d’apparition, de la première bouchée à la mastication complète. La dureté y est une
  caractéristique mécanique primaire (Szczesniak, 1963 [[szczesniak1963]]), avec une échelle standard faite d’aliments de référence (Szczesniak, Brandt et Friedman, 1963 [[szczesniak_brandt_friedman1963]]
  ; Muñoz, 1986 [[munoz1986]]). ISO 11036:2020 [[iso11036]] la définit comme la force pour une déformation donnée, sous les molaires pour un solide, entre la langue et le palais pour un semi-solide. La
  texture est un suivi dynamique de la bouchée (Hutchings et Lillford, 1988 [[hutchings1988]]), et chacun mâche à sa façon (Brown et al., 1994 [[brown1994]] ; Kohyama et al., 2002 [[kohyama2002]]). L’instrument
  (Friedman et al., 1963 [[friedman1963]]) suit le jury pour la dureté sur 21 aliments, mais pas pour la cohésion (Meullenet et al., 1998 [[meullenet1998]]) ; sa valeur dépend du réglage (Rosenthal, 2010
  [[rosenthal2010]] ; Peleg, 2019 [[peleg2019]]) et ne saisit ni la salive ni la mastication réelle (Stokes et al., 2013 [[stokes2013]]). Le son de la rupture passe par les os (Duizer, 2001 [[duizer2001]]).
  Aucune source lue ne teste l’accord entre observateurs sur des crans de dureté en bouche sans jury entraîné. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:hardnessInMouth a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je mange cette pomme » à « je regarde quelle force il faut pour y entrer » change la description (on suit le premier coup de dent, pas ce qui vient après).
transfert: objet conçu oui (une recette, un biscuit, un produit) | tableau non | cuisine oui (pain, fruit, légume cru ou cuit) | high-tech non | architecture non
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 produits identifiés (bouchées du même lot, de même taille, au même moment), accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à `moment` = `firstBite`
    (spec §9.7 H, règle 12), les aliments repères goûtés avant de juger
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les produits (ceux qui aiment et ceux qui n’aiment pas)
  statut_epistemique: non éprouvé
  epreuve: null
