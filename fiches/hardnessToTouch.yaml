remarque:
- 'série 78 bis (choix de relecture (2026-10-20), corrections de relecture) : identite complétée (pas la dureté en bouche, `ppp:hardnessInMouth`, sans relation) ; à relire'
- 'série 90 (2026-11-02) : épisodes proposés « à réaliser » du lot 7 repris dans la fiche (décision de l’éditeur du projet du 2026-11-02 : « B : publier avec des épisodes proposés marqués « à réaliser » ») ; choix de relecture (2026-11-02) : repère « éponge synthétique (mousse) sèche » (Rey et Vandamme 2013, résumé lu, ajouté aux références) ; « cède un peu » : balle de mousse dense en repère principal, chapeau de champignon frais en second, fraîcheur déclarée ; gomme et bouchon de liège à « cède à peine » ; appui ferme appris avant l’épreuve sur une balance de cuisine (environ 1 kg), puis pression à la main. Repères, note_conditions et note_echelle mis à jour (EN et empreintes).'
- 'série 90, correctif (choix de relecture (2026-11-02)) : épisodes réalignés sur la version révisée du lot 7 (hors dépôt) : cinq champs explicites par épisode (objet, preparation, consigne, conditions, region_attendue), éponge synthétique sans doute, balle de mousse en exemplaire principal (02) et champignon en second (03), gomme et bouchon à « cède à peine », étalonnage à environ 1 kg refait une fois à mi-épreuve ; à relire'
