manques:
- 'exemplaires : six épisodes proposés « à réaliser » (episodes_a_realiser), à réaliser par plusieurs observateurs, chacun seul ; à la réalisation, chaque objet est mesuré et photographié (photo d’identification, X17 (g)), et l’assertion entre dans fiches/exemplaires.yaml'
- 'épisodes sans doute de leur auteur : « cède beaucoup » (éponge synthétique sèche) et « ne cède pas » (galet), régions non voisines ; « cède un peu » et « cède à peine » n’ont que des épisodes marqués `doute: oui` ; le palier visé dépend de la relecture et de la règle X17 (f)'
