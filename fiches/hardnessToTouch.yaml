# Fiche de type PPP — ppp:hardnessToTouch — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md, gabarit relu ; pas encore dans PPP_FicheType.md ni lue par la maquette).
# Série 54 (2026-10-16) : fiche en préparation, rédigée sans exemplaire à partir du ticket 4 (tickets/0004-suggestion-type.md) et de la proposition « Toucher » ; aucun champ n’est encore relu. Première fiche propre au toucher.
id: ppp:hardnessToTouch
label_fr: dureté au toucher
label_en: hardness to the touch
label_court: dureté
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- toucher
définition: 'Combien l’objet s’enfonce quand on le presse du bout du doigt, à l’endroit pressé : de ce qui s’enfonce beaucoup sous le doigt à ce qui ne cède pas du tout.'
question_attentionnelle: Si vous appuyez du bout du doigt, sans regarder, l’objet cède-t-il beaucoup, un peu, à peine, ou pas du tout ?
contre_exemple: 'Une balle de mousse et une boule de billard peuvent avoir la même surface lisse : c’est ce qu’elles cèdent sous le doigt qui les sépare, pas leur relief (texture). Une éponge et une pâte à modeler cèdent autant ; l’une revient à sa forme, l’autre garde la marque : ce n’est pas une différence de dureté, mais de retour à la forme. Une feuille de papier se plie facilement, mais posée à plat sur une table elle ne cède pas sous le doigt : se plier n’est pas céder.'
grandeur_physique_homonyme: 'dureté au sens des minéralogistes (échelle de Mohs), qui est une résistance à la rayure, pas à l’enfoncement [[nps_mohs]] ; dureté des métaux (Vickers), mesurée par l’empreinte laissée [[iso6507_1]] ; « hardness » de l’analyse sensorielle des aliments, qui juge en mâchant : aucune région ne s’en déduit. Voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Des mesures associées existent pour les caoutchoucs et les mousses : un appareil enfonce une pointe ou une bille avec une force réglée et relève la profondeur, ou mesure la force qu’il faut pour écraser une mousse d’une fraction donnée de son épaisseur. Elles portent sur un échantillon de matière préparé, pas sur un objet quelconque touché du doigt. En laboratoire, la mollesse perçue suit la souplesse mesurée de caoutchoucs [[srinivasan_lamotte1995]] et la dureté jugée croît avec la dureté physique selon une loi de puissance [[harper_stevens1964]] ; ces résultats ne fixent pas de régions.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso48_4
    nom: dureté Shore (duromètre)
    grandeur: profondeur d’enfoncement d’une pointe de forme normalisée, poussée par un ressort, dans un caoutchouc
    unite_ou_echelle: 'échelles Shore A (dureté normale), D (caoutchoucs durs), AO (caoutchoucs mous et alvéolaires), AM (pièces minces) ; ASTM D2240 décrit douze types de duromètres, dont OO'
    references: [iso48_4, astm_d2240]
    proximite: proche
    ecart: 'mesure la matière d’un échantillon plan d’épaisseur donnée, avec une pointe et une force fixées, pas l’objet entier à l’endroit pressé ; ne saisit ni la force variable du doigt, ni sa surface de contact, ni l’épaisseur ou le creux de l’objet (un ballon gonflé, une pile de papier), ni l’observateur ; chaque échelle ne couvre qu’une partie des matières (caoutchoucs, élastomères, mousses, gels, quelques plastiques), ni la pierre ni le métal ; ASTM D2240 le dit lui-même : « No simple relationship exists between indentation hardness determined by this test method and any fundamental property of the material tested » (section 4.1)'
    conditions: échantillon de caoutchouc ou d’élastomère, plan, d’épaisseur suffisante ; force et forme de la pointe fixées par l’échelle ; température de l’essai
    statut_lecture: 'résumé public lu (ISO 48-4 : page de l’ISO ; ASTM D2240 : page de l’éditeur, Scope sections 1.1 et 1.2 et section 4.1)'
  - id: iso48_2
    nom: dureté internationale du caoutchouc (IRHD)
    grandeur: enfoncement d’une bille sous une force donnée
    unite_ou_echelle: 'degrés IRHD, de 10 à 100 ; trois méthodes selon la dureté (N, H, L) et une pour les pièces minces (M), plus quatre pour les surfaces courbes'
    references: [iso48_2]
    proximite: proche
    ecart: 'même écart que la dureté Shore : matière d’un caoutchouc, bille et force fixées ; ne saisit ni le doigt, ni l’objet entier, ni l’observateur ; « dureté apparente » sur surface courbe seulement par des méthodes à part'
    conditions: caoutchouc vulcanisé ou thermoplastique ; surface plane (ou courbe, méthodes de dureté apparente) ; diamètre de bille et force selon la méthode
    statut_lecture: résumé public lu (page de l’ISO)
  - id: iso2439
    nom: dureté des mousses par indentation
    grandeur: force nécessaire pour écraser une mousse d’une fraction donnée de son épaisseur (40 % pendant 30 s, par exemple)
    unite_ou_echelle: force (newtons) à un taux d’indentation donné ; cinq méthodes (A à E)
    references: [iso2439]
    proximite: indirecte
    ecart: 'mesure la portance d’une mousse sous un large plateau, pas l’enfoncement sous un doigt ; la norme limite elle-même ses résultats aux conditions de l’essai ; ne s’applique qu’aux mousses de latex, d’uréthane et de PVC à cellules ouvertes ; ne saisit ni l’observateur, ni la force du doigt, ni ce qui n’est pas une mousse'
    conditions: mousse souple à cellules ouvertes, éprouvette ou article fini ; plateau, taux d’indentation et durée fixés par la méthode
    statut_lecture: résumé public lu (page de l’ISO)
  non_retenues:
  - nom: échelle de Mohs
    references: [nps_mohs]
    raison: 'mesure la résistance à la rayure d’un minéral, pas ce qu’il cède sous la pression : homonyme de domaine, pas une mesure associée'
    statut_lecture: page lue (U.S. National Park Service)
  - nom: dureté Vickers (et Brinell)
    references: [iso6507_1]
    raison: 'mesure l’empreinte permanente qu’un pénétrateur laisse dans un métal ou un revêtement dur, pas ce qu’un objet cède sous le doigt à l’endroit pressé. Brinell : norme non consultée'
    statut_lecture: 'résumé public lu (ISO 6507-1 : page de l’ISO) ; Brinell non lu'
modalites:
- toucher
mode_de_presentation: échantillon
conditions_critiques:
- geste
- temperature_objet
note_conditions: 'le jugement se fait en pressant (facette `geste` : `pressure`, spec §9.7 H, règle 8), du bout de l’index, perpendiculairement à la surface, puis on relâche ; la température de l’objet (facette `temperature_objet`) change la dureté de certaines matières (beurre, cire, chocolat) : elle est critique. La force (« sans appuyer », « appui ferme »), la partie de la main (bout du doigt ou paume), la durée de l’appui, la main nue ou gantée et l’état de la peau vont en note d’épisode, sans facette. Objet posé à plat sur une table dure (`tableTop`) pour qu’il ne bouge pas, ou touché sur place (`inSitu`) ; durée `glance`. Épreuve sans voir : on presse plus fort quand on s’attend à un objet rigide (Klatzky et Reed, 2009) [[klatzky_reed2009]]. Une photo ne dit rien de la dureté : aucune assertion sur image, sauf indice visuel déclaré (un coussin creusé, une mousse écrasée), qui reste une assertion de vue sur cet indice, pas sur la dureté (spec X17 ; protocole d’échantillons, docs/protocole-echantillons-toucher.md §4.1).'
porteur: 'un objet, ou une partie d’objet, à l’endroit pressé (pas la matière en général : une boîte de métal mince cède alors que le métal est dur)'
arité: 1
condition_NA: 'objet qu’on n’a pas le droit ou pas la possibilité de presser (œuvre de musée, objet fragile ou dangereux) ; ce qui ne garde pas de forme sous le doigt (un liquide, un gaz) ; objet vu seulement en image.'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `yieldsMuch` (rang 1) vers `doesNotYield` (rang 4), l’objet cède de moins en moins sous le doigt
  numerique: non
  regions:
  - cle: yieldsMuch
    label_fr: cède beaucoup
    label_en: yields a lot
    rang: 1
    repere: 'le doigt s’enfonce profondément (de la mousse à raser, une éponge sèche, un ballon de baudruche gonflé)'
    exemplaires: []
  - cle: yieldsSome
    label_fr: cède un peu
    label_en: yields somewhat
    rang: 2
    repere: le doigt s’enfonce nettement, mais la matière résiste (un chapeau de champignon)
    exemplaires: []
  - cle: yieldsBarely
    label_fr: cède à peine
    label_en: yields barely
    rang: 3
    repere: on sent un léger enfoncement en appuyant fort, sans voir de creux (une pile de papier)
    exemplaires: []
  - cle: doesNotYield
    label_fr: ne cède pas
    label_en: does not yield
    rang: 4
    repere: rien ne cède sous le doigt, même en appuyant fort (une pierre)
    exemplaires: []
note_echelle: 'quatre crans tirés des cinq exemples du ticket 4, rangés par leur proposant du plus mou au plus dur : le ballon gonflé est rangé avec la mousse à raser (le doigt s’enfonce profondément), le chapeau de champignon seul au cran « cède un peu », la pile de papier à « cède à peine », la pierre à « ne cède pas ». La proposition « Toucher » (§2.2) avait trois crans (« cède beaucoup », « cède un peu », « ne cède pas ») ; le ticket en distingue un de plus entre « un peu » et « pas du tout ». Position de travail : quatre crans, E1 à une région près ; si l’épreuve ne distingue pas « cède à peine » de ses voisins, revenir à trois (spec §9.7 C, accord exact). Repères du cran « cède beaucoup » (série 54 bis) : la mousse à raser reste comme repère, mais elle se déforme sans revenir, et l’examen risque la condition NA (ce qui ne garde pas de forme) ; le ballon gonflé reste en `yieldsMuch`, avec un doute vers `yieldsSome` selon le gonflage.'
identite: 'Ce que l’objet cède sous la pression du doigt, à l’endroit pressé ; pas la façon dont il revient à sa forme (retour à la forme), pas ce qui plie (souplesse au pli), pas le relief de sa surface (texture), pas la résistance à la rayure (échelle de Mohs).'
relations:
- type: confusableWith
  cible: ppp:texture
  note: 'au toucher, une surface lisse paraît parfois plus dure, une surface à gros reliefs (un tapis épais) plus molle : on juge ce que l’objet cède sous le doigt, pas son relief'
