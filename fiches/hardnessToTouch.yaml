etat_de_l_art: 'Sources : la dureté (ou mollesse) est une dimension du toucher des matériaux (Bergmann Tiest et Kappers 2006) [[bergmann_tiest_kappers2006]] ; la dureté jugée suit une loi de puissance de la dureté physique pour des matières souples (Harper et Stevens 1964) [[harper_stevens1964]] ; pour des caoutchoucs, la mollesse se discrimine finement au doigt et suit la souplesse mesurée (Srinivasan et LaMotte 1995) [[srinivasan_lamotte1995]] ; la déformation de la surface et l’épaisseur de l’objet comptent (Bergmann Tiest et Kappers 2009) [[bergmann_tiest_kappers2009a]]. Aucune source trouvée ne fixe des régions perçues de la dureté au toucher. Détail : docs/bibliographie-par-type.md#groupe-toucher.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-toucher
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:hardnessToTouch a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je touche l’objet » à « je sens s’il cède sous le doigt » change la description (un même cuir, rembourré ou tendu sur du bois).
transfert: objet conçu oui (une poignée gainée, un emballage, un siège) | tableau non (on ne le presse pas) | cuisine oui (un fruit mûr ou non, une pâte) | high-tech oui (une coque souple ou rigide, une touche) | architecture oui (un revêtement de sol souple, un mur capitonné)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets qu’on a le droit de toucher, accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales (spec §9.7 H), sans voir l’objet ; accord exact si l’échelle revient à trois régions (spec §9.7 C)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
