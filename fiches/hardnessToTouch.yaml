source_de_la_fiche: 'ticket n° 4 (https://github.com/blomig/PPP-ontologie/issues/4, suggestion de type « Dureté ») ; proposition de famille « Toucher » (docs/famille-toucher-proposition.md (document de travail, non publié), §2.2, premier lot, décisions 3 et 9) ; protocole d’échantillons (docs/protocole-echantillons-toucher.md §4.1) ; fiche rédigée le 2026-10-16 par l’équipe, champs à valider par la relecture explicative'
# Série 90 : épisodes proposés « à réaliser » (spec X17 ; décision de l’éditeur du projet du 2026-11-02 pour le principe ; champs et détail du lot : choix de relecture (2026-11-02)) ; ni épreuve faite ni accord entre observateurs ;
# ni observateur, ni date, ni résultat. Objets et prédictions repris de la proposition de lot 7, révisés : choix de relecture (2026-11-02).
episodes_a_realiser:
- id: ppp-a:prop7-hardnessToTouch-01
  realisation: a_realiser
  region_attendue: yieldsMuch
  objet: éponge de ménage en mousse synthétique (polyuréthane), sans face grattante, sèche, d’environ 11 × 7 × 3 cm ; pas une éponge de cellulose
  objet_en: household sponge of synthetic foam (polyurethane), without a scouring face, dry, about 11 × 7 × 3 cm; not a cellulose sponge
  preparation: éponge en mousse synthétique, sans face grattante, d’au moins 3 cm d’épaisseur (pour que le doigt ne touche pas la table), sèche depuis au moins un jour ; pas une éponge de cellulose ; la peser ; étalonnage fait avant
  preparation_en: synthetic foam sponge, without a scouring face, at least 3 cm thick (so that the finger does not reach the table), dry for at least a day; not a cellulose sponge; weigh it; calibration done beforehand
  consigne: 'Presser du bout de l’index, bien droit, au milieu de l’objet : d’abord doucement, puis jusqu’à la force sentie à l’étalonnage ; relâcher. L’objet cède-t-il beaucoup, un peu, à peine, ou pas du tout, à l’endroit pressé ? Ne juger ni le retour à la forme, ni le relief, ni le froid.'
  consigne_en: 'Press with the tip of the index finger, straight down, in the middle of the object: gently at first, then up to the force felt during calibration; release. Does the object yield a lot, somewhat, barely, or not at all, where it is pressed? Judge neither the return to shape, nor the relief, nor the cold.'
  conditions:
    presentation: tableTop
    geste: pressure
    temperature_objet: ambient
    duree: glance
    yeux: fermés (ou bandés)
    yeux_en: closed (or blindfolded)
    note: 'objet posé à plat sur une table dure ; yeux fermés ou bandés, une autre personne pose l’objet ; index de la main dominante, main nue et sèche ; objet dans la pièce depuis au moins une heure (la veille pour le galet) ; étalonnage : avant l’épreuve, appuyer du bout de l’index, bien droit, sur le plateau d’une balance de cuisine jusqu’à lire environ 1 kg, pour sentir cette force ; le refaire une fois à mi-épreuve (après trois objets) ; les objets se pressent ensuite à la main, sans balance : une perception, pas une mesure ; force visée déclarée sur la feuille'
    note_en: 'object laid flat on a hard table; eyes closed or blindfolded, another person puts the object down; index finger of the dominant hand, bare and dry; object in the room for at least one hour (since the day before for the pebble); calibration: before the trial, press with the tip of the index finger, straight down, on the pan of a kitchen scale until it reads about 1 kg, to feel that force; do it again once halfway through the trial (after three objects); the objects are then pressed by hand, without the scale: a perception, not a measurement; target force declared on the sheet'
  doute: non
  note: 'repère de la fiche : « une éponge synthétique (mousse) sèche » ; une éponge de cellulose devient raide en séchant (Rey et Vandamme, 2013) et tomberait à un cran plus dur'
  note_en: 'reference point of the entry: “a dry synthetic foam sponge”; a cellulose sponge stiffens as it dries (Rey and Vandamme, 2013) and would fall one step harder'
  texte_fr: 'Une éponge synthétique (mousse) sèche : cède beaucoup (prédiction, à éprouver).'
  texte_en: 'A dry synthetic foam sponge: yields a lot (prediction, to be tested).'
