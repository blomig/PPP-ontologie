  doute: oui
  motif_doute: 'ces balles vont d’une mousse très molle (« cède beaucoup ») à une mousse ferme : décrire la balle retenue assez pour qu’un tiers en retrouve une semblable'
  motif_doute_en: 'these balls range from a very soft foam (“yields a lot”) to a firm one: describe the chosen ball well enough for someone else to find a similar one'
  note: 'reproductible et non périssable : exemplaire principal du cran'
  note_en: 'reproducible and non-perishable: main exemplar of the step'
  texte_fr: 'Une balle de mousse dense : cède un peu (prédiction, à éprouver).'
  texte_en: 'A dense foam ball: yields somewhat (prediction, to be tested).'
