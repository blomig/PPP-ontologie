etat_de_l_art: 'La perception de la texture est étudiée depuis les années 1970 en vision par ordinateur et en psychologie. Tamura, Mori et Yamawaki (1978) [[tamura1978]] ont proposé six mesures calculées
  sur une image, comparées à des jugements humains ; la *coarseness* (le caractère plus ou moins gros du grain) correspond à la taille des reliefs. Rao et Lohse (1996) [[rao_lohse1996]] et Bhushan, Rao
  et Lohse (1997) [[bhushan1997]] ont cherché les dimensions perçues et le lexique de la texture. Les mesures de Haralick et al. (1973) [[haralick1973]] servent à classer des images par calcul, sans viser
  la perception. Détail : docs/bibliographie-par-type.md#groupe-texture.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-texture
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:texture a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je regarde la couleur » à « je vois si c’est lisse ou à gros relief » modifie la description (prise de la lumière, envie de toucher, distance).
transfert: objet conçu oui (glaçure, textile, enduit) | tableau oui (empâtement, toile) | cuisine oui (plan de travail) | high-tech oui (finition sablée ou polie)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve ; vision et toucher éprouvés séparément (Q13 reste ouverte)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E5
  nature: existence
  enonce: le type s’applique sans redéfinition à au moins deux régimes (un objet conçu et un matériau ou une œuvre)
  statut_epistemique: non éprouvé
  epreuve: null
- id: texture-1
  nature: structure
  enonce: 'la texture est formelle : deux surfaces jugées identiques en texture ne diffèrent pas seulement parce que leurs reliefs sont autrement répartis ; si la répartition change la texture perçue, la
    texture devient semi-formelle de base ppp:distribution (spec §10)'
  statut_epistemique: non éprouvé
  epreuve: null
