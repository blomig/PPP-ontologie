# Fiche de type PPP — ppp:texture — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par, note_label_alternatif.
id: ppp:texture
label_fr: texture
label_en: texture
label_court: texture
labels_alternatifs:
- grain
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Taille perçue des reliefs d’une surface, à la vue ou au toucher, de la surface sans relief perceptible à la surface à gros reliefs.
question_attentionnelle: À la vue ou sous la main, la surface paraît-elle lisse, ou ses reliefs sont-ils fins, moyens ou gros ?
contre_exemple: 'Un stratifié imprimé « bois » montre des veines, mais la main n’y sent aucun relief : c’est un motif de teinte et de clarté, et la texture est lisse. Une tôle gaufrée a de gros reliefs
  tous pareils : sa texture est grosse, sans irrégularité locale. Une page de journal en petits caractères compte beaucoup d’éléments, mais son papier peut être lisse : le nombre d’éléments relève de la
  densité, pas de la texture.'
grandeur_physique_homonyme: '« texture » désigne aussi, en science des matériaux, l’orientation cristalline et, en science des sols, la répartition des grains par taille (granulométrie), comme « grain », label alternatif : aucune région ne s’en déduit. La rugosité de surface mesurée relève de la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'La métrologie des surfaces mesure la rugosité au profilomètre (paramètres de profil, ISO 21920-2, qui remplace ISO 4287) ou sur une surface (paramètres surfaciques, ISO 25178-2). Ces mesures associées portent sur la hauteur et l’espacement des reliefs, un aspect proche de ce type (de façon indirecte pour Ra, hauteur relevée le long d’une ligne) ; elles se font sur un petit échantillon, à une échelle souvent bien plus fine que celle qu’on voit ou qu’on sent, et ne disent pas quelle taille de relief perçoit un observateur à une distance et sous un éclairage donnés.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso_21920_2
    nom: rugosité de profil (Ra et paramètres voisins)
    grandeur: écarts de hauteur d’un profil relevé le long d’une ligne de la surface
    unite_ou_echelle: micromètres (hauteur moyenne arithmétique du profil, Ra, et autres paramètres de profil)
    references:
    - iso_21920_2
    proximite: indirecte
    ecart: 'mesure le relief à l’échelle du micromètre, sur une petite zone et après des filtrages choisis par l’opérateur, alors que les reliefs qu’on voit ou qu’on sent se comptent souvent en millimètres ; une hauteur le long d’une ligne, qui ne dit pas la taille des reliefs dans le plan ; ne saisit ni la distance de vue, ni l’éclairage (une lumière rasante révèle les reliefs), ni l’observateur, ni, au toucher, la force et le geste ; ISO 21920-2 a remplacé ISO 4287 en 2021, et les valeurs ne se comparent pas toujours d’une norme à l’autre'
    conditions: profil relevé au profilomètre sur un échantillon ; longueur d’évaluation et filtres fixés par la norme
    statut_lecture: résumé public lu (page de l’ISO, statut et cycle de vie)
  - id: iso_25178_2
    nom: rugosité surfacique (Sa, longueur d’autocorrélation)
    grandeur: hauteur moyenne des écarts sur une surface relevée, et longueur sur laquelle le relief se répète
    unite_ou_echelle: 'micromètres (hauteur moyenne arithmétique, Sa ; longueur d’autocorrélation, Sal)'
    references:
    - iso_25178_2
    - npl_gpg116
    proximite: proche
    ecart: 'mesure le relief à l’échelle du micromètre, sur une petite zone et après des filtrages choisis par l’opérateur, alors que les reliefs qu’on voit ou qu’on sent se comptent souvent en millimètres ; Sa est une hauteur, Sal un espacement ; ne saisit ni la distance de vue, ni l’éclairage (une lumière rasante révèle les reliefs), ni l’observateur, ni, au toucher, la force et le geste'
    conditions: surface relevée par un instrument surfacique (optique ou à contact) ; zone d’évaluation et filtres fixés par l’opérateur et la norme
    statut_lecture: 'résumé public lu (page de l’ISO ; sommaire de l’extrait public) ; symboles d’après NPL, Measurement Good Practice Guide No. 116 (2010), table 1, fondé sur le projet ISO 25178-2 ; noms confirmés par le sommaire public de l’édition 2021'
modalites:
- vision
- toucher
mode_de_presentation: échantillon
conditions_critiques:
- distance
note_conditions: 'la taille perçue des reliefs dépend de la distance (les repères des régions la nomment) ; la lumière rasante révèle les reliefs à la vue, mais n’est pas critique au toucher : non déclarée
  critique (T22)'
porteur: 'une surface : celle d’un objet ou d’une partie (la matière vue ou touchée). « Matière = porteur » : à confirmer (spec §10, §11).'
arité: 1
condition_NA: porteur sans surface perceptible (une lumière, un son). Une surface sans relief perceptible est APPLICABLE, en région `smooth`.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `smooth` (rang 1) vers `coarse` (rang 4), la taille perçue des reliefs de surface augmente
  numerique: non
  regions:
  - cle: smooth
    label_fr: lisse
    label_en: smooth
    rang: 1
    repere: aucun relief perceptible à distance d’examen (une glaçure, une pierre polie)
    exemplaires:
    - ppp-a:pilote-0101
    - ppp-a:pilote-0102
  - cle: fine
    label_fr: fine
    label_en: fine
    rang: 2
    repere: relief perceptible de près, à peine visible à bout de bras (un papier à dessin, une toile fine)
    exemplaires: []
  - cle: medium
    label_fr: moyenne
    label_en: medium
    rang: 3
    repere: relief visible à distance d’examen, sans relief individuel saillant (un enduit taloché)
    exemplaires:
    - ppp-a:pilote-0104
    - ppp-a:pilote-0105
  - cle: coarse
    label_fr: grosse
    label_en: coarse
    rang: 4
    repere: reliefs individuels visibles et palpables (une pierre brute éclatée, une écorce)
    exemplaires: []
identite: Taille des reliefs de surface, pas le nombre d’éléments d’une composition (densité), pas l’écart à une régularité (irrégularité locale), pas le motif de couleur (teinte, clarté).
relations:
- type: confusableWith
  cible: ppp:localIrregularity
  note: une surface à gros relief régulier (une tôle gaufrée) n’est pas irrégulière ; l’irrégularité locale qualifie l’écart à une régularité
- type: separableFrom
  cible: ppp:hue
  note: 'à éprouver (E2) : un nuancier de glaçures de même teinte, de lisse à grosse'
- type: confusableWith
  cible: ppp:textureDirectionality
  note: la texture dit la taille des reliefs ; l’orientation de la texture dit s’ils suivent une même direction
