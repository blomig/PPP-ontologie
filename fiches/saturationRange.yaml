- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales (spec
    §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E3
  nature: structure
  enonce: deux zones dont on juge les saturations une à une identiques ne diffèrent pas en éventail des saturations (sinon la base est incomplète)
  statut_epistemique: non éprouvé
  epreuve: null
