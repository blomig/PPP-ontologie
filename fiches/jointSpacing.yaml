etat_de_l_art: 'En architecture, le détail de construction a ses textes : l''article de Frascari (1983) [[frascari1983]] s''intitule « The tell-the-tale detail » (« le détail qui raconte ») et paraît dans
  un recueil de sémiotique (titre seul, contenu non lu) ; Frampton (1995) [[frampton1995]] relit l''architecture moderne comme un art de la construction (description de l''éditeur ; livre non lu). Aucune
  source perceptive trouvée sur l''écart vu au joint (recherche faite le 2026-10-10 : Crossref, Semantic Scholar) ; les mesures industrielles d''écart et d''affleurement (l''alignement des deux surfaces)
  ne visent pas une qualité perçue. Détail : docs/bibliographie-par-type.md#groupe-joint.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-joint
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:jointSpacing a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois deux parties assemblées » à « je regarde l’écart entre elles au joint » change la description (le joint se lit comme une ligne, une bande ou disparaît).
transfert: objet conçu oui (meuble, boîtier) | tableau non (pas de joint entre parties d’objet, sauf le cadre ou un tableau fait de plusieurs panneaux) | cuisine oui (façades de placard) | high-tech oui
  (coque en deux parties) | architecture oui (dalles, panneaux de façade)
