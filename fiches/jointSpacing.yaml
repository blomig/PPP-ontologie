définition: À l’endroit où deux parties d’un objet se rejoignent (le joint), largeur perçue de l’écart qui les sépare, des parties qui se touchent à un écart qui forme une bande.
question_attentionnelle: Au joint, les deux parties se touchent-elles, ou un écart étroit ou large les sépare-t-il ?
contre_exemple: 'La différence de couleur entre les deux parties n’est pas un espacement : c’est un contraste de teinte ou de clarté entre elles. Une partie qui dépasse l’autre relève du décalage de niveau,
  pas de l’espacement.'
mesure:
  etat: methodes
  synthese: 'La largeur d’un joint est une longueur, qui se mesure en millimètres [[iso_80000_3]] : c’est une mesure associée proche. La largeur perçue dépend aussi de la distance de vue, de l’éclairage
    (l’ombre dans le joint) et du contraste entre le joint et les parties.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso_80000_3
    nom: largeur du joint
    grandeur: distance entre les bords des deux parties, à l’endroit du joint
    unite_ou_echelle: millimètres
    references:
    - iso_80000_3
    proximite: proche
    ecart: 'ISO 80000-3 définit la grandeur sans décrire de procédé de mesure ; aucune norme de pose n’a été lue ; un même joint paraît plus étroit de loin ; l’ombre dans le joint, l’éclairage, la couleur du joint et l’observateur changent la largeur perçue'
    conditions: joint accessible ; endroit et instrument de mesure déclarés
    statut_lecture: résumé public lu (ISO 80000-3)
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- distance
note_conditions: de loin, un écart étroit cesse de se voir
porteur: la partie « joint » de l’objet (app:<objet>#joint-…)
arité: 1
condition_NA: objet d’une seule pièce, sans joint perceptible.
