etat_de_l_art: 'La perception de structures hiérarchiques (des parties dans des parties) est étudiée depuis Navon (1977) [[navon1977]], qui compare traits globaux et locaux (l’ensemble et les détails),
  et Palmer (1977) [[palmer1977]], qui décrit la représentation perceptive comme hiérarchique. Hoffman et Richards (1984) [[hoffman_richards1984]] étudient la décomposition d’une forme en parties. Aucune
  source trouvée ne fixe des régions perçues du nombre de niveaux. Détail : docs/bibliographie-par-type.md#groupe-organisation.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-organisation
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:partNesting a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois un objet et ses parties » à « je regarde si ses parties se divisent à leur tour » change la description (va-et-vient du regard entre l’ensemble et le détail).
transfert: objet conçu oui (meuble à tiroirs et poignées) | tableau oui (scène, groupes, figures, détails) | cuisine oui (meuble de cuisine) | high-tech oui (interface à fenêtres, panneaux, boutons) | architecture
  oui (façade)
