id: ppp:partNesting
label_fr: emboîtement des parties
label_en: part nesting
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
  - ppp:contour
  facteurs_non_perceptuels: []
note_base: 'Base (2.3.2, position de travail, révisable par l’éditeur du projet ; T25, C4 point 5) : `ppp:contour` (formel, A9), parce qu’il faut des bords perçus pour voir des parties ; plus une relation entre parties,
  non typée : une partie paraît contenue dans une autre, plus grande qu’elle (taille relative des parties entre elles). Cette relation n’est pas une qualité : elle relève de la description de l’objet (spec
  §9.7 I) et n’a pas d’id. `ppp:perceivedSize` est retiré de la base : il rapporte la taille au corps de l’observateur, alors que l’emboîtement ne dépend que de la taille des parties les unes par rapport
  aux autres (une façade et une boîte à bijoux peuvent avoir le même emboîtement). `ppp:scaleContrast` n’est pas une base non plus : il compare deux éléments vus côte à côte (contre-exemple).'
facettes:
- organisation
- forme
définition: Degré auquel les parties d’un objet ou d’une composition paraissent contenir elles-mêmes des parties plus petites, sur un ou plusieurs niveaux, comme une façade faite de fenêtres faites de carreaux.
question_attentionnelle: Les parties de cet objet se divisent-elles à leur tour en parties plus petites, et sur combien de niveaux ?
contre_exemple: 'Une rangée de vingt boutons identiques compte beaucoup d’éléments, tous au même niveau : c’est la densité, pas l’emboîtement. Une grande forme posée à côté d’une petite diffère d’elle par
  la taille sans la contenir : c’est un contraste d’échelle.'
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- distance
note_conditions: de loin, les plus petites parties cessent de se voir et des niveaux disparaissent
porteur: une configuration (objet, composition, façade)
arité: 1
condition_NA: porteur sans parties perceptibles (un galet uni).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `oneLevel` (rang 1) vers `threeOrMoreLevels` (rang 3), le nombre de niveaux de parties emboîtées augmente
  numerique: non
  regions:
  - cle: oneLevel
    label_fr: un seul niveau
    label_en: one level
    rang: 1
    repere: des parties qui ne se divisent pas à leur tour (un tabouret à trois pieds)
    exemplaires: []
  - cle: twoLevels
    label_fr: deux niveaux
    label_en: two levels
    rang: 2
    repere: des parties elles-mêmes divisées une fois (une fenêtre à petits carreaux dans un mur nu)
    exemplaires: []
  - cle: threeOrMoreLevels
    label_fr: trois niveaux ou plus
    label_en: three or more levels
    rang: 3
    repere: 'des parties dans des parties, sur trois niveaux ou plus (une façade de cathédrale : portails, voussures, statues ; un chou romanesco)'
    exemplaires: []
identite: 'Nombre de niveaux de parties contenues dans des parties, pas le nombre d’éléments (densité), pas la différence de taille entre deux éléments (contraste d’échelle). Quelle partie contient quelle
  autre n’est pas une qualité : c’est une description de l’objet lui-même, notée à part (spec §9.7 I).'
