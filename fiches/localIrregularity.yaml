# Fiche de type PPP — ppp:localIrregularity — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:localIrregularity
label_fr: irrégularité locale
label_en: local irregularity
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:texture
  - ppp:contour
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Présence et ampleur des endroits où une surface, un trait, un bord, ou l’intérieur visible d’une matière, s’écarte de la régularité qu’il a dans l’ensemble (un trait tremblé, des carreaux posés
  à la main qui ne s’alignent pas tout à fait, quelques bulles isolées dans un verre clair).
question_attentionnelle: La surface, le trait, le bord ou l’intérieur visible d’une matière s’écarte-t-il par endroits de sa régularité d’ensemble, et ces écarts sont-ils légers ou marqués ?
contre_exemple: 'Une surface à gros relief régulier (tôle gaufrée) a une texture grosse, sans irrégularité locale. Un verre bullé, semé partout de bulles pareilles, n’a pas d’irrégularité locale : ces bulles
  sont sa régularité. Qu’un verre ait plus ou moins de bulles relève de la densité perceptive ; leur répartition, de la distribution. Des accidents isolés dans une matière par ailleurs régulière (trois
  bulles dans un verre clair, un fil dans une coupe soufflée, une grosse bulle parmi des petites) relèvent de l’irrégularité locale ; un amas de bulles relève des deux types : c’est un écart, et la distribution
  est groupée. Des bulles si fines qu’on ne les distingue plus une à une rendent le verre trouble : c’est sa transparence qui change.'
grandeur_physique_homonyme: 'aucune pour le label canonique ; l’ancien label v0.2 « rugosité », retiré, était homonyme de la rugosité de surface mesurée, qui relève de la texture.'
mesure:
  etat: aucune_methode_robuste
  synthese: Aucune méthode robuste de mesure associée aux écarts locaux à la régularité d’ensemble n’est connue (recherche du 2026-10-17). Les paramètres de rugosité de profil ou de surface résument tout
    le relief d’une zone ; pour l’intérieur d’un verre, les normes comptent bulles et inclusions par rapport à un verre sans bulle. Aucune norme lue ne repère les endroits où une surface, un trait, un bord
    ou l’intérieur d’une matière s’écarte de sa propre régularité.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: paramètres de rugosité de profil ou de surface (ISO 21920-2, ISO 25178-2)
    references:
    - iso_21920_2
    - iso_25178_2
    raison: ils résument le relief de toute une zone en une valeur moyenne ou extrême, sans repérer où la surface s’écarte de sa régularité d’ensemble ; ils ne valent pas pour un trait ou un bord, et ne
      saisissent ni la distance de vue, ni l’éclairage, ni l’observateur
    statut_lecture: résumé public lu (pages de l’ISO)
  - nom: tolérances de bulles et d’inclusions du verre (ISO 10110-18, ISO 12543-6)
    references:
    - iso_10110_18
    - iso_12543_6
    raison: elles comptent des défauts par rapport à un verre sans bulle et ne disent pas où l’intérieur s’écarte de sa propre régularité ; la notation d’optique descend à des tailles invisibles à distance
      d’usage ; elles ne valent que pour le verre d’optique ou le verre feuilleté de bâtiment
    statut_lecture: pages de l’ISO et extraits publics lus (ISO 10110-18, sections 3.2 et 6.2 ; ISO 12543-6, domaine d’application et définitions)
  - nom: contrôle visuel des bulles et inclusions du verre d’optique (SCHOTT TIE-28 ; ISO 12123)
    references:
    - schott_tie28
    - iso_12123
    raison: il compte bulles et inclusions par leur aire totale dans un volume donné, par rapport à un verre sans bulle, et ne traite leur concentration que comme un motif de rejet ; il ne dit pas l’écart
      perçu à la régularité propre de l’objet, ne vaut que pour le verre d’optique et ne saisit ni la distance de vue ni l’observateur
    statut_lecture: note technique lue (SCHOTT, sections 4 et 5) ; ISO 12123, page de l’ISO et extrait public lus
modalites:
- vision
- toucher
mode_de_presentation: image
conditions_critiques:
- distance
- angle
note_conditions: 'de loin, des écarts légers cessent de se voir ; dans l’intérieur d’une matière, le contre-jour ou une lumière de côté sur fond sombre révèlent bulles et nuages, et c’est en tournant l’objet
  qu’on voit l’intérieur ; la lumière reste en note (spec §9.7 H, règle 3) ; angle est critique pour la vue, par l’exception de cette règle ; dans l’intérieur, le jugement se fait à la vue seulement.
  Sur une photo, si l’on ne peut pas dire si l’écart est dans l’intérieur ou en surface : « non tranché ».'
porteur: une surface, un trait ou un bord ; ou l’intérieur d’une matière qui laisse voir dedans (verre, résine, pierre translucide)
note_porteur: 'Intérieur : on ne juge que ce qui se voit dans l’épaisseur, il faut donc que la matière laisse passer la lumière. Sur une matière opaque, seule la surface se juge. Une bulle se distingue d’une
  piqûre parce qu’elle glisse sous la surface quand on tourne l’objet et qu’elle ne casse pas le reflet. Si on ne peut pas trancher (photo), on écrit « non tranché ». Au toucher, seule la surface compte.
  La transparence est une condition d’accès à l’intérieur, pas une base du type : les bulles ont déjà un bord perçu (netteté du bord), et une piqûre sur un métal opaque ne dépend pas de la transparence.
  Seule compte la bulle vue, pas celle qu’on sait là. Les indices bulle / piqûre sont des positions de travail, à éprouver.'
arité: 1
condition_NA: porteur sans régularité d’ensemble perceptible (rien par rapport à quoi un écart se lirait).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `none` (rang 1) vers `marked` (rang 3), l’ampleur des écarts augmente
  numerique: non
  regions:
  - cle: none
    label_fr: aucune
    label_en: none
    rang: 1
    repere: aucun écart local perceptible
    exemplaires:
