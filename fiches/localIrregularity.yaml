etat_de_l_art: 'La régularité d’une texture est une des dimensions de Tamura, Mori et Yamawaki (1978) [[tamura1978]], calculée à partir des variations de leurs autres mesures (grossièreté, contraste, orientation, linéarité) ; Liu et Picard (1996) [[liu_picard1996]] traitent le caractère aléatoire d’une texture comme une composante à part. Aucune source trouvée ne nomme l’écart local à une régularité comme qualité perçue. Dans l’intérieur d’une matière, aucune étude de perception sur les bulles ou les inclusions n’a été trouvée (recherche du 2026-10-17). La perception des matières translucides et transparentes est étudiée : flou, contraste, reflets et lumière y jouent [[fleming_bulthoff2005]] [[motoyoshi2010]], et le phénomène perçu dépend des conditions d’observation [[gigilashvili2021]] ; le modèle des filtres minces [[metelli1974]] convient mal à un volume ; dans un verre épais, les déformations dues à l’objet servent d’indice [[fleming_jakel_maloney2011]]. Pour séparer une bulle d’une piqûre, la parallaxe de mouvement, indice de profondeur reconnu [[cutting_vishton1995]], et le reflet qui reste entier au-dessus d’une bulle sont des positions de travail. Les normes et notes techniques du verre décrivent bulles et inclusions comme des défauts, comptés par rapport à un verre sans bulle (ISO 10110-18 [[iso_10110_18]], ISO 12123 [[iso_12123]], SCHOTT TIE-28 [[schott_tie28]], ISO 12543-6 [[iso_12543_6]]) ; le vocabulaire d’atelier distingue seed, blister, cord et stone [[astm_c162]]. La base retenue (texture et netteté du bord) est une décision du projet, révisable après épreuve (T11, série 48) ; la transparence n’en fait pas partie : c’est une condition d’accès à l’intérieur. Détail : docs/bibliographie-par-type.md#groupe-texture.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-texture
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:localIrregularity a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une surface ou un trait » à « je cherche où il s’écarte de sa régularité » change la description (repérage de la trace de la main, des écarts de pose ; dans un verre, des
  bulles ou des fils à l’intérieur).
transfert: objet conçu oui (céramique tournée, carrelage posé à la main) | tableau oui (trait tremblé) | cuisine oui (plan de travail en pierre) | high-tech oui (petites marques sur une coque lisse) | verre et résine oui (bulles d’un verre soufflé, inclusions dans une résine coulée ou un presse-papier)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques
    (spec §9.7 H) ; vision et toucher éprouvés séparément
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: sur des objets à semis égal de bulles, de nombres différents, la densité varie et l’irrégularité locale reste `none`
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
