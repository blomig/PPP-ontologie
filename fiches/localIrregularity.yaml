# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:localIrregularity
label_fr: irrégularité locale
label_en: local irregularity
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:texture
  - ppp:contour
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Présence et ampleur des endroits où une surface, un trait ou un bord s’écarte de la régularité qu’il a dans l’ensemble (un trait tremblé, des carreaux posés à la main qui ne s’alignent pas tout
  à fait).
question_attentionnelle: La surface, le trait ou le bord s’écarte-t-il par endroits de sa régularité d’ensemble, et ces écarts sont-ils légers ou marqués ?
contre_exemple: Une surface à gros relief régulier (tôle gaufrée) a une texture grosse, sans irrégularité locale.
grandeur_physique_homonyme: 'aucune pour le label canonique ; l’ancien label v0.2 « rugosité », retiré, était homonyme de la rugosité de surface mesurée, qui relève de la texture.'
mesure:
  etat: aucune_methode_robuste
  synthese: Aucune méthode robuste de mesure associée aux écarts locaux à la régularité d’ensemble n’est connue (recherche du 2026-10-16). Les paramètres de rugosité de profil ou de surface résument tout
    le relief d’une zone ; aucune norme lue ne repère les endroits où une surface, un trait ou un bord s’écarte de sa propre régularité.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: paramètres de rugosité de profil ou de surface (ISO 21920-2, ISO 25178-2)
    references:
    - iso_21920_2
    - iso_25178_2
    raison: ils résument le relief de toute une zone en une valeur moyenne ou extrême, sans repérer où la surface s’écarte de sa régularité d’ensemble ; ils ne valent pas pour un trait ou un bord, et ne
      saisissent ni la distance de vue, ni l’éclairage, ni l’observateur
    statut_lecture: résumé public lu (pages de l’ISO)
modalites:
- vision
- toucher
mode_de_presentation: image
conditions_critiques:
- distance
note_conditions: de loin, des écarts légers cessent de se voir
porteur: une surface, un trait ou un bord
arité: 1
condition_NA: porteur sans régularité d’ensemble perceptible (rien par rapport à quoi un écart se lirait).
