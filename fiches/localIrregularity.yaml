  cible: regularity (Tamura, Mori et Yamawaki 1978)
  reference: Tamura, H., Mori, S. & Yamawaki, T. (1978). Textural features corresponding to visual perception. IEEE Trans. SMC 8(6), 460–473. doi:10.1109/TSMC.1978.4309999
  reference_id: tamura1978
  note: 'dans la source, régularité globale : 1 moins la somme normalisée des écarts types des autres mesures entre sous-images ; polarité inverse et portée globale, alors que l’irrégularité locale vise
    des écarts par endroits ; mesure calculée sur une image en niveaux de gris, comparée par les auteurs à des classements humains de 16 textures de l’album de Brodatz ; ne fournit pas de régions ; non
    déclaré exact (spec §9.7 O)'
