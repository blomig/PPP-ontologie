etat_de_l_art: 'La régularité d’une texture est une des dimensions de Tamura, Mori et Yamawaki (1978) [[tamura1978]], calculée à partir des variations de leurs autres mesures (grossièreté, contraste, orientation, linéarité) ; Liu et Picard (1996) [[liu_picard1996]] traitent le caractère aléatoire d’une texture comme une composante à part. Aucune source trouvée ne nomme l’écart local à une régularité comme qualité perçue. La base retenue (texture et netteté du bord) est une décision du projet, révisable après épreuve (T11, série 48). Détail : docs/bibliographie-par-type.md#groupe-texture.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-texture
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:localIrregularity a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une surface ou un trait » à « je cherche où il s’écarte de sa régularité » change la description (repérage de la trace de la main, des écarts de pose).
transfert: objet conçu oui (céramique tournée, carrelage posé à la main) | tableau oui (trait tremblé) | cuisine oui (plan de travail en pierre) | high-tech oui (petites marques sur une coque lisse)
