  - cle: marked
    label_fr: marquée
    label_en: marked
    rang: 3
    repere: des écarts visibles d’emblée
    exemplaires:
    - ppp-a:pilote-2703
identite: 'Écart à une régularité, pas la taille du relief (texture) ; dans l’intérieur d’une matière, pas le nombre d’inclusions (densité perceptive), pas leur répartition (distribution), pas le trouble
  d’ensemble (transparence), pas l’impression de voir loin dans l’épaisseur (profondeur dans la matière).'
relations:
- type: confusableWith
  cible: ppp:perceptualDensity
  note: 'dans un verre, beaucoup de bulles se lisent d’abord comme un nombre d’éléments : c’est la densité perceptive ; l’irrégularité locale demande où l’intérieur s’écarte de sa régularité d’ensemble'
- type: confusableWith
  cible: ppp:subsurfaceDepth
  note: des bulles vues à différentes profondeurs donnent l’impression d’entrer dans la matière ; cette impression relève de la profondeur dans la matière, pas de l’écart à la régularité
alignements_externes:
