  facteurs_non_perceptuels: []
facettes:
- forme
définition: Différence perçue de taille entre deux éléments vus ensemble, de deux éléments presque pareils à un très grand élément face à un très petit.
question_attentionnelle: Entre ces deux éléments vus ensemble, les tailles sont-elles voisines, nettement différentes (l’un nettement plus grand), très différentes (l’un plusieurs fois plus grand) ou sans
  commune mesure (un très grand élément à côté d’un très petit) ?
contre_exemple: 'Une tour vue seule dépasse le corps de celui qui la regarde : c’est sa taille perçue. Le contraste d’échelle compare toujours deux éléments vus ensemble (la tour et la maison à son pied),
  même quand tous deux dépassent le corps.'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode de mesure robuste de la différence de taille perçue n’est connue (recherche du 2026-10-16). Le rapport des dimensions mesurées n’est pas retenu : dans les illusions de Delboeuf
    et d’Ebbinghaus, la taille perçue d’un objet dépend de celle des objets qui l’entourent [[mruczek2017]].'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: rapport des dimensions mesurées des deux éléments
    references:
    - iso_80000_3
    - mruczek2017
    raison: 'la taille perçue d’un élément dépend de ce qui l’entoure (illusions de Delboeuf et d’Ebbinghaus) : un même rapport de dimensions peut donner des différences perçues différentes ; ne saisit ni la distance de vue, ni la disposition, ni l’observateur ; ISO 80000-3 définit la grandeur sans décrire de procédé de mesure'
    statut_lecture: résumé public lu (ISO 80000-3) ; résumé lu (Mruczek et al. 2017, OpenAlex)
modalites:
- vision
mode_de_presentation: image
porteur: deux termes (zones, parties ou objets), rôle `terme` pour chacun
arité: 2
dimension_comparee: ppp:perceivedSize
condition_NA: moins de deux termes distincts sur cette dimension (une seule zone homogène).
