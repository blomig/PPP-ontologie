id: ppp:scaleContrast
label_fr: contraste d’échelle
label_en: scale contrast
label_court: contraste d’échelle
labels_alternatifs:
- contraste de taille
patron: P2
sorte: relateur
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
