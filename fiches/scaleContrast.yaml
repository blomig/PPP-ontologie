note_labels_regions: 'Labels propres au contraste d’échelle (T34 : l’éditeur du projet a retenu l’option B le 2026-10-11, des labels propres ; les labels eux-mêmes sont une proposition de l’équipe, à valider)
  : « tailles voisines / nettement différentes / très différentes / sans commune mesure », champ `labels_regions_propres`. « Sans commune mesure » remplace « démesurées », qui peut porter un jugement (l’excès).
  Label anglais de `strong` : *vastly different sizes*, de même forme que les trois autres (*similar sizes*, *clearly different sizes*, *very different sizes*) ; *no common measure* est un calque, peu idiomatique
  comme label, et ferait croire que les deux tailles ne se comparent pas, alors que le type les compare. Les régions restent celles de tous les contrastes (mêmes clés, mêmes rangs, labels généraux « faible
  / modéré / évident / maximal ») : seul l’affichage change. Raison : la taille perçue n’a pas de bout d’échelle (on peut toujours trouver plus grand ou plus petit), alors que la clarté va du noir au blanc
  et que la teinte a des opposées sur le cercle ; « maximal » se lisait mal pour la taille (spec §9.7 B).'
