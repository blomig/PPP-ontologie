identite: Un écart de taille perçue entre deux termes, pas la taille perçue d’un seul porteur.
note_dimension: 'Le contraste d’échelle ne se lit pas sur les trois régions de la taille perçue : une tour et la maison à son pied dépassent toutes deux le corps, et leur contraste d’échelle peut être fort.
  Il se juge directement entre les deux termes (T8).'
