etat_de_l_art: 'Les illusions de Delboeuf et d’Ebbinghaus, deux illusions de taille connues où un même cercle paraît plus grand ou plus petit selon les figures qui l’entourent, montrent que la taille vue
  d’un élément dépend des éléments vus avec lui : la taille apparente d’un cercle change avec la taille et la distance des cercles qui l’entourent (Girgus, Coren et Agdern 1972) [[girgus1972]]. On parle
  de contraste de taille quand deux objets paraissent plus différents qu’ils ne sont, d’assimilation quand ils paraissent plus semblables (Mruczek et al. 2017, résumé lu) [[mruczek2017]] ; ces jugements
  peuvent varier selon la culture : une étude trouve l’illusion d’Ebbinghaus plus faible chez des Himba que chez des Anglais (de Fockert et al. 2007) [[defockert2007]]. Aucune source trouvée ne propose
  une échelle perçue de l’écart de taille entre deux éléments vus ensemble (recherches du 2026-10-10 et du 2026-10-11 : Crossref, Semantic Scholar, OpenAlex) ; les labels des régions sont propres à ce contraste
  (T34). Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-contrastes
axiomes:
- conceptuel: Tout contraste particulier médie exactement deux termes.
  validation: Toute assertion de type ppp:scaleContrast a exactement deux ppp:about, chacun avec un ppp:role.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Tout contraste d’échelle est un contraste perceptif dont la dimension comparée est ppp:perceivedSize.
  validation: Toute assertion de type ppp:scaleContrast relève aussi de ppp:perceptualContrast ; elle ne déclare pas de ppp:comparedDimension, ou déclare ppp:perceivedSize.
nanay: Oui — passer de « je vois deux éléments » à « je compare leurs tailles » change la description (lecture d’un rapport de grandeur entre eux).
transfert: objet conçu oui (grand et petit élément d’un même objet) | tableau oui (figures de tailles différentes) | cuisine oui (grand plat, petites tasses) | high-tech oui (grand écran, petits boutons)
  | architecture oui (tour et maison)
