    apres: 'Les illusions de Delboeuf et d’Ebbinghaus, deux illusions de taille connues où un même cercle paraît plus grand ou plus petit selon les figures qui l’entourent, montrent que la taille vue d’un
      élément dépend des éléments vus avec lui : la taille apparente d’un cercle change avec la taille et la distance des cercles qui l’entourent (Girgus, Coren et Agdern 1972) [[girgus1972]]. On parle
      de contraste de taille quand deux objets paraissent plus différents qu’ils ne sont, d’assimilation quand ils paraissent plus semblables (Mruczek et al. 2017, résumé lu) [[mruczek2017]] ; ces jugements
      peuvent varier selon la culture : une étude trouve l’illusion d’Ebbinghaus plus faible chez des Himba que chez des Anglais (de Fockert et al. 2007) [[defockert2007]]. Aucune source trouvée ne propose
      une échelle perçue de l’écart de taille entre deux éléments vus ensemble (recherches du 2026-10-10 et du 2026-10-11 : Crossref, Semantic Scholar, OpenAlex) ; les labels des régions sont propres à
      ce contraste (T34). Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
    raison: 'T34 tranché par l’éditeur du projet le 2026-10-11 (option B) : labels propres au contraste d’échelle, clés et rangs inchangés ; fait devenu faux ; puis : série 7 (point de la coordination)
