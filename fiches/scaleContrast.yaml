      petit ; « sans commune mesure » dit seulement que l’écart est énorme, pas que les deux tailles ne se comparent pas ; la frontière avec « très différentes » n’est pas chiffrée : l’épreuve d’accord
      (E1) dira où les observateurs la placent'
    exemplaires:
