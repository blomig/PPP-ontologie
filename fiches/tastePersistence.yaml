etat_de_l_art: 'La finale (*wine finish*) est définie comme « the tastes and aromas that linger after swallowing wine » (Baker et Ross, 2014 [[baker_ross2014]], d’après Jackson, 2002 [[jackson2002]], par
  source secondaire) ; plus d’éthanol allonge la finale de certaines notes. La finale varie selon la note (Goodstein et al., 2014 [[goodstein2014]]). Après avoir recraché, une part des odorants reste fixée
  en bouche (Esteban-Fernández et al., 2016 [[esteban2016]]). La caudalie vaut une seconde de persistance (Grand dictionnaire terminologique [[oqlf_caudalie]]) ; une forme « codalie » est attestée en 1963
  par source secondaire [[slate2010]] ; l’invention de l’unité par Peynaud n’est pas vérifiée ; persistance « aromatique » ou « gustative » : les sources ne s’accordent pas [[academie_caudalie]]. Le temps-intensité
  (ASTM E1909-24 [[astm_e1909]]) et la TDS (Pineau et al., 2009 [[pineau2009]]) sont des jugements de jury. Aucune source lue ne porte sur la persistance d’une saveur (et non d’un arôme) dans le vin, ni
  sur l’accord entre personnes sur une durée chronométrée. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:tastePersistence a exactement un ppp:about.
- conceptuel: La valeur est une durée en secondes, positive ou nulle ; les 3 régions de lecture sont deux à deux disjointes et ordonnées par rang, sans bornes chiffrées.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « j’ai bu ce vin » à « je compte combien de temps il en reste quelque chose » change la description (on suit la trace après la gorgée, pas la gorgée).
transfert: objet conçu oui (une boisson, un assemblage) | tableau non | cuisine oui (un vin, un café, un chocolat) | high-tech non | architecture non
enonces_testables:
- id: E1
  nature: existence
  enonce: après l’épreuve du premier lot, sur 6 à 10 produits identifiés (portions du même lot, au même moment), accord inter-observateurs sur la durée chronométrée (écart au-dessous d’un seuil fixé avant
    l’épreuve) et sur la région de lecture, à `nez` égal (spec §9.7 H, règle 12), la portion avalée ou recrachée de la même façon par tous
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les produits (ceux qui aiment et ceux qui n’aiment pas)
  statut_epistemique: non éprouvé
  epreuve: null
