# Fiche de type PPP — ppp:tastePersistence — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:tastePersistence
label_fr: longueur
label_en: length
labels_alternatifs:
- caudalie
- persistance en bouche
- persistance aromatique intense
labels_alternatifs_en:
- finish
- lingering taste
note_label_alternatif: '« caudalie » est un jargon d’atelier, marqué comme tel : c’est une unité (1 caudalie = 1 seconde de persistance, selon le Grand dictionnaire terminologique [[oqlf_caudalie]]) ; une
  forme plus ancienne, « codalie », est attestée en 1963 par source secondaire [[slate2010]]. « Persistance en bouche » est l’ancien label ; « persistance aromatique intense » vient du Grand dictionnaire
  terminologique (extraits). EN : finish, lingering taste (ancien label). « Belle longueur », « court » au sens de défaut : lexique d’atelier (§9.7 K).'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
note_base: 'strate formel, à vérifier (proposition « Goût », 2.8.4) : on juge la durée sans devoir nommer ce qui persiste.'
facettes:
- gout
définition: 'La durée pendant laquelle quelque chose de la portion, saveur ou arôme, reste perçu après avoir avalé ou recraché, jusqu’à la dernière trace perçue : une durée, en secondes, pas ce qu’on sent.'
question_attentionnelle: Après avoir avalé ou recraché, combien de secondes quelque chose de la portion reste-t-il perçu ?
contre_exemple: 'On n’arrête pas le chronomètre à la première baisse, mais à la dernière trace. Sa propre salive, ou un arrière-goût d’une gorgée précédente, ne comptent pas. L’astringence qui reste n’est
  pas une trace qui s’éteint : c’est un état de la bouche qui s’accumule. « Reste longtemps » ne juge pas : « ce vin reste longtemps, et c’est un défaut » se dit comme « …et c’est une qualité ».'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode robuste n’est connue (recherche du 2026-10-20). Le chronométrage en secondes (caudalies) est l’unité native de l’espace de valeurs, pas une mesure associée : le chronomètre est
    physique, mais le point final est jugé par le dégustateur, sans série de référence physique ; il n’est donc pas « proche ». Piste à évaluer, indirecte : le dosage en bouche des odorants relâchés après
    avoir recraché [[esteban2016]] mesure une quantité d’odorants, pas leur perception ; tant qu’elle n’est pas évaluée, l’état reste celui-ci. Le score de la grille CIEL (de 0 à 4) est hors de la rubrique
    : c’est un jugement de qualité.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: la caudalie comme mesure
    references:
    - oqlf_caudalie
    raison: 'un jugement chronométré : le point final est jugé par le dégustateur, sans série de référence physique ; c’est l’unité de l’espace de valeurs, pas une mesure associée'
    statut_lecture: extraits (Grand dictionnaire terminologique)
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - goodstein2014
    - baker_ross2014
    - pineau2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumés (Goodstein et al., 2014 ; Baker et Ross, 2014 ; Pineau et al., 2009)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
conditions_fixees:
  moment: residual
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique, déclaré par la fiche (la règle ne le rend critique que pour les types de saveur) ; `nez` est déclaré à chaque épisode : `open` pour la longueur
  de l’ensemble (saveur et arôme), `pinched` pour la seule saveur ; E1 compare à `nez` égal (choix de relecture (2026-10-20), série 78 bis). `moment` vaut `residual` par définition : la phase est fixée
  dans la définition, et `moment` n’est pas déclaré critique. Une assertion faite à une autre phase que celle que fixe la définition est invalide pour ce type, et le contrôle du site la refuse
  ; l’observation reste en note d’épisode. `unknown` est accepté, mais exclu de E1 (choix de relecture (2026-10-20), série 78 bis). `temperature_bouchee` et `avant` sont à éprouver. Avalé ou recraché va
  dans l’épisode.'
porteur: la portion qu’on vient d’avaler ou de recracher (d’un produit identifié) ; ce qui en reste perçu
note_porteur: 'porteur propre à la longueur (choix de relecture, 2026-10-20 ; proposition « Goût », 2.8.4) : la portion avalée ou recrachée, et non la portion en bouche des trois autres types du lot. L’objet
  du registre reste le produit identifié (§9.7 I).'
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
  echelle: ratio
  sens_croissant: de `vanishes` (rang 1) vers `long` (rang 3), la dernière trace perçue dure de plus en plus longtemps
  numerique: 'oui (unité : la seconde)'
  regions:
  - cle: vanishes
    label_fr: disparaît aussitôt
    label_en: vanishes at once
    rang: 1
    repere: plus rien n’est perçu dès qu’on a avalé ou recraché (de l’eau neutre) ; sans borne chiffrée
    exemplaires: []
  - cle: brief
    label_fr: reste quelques instants
    label_en: lingers briefly
    rang: 2
    repere: une trace reste quelques instants, puis s’éteint ; sans borne chiffrée
    exemplaires: []
  - cle: long
    label_fr: reste longtemps
    label_en: lingers for a long time
    rang: 3
    repere: une trace reste longtemps après la gorgée ; sans borne chiffrée
    exemplaires: []
note_echelle: 'une seule dimension, la durée de la dernière trace perçue, en secondes (échelle `ratio`, valeur numérique) ; les trois régions sont une lecture de cette durée, reprises de la réserve, sans
  bornes en secondes avant E1 (choix de relecture, 2026-10-20, proposition « Goût », 2.8.4, choix 5). Un seul type, mixte : on ne sépare persistance de l’arôme et persistance des saveurs que si E1 échoue
  ; les sources d’atelier comptent surtout l’arôme, d’autres la persistance « gustative » (Académie française [[academie_caudalie]]) : le type ne tranche pas entre elles.'
identite: 'Une durée, pas ce qu’on sent : jugée à la phase `residual` (après avoir avalé ou recraché), mais ce n’est pas cette phase : la phase dit quand on juge, la longueur combien de temps dure la trace
  (choix de relecture (2026-10-20), série 78 bis) ; pas l’astringence (un état de la bouche qui s’accumule) ; pas l’arôme en bouche (en réserve : le caractère de ce qui reste n’est pas sa durée) ; pas l’intensité.
  Rapprochement avec la persistance de l’odeur (en réserve dans la famille Odorat : l’odeur à l’air, sans prise en bouche), sans relation : homonyme de domaine.'
relations:
- type: confusableWith
  cible: ppp:astringency
  note: 'l’astringence reste après que l’aliment est parti et s’accumule : ce n’est pas une trace qui s’éteint, et elle ne se chronomètre pas comme la longueur'
- type: confusableWith
  cible: ppp:flavourIntensity
  note: 'une finale forte paraît longue : l’éthanol allonge et renforce la finale à la fois ; on juge ici combien de temps dure la trace, pas sa force'
