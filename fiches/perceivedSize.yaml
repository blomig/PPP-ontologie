# Fiche de type PPP — ppp:perceivedSize — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer ; remarque, résumé non compté comme champ), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:perceivedSize
label_fr: taille perçue
label_en: perceived size
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- forme
définition: 'Ce que l’élément paraît mesurer à côté du corps de celui qui regarde : de ce qui est plus petit que le bout du doigt à ce qui dépasse nettement une personne.'
question_attentionnelle: À côté de mon corps, cet élément paraît-il plus petit que le bout du doigt (comme un grain de riz), tenir dans la main (comme une tasse), être à l’échelle du corps (comme une chaise)
  ou dépasser le corps (comme une maison) ?
contre_exemple: '« La tour paraît bien plus haute que la maison voisine » compare deux éléments : c’est un contraste d’échelle, pas la taille perçue de la tour seule. Sa hauteur en mètres est une mesure,
  pas la taille perçue.'
grandeur_physique_homonyme: '« taille » désigne aussi la dimension mesurée d’un objet, en mètres (voir la rubrique « mesure »), et l’angle visuel qu’il occupe : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'Les dimensions d’un objet se mesurent en mètres [[iso_80000_3]] : c’est une mesure associée indirecte, puisque les régions rapportent l’objet au corps de celui qui regarde, que la règle ignore.
    La taille perçue ne se lit pas sur la règle : elle dépend aussi de la distance, du contexte et de l’observateur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso_80000_3
    nom: dimensions de l’objet
    grandeur: longueur, largeur, hauteur de l’objet
    unite_ou_echelle: mètres
    references:
    - iso_80000_3
    proximite: indirecte
    ecart: 'la règle donne la dimension de l’objet, pas ce qu’il paraît mesurer : la distance de vue, ce qui l’entoure, une photographie sans repère d’échelle et l’observateur changent la taille perçue ; les régions sont rapportées au corps de l’observateur, ce que la mesure ignore ; ISO 80000-3 définit la grandeur sans décrire de procédé de mesure'
    conditions: objet accessible et mesurable ; dimension choisie (la plus grande, en général)
    statut_lecture: résumé public lu (ISO 80000-3)
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- presentation
- distance
note_conditions: 'sur une image, la taille se juge d’après la scène montrée (note_reference) ; de loin ou sur un écran, les repères du corps manquent ; le cran « plus petit que le bout du doigt » demande
  de voir l’élément d’assez près (distance `contact` ou `near`) ou sur une image qui le montre de près à côté d’un repère du corps (un doigt, une main) : sinon, l’assertion reste non tranchée'
porteur: un élément, une partie ou un objet
arité: 1
condition_NA: porteur sans étendue perceptible.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `fingertipSized` (rang 1) vers `beyondBody` (rang 4), la taille perçue rapportée au corps de l’observateur augmente
  numerique: non
  regions:
  - cle: fingertipSized
    label_fr: plus petit que le bout du doigt
    label_en: smaller than a fingertip
    rang: 1
    repere: ce qui tient tout entier sur le bout d’un doigt, sans le dépasser, ou qui est plus petit (une petite perle, un grain de riz, un bouton de chemise, la tête d’une vis)
    exemplaires: []
  - cle: handSized
    label_fr: tient dans la main
    label_en: hand-sized
    rang: 2
    repere: ce qui dépasse le bout du doigt mais se prend d’une main (une tasse, un stylo, une pomme)
    exemplaires: []
  - cle: bodySized
    label_fr: à l’échelle du corps
    label_en: body-sized
    rang: 3
    repere: ce qu’on porte à deux bras ou à quoi l’on se mesure (une chaise, un carton de déménagement, une porte)
    exemplaires: []
  - cle: beyondBody
    label_fr: dépasse le corps
    label_en: beyond-body-sized
    rang: 4
    repere: ce qui dépasse nettement la taille d’une personne (une maison, un arbre adulte, une façade)
    exemplaires:
    - ppp-a:pilote-0801
note_echelle: 'Les crans se jugent d’après des parties du corps de celui qui regarde (le bout du doigt, la main, le corps entier), pas d’après une mesure (T8 ; contre_exemple : « sa hauteur en mètres est
  une mesure, pas la taille perçue »). Ordres de grandeur seulement indicatifs, pour se repérer : jusqu’à un ou deux centimètres environ ; jusqu’à une vingtaine de centimètres ; jusqu’à la taille d’une
  personne ; au-delà. Quatrième cran (`fingertipSized`) ajouté en série 17 sur demande de l’éditeur du projet (on perçoit des détails et des objets plus petits que la main) ; découpage confirmé par l’éditeur
  du projet en série 18, avec le label « plus petit que le bout du doigt » : un élément peut être plus petit sans, à proprement parler, tenir sur le bout d’un doigt (T8). La clé `fingertipSized` est gardée
  (aucune clé n’est réemployée, spec §9.7 C ; elle n’est pas affichée).'
note_reference: 'On juge la taille de l’élément dans la scène qu’on voit, pas celle de son image : la photo d’une maison montre un élément qui dépasse le corps (position de l’équipe, révisable ; T8).'
identite: Taille d’un seul élément, pas la différence de taille entre deux éléments (contraste d’échelle).
relations:
- type: confusableWith
  cible: ppp:scaleContrast
  note: la taille perçue se dit d’un seul élément rapporté au corps ; le contraste d’échelle compare deux éléments vus ensemble
ontoClean:
  rigidite: +R
  identite_propre: +I
  unite: —
  dependance: +D
references_statut: renseignées
references:
- id: konkle_oliva2011
  citation: 'Konkle, T. & Oliva, A. (2011). Canonical visual size for real-world objects. Journal of Experimental Psychology: Human Perception and Performance, 37(1), 23–37.'
  doi_ou_url: https://doi.org/10.1037/a0020413
  role: alimente
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-10'
  verifie_sur: 'métadonnées Crossref et résumé lu (OpenAlex, 2026-10-10) : les objets réels ont une taille vue constante à laquelle on les dessine, les imagine et préfère les voir ; elle est proportionnelle
    au logarithme de leur taille supposée dans le monde, et se caractérise mieux par le rapport entre l’objet et le cadre qui l’entoure que par un angle visuel fixe'
  reprend: le fait, dit dans le résumé, que la taille à laquelle on dessine, imagine et préfère voir un objet dépend de sa taille supposée dans le monde, et se décrit mieux par rapport au cadre qui l’entoure
    que par un angle visuel fixe
  ne_reprend_pas: la loi logarithmique et les tâches de dessin et d'imagerie
  note_verification: 'série 6, partie 7 : le résumé parle de la taille à laquelle on dessine, imagine et préfère voir un objet (« taille canonique »), pas du jugement de taille ; « on juge la taille d’un
    objet d’après sa taille supposée dans le monde » allait plus loin que le résumé ; reprend réduit à ce que le résumé soutient'
- id: iso_80000_3
  citation: 'ISO 80000-3:2019. Quantities and units — Part 3: Space and time. Genève : ISO.'
  doi_ou_url: https://www.iso.org/standard/64974.html
  role: contraste
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-16'
  verifie_sur: 'page de l’ISO lue le 2026-10-16 (noms, symboles, définitions et unités des grandeurs d’espace et de temps ; confirmée en 2023, un amendement de 2025) ; extrait public (aperçu iTeh) lu le 2026-10-16 : rayon de courbure (3-1.12, rayon du cercle osculateur d’une courbe plane, défini pour les courbes au moins deux fois continûment dérivables, en mètres) et courbure (3-2, inverse du rayon de courbure, en m⁻¹) ; texte payant non lu'
  reprend: rien (mesure associée, rubrique « mesure »)
  ne_reprend_pas: les valeurs de longueur ou de courbure comme bornes de régions
etat_de_l_art: 'Konkle et Oliva (2011) [[konkle_oliva2011]] montrent que les objets réels ont une taille vue « canonique » (celle à laquelle on tend à les dessiner ou à les imaginer), proportionnelle au
  logarithme de leur taille supposée dans le monde : elle croît avec cette taille, mais de moins en moins vite. Cela appuie une taille perçue rapportée à un repère (ici le corps de l’observateur, T8), plutôt
  qu’à la place que l’objet occupe dans le champ de vision (l’angle visuel). Détail : docs/bibliographie-par-type.md#groupe-forme.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-forme
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:perceivedSize a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois un objet » à « je le rapporte à mon corps (plus petit que le bout du doigt, dans la main, à ma taille, au-delà) » change la description (manière de l’approcher, de le prendre
  ou d’en faire le tour).
transfert: objet conçu oui (une tasse, une chaise) | tableau oui (taille des figures dans la scène peinte) | cuisine oui (ustensile, plan de travail) | high-tech oui (téléphone, écran mural) | architecture
  oui (façade)
