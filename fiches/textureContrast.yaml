etat_de_l_art: 'Les mesures de texture de Tamura, Mori et Yamawaki (1978) [[tamura1978]] permettent de comparer deux surfaces, mais elles ne définissent pas un contraste perçu entre elles. Aucune source
  trouvée ne propose une échelle perçue du contraste de texture entre deux parties d''un objet ; les labels des régions restent en position de travail (T3). Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-contrastes
axiomes:
- conceptuel: Tout contraste particulier médie exactement deux termes.
  validation: Toute assertion de type ppp:textureContrast a exactement deux ppp:about, chacun avec un ppp:role.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Tout contraste de texture est un contraste perceptif dont la dimension comparée est ppp:texture.
  validation: Toute assertion de type ppp:textureContrast relève aussi de ppp:perceptualContrast ; elle ne déclare pas de ppp:comparedDimension, ou déclare ppp:texture.
nanay: Oui — passer de « je vois deux matières » à « je compare la taille de leurs reliefs » change la description (envie de toucher, passage de la main d’une surface à l’autre).
transfert: objet conçu oui (pierre polie contre pierre brute) | tableau oui (peinture posée en épaisseur à côté d’une couche lisse et mince) | cuisine oui (plan lisse et façade striée) | high-tech oui (coque
  sablée et écran lisse)
