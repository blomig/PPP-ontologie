# Série 109 (2026-11-11) : relecture_explicative : épisodes ajoutés le 2026-11-11 relus avec leur ajout (choix de relecture (2026-11-11)) ; quatre épisodes au toucher ajoutés.
id: ppp:textureContrast
label_fr: contraste de texture
label_en: texture contrast
label_court: contraste de texture
labels_alternatifs: []
patron: P2
sorte: relateur
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:texture
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Différence perçue de texture, c’est-à-dire de taille des reliefs, entre deux surfaces, à la vue ou au toucher.
question_attentionnelle: À la vue ou sous la main, la différence de relief entre ces deux surfaces est-elle faible (même relief, ou presque), modérée (une surface lisse et une à texture fine), évidente
  (une lisse et une moyenne, ou une fine et une grosse) ou maximale (une lisse et une grosse) ?
contre_exemple: 'Deux carreaux également lisses, l’un blanc, l’autre noir, ont un contraste de texture faible : ce qui les distingue est un contraste de clarté.'
mesure:
  etat: methodes
  synthese: 'La différence de texture entre deux surfaces peut se calculer comme l’écart entre leurs paramètres de rugosité surfacique (Sa, Sal) [[iso_25178_2]] : c’est une mesure associée indirecte, qui
    hérite des limites décrites dans la fiche texture et ne saisit ni la distance de vue, ni l’éclairage, ni l’observateur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso_25178_2
    nom: écart de rugosité surfacique entre deux surfaces
    grandeur: 'différence entre les écarts moyens du relief (Sa) et entre les longueurs d’autocorrélation (Sal) mesurés sur chacune des deux surfaces ; Sa, l’écart moyen des creux et des bosses par rapport au niveau moyen de la surface ; Sal, la plus courte distance de décalage à laquelle le relief ne ressemble presque plus à lui-même (ressemblance tombée à 0,2 par défaut), soit à peu près la taille typique d’un motif du relief'
    unite_ou_echelle: micromètres
    references:
    - iso_25178_2
    - npl_gpg116
    - npl_gpg108
    proximite: indirecte
    ecart: 'compare deux valeurs mesurées au micromètre sur de petites zones, alors que les reliefs qu’on voit ou qu’on sent se comptent souvent en millimètres ; ne saisit ni la distance de vue, ni l’éclairage, ni l’observateur, ni, au toucher, la force et le geste'
    conditions: surfaces relevées par un même instrument surfacique, avec les mêmes filtres
    statut_lecture: résumé public lu (page de l’ISO ; sommaire de l’extrait public) ; symboles d’après NPL, Measurement Good Practice Guide No. 116 (2010), table 1 ; définitions de Sa et de Sal lues dans les guides NPL n° 116 et n° 108
modalites:
- vision
- toucher
mode_de_presentation: image
conditions_critiques:
- distance
note_conditions: de loin, des reliefs fins cessent de se voir et deux surfaces paraissent de même texture
porteur: deux termes (zones, parties ou objets), rôle `terme` pour chacun
arité: 2
dimension_comparee: ppp:texture
condition_NA: moins de deux termes distincts sur cette dimension (une seule zone homogène).
espace_valeurs:
  echelle: ordinale
  meme_echelle_que: ppp:perceptualContrast
  sens_croissant: de `weak` (rang 1) vers `strong` (rang 4), l’écart perçu de texture augmente
  numerique: non
  regions:
  - cle: weak
    label_fr: faible
    label_en: slight
    rang: 1
    repere: deux surfaces de même texture, ou presque (deux surfaces lisses)
    exemplaires:
    - ppp-a:pilote-1401
  - cle: moderate
    label_fr: modéré
    label_en: moderate
    rang: 2
    repere: lisse contre fine
    exemplaires:
    - ppp-a:pilote-1404
  - cle: marked
    label_fr: évident
    label_en: evident
    rang: 3
    repere: lisse contre moyenne, ou fine contre grosse
    exemplaires:
    - ppp-a:pilote-1403
  - cle: strong
    label_fr: maximal
    label_en: maximal
    rang: 4
    repere: lisse contre grosse
    exemplaires: []
identite: Un écart de texture entre deux termes, pas la texture d’un seul porteur.
