    texture ; Std, direction de la texture, degrés) ; le guide suit les projets de normes ISO 25178 alors en préparation ; relu le 2026-11-02 : Sa, moyenne arithmétique de la valeur absolue de la hauteur sur la zone d’échantillonnage (section des paramètres de hauteur) ; Sal n’y est que nommé (table 1), sans définition'
