  cible: ppp:perceptualContrast
  note: garde l’arité, les rôles, les clés et les rangs du général ; n’ajoute pas de région (A1) ; chaque région correspond à la région de même clé du général
- type: confusableWith
  cible: ppp:lightnessContrast
  note: deux carreaux lisses, l’un blanc, l’autre noir, se distinguent par la clarté, pas par la texture
ontoClean:
