id: ppp:jointLevelOffset
label_fr: décalage de niveau au joint
label_en: joint level offset
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:contour
  facteurs_non_perceptuels: []
facettes:
- forme
- organisation
définition: À l’endroit où deux parties d’un objet se rejoignent (le joint), différence de niveau perçue entre leurs deux surfaces, du même plan à une surface qui dépasse nettement l’autre.
question_attentionnelle: Au joint, les deux surfaces sont-elles au même niveau, ou l’une dépasse-t-elle un peu ou nettement ?
contre_exemple: 'Une ligne peinte à la jonction de deux surfaces de même niveau n’est pas un décalage. Un écart ouvert entre deux surfaces de même niveau non plus : c’est un espacement au joint.'
modalites:
- vision
- toucher
mode_de_presentation: image
conditions_critiques:
- angle
- distance
note_conditions: 'à la vue, un léger décalage se voit surtout sous un regard rasant ; de loin, un léger décalage paraît de même plan : les repères des régions nomment la distance ; l’angle et la distance sont critiques. Au toucher, la distance vaut toujours `contact` et l’angle est sans objet (le doigt sent la marche en passant d’une surface à l’autre) : ils restent déclarés critiques, et une assertion tactile n’est pas « non tranché » pour autant (spec §9.7 H, règles 3 et 4, décision de l’éditeur du projet du 2026-10-12, T22, option (b)).'
porteur: la partie « joint » de l’objet (app:<objet>#joint-…)
arité: 1
condition_NA: objet d’une seule pièce, sans joint perceptible.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `flush` (rang 1) vers `marked` (rang 3), la différence de niveau perçue augmente
  numerique: non
  regions:
  - cle: flush
    label_fr: affleurant
    label_en: flush
    rang: 1
    repere: les deux surfaces paraissent dans le même plan
    exemplaires:
    - ppp-a:pilote-1701
  - cle: slight
    label_fr: léger
    label_en: slight
    rang: 2
    repere: une différence de niveau perceptible de près ou au doigt
    exemplaires: []
  - cle: marked
    label_fr: marqué
    label_en: marked
    rang: 3
    repere: une différence de niveau visible à distance d’examen
    exemplaires:
    - ppp-a:pilote-1702
identite: Différence de niveau entre deux surfaces, pas l’écart qui les sépare (espacement au joint).
relations:
- type: confusableWith
  cible: ppp:lightnessContrast
  note: une ligne peinte à la jonction de deux surfaces de même niveau se voit par la clarté, sans décalage
