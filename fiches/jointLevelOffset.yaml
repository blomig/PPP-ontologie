etat_de_l_art: 'Comme pour l''écart au joint, les seules sources trouvées viennent de l''architecture (Frascari 1983 [[frascari1983]], titre seul ; Frampton 1995 [[frampton1995]], description de l''éditeur),
  et rien de ce qui en a été lu ne vise une qualité perçue. Aucune source perceptive trouvée sur le décalage de niveau vu au joint (recherche faite le 2026-10-10 : Crossref, Semantic Scholar). Détail :
  docs/bibliographie-par-type.md#groupe-joint.'
