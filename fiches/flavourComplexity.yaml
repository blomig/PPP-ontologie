etat_de_l_art: 'On ne distingue guère plus de trois ou quatre composantes dans un mélange d’odeurs, même entraîné (Livermore et Laing, 1996 [[livermore_laing1996]]) ; avec seize odorants, l’identification
  tombe au hasard, et l’analyse se limiterait à « environ trois composantes » (Jinks et Laing, 1999 [[jinks_laing1999a]] [[jinks_laing1999b]]) ; un mélange est perçu en partie comme un tout (Jinks et Laing,
  2001 [[jinks_laing2001]], qui attribuent la limite à Laing et Francis, 1989 [[laing_francis1989]]). En bouche, trois saveurs au plus sont identifiées (Laing et al., 2002 [[laing2002]]), et deux composantes
  dans des mélanges de quatre à six odeurs et saveurs (Marshall et al., 2006 [[marshall2006]]). Des consommateurs lient la complexité à la persistance, à la force et au nombre d’arômes (Meillon et al.,
  2010 [[meillon2010]]), ou à l’harmonie plutôt qu’à la séparabilité (Schlich et al., 2015 [[schlich2015]]) ; l’expertise tient surtout au vocabulaire (Hughson et Boakes, 2002 [[hughson_boakes2002]]), et
  la complexité y est vue comme « désirable » (Parr et al., 2011 [[parr2011]]). Dans un vin modèle à quatre composés, l’écart entre les notes s’efface (Goodstein et al., 2014 [[goodstein2014]]). La CPG-O
  compte des composés, pas des composantes perçues (Delahunty et al., 2006 [[delahunty2006]]). Aucune source lue ne teste l’accord entre observateurs sur un compte de composantes en bouche à crans bas.
  Détail : docs/bibliographie-par-type.md#groupe-gout.'
