# Fiche de type PPP — ppp:flavourComplexity — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:flavourComplexity
label_fr: nombre de composantes
label_en: number of components
labels_alternatifs:
- complexité
labels_alternatifs_en:
- complexity
note_label_alternatif: '« complexité » (EN complexity) est un label alternatif d’atelier, marqué comme tel : en dégustation, le mot porte une valence (A10), et la complexité y est vue comme « désirable
  » (Parr et al., 2011 [[parr2011]]). « Complexe » et « riche » restent au lexique d’atelier (§9.7 K). Homonyme : la complexité globale reste une grille d’analyse et n’est pas un type (spec §9.10) ; ce
  comptage ne la réintroduit pas.'
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:bitterness
  - ppp:oralPungency
  - ppp:astringency
  facteurs_non_perceptuels: []
note_base: 'Base proposée (strate semi-formel, à vérifier ; proposition « Goût », 2.8) : on compte des composantes perçues par d’autres types, comme le nombre de formes élémentaires a le contour pour base.
  Seuls des ids définis sont cités (A12) : l’amer, le piquant en bouche et l’astringence, tous trois formels (A9). Le sucré, l’acide, le salé, l’umami et l’arôme en bouche sont encore en réserve, sans id
  : ils entreront dans la base quand leurs fiches existeront ; la base déclarée est donc incomplète. Les deux types de texture du premier lot n’y sont pas : la définition exclut la texture de la bouchée
  (choix de relecture (2026-10-20), série 78 bis).'
facettes:
- gout
définition: 'Le nombre de composantes (saveurs, arômes par voie rétronasale (de l’arrière de la bouche vers le nez), sensations du trijumeau (le nerf qui sent la brûlure du piment, le froid de la menthe,
  le picotement), astringence ; la texture de la bouchée n’en fait pas partie) que l’on peut distinguer dans la portion en bouche, sous le régime déclaré : un compte, pas une force ni un caractère.'
question_attentionnelle: Combien de composantes différentes (saveurs, arômes, sensations) distinguez-vous dans la portion ? Une, deux, trois, ou plus de trois, sans pouvoir les compter ?
contre_exemple: 'Nommer beaucoup d’arômes n’est pas en distinguer beaucoup : on peut compter son vocabulaire plutôt que sa perception. Des composantes qui se succèdent dans le temps ne se comptent pas ensemble
  : on compte ce qui est distinct à la phase déclarée. Un mélange peut être perçu comme un tout. « Ce vin a plus de trois composantes, et c’est un défaut » doit pouvoir se dire comme « …et c’est une qualité
  » : « complexe » n’est pas « meilleur ».'
mesure:
  etat: methodes
  synthese: 'Une mesure associée indirecte existe : le nombre de zones odorantes détectées par chromatographie en phase gazeuse couplée à l’olfactométrie (CPG-O). On y compte des composés séparés par la
    colonne, pas des composantes perçues dans le mélange ; aucun lien n’est établi entre les deux. Aucune méthode proche n’est connue (recherche du 2026-10-20). Le score de la grille CIEL (de 0 à 4) est
    hors de la rubrique : c’est un jugement de qualité.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: gco_comptage
    nom: nombre de composés odorants détectés par CPG-O
    grandeur: un nombre de zones odorantes détectées par des juges qui sentent l’effluent de la colonne (méthodes par fréquence de détection ou par dilution jusqu’au seuil)
    unite_ou_echelle: nombre (sans unité)
    references:
    - delahunty2006
    proximite: indirecte
    ecart: on compte des composés séparés par la colonne, pas des composantes perçues dans le mélange, qui plafonnent vers trois ou quatre ; ni saveurs, ni trijumeau, ni toucher ; pas de mélange en bouche
      ; le résultat dépend de l’extraction et du réglage ; aucune procédure normalisée lue
    conditions: extraction, colonne, méthode de CPG-O et nombre de juges à déclarer
    statut_lecture: résumé (Delahunty et al., 2006, sur Crossref)
  non_retenues:
  - nom: gLMS et estimation de grandeur
    references:
    - green1993lms
    - green1996lms
    - stevens1957
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: résumés (Green et al., 1993 et 1996) ; métadonnées (Stevens, 1957)
  - nom: échelles de panel et notes sur une échelle de complexité, d’intensité ou d’équilibre, dont le questionnaire de complexité de Medel et al. (2009)
    references:
    - medel2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: métadonnées (Medel et al., 2009 ; contenu par source secondaire)
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - pineau2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumé (Pineau et al., 2009)
  - nom: CPG-O par intensité directe
    references:
    - delahunty2006
    raison: échelle de jugement d’un jury, sans référence physique
    statut_lecture: résumé
  - nom: compte des composés volatils dosés sans olfactométrie
    references:
    - goodstein2014
    raison: une composition, pas une détection ; plus de 1 300 composés détectés dans le vin, la bière, les boissons maltées, le brandy et les spiritueux selon une revue d’Ebeler (2001), connue par source
      secondaire
    statut_lecture: 'extraits (introduction de Goodstein et al., 2014, lue le 2026-10-20) ; Ebeler (2001) : source secondaire'
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
- moment
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique : fermer le nez retire les arômes du compte (Lawless et al., 2004 [[lawless2004]]). `moment` est critique : le compte change pendant la dégustation
  (Pineau et al., 2009 [[pineau2009]]) ; l’épisode déclare la phase (`chewing` : « pendant la mastication, ou gorgée gardée en bouche »), et E1 compare à `moment` égal. `temperature_bouchee` et `avant`
  sont à éprouver.'
porteur: la portion en bouche (la gorgée ou la bouchée) d’un produit identifié, voie rétronasale comprise
note_porteur: 'porteur des trois premiers types du lot CIEL (choix de relecture, 2026-10-20 ; proposition « Goût », 2.8) : la portion en bouche, et non le produit identifié, parce que ces jugements portent
  sur ce qui est en bouche à un moment donné et changent pendant la dégustation [[pineau2009]]. L’objet du registre reste le produit identifié ; la portion en est la partie jugée (§9.7 I).'
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `one` (rang 1) vers `beyondCount` (rang 4), on distingue de plus en plus de composantes dans la portion
  numerique: non
  regions:
  - cle: one
    label_fr: une composante
    label_en: one component
    rang: 1
    repere: une seule chose se distingue (une eau sucrée, une eau salée)
    exemplaires: []
  - cle: two
    label_fr: deux composantes
    label_en: two components
    rang: 2
    repere: deux choses se distinguent (une eau sucrée et acide)
    exemplaires: []
  - cle: three
    label_fr: trois composantes
    label_en: three components
    rang: 3
    repere: trois choses se distinguent encore une à une ; repère à choisir avant l’épreuve
    exemplaires: []
  - cle: beyondCount
    label_fr: plus de trois, sans pouvoir les compter
    label_en: more than three, beyond counting
    rang: 4
    repere: on sent qu’il y en a plus, mais on ne peut plus les séparer ni les compter
    exemplaires: []
note_echelle: 'comptage ordinal à crans bas (proposition « Goût », 2.8.1 ; clé `beyondCount` reprise de `elementaryShapeCount`) : on ne distingue guère plus de trois ou quatre composantes dans un mélange,
  même entraîné (Livermore et Laing, 1996 [[livermore_laing1996]] ; Jinks et Laing, 1999 [[jinks_laing1999a]] [[jinks_laing1999b]] ; Jinks et Laing, 2001 [[jinks_laing2001]] ; limite attribuée à Laing et
  Francis, 1989 [[laing_francis1989]], par Jinks et Laing, 2001). Au-delà de trois, un cran de plus ne serait pas partagé : le dernier cran dit qu’on ne compte plus. Les repères des crans un et deux sont
  des solutions simples, sans marque, à fixer avant l’épreuve ; ce qui compte comme « composante » est à fixer aussi.'
identite: 'Un compte de composantes distinguées dans la portion, pas une force ni un caractère : pas l’intensité d’ensemble (intensité (goût)), pas la longueur, pas l’arôme en bouche (en réserve, qui nomme
  un caractère au lieu de compter). Analogie déclarée, sans relation, avec les types de comptage d’autres sens, `ppp:hueCount` (nombre de teintes) et `ppp:elementaryShapeCount` (nombre de formes élémentaires)
  : même forme d’espace de valeurs (un compte ordinal à crans bas, borné par ce qu’on saisit d’un coup), autre porteur et autre sens (Q13, option c). Ce n’est pas la complexité globale, qui reste une grille
  d’analyse (§9.10).'
relations:
- type: confusableWith
  cible: ppp:tastePersistence
  note: 'la complexité jugée va avec la persistance : une portion dont la trace dure paraît « riche » ; on compte ce qui se distingue à la phase déclarée, pas combien de temps cela dure'
