# Fiche de type PPP — ppp:perceptualContrast — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:perceptualContrast
label_fr: contraste perceptif
label_en: perceptual contrast
label_court: contraste
labels_alternatifs: []
patron: P2
sorte: relateur
sous_sorte: —
strate: semi-formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
  note: 'la dimension comparée (spec §9.7 B, A9) : vérifiée sur chaque spécialisé et, pour une assertion du général, sur la ppp:comparedDimension déclarée'
facettes:
- organisation
définition: 'Différence perçue entre deux zones, parties ou objets sur une seule qualité nommée à l’avance (la dimension comparée : clarté, teinte, texture, taille…), de la différence à peine perceptible
  à la plus grande possible sur cette qualité.'
question_attentionnelle: En ne regardant qu’une qualité à la fois (la clarté, la teinte, la texture…), la différence entre ces deux zones est-elle faible (on les distingue à peine), modérée (elle se voit
  en y regardant), évidente (elle se voit d’emblée, même de loin) ou maximale (les deux zones sont aux deux bouts de cette qualité, comme le noir et le blanc pour la clarté) ?
contre_exemple: 'Un mur peint d’une seule couleur n’offre pas deux zones à comparer : il n’y a pas de contraste. Une zone très claire, prise seule, a une clarté, pas un contraste : il faut une seconde zone.
  Et « ces deux zones contrastent » ne suffit pas : on dit toujours sur quelle qualité (clarté, teinte, texture…).'
grandeur_physique_homonyme: 'contraste de luminance, calculé à partir des luminances de deux plages ou, localement, sur une image (voir la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'Pour la seule dimension de la clarté, le contraste de luminance se mesure [[peli1990]] : c’est une mesure associée indirecte. Pour les autres dimensions comparées (teinte, texture, taille…),
    voir la rubrique « mesure » de la fiche de la qualité comparée ; aucune mesure ne couvre ce type en général.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: peli1990
    nom: contraste de luminance
    grandeur: 'contraste de luminance, calculé à partir des luminances de deux plages ou, localement, sur une image'
    unite_ou_echelle: 'nombre sans dimension'
    references:
    - peli1990
    proximite: indirecte
    ecart: ne vaut que pour la dimension de la clarté, alors que ce type compare une qualité choisie ; porte sur la luminance, pas sur la différence perçue ; en accord avec le contraste perçu pour des images
      simples (réseau, plage sur fond uniforme), pas pour des images complexes ; ne saisit ni l’observateur, ni l’entourage, ni la distance
    conditions: 'luminances mesurées (luminancemètre ou image calibrée) ; image simple ; dimension comparée : la clarté'
    statut_lecture: résumé lu (Peli 1990, Crossref et OpenAlex)
modalites:
- vision
mode_de_presentation: image
porteur: deux termes (zones, parties ou objets), rôle `terme` pour chacun
arité: 2
dimension_comparee: null
dimension_comparee_regle: 'libre pour le général : toute assertion de ce type déclare ppp:comparedDimension (un type P1) ; un spécialisé la fixe (spec §9.7 B)'
condition_NA: moins de deux termes distincts (une seule zone homogène).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `weak` (rang 1) vers `strong` (rang 4), l’écart perçu entre les deux termes augmente
  numerique: non
  regions:
  - cle: weak
    label_fr: faible
    label_en: slight
    rang: 1
    repere: les deux termes se distinguent à peine, ou pas, sur la dimension comparée
    exemplaires:
    - ppp-a:pilote-0302
  - cle: moderate
    label_fr: modéré
    label_en: moderate
    rang: 2
    repere: l’écart se voit à l’examen, sans s’imposer à distance
    exemplaires:
    - ppp-a:pilote-0303
  - cle: marked
    label_fr: évident
    label_en: evident
    rang: 3
    repere: l’écart se voit d’emblée, à distance de pièce
    exemplaires:
    - ppp-a:pilote-0304
  - cle: strong
    label_fr: maximal
    label_en: maximal
    rang: 4
    repere: les deux termes sont aux extrémités ou près des extrémités de la dimension comparée
    exemplaires:
    - ppp-a:pilote-0305
identite: Un écart entre deux termes, pas une qualité d’un seul porteur (la clarté d’une zone n’est pas un contraste de clarté).
