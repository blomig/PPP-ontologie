manques:
- 'exemplaires (au 2026-10-14) : 0302 faible, 0304 évident, 0305 maximal relus ; 0303 modéré, marqué discutable, non montré ; ppp-a:pilote-0301 reste retiré (T24) ; le 2026-11-15, neuf épisodes proposés
  « à réaliser » (vue : sans effet sur les paliers ; candidats au registre préparés à part)'
- 'nombre et labels des régions : tranchés (T3, option A, décision de l’éditeur du projet, 2026-10-10)'
- 'ne s’explique pas sans aide (relecture explicative, série 6) : exemple concret : le type est abstrait (la dimension comparée est libre) ; au 2026-10-14, trois régions illustrées par des exemplaires relus,
  sur deux dimensions (clarté, teinte) ; reste à juger si cela suffit, ou s’il faut un renvoi visible aux contrastes spécialisés ; le 2026-11-15 : l’identité renvoie aux contrastes spécialisés, et des épisodes
  proposés montrent un même couple sur plusieurs qualités (l’échiquier : clarté, teinte, texture) et une qualité sans contraste spécialisé (la brillance) ; reste à réaliser ces épisodes ou à entrer un exemplaire'
- 'critères des régions : « faible », « modéré » et « évident » disent ce qu’on voit, « maximal » une position sur la qualité ; un même couple peut être « maximal » de près et « faible » de loin (épisodes
  06 et 07) ; la distance est déclarée, les repères ne changent pas (choix de relecture (2026-11-15)) ; à éprouver'
- 'pas d’échelle de pas pour « évident » sur une qualité sans contraste spécialisé (la brillance) : le repère se lit sur ce qu’on voit ; à éprouver'
