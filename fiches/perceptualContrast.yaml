  verifie_le: '2026-10-11'
  verifie_sur: 'métadonnées Crossref et résumé lu (OpenAlex, 2026-10-11) : le contraste physique d’images simples (un réseau, une tache sur un fond uniforme) est bien défini et s’accorde avec le contraste
    perçu, mais pas pour des images complexes, où le contraste perçu varie beaucoup d’un endroit à l’autre ; l’article propose un contraste local calculé par bandes de fréquences spatiales ; texte non lu'
  reprend: la différence entre un contraste calculé sur la lumière et le contraste perçu, qui fait de ce type une qualité perçue (grandeur_physique_homonyme)
  ne_reprend_pas: la définition calculée du contraste et les fréquences spatiales
- id: haun_peli2013
  citation: Haun, A. M. & Peli, E. (2013). Perceived contrast in complex images. Journal of Vision, 13(13), 3.
