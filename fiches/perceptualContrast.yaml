  verifie_le: '2026-10-11'
  verifie_sur: 'métadonnées Crossref et résumé lu (OpenAlex, 2026-10-11) : des observateurs jugent laquelle de deux photographies a le plus de contraste ; le contraste d’ensemble perçu dépend surtout de
    certaines fréquences spatiales ; les images aux zones sombres plus sombres sont jugées plus contrastées ; texte non lu'
  reprend: le contraste perçu comme jugement d’observateurs qui comparent, distinct du contraste calculé
  ne_reprend_pas: les fréquences spatiales, les modèles et les mesures ; le contraste de luminance n’est qu’une des dimensions comparées par ce type
etat_de_l_art: 'Pour la lumière, le contraste calculé (contraste de luminance : écart de luminance entre deux zones, rapporté à la luminance moyenne ou à celle du fond) ne s’accorde avec le contraste perçu que pour des images simples ; dans une image complexe, le contraste perçu varie d’un endroit à l’autre (Peli 1990, résumé lu) [[peli1990]], et des observateurs qui comparent deux photographies jugent laquelle est la plus contrastée (Haun et Peli 2013) [[haun_peli2013]]. Aucune source trouvée ne propose un contraste perçu général, valable pour toute dimension comparée (recherches du 2026-10-10 et du 2026-10-11 : Crossref, Semantic Scholar, OpenAlex). Les sources des contrastes spécialisés sont dans leurs fiches. Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-contrastes
axiomes:
- conceptuel: Tout contraste particulier médie exactement deux termes.
  validation: Toute assertion de type ppp:perceptualContrast a exactement deux ppp:about, chacun avec un ppp:role.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Tout contraste particulier du type général porte sur une dimension déterminée.
  validation: Toute assertion dont le ppp:assertedType est ppp:perceptualContrast déclare exactement une ppp:comparedDimension, qui est un ppp:QualityType.
nanay: Oui — passer de « je vois deux zones » à « je compare leur clarté (ou leur teinte…) et je juge l’écart, de faible à maximal » change la description (ce qui se détache, ce qui se fond).
