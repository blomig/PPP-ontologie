episodes_a_realiser:
- id: ppp-a:ep-perceptualContrast-01
  realisation: a_realiser
  region_attendue: moderate
  rang_exemplaire: second
  dimension_comparee: ppp:lightness
  objet: 'échiquier de bois vide, sur photo ; termes : une case claire et la case foncée voisine ; image : https://commons.wikimedia.org/wiki/File:Empty_wooden_chessboard.jpg (CC0, licence vérifiée le 2026-11-15)'
  objet_en: 'an empty wooden chessboard, in a photo; terms: a light square and the neighbouring dark square; image: https://commons.wikimedia.org/wiki/File:Empty_wooden_chessboard.jpg (CC0, licence checked
    on 2026-11-15)'
  preparation: afficher l’image en plein écran ; ne rien recadrer ; montrer du doigt la case claire (A), puis la case foncée voisine (B), sur la même rangée, au centre de la moitié avant
  preparation_en: show the image full screen; do not crop anything; point to the light square (A), then to the neighbouring dark square (B), in the same row, in the middle of the front half
  consigne: En ne regardant que la clarté (combien chaque case paraît claire ou sombre), la différence entre ces deux zones est-elle faible (on les distingue à peine), modérée (elle se voit en y regardant),
    évidente (elle se voit d’emblée, même de loin) ou maximale (les deux zones sont aux deux bouts de cette qualité, comme le noir et le blanc) ?
  consigne_en: Looking only at lightness (how light or dark each square looks), is the difference between these two zones slight (you can barely tell them apart), moderate (you see it when you look), evident
    (you see it at once, even from afar) or maximal (the two zones are at the two ends of this quality, like black and white)?
  conditions:
    presentation: screen
    lumiere: diffuse
    distance: near
    angle: oblique
    duree: exam
    yeux: ouverts
    yeux_en: open
    note: lumière, distance et angle estimés sur l’image ; écran d’au moins 30 cm de diagonale
    note_en: light, distance and angle estimated from the image; screen at least 30 cm across the diagonal
  doute: oui
  motif_doute: l’écart se voit bien et pourrait être jugé « évident » (visible d’emblée) ; le registre dit déjà, pour l’éventail des clartés de ce damier, « l’écart se voit bien, mais sans noir ni blanc
    »
  motif_doute_en: the difference is clearly visible and could be judged “evident” (seen at once); the register already says, for the range of lightnesses of this board, “the difference is clearly visible,
    but with neither black nor white”
  note: 'même constat qu’un contraste de clarté (région modérée, sans exemplaire) : doublon assumé ; lié aux épisodes de la teinte et de la texture sur l’échiquier (même couple, autres dimensions)'
  note_en: 'same finding as a lightness contrast (moderate region, no exemplar yet): an accepted duplicate; linked to the hue and texture episodes on the chessboard (same pair, other dimensions)'
  texte_fr: 'Échiquier de bois : entre une case claire et une case foncée, contraste de clarté modéré (prédiction, à éprouver).'
  texte_en: 'Wooden chessboard: between a light and a dark square, moderate lightness contrast (prediction, to be tested).'
- id: ppp-a:ep-perceptualContrast-02
  realisation: a_realiser
  region_attendue: moderate
  rang_exemplaire: principal
  dimension_comparee: ppp:hue
  objet: 'un citron et un citron vert posés côte à côte, sur photo ; termes : le citron et le citron vert ; image : https://commons.wikimedia.org/wiki/File:Lemon_and_lime.jpg (CC BY-SA 4.0, photo de Rhododendrites,
    licence vérifiée le 2026-11-15)'
  objet_en: 'a lemon and a lime side by side, in a photo; terms: the lemon and the lime; image: https://commons.wikimedia.org/wiki/File:Lemon_and_lime.jpg (CC BY-SA 4.0, photo by Rhododendrites, licence
    checked on 2026-11-15)'
  preparation: afficher l’image en plein écran ; montrer le citron (A), puis le citron vert (B)
  preparation_en: show the image full screen; point to the lemon (A), then to the lime (B)
  consigne: En ne regardant que la teinte (rouge, jaune, vert, bleu…), la différence entre ces deux fruits est-elle faible (on les distingue à peine), modérée (elle se voit en y regardant), évidente (elle
    se voit d’emblée, même de loin) ou maximale (les deux sont aux deux bouts de cette qualité) ?
  consigne_en: Looking only at hue (red, yellow, green, blue…), is the difference between these two fruits slight (you can barely tell them apart), moderate (you see it when you look), evident (you see
    it at once, even from afar) or maximal (the two are at the two ends of this quality)?
  conditions:
    presentation: screen
    lumiere: diffuse
