facettes:
- couleur
définition: Degré auquel une couleur paraît s’écarter du gris de même clarté.
question_attentionnelle: Cette couleur paraît-elle grise, peu colorée, moyennement ou très colorée ?
contre_exemple: 'Une couleur claire n’est pas pour autant peu saturée : clarté et saturation varient séparément.'
grandeur_physique_homonyme: 'chroma C* (CIELCh), pureté d’excitation : aucune région ne s’en déduit.'
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- presentation
note_conditions: un écran ou un imprimé peut rendre une couleur plus ou moins vive que sur l’objet
porteur: une zone, une partie ou un objet
arité: 1
condition_NA: porteur sans surface ni lumière perceptible. Un gris est APPLICABLE, en région `neutral`.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `neutral` (rang 1) vers `high` (rang 4), l’écart perçu au gris augmente
  numerique: non
  regions:
  - cle: neutral
    label_fr: neutre
    label_en: neutral
    rang: 1
    repere: un gris, sans couleur perceptible
    exemplaires:
    - ppp-a:pilote-1305
  - cle: low
    label_fr: faible
    label_en: low
    rang: 2
    repere: une couleur grisée
    exemplaires:
    - ppp-a:pilote-1301
    - ppp-a:pilote-1303
  - cle: medium
    label_fr: moyenne
    label_en: medium
    rang: 3
    repere: une couleur franche mais non vive
    exemplaires:
    - ppp-a:pilote-1304
  - cle: high
    label_fr: forte
    label_en: high
    rang: 4
    repere: la couleur la plus vive qu’on puisse voir à cette clarté
    exemplaires:
    - ppp-a:pilote-1302
identite: Écart au gris, pas la teinte, pas la clarté.
