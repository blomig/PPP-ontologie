etat_de_l_art: 'La saturation correspond au chroma du système de Munsell (1905) [[munsell1905]] et au chroma C* de la colorimétrie CIE [[cie015]]. Les modèles d''apparence des couleurs font l''objet d''un
  ouvrage de Fairchild (2013) [[fairchild2013]], non lu ici. PPP retient une seule dimension perçue, à repères publics. Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:saturation a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une couleur » à « je regarde si elle est grise ou vive » change la description (une couleur paraît plus grise ou plus vive à côté d’une autre).
