id: ppp:saturation
label_fr: saturation
label_en: saturation
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- couleur
définition: Degré auquel une couleur paraît s’écarter du gris de même clarté.
question_attentionnelle: Cette couleur paraît-elle grise, peu colorée, moyennement ou très colorée ?
contre_exemple: 'Une couleur claire n’est pas pour autant peu saturée : clarté et saturation varient séparément.'
grandeur_physique_homonyme: '« saturation » désigne aussi, en colorimétrie, une grandeur calculée que la CIE distingue du chroma (e-ILV 17-22-073) : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: La colorimétrie donne un chroma calculé à partir de mesures instrumentales (C*ab de l’espace CIELAB), et le système Munsell un chroma évalué par comparaison visuelle à des échantillons ordonnés.
    Ce sont des corrélats approchés du chroma, proches de ce type, qui juge l’écart au gris de même clarté ; ils valent pour des surfaces opaques sous un éclairage et un observateur de référence et ne tiennent
    pas compte de l’entourage ni de l’éclairage réel de l’épisode.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie015
    nom: chroma C*ab (CIELAB)
    grandeur: chroma calculé à partir des coordonnées a* et b*, elles-mêmes calculées sur des valeurs trichromatiques mesurées
    unite_ou_echelle: C*ab, à partir de 0 pour un gris (corrélat approché du chroma, e-ILV 17-23-076)
    references:
    - cie015
    - cie_ilv_cielab
    - cie_ilv_chroma
    - cie_ilv_saturation
    proximite: proche
    ecart: 'corrélat approché du chroma, que la CIE distingue de la saturation : le chroma se juge par rapport à un blanc ou un gris éclairé de même (e-ILV 17-22-074), la saturation par rapport à la luminosité propre de la zone (e-ILV 17-22-073) ; valeur calculée pour un observateur et un illuminant de référence, sur un échantillon isolé : ne tient compte ni de l’entourage ni de l’éclairage de l’épisode'
    conditions: géométries d’éclairage et d’observation, observateur et illuminant normalisés
    statut_lecture: résumé public lu (CIE 015:2018) ; e-ILV lu (17-23-076)
  - id: astm_d1535
    nom: chroma Munsell (Munsell chroma)
    grandeur: chroma évalué par comparaison visuelle avec un atlas d’échantillons ordonnés ; la norme prévoit aussi la conversion depuis des données CIE
    unite_ou_echelle: notation Munsell, composante chroma
    references:
    - astm_d1535
    proximite: proche
    ecart: une notation fine par comparaison à un atlas, pour des objets opaques à la lumière du jour ; ne tient compte ni de l’entourage ni d’un autre éclairage que celui de la norme, et ne donne pas une
      région
    conditions: objets opaques (peintures), lumière du jour, comparaison à l’atlas
    statut_lecture: 'lu en partie : page de l’éditeur, Scope section 1.1 (ASTM D1535)'
