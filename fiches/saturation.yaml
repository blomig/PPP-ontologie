  - cle: high
    label_fr: forte
    label_en: high
    rang: 4
    repere: la couleur la plus vive qu’on puisse voir à cette clarté
    exemplaires:
    - ppp-a:pilote-1302
identite: 'Écart au gris, pas la teinte, pas la clarté. La fiche suit ce que la CIE appelle chroma (e-ILV 17-22-074).'
