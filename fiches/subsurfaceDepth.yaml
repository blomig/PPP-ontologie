id: ppp:subsurfaceDepth
label_fr: profondeur dans la matière
label_en: depth within the material
labels_alternatifs: []
labels_alternatifs_en:
- subsurface depth
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:translucency
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Degré auquel on a l’impression de voir dans l’épaisseur d’une matière, sous sa surface, de la matière où le regard s’arrête à la surface à celle où il paraît entrer loin.
question_attentionnelle: Le regard s’arrête-t-il à la surface de cette matière, ou paraît-il entrer un peu, ou loin, dans son épaisseur ?
contre_exemple: 'Une vitre propre est transparente, mais on regarde à travers, vers ce qui est derrière : on ne voit pas d’épaisseur dans la vitre elle-même ; c’est ce qu’on voit à travers elle (transparence).
  Un paysage peint qui s’étage en plans relève de l’étagement en plans, pas d’une profondeur dans la matière.'
mesure:
  etat: methodes
  synthese: 'En synthèse d’image, la diffusion de la lumière sous la surface se décrit par des propriétés optiques de la matière (coefficients de diffusion et d’absorption), qu’une technique de recherche
    mesure à partir d’images [[jensen2001]]. C’est une mesure associée indirecte : elle sert à prédire l’aspect, pas à dire jusqu’où le regard paraît entrer ; elle n’est pas normalisée, et ne saisit ni
    l’observateur, ni l’éclairage de l’épisode, ni la distance.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: jensen2001
    nom: propriétés optiques de diffusion sous la surface (mesure par image)
    grandeur: coefficients de diffusion et d’absorption d’une matière translucide, estimés à partir d’images de la matière éclairée en un point
    unite_ou_echelle: coefficients par unité de longueur (paramètres du modèle)
    references:
    - jensen2001
    proximite: indirecte
    ecart: 'technique de recherche, non normalisée, faite pour la synthèse d’image : elle prédit l’aspect d’une matière, pas l’impression de voir dans son épaisseur ; ne saisit ni l’observateur, ni l’éclairage
      de l’épisode, ni la distance'
    conditions: échantillon de matière éclairé en un point, images calibrées ; modèle de diffusion choisi
    statut_lecture: résumé lu (Jensen et al. 2001, Crossref et OpenAlex)
  non_retenues:
  - nom: trouble et transmittance d’une plaque (ASTM D1003)
    references:
    - astm_d1003
    raison: mesure ce qui traverse une plaque mince, pas la lumière qui entre et ressort par la même face ; la matière qu’on regarde ici est souvent épaisse ou opaque à la transmission
    statut_lecture: 'lu en partie : page de l’éditeur, Scope section 1.1 et sections 4.1 à 4.3'
modalites:
- vision
mode_de_presentation: échantillon
conditions_critiques:
- lumiere
- angle
note_conditions: 'l’impression de voir dans la matière dépend de la lumière et de l’angle de vue ; sur une photo dont la lumière et l’angle de prise de vue sont inconnus : « non tranché » (spec §9.7 H,
  règle 4 ; A5)'
porteur: une partie ou un objet vu avec son épaisseur (une glaçure, un vernis, un bloc de pierre)
arité: 1
condition_NA: 'porteur sans matière (une lumière, une ombre). Une matière opaque est applicable : le regard s’arrête à sa surface, elle est dans la région « en surface » (repère « une pierre opaque »),
  pas non applicable.'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `atSurface` (rang 1) vers `farInside` (rang 3), le regard paraît entrer plus loin dans l’épaisseur de la matière
  numerique: non
  regions:
  - cle: atSurface
    label_fr: en surface
    label_en: at the surface
    rang: 1
    repere: le regard s’arrête à la surface (un plâtre, une pierre opaque)
    exemplaires:
    - ppp-a:pilote-2901
  - cle: slightlyInside
    label_fr: un peu dans l’épaisseur
    label_en: slightly inside
    rang: 2
    repere: on voit un peu sous la surface (un vernis épais sur du bois, une cire)
    exemplaires:
    - ppp-a:pilote-2902
  - cle: farInside
    label_fr: loin dans l’épaisseur
    label_en: far inside
    rang: 3
    repere: le regard paraît entrer loin dans la matière (un bloc d’ambre, un savon translucide épais)
    exemplaires:
    - ppp-a:pilote-2903
identite: Impression de voir dans l’épaisseur d’une matière, pas ce qu’on voit à travers elle (transparence), pas l’étagement de plans d’une scène (étagement en plans).
relations:
- type: confusableWith
  cible: ppp:perceivedDepth
  note: 'les deux se disent « profondeur » (« profondeur de la scène », label alternatif de l’étagement en plans ; « profondeur dans la matière ») : l’une est l’étagement des plans d’une scène, l’autre
    l’épaisseur visible d’une matière (réciproque écrite aussi dans perceivedDepth, T31)'
- type: confusableWith
  cible: ppp:surfaceGloss
  note: un vernis épais montre souvent des reflets nets et laisse voir dans son épaisseur ; les reflets et l’épaisseur visible se jugent séparément
