etat_de_l_art: 'Fleming et Bülthoff (2005) [[fleming_bulthoff2005]] décrivent la lumière qui entre dans une matière translucide, s’y diffuse et ressort, et l’aspect doux qui en résulte ; Fleming (2014)
  [[fleming2014]] en fait un cas de la perception des matériaux. Aucune source trouvée ne nomme une qualité perçue de la profondeur à laquelle le regard paraît entrer dans la matière ; la distinction entre l’étagement en plans et la profondeur dans la matière
  est décidée (C4, deux types). Détail : docs/bibliographie-par-type.md#groupe-matiere.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-matiere
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:subsurfaceDepth a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une surface » à « je regarde si le regard entre dans la matière » change la description (couches visibles, lumière qui semble venir de l’intérieur).
transfert: 'objet conçu oui (glaçure, laque, vernis) | tableau oui (glacis : couches de peinture transparentes superposées) | cuisine oui (plan de travail en pierre translucide) | high-tech oui (coque en
  résine translucide)'
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques
    (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E3
  nature: structure
  enonce: deux matières jugées identiques en transparence ne diffèrent pas en profondeur dans la matière ; si elles diffèrent (épaisseur, couches), la base est incomplète
  statut_epistemique: non éprouvé
  epreuve: null
