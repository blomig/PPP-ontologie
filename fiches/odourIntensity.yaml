# Série 106 (2026-11-11) : épisodes proposés « à réaliser » (spec X17 ; décision de l’éditeur du projet du 2026-11-02 pour le principe ; champs, détail du lot et codage des facettes : choix de relecture) ;
# ni épreuve faite ni accord entre observateurs ; ni observateur, ni date, ni résultat. Objets et prédictions repris de la proposition de lot 9, révisés (choix de relecture (2026-11-02)) ; ids renumérotés.
episodes_a_realiser:
- id: ppp-a:ep-odourIntensity-01
  realisation: a_realiser
  region_attendue: noOdour
  objet: une coupelle en verre clair, lisse, sans décor, d’environ 10 cm, lavée à l’eau chaude sans produit parfumé, rincée et séchée à l’air
  objet_en: a small clear glass saucer, plain, about 10 cm, washed in hot water without scented product, rinsed and air-dried
  preparation: laver la coupelle et le pot comme dit, sans liquide vaisselle parfumé ; la poser au fond du pot ; préparer aussi un pot témoin vide lavé de même ; noter le produit de lavage (ou « eau seule
    »)
  preparation_en: wash the saucer and the jar as stated, without scented washing-up liquid; place the saucer at the bottom of the jar; also prepare an empty control jar washed the same way; note the washing
    product (or “water only”)
  consigne: Approchez le nez à environ 3 cm du pot ouvert, sans le toucher. Flairez calmement, deux fois au plus, sans inspirer fort. Sentez-vous quelque chose ? Rien, à peine (il faut chercher), nettement
    (sans chercher), ou fortement (l’odeur s’impose) ? Ne jugez pas si elle est agréable.
  consigne_en: Bring your nose to about 3 cm from the open jar, without touching it. Sniff calmly, twice at most, without inhaling hard. Do you smell anything? Nothing, barely (you have to search for it),
    distinctly (without searching), or strongly (the odour imposes itself)? Do not judge whether it is pleasant.
  conditions:
    presentation: unknown
    distance: near
    duree: glance
    exposition: firstSniff
    air: closed
    yeux: 'ouverts (pot opaque : l’objet n’est pas vu)'
    yeux_en: 'open (opaque jar: the object is not seen)'
    note: 'pot opaque à couvercle, ouvert juste avant, tous les pots identiques ; nez à environ 3 cm du bord du pot, sans le toucher ; deux flairages calmes d’environ 2 s ; pause de 30 s entre deux pots,
      dans la pièce aérée, sans autre neutralisation ; distance, durée et pause : protocole déclaré pour tous les épisodes d’odorat, non sourcé ; objet à la température de la pièce (vers 20 °C, valeur notée
      ; la facette `temperature_objet` est réservée pour l’odorat, règle 10) ; codage des facettes (`near`, `glance`, `firstSniff`, `closed`) : choix de relecture (2026-11-11) ; ordre tiré au sort ; pièce
      aérée puis fermée 10 min avant ; pas de parfum, de crème ni de tabac sur l’observateur ou le préparateur ; aucune autre épreuve d’odeur dans les 20 min précédentes (ISO 5496, 5.2)'
    note_en: 'opaque lidded jar, opened just before, all jars identical; nose about 3 cm from the rim of the jar, without touching it; two calm sniffs of about 2 s; 30 s pause between two jars, in the aired
      room, with no other neutralisation; distance, duration and pause: protocol declared for all smell episodes, not sourced; object at room temperature (about 20 °C, value noted; the `temperature_objet`
      facet is reserved for smell, rule 10); facet coding (`near`, `glance`, `firstSniff`, `closed`): review choice (2026-11-11); random order; room aired then closed 10 min before; no perfume, cream or
      tobacco on observer or preparer; no other odour test in the previous 20 min (ISO 5496, 5.2)'
  doute: oui
  motif_doute: 'le pot lui-même ou un reste de produit de lavage peut sentir faiblement : le pot témoin vide le contrôle'
  motif_doute_en: 'the jar itself or a residue of washing product may smell faintly: the empty control jar checks this'
  note: 'la coupelle dans un pot opaque remplace « une assiette en verre propre » de la fiche (choix de relecture (2026-11-02)) ; tous les pots sont identiques : le cran « aucune odeur » est donc celui
    du pot lui-même, ce qui est déclaré'
  note_en: the saucer in an opaque jar replaces the entry’s “a clean glass plate” (review choice (2026-11-02)); all jars are identical, so the “no odour” level is that of the jar itself, as declared
  texte_fr: 'Une coupelle en verre propre : aucune odeur (prédiction, à éprouver).'
  texte_en: 'A clean glass saucer: no odour (prediction, to be tested).'
