# Fiche de type PPP — ppp:odourIntensity — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_categories, avertissement_label.
# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:odourIntensity
label_fr: intensité de l’odeur
label_en: odour intensity
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- odorat
définition: La force avec laquelle on sent l’odeur de l’objet, le nez approché à la distance déclarée, de l’objet qui ne sent rien à celui qui sent fort.
question_attentionnelle: Le nez près de l’objet, sentez-vous quelque chose ? À peine, nettement, ou fortement ?
contre_exemple: Deux objets qui libèrent autant de substance odorante peuvent ne pas sentir aussi fort ; et la même odeur paraît plus faible à celui qui y est exposé depuis longtemps. Ce que mesure un appareil
  n’est pas ce que décrit ce type. « Fort » n’est pas « trop fort ».
grandeur_physique_homonyme: '« intensité » au sens b) d’ISO 5492 (grandeur du stimulus ; la concentration d’odeur relève de la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'L’intensité d’une odeur au-dessus du seuil peut se rapporter, par un jury, à une série de concentrations d’un odorant de référence, le 1-butanol [[astm_e544]] : c’est une mesure associée proche.
    La concentration d’odeur d’un échantillon gazeux, obtenue par dilution jusqu’au seuil de détection [[en13725]], est une mesure associée indirecte. Aucune des deux ne se fait sur l’objet, le nez approché
    à la distance déclarée.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: astm_e544
    nom: intensité d’odeur rapportée à une référence
    grandeur: intensité d’odeur d’un échantillon, comparée par un jury à celles d’une série de concentrations de 1-butanol
    unite_ou_echelle: concentration équivalente de 1-butanol (échelle de référence de l’intensité d’odeur de l’ASTM)
    references:
    - astm_e544
    proximite: proche
    ecart: 'jugée par un jury (au moins huit jugements indépendants), qui compare l’échantillon à une série de concentrations de 1-butanol ; un seul odorant de référence ; échantillon présenté selon le laboratoire (la norme ne fixe pas cette présentation) ; ne se fait pas sur l’objet, le nez approché à la distance déclarée ; ne saisit ni l’adaptation de chaque personne à l’odeur, ni l’air ambiant de l’épisode'
    conditions: jury ; série de dilutions de 1-butanol (méthode dynamique ou statique) ; présentation de l’échantillon documentée
    statut_lecture: 'lu en partie : page de l’éditeur, résumé et Scope sections 1.1 à 1.5'
  - id: en13725
    nom: concentration d’odeur (olfactométrie dynamique)
    grandeur: 'dilution d’un échantillon gazeux nécessaire pour atteindre le seuil de détection d’un jury'
    unite_ou_echelle: unités d’odeur européennes par mètre cube (ouE/m³)
    references:
    - en13725
    proximite: indirecte
    ecart: 'dit combien il faut diluer l’air prélevé pour atteindre le seuil, pas la force avec laquelle on sent l’odeur au-dessus du seuil ; faite sur un gaz prélevé, conçue pour les émissions de sources fixes, pas sur l’objet tenu près du nez ; ne saisit ni l’adaptation ni l’air ambiant de l’épisode ; la norme exclut elle-même la mesure de l’intensité perçue au-dessus du seuil (EN 13725, domaine d’application)'
    conditions: échantillon gazeux ; olfactomètre à dilution dynamique ; jury humain
    statut_lecture: 'résumé public lu (extrait public de BS EN 13725:2022, section 1)'
modalites:
- odorat
mode_de_presentation: échantillon
conditions_critiques:
- distance
- exposition
note_conditions: la distance du nez (facette `distance`) et le temps passé dans l’odeur avant de juger (facette `exposition`) sont critiques (spec §9.7 H, règle 10) ; l’air (pièce close ou aérée) est noté
  dans l’épisode, comme les autres odeurs présentes et l’état de l’observateur.
porteur: l’objet ou la partie qu’on sent (pas l’odeur d’une pièce entière)
arité: 1
condition_NA: objet qu’on ne peut pas approcher du nez (sous vitrine fermée).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `noOdour` (rang 1) vers `strong` (rang 4), on sent l’odeur de plus en plus fort
  numerique: non
  regions:
  - cle: noOdour
    label_fr: aucune odeur
    label_en: no odour
    rang: 1
    repere: on ne sent rien, même le nez près de l’objet (une assiette en verre propre)
    exemplaires: []
  - cle: faint
    label_fr: à peine perceptible
    label_en: faint
    rang: 2
    repere: il faut chercher l’odeur pour la sentir
    exemplaires: []
  - cle: distinct
    label_fr: nette
    label_en: distinct
    rang: 3
    repere: on sent l’odeur sans la chercher
    exemplaires: []
  - cle: strong
    label_fr: forte
    label_en: strong
    rang: 4
    repere: l’odeur s’impose dès qu’on approche (un cuir neuf, un savon parfumé)
    exemplaires: []
identite: La force de l’odeur sentie au nez, en inspirant, pas ce qu’elle rappelle (caractère de l’odeur), pas l’arôme en bouche (goût), pas l’agrément.
relations: []
