  doute: oui
  motif_doute: 'frontière avec « aucune odeur » : un papier ancien ou rangé loin de toute odeur peut ne rien sentir ; un papier neuf peut sentir plus nettement ; le bout de bois sec, autre proposition,
    sent selon l’essence (un pin peut sentir nettement) : non retenu'
  motif_doute_en: 'borderline with “no odour”: old paper or paper stored away from any odour may smell of nothing; new paper may smell more distinctly; the dry piece of wood, the other proposal, smells
