etat_de_l_art: 'ISO/TS 16922 définit l’intensité d’odeur comme la « force de la perception de l’odeur » (édition 2002, annulée, 3.1.3, extraits [[iso_ts16922_2002]] ; édition en vigueur 2022, 3.1.4, « magnitude
  of the perceived odour » [[iso_ts16922_2022]]) ; ISO 5492 (2.8) [[iso5492]] garde deux sens à l’intensité, PPP ne prend que la sensation. Dalton et Wysocki (1996) [[dalton_wysocki1996]] montrent que l’intensité
  perçue baisse après une longue exposition (résumé lu). Aucune source trouvée ne fixe des régions perçues pour l’odeur d’un objet. Détail : docs/bibliographie-par-type.md#groupe-odorat.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-odorat
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:odourIntensity a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « ça sent » à « ça sent à peine, nettement ou fort » change la description.
transfert: objet conçu oui (un cuir, un bois, un textile neuf) | tableau non | cuisine oui (un ustensile de bois, une planche) | high-tech oui (l’odeur d’un appareil neuf) | architecture oui (un intérieur,
  un matériau)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales
    (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
