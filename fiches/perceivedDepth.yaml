id: ppp:perceivedDepth
label_fr: étagement en plans
label_en: layering into planes
labels_alternatifs:
- profondeur de la scène
labels_alternatifs_en:
- perceived depth
- scene depth
avertissement_label: Label canonique « étagement en plans » depuis la spec 2.3.2 (position de travail, révisable par l’éditeur du projet, T25) ; label alternatif « profondeur de la scène ». L’ancien label « profondeur
  perçue » se confondait avec la profondeur dans la matière (`ppp:subsurfaceDepth`), qui est aussi perçue. Label EN *layering into planes* depuis la série 29 (ancien label EN *perceived depth*).
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- forme
- organisation
définition: 'Degré auquel les choses qu’on voit paraissent se ranger les unes devant les autres, à des distances différentes du regard : du tout à plat à de nombreux plans successifs jusqu’au lointain.'
question_attentionnelle: Ce qu’on voit paraît-il à plat, sur quelques plans (un devant et un fond), ou étagé sur de nombreux plans jusqu’au lointain ?
contre_exemple: 'Un bas-relief à peine saillant reste presque à plat, même s’il est en volume : c’est l’étagement vu qui compte. L’impression de voir dans l’épaisseur d’un émail ou d’une pierre translucide
  est une profondeur dans la matière, pas un étagement de plans.'
mesure:
  etat: aucune_methode_robuste
  synthese: Aucune méthode de mesure robuste n’est connue pour le nombre de plans qu’on perçoit dans une scène ou une image (recherche du 2026-10-16). Le rangement en plans est fait par l’observateur, à
    partir d’indices de profondeur qui se combinent [[cutting_vishton1995]] ; aucune norme ni méthode publiée lue ne le mesure.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- presentation
- distance
- angle
note_conditions: une image fige un seul point de vue ; la distance et l’angle changent les plans qu’on distingue
porteur: une scène, une composition ou un objet vu dans son ensemble
arité: 1
condition_NA: porteur sans étendue perceptible.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `flat` (rang 1) vers `manyPlanes` (rang 3), ce qu’on voit s’étage sur davantage de plans
  numerique: non
  regions:
  - cle: flat
    label_fr: à plat
    label_en: flat
    rang: 1
    repere: tout paraît dans un même plan (une affiche à deux couleurs, un mur vu de face)
    exemplaires:
    - ppp-a:pilote-3001
  - cle: fewPlanes
    label_fr: quelques plans
    label_en: a few planes
    rang: 2
    repere: un premier plan et un fond (une nature morte sur une table devant un mur)
    exemplaires:
    - ppp-a:pilote-3002
  - cle: manyPlanes
    label_fr: nombreux plans
    label_en: many planes
    rang: 3
    repere: des plans successifs jusqu’au lointain (un paysage de vallée, une longue rue en perspective)
    exemplaires:
    - ppp-a:pilote-3003
identite: Étagement en plans de ce qu’on voit, pas l’impression de voir dans l’épaisseur d’une matière (profondeur dans la matière), pas les espaces laissés libres lus comme des formes (espace négatif).
relations:
- type: confusableWith
  cible: ppp:scaleContrast
  note: un petit élément peut paraître loin plutôt que petit ; le contraste d’échelle compare deux tailles vues ensemble
- type: confusableWith
  cible: ppp:subsurfaceDepth
  note: 'les deux se disent « profondeur » : l’étagement en plans range les choses d’une scène à des distances différentes ; la profondeur dans la matière est l’impression de voir dans l’épaisseur d’une
    matière (réciproque écrite aussi dans subsurfaceDepth, T31)'
