etat_de_l_art: 'La perception de l’espace et de la profondeur est étudiée notamment par Gibson (1950) [[gibson1950]] ; Cutting et Vishton (1995) [[cutting_vishton1995]] traitent de la perception de l’agencement
  et des distances. Mather et Smith (2002) [[mather_smith2002]] montrent que le flou n’est qu’un indice grossier de l’ordre en profondeur. PPP ne nomme pas les indices (ce qui, dans une image ou une scène, permet de voir la profondeur) : il qualifie l’étagement vu ; la strate retenue (formel) est une décision du projet, à vérifier par l’épreuve E3 (T25, série 48). Détail : docs/bibliographie-par-type.md#groupe-etagement.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-etagement
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:perceivedDepth a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une image » à « je regarde ce qui est devant et derrière » change la description (parcours du regard du premier plan au lointain).
transfert: objet conçu oui (vitrine, meuble à étagères) | tableau oui (perspective, plans successifs) | cuisine oui (étagères ouvertes) | high-tech oui (fenêtres qui se superposent sur un écran) | architecture
  oui (enfilade de pièces)
