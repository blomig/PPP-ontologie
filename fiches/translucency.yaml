# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:translucency
label_fr: transparence
label_en: translucency
labels_alternatifs:
- vue à travers
- translucidité
avertissement_label: 'Le mot « transparence » nomme toute l’échelle : ce que la matière laisse voir de ce qui est derrière elle. Une matière opaque s’y range aussi, tout en bas (région « opaque ») ; « transparent
  » nomme seulement le haut de l’échelle (on voit nettement à travers). Les deux mots sont de la même famille, comme « symétrie » et « symétrique » ; aucune région ne s’appelle « transparence ». Le sens
  figuré (« la transparence d’une institution ») ne vaut pas ici. « Vue à travers » et « translucidité » sont des labels alternatifs (décision de l’éditeur du projet, 2026-10-11, T28). Label anglais `translucency`
  inchangé.'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: 'Ce que la matière laisse voir de ce qui est derrière elle : rien du tout, seulement de la lumière sans les formes, ou les formes nettes de ce qui est derrière.'
question_attentionnelle: 'Peut-on voir à travers cette matière : pas du tout, seulement une lueur ou des formes floues, ou nettement ?'
contre_exemple: 'Un verre teinté sombre reste transparent : on voit nettement à travers, même si tout paraît plus sombre ; ce sont sa clarté et sa teinte qui changent. Un miroir renvoie des images mais
  ne laisse rien voir à travers : il est opaque ; ce qu’il a de particulier, ce sont ses reflets nets (brillance de surface).'
grandeur_physique_homonyme: 'transmittance lumineuse et trouble (haze) mesurés sur une plaque, par exemple selon ASTM D1003 (« Standard Test Method for Haze and Luminous Transmittance of Transparent Plastics
  », ASTM International) ; indice de réfraction : aucune région ne s’en déduit.'
modalites:
- vision
mode_de_presentation: échantillon
conditions_critiques:
- lumiere
- presentation
note_conditions: la transparence se juge à contre-jour ou devant un fond ; valeur `backlit` de la facette lumière proposée en spec 2.3.1 (T23)
porteur: une partie ou un objet vu avec son épaisseur (une plaque, une paroi, un récipient)
note_porteur: 'Couche mince posée sur un support opaque (un vernis, une laque, une glaçure) : la couche est une partie (§9.7 I). Sa transparence se juge par ce qu’elle laisse voir du support, qui tient lieu de fond, à condition que le support montre quelque chose à reconnaître (sous un vernis clair, on voit nettement le veinage du bois : `transparent`) ; ou sur un échantillon de la même couche, seul, devant un fond ou à contre-jour. Si l’on ne peut faire ni l’un ni l’autre (par exemple sur un support uni), on écrit « non tranché », jamais `opaque` par défaut. Position de travail prudente (C12, docs/questions-crash-tests.md) ; le cas met à l’épreuve la base de `ppp:subsurfaceDepth` (E3).'
arité: 1
condition_NA: 'porteur sans matière (une lumière, une ombre). Une matière qu’on ne peut voir ni à contre-jour ni devant un fond reste applicable : « non tranché » plutôt que non applicable.'
