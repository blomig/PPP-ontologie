etat_de_l_art: 'La perception de la transparence a été modélisée par Metelli (1974) [[metelli1974]] pour des filtres minces ; Fleming et Bülthoff (2005) [[fleming_bulthoff2005]] montrent que les indices
  de ce modèle ne valent pas pour les objets translucides pleins ; Motoyoshi (2010) [[motoyoshi2010]] étudie les indices d’image qui distinguent translucide et transparent. La mesure de la lumière transmise
  (transmittance) et du trouble (ASTM D1003) [[astm_d1003]] est un homonyme. Détail : docs/bibliographie-par-type.md#groupe-matiere.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-matiere
