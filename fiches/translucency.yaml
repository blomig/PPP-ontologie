  sens_croissant: de `opaque` (rang 1) vers `transparent` (rang 3), on voit de mieux en mieux à travers la matière
  numerique: non
  regions:
  - cle: opaque
    label_fr: opaque
    label_en: opaque
    rang: 1
    repere: on ne voit rien à travers, même à contre-jour (une planche de bois, une tôle)
    exemplaires:
    - ppp-a:pilote-2304
  - cle: translucent
    label_fr: translucide
    label_en: translucent
    rang: 2
    repere: la lumière passe, mais on ne distingue pas les formes derrière (un verre dépoli, un abat-jour en papier)
    exemplaires:
    - ppp-a:pilote-2302
  - cle: transparent
    label_fr: transparent
    label_en: transparent
    rang: 3
    repere: on voit nettement les formes derrière (une vitre propre, l’eau claire d’un verre)
    exemplaires:
    - ppp-a:pilote-2303
identite: Ce qu’on voit à travers une matière, pas sa clarté (un verre sombre peut être transparent), pas ses reflets (brillance de surface), pas l’impression de voir dans son épaisseur (profondeur dans
  la matière).
