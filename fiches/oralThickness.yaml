# Fiche de type PPP — ppp:oralThickness — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:oralThickness
label_fr: épaisseur en bouche
label_en: thickness in the mouth
label_court: épaisseur
labels_alternatifs: []
labels_alternatifs_en: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- gout
définition: 'La résistance qu’oppose la gorgée ou la bouchée quand on la fait passer entre la langue et le palais, à la première mise en bouche (moment `firstContact`) : de ce qui coule comme l’eau à ce
  qui résiste fortement. Un toucher en bouche.'
question_attentionnelle: Quelle résistance la gorgée ou la bouchée oppose-t-elle quand on la fait passer entre la langue et le palais ? Aucune, un peu, nettement, ou beaucoup ?
contre_exemple: 'Ce n’est pas l’onctueux, un mélange d’épaisseur, de lisse et de gras. Un même velouté paraît moins épais chaud que tiède : la température se déclare. Ce n’est pas l’astringence : un thé
  fort peut être fluide et assécher la bouche. « Ce yaourt est très épais, et c’est un défaut » se dit comme « …et c’est une qualité ».'
grandeur_physique_homonyme: 'viscosité (en pascals-seconde) : une grandeur de rhéologie, qui relève de la rubrique « mesure » ; aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'Une mesure associée proche existe : la viscosité au rhéomètre, à une vitesse de cisaillement choisie pour la perception de l’épaisseur. Aucune vitesse unique ne vaut pour tous les aliments,
    et la mesure ne saisit ni la salive, ni la chaleur de la bouche, ni le passage en couche mince. L’échelle standard de viscosité du profil de texture sert de repère de région, pas de mesure (recherche
    du 2026-10-19).'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: viscosite_cisaillement
    nom: viscosité au rhéomètre, à une vitesse de cisaillement déclarée
    grandeur: la viscosité
    unite_ou_echelle: pascal-seconde (Pa·s), à une vitesse de cisaillement donnée (s⁻¹)
    references:
    - van_vliet2002
    - shama_sherman1973
    - kokini1977
    - stokes2013
    proximite: proche
    ecart: proche quand la vitesse est choisie pour la perception de l’épaisseur (Wood, 1968, par source secondaire) ; aucune vitesse unique ne vaut pour tous les aliments (de 0,1 à 1 000 s⁻¹ selon l’aliment)
      ; la mesure ne saisit ni la salive, ni la chaleur de la bouche, ni le passage en couche mince, ni les particules
    conditions: température de l’échantillon et vitesse de cisaillement à déclarer
    statut_lecture: 'résumés (Shama et Sherman, 1973 ; Kokini et al., 1977 ; Stokes et al., 2013) ; Wood (1968) : source secondaire ; van Vliet (2002) : extraits, à relire sur le texte'
  non_retenues:
  - nom: échelle standard de viscosité du profil de texture
    references:
    - szczesniak_brandt_friedman1963
    raison: échelle de jugement ancrée par des aliments de référence, dont les crans sont fixés par un jury et non par une grandeur physique ; à reprendre comme repères de région dans le protocole de l’épreuve
      d’accord (E1)
    statut_lecture: résumé
  - nom: TPA pour les liquides
    references:
    - nishinari2013
    raison: les auteurs mettent en garde contre l’usage des paramètres de la TPA pour les aliments liquides
    statut_lecture: résumé
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - pineau2009
    - lenfant2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumés (Pineau et al., 2009 ; Lenfant et al., 2009)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- moment
- temperature_bouchee
conditions_fixees:
  moment: firstContact
note_conditions: 'règle 12 (spec §9.7 H) : `moment` est critique pour les types de texture ; la définition fixe `firstContact` (la première mise en bouche, avant de mâcher) : une assertion faite à une autre
  phase que celle que fixe la définition est invalide pour ce type, et le contrôle la refusera (contrôle à écrire) ; l’observation reste en note d’épisode. `unknown` est accepté, mais exclu de E1 (choix
  de relecture (2026-10-20), série 78 bis). `temperature_bouchee` est critique : l’épaisseur perçue baisse quand le produit est plus chaud (Engelen et al., 2003 [[engelen2003]], produits à 10, 22 et 35
  °C). `nez` n’est pas critique ; `avant` est à éprouver. La taille de la gorgée va dans l’épisode, sans facette ; la salive est une note d’épisode (seuls les premiers temps se prédisent sans elle : Stokes
  et al., 2013 [[stokes2013]]).'
porteur: la gorgée ou la bouchée (la portion en bouche) d’un produit identifié, à la première mise en bouche
note_porteur: 'porteur des types de texture : la bouchée ou la gorgée (choix de relecture, 2026-10-20 ; proposition « Goût », 2.7) ; il change pendant qu’on le juge (salive, chaleur, mastication), d’où
  la facette `moment`. L’objet du registre reste le produit identifié ; la portion en est la partie jugée (§9.7 I).'
arité: 1
condition_NA: 'solide qu’on mord et qu’on mâche, sans le faire passer en couche entre la langue et le palais (un biscuit sec, une noix) ; objet non destiné à la bouche (un cuir, un bois verni, un métal
  : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `waterThin` (rang 1) vers `veryThick` (rang 4), la portion résiste de plus en plus entre la langue et le palais
  numerique: non
  regions:
  - cle: waterThin
    label_fr: fluide comme l’eau
    label_en: thin as water
    rang: 1
    repere: de l’eau, à la température déclarée
    exemplaires: []
  - cle: slightlyThick
    label_fr: un peu épais
    label_en: slightly thick
    rang: 2
    repere: un lait entier, un jus de fruit avec pulpe
    exemplaires: []
  - cle: thick
    label_fr: épais
    label_en: thick
    rang: 3
    repere: une crème anglaise, un yaourt à boire
    exemplaires: []
  - cle: veryThick
    label_fr: très épais
    label_en: very thick
    rang: 4
    repere: un miel, une purée lisse
    exemplaires: []
note_echelle: quatre régions, écrites avec la fiche (la proposition « Goût », 2.7, les laissait à écrire). Les quatre crans et leurs repères sont des choix de relecture provisoires (2026-10-20, série 78
  bis), à caler avant E1 sur les échelles standard du profil de texture, ici l’échelle standard de viscosité (Szczesniak, Brandt et Friedman, 1963 [[szczesniak_brandt_friedman1963]]), dont les aliments
  de référence n’ont pas été lus. Les repères sont des produits courants, sans marque, et non des exemplaires (décision 5 de l’éditeur du projet, 2026-10-19) ; ils se goûtent à la même température.
identite: La résistance de la portion entre la langue et le palais, à la première mise en bouche ; pas l’onctueux (un terme composite, en réserve, qui n’entrerait que décomposé), pas le lisse ni la glisse
  (des pistes notées), pas la dureté au premier coup de dent (dureté en bouche), pas l’astringence (un état de la bouche), pas le collant (en lot suivant).
