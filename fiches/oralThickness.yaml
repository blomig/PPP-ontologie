etat_de_l_art: 'Kokini et al. (1977) [[kokini1977]] réduisent dix attributs des liquides à trois, dont l’épaisseur, liée à la force visqueuse entre la langue et le palais ; ISO 11036:2020 [[iso11036]] définit
  la viscosité par la force pour tirer un liquide d’une cuillère sur la langue. Le stimulus de la viscosité jugée en bouche va de 0,1 à 1 000 s⁻¹ selon l’aliment (Shama et Sherman, 1973 [[shama_sherman1973]])
  ; Wood (1968), connu par van Vliet (2002) [[van_vliet2002]], associe l’épaisseur perçue à une vitesse de cisaillement choisie. L’épaisseur perçue baisse quand le produit est plus chaud (Engelen et al.,
  2003 [[engelen2003]]), et la rhéologie ne saisit ni la salive ni le passage en couche mince (Stokes et al., 2013 [[stokes2013]]). L’onctuosité est un attribut complexe, distinct (Kilcast et Clegg, 2002
  [[kilcast_clegg2002]]). Une échelle standard de viscosité, faite d’aliments de référence, existe (Szczesniak, Brandt et Friedman, 1963 [[szczesniak_brandt_friedman1963]]) ; la TPA est déconseillée pour
  les liquides (Nishinari et al., 2013 [[nishinari2013]]). Aucune source lue ne teste l’accord entre observateurs non entraînés sur des crans d’épaisseur. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:oralThickness a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je bois ce velouté » à « je regarde comment il résiste entre ma langue et mon palais » change la description (on suit le passage en bouche, pas la saveur).
transfert: objet conçu oui (une boisson, une sauce, un dessert) | tableau non | cuisine oui (soupe, sauce, crème, sirop) | high-tech non | architecture non
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 produits identifiés (gorgées du même lot, de même volume, au même moment), accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à `moment` = `firstContact`
    et `temperature_bouchee` égale (spec §9.7 H, règle 12), les produits repères goûtés avant de juger
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les produits (ceux qui aiment et ceux qui n’aiment pas)
  statut_epistemique: non éprouvé
  epreuve: null
