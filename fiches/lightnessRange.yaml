# Fiche de type PPP — ppp:lightnessRange — format : PPP_FicheType.md (spec v2.5)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:lightnessRange
label_fr: éventail des clartés
label_en: lightness range
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
  - ppp:lightness
  facteurs_non_perceptuels: []
facettes:
- couleur
définition: 'Écart entre les clartés (du plus sombre au plus clair) qu’on voit dans une même zone : une seule clarté, des clartés proches, ou des clartés éloignées, quelles que soient leurs teintes.'
question_attentionnelle: Dans cette zone, voit-on une seule clarté, des clartés proches (des gris moyens un peu différents) ou des clartés éloignées (du presque noir et du presque blanc) ?
contre_exemple: 'Un tissu rouge et vert de même clarté ne montre qu’une clarté : il varie en teinte, pas en clarté. Deux zones qu’on montre du doigt, l’une claire, l’autre sombre, se comparent par un contraste
  de clarté ; l’éventail des clartés dit ce qu’on voit dans toute une zone, sans en choisir deux.'
mesure:
  etat: methodes
  synthese: 'Une étendue de clarté peut se calculer de façon indirecte à partir d’une image colorimétrique ou de mesures de plusieurs zones : écart entre la plus faible et la plus forte valeur de L*. Aucune
    norme lue ne fixe ce calcul (choix des zones, résolution, exclusion des reflets) : c’est une mesure associée indirecte, dont le résultat dépend de ces choix.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie_ilv_cielab
    nom: étendue des valeurs de L* mesurées
    grandeur: écart entre la plus faible et la plus forte valeur de L* parmi les zones mesurées
    unite_ou_echelle: unités L* (e-ILV 17-23-076)
    references:
    - cie_ilv_cielab
    - cie015
    proximite: indirecte
    ecart: calcul sur des valeurs ponctuelles, sans norme pour le choix des zones ; ne saisit ni l’observateur, ni l’éclairage de l’épisode, ni la distance, qui décident des zones qu’on distingue et de
      leur clarté
    conditions: image colorimétrique calibrée ou mesures de plusieurs zones, observateur et illuminant normalisés
    statut_lecture: e-ILV lu (17-23-076) ; résumé public lu (CIE 015:2018) ; aucune méthode d’étendue lue
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- presentation
- lumiere
- distance
note_conditions: 'une ombre ou un reflet sur un objet courbe fait varier ce qu’on voit : on juge les clartés de la matière, pas celles de l’éclairage (à éprouver) ; de loin, de petites taches claires et
  sombres se mêlent'
porteur: une zone ou une composition
arité: 1
condition_NA: zone trop petite pour montrer plus d’une clarté (un point).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `singleLightness` (rang 1) vers `distantLightnesses` (rang 3), les clartés vues s’éloignent davantage, du plus sombre au plus clair
  numerique: non
  regions:
  - cle: singleLightness
    label_fr: une seule clarté
    label_en: single lightness
    rang: 1
    repere: toute la zone a la même clarté (un mur peint uniformément, sous une lumière égale)
    exemplaires:
    - ppp-a:pilote-2004
  - cle: closeLightnesses
    label_fr: clartés proches
    label_en: close lightnesses
    rang: 2
    repere: des clartés un peu différentes, sans très clair ni très sombre côte à côte (un enduit nuageux, un lin chiné)
    exemplaires:
    - ppp-a:pilote-2002
  - cle: distantLightnesses
    label_fr: clartés éloignées
    label_en: distant lightnesses
    rang: 3
    repere: du très sombre et du très clair dans la même zone (un damier noir et blanc, une gravure en noir et blanc)
    exemplaires:
    - ppp-a:pilote-2003
identite: Écart des clartés vues dans une même zone, pas la clarté elle-même (claire ou sombre), pas l’écart entre deux zones qu’on compare (contraste de clarté), pas les écarts de teinte (éventail des
  teintes).
relations:
- type: confusableWith
  cible: ppp:lightnessContrast
  note: deux zones qu’on montre du doigt se comparent par un contraste de clarté ; l’éventail dit l’écart des clartés vues dans toute une zone
- type: confusableWith
  cible: ppp:hueRange
  note: une zone peut varier en teinte sans varier en clarté, et l’inverse (un camaïeu de bleus, du bleu nuit au bleu ciel)
alignements_externes:
- relation: skos:relatedMatch
  cible: contrast (Tamura, Mori et Yamawaki 1978)
  reference: Tamura, H., Mori, S. & Yamawaki, T. (1978). Textural features corresponding to visual perception. IEEE Transactions on Systems, Man, and Cybernetics, 8(6), 460–473. doi:10.1109/TSMC.1978.4309999
  reference_id: tamura1978
  note: étalement des niveaux de gris dans une texture, mesuré sur une image ; PPP dit l’écart des clartés vues ; ne fournit pas de régions ; non déclaré exact (spec §9.7 O)
