- id: virtanen2026
  citation: Virtanen, L., Saarela, T. & Olkkonen, M. (2026). Complex interactions between lightness, chroma, and hue in color ensemble perception. Vision Research, 246, 108868.
  doi_ou_url: https://doi.org/10.1016/j.visres.2026.108868
  role: discute
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-10'
  verifie_sur: 'métadonnées Crossref et résumé (OpenAlex) : effet de la variation spatiale de clarté, de chroma et de teinte d''une plage de couleur sur la couleur moyenne perçue ; texte non lu'
  reprend: la variation spatiale de clarté dans une même plage comme objet d'étude perceptive, distinct de la clarté moyenne
  ne_reprend_pas: la couleur moyenne perçue, les seuils et les mesures
- id: tamura1978
  citation: Tamura, H., Mori, S. & Yamawaki, T. (1978). Textural features corresponding to visual perception. IEEE Transactions on Systems, Man, and Cybernetics, 8(6), 460–473.
  doi_ou_url: https://doi.org/10.1109/TSMC.1978.4309999
  role: alimente
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-10'
  verifie_sur: métadonnées Crossref et résumé IEEE Xplore ; deux sources secondaires (docs/etat-de-l-art.md §5 bis) ; texte intégral non lu
  reprend: la dimension *contrast* (étalement des niveaux de gris à l'intérieur d'une texture), rapprochée de ce type (skos:relatedMatch, alignements_externes)
  ne_reprend_pas: la mesure calculée sur une image ; aucune région n'en est tirée
- id: chubb1994
  citation: Chubb, C., Econopouly, J. & Landy, M. S. (1994). Histogram contrast analysis and the visual segregation of IID textures. Journal of the Optical Society of America A, 11(9), 2350.
  doi_ou_url: https://doi.org/10.1364/JOSAA.11.002350
  role: alimente
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-10'
  verifie_sur: 'métadonnées Crossref et résumé lu en entier (OpenAlex, 2026-10-10) : méthode psychophysique (analyse du contraste d’histogramme) ; textures de petites cases unies, de gris tirés au hasard
    ; à gris moyen et variance fixés, deux textures se distinguent seulement si la moyenne d’une certaine fonction des gris diffère ; texte non lu'
  reprend: l'idée, appuyée par le résumé, que la vue distingue des plages par la répartition de leurs gris, et pas seulement par leur gris moyen
  ne_reprend_pas: la méthode et ses mesures
etat_de_l_art: 'Tamura, Mori et Yamawaki (1978) [[tamura1978]] calculent l’étalement des niveaux de gris à l’intérieur d’une texture (leur *contrast*), proche de ce type ; Chubb, Econopouly et Landy (1994)
  [[chubb1994]] montrent, sur des textures faites de petites cases grises, que la vue peut distinguer deux plages de même gris moyen et de même dispersion selon la répartition de leurs gris (résumé lu)
  ; Virtanen, Saarela et Olkkonen (2026) [[virtanen2026]] étudient l’effet de la variation de clarté, de chroma (saturation) et de teinte d’une plage sur la couleur moyenne perçue. Aucune source trouvée
  ne nomme des degrés perçus de cet écart. Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:lightnessRange a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « cette zone est grise » à « je regarde si ses clartés sont une seule, proches ou éloignées » change la description (une zone égale ou tachetée).
transfert: objet conçu oui (enduit, pierre, textile chiné) | tableau oui (clairs et sombres d’une zone) | cuisine oui (plan de travail) | high-tech oui (coque mouchetée)
