etat_de_l_art: 'Tamura, Mori et Yamawaki (1978) [[tamura1978]] calculent l’étalement des niveaux de gris à l’intérieur d’une texture (leur *contrast*), proche de ce type ; Chubb, Econopouly et Landy (1994)
  [[chubb1994]] montrent, sur des textures faites de petites cases grises, que la vue peut distinguer deux plages de même gris moyen et de même dispersion selon la répartition de leurs gris (résumé lu)
  ; Virtanen, Saarela et Olkkonen (2026) [[virtanen2026]] étudient l’effet de la variation de clarté, de chroma (saturation) et de teinte d’une plage sur la couleur moyenne perçue. Aucune source trouvée
  ne nomme des degrés perçus de cet écart. Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:lightnessRange a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « cette zone est grise » à « je regarde si ses clartés sont une seule, proches ou éloignées » change la description (une zone égale ou tachetée).
transfert: objet conçu oui (enduit, pierre, textile chiné) | tableau oui (clairs et sombres d’une zone) | cuisine oui (plan de travail) | high-tech oui (coque mouchetée)
