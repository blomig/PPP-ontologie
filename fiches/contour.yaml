# Fiche de type PPP — ppp:contour — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:contour
label_fr: netteté du bord
label_en: contour
labels_alternatifs:
- contour
- bord
- limite
avertissement_label: 'Label alternatif « contour » : en français courant, il désigne souvent la silhouette. Ce type ne dit rien du tracé ; il qualifie seulement la netteté du bord (franc, progressif, flou).
  Label canonique « netteté du bord » depuis la spec 2.2.3 (T18).'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- forme
définition: 'Manière dont une zone ou une forme se sépare de ce qui l’entoure : d’un passage franc, sans épaisseur, à un passage flou qu’on ne peut pas situer.'
question_attentionnelle: Les bords sont-ils francs, progressifs ou flous ?
contre_exemple: 'Un bord en pointillé (une ligne de points bien nets) est interrompu, mais pas flou : la continuité du bord est une autre question que sa netteté. La silhouette non plus n’est pas en cause
  : un rond et un carré peuvent avoir tous deux des bords francs, ou tous deux des bords flous.'
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- distance
note_conditions: de loin, un bord progressif peut paraître franc ; la distance d’observation doit être déclarée
porteur: une zone ou une forme (le bord qui la délimite)
arité: 1
condition_NA: porteur sans bord perceptible (un aplat qui couvre tout le champ).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `sharp` (rang 1) vers `blurred` (rang 3), la largeur perçue de la transition augmente
  numerique: non
  regions:
  - cle: sharp
    label_fr: franc
    label_en: sharp
    rang: 1
    repere: la transition est sans épaisseur perceptible (une découpe au cutter)
    exemplaires:
    - ppp-a:pilote-1901
  - cle: gradual
    label_fr: progressif
    label_en: gradual
    rang: 2
    repere: la transition a une largeur perceptible, mais on peut situer le bord (un chanfrein, un dégradé court)
    exemplaires:
    - ppp-a:pilote-1904
  - cle: blurred
    label_fr: flou
    label_en: blurred
    rang: 3
    repere: on ne peut pas situer le bord (une ombre portée diffuse)
    exemplaires:
    - ppp-a:pilote-1902
    - ppp-a:pilote-1903
identite: Netteté du bord, pas le tracé de la forme (silhouette), pas la continuité du bord.
relations:
- type: confusableWith
  cible: ppp:curvature
  note: 'la netteté du bord ne dit rien de son tracé : un bord courbe peut être franc ou flou, un bord droit aussi'
