etat_de_l_art: 'La netteté d’un bord est étudiée en psychophysique, la mesure de ce que l’on perçoit : Mather et Smith (2002) [[mather_smith2002]] mesurent à quel point on distingue deux degrés de flou,
  et montrent que cette distinction est grossière. En vision par ordinateur, Elder et Zucker (1998) [[elder_zucker1998]] estiment le flou d’un bord sur une image. Aucune source trouvée ne fixe des régions perçues de netteté ; l’échelle retenue (netteté seule, trois régions) est une décision du projet (T7, série 48). Détail : docs/bibliographie-par-type.md#groupe-forme.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-forme
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:contour a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois la forme » à « je regarde si ses bords sont francs ou flous » change la description (la forme se détache du fond ou s’y fond).
transfert: objet conçu oui (arête vive ou adoucie) | tableau oui (contours nets ou fondus) | cuisine oui (bord d’un plan de travail) | high-tech oui (arêtes d’un boîtier, icônes d’écran)
