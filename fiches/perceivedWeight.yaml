etat_de_l_art: 'Sources : depuis Charpentier (1891), connu par Murray et al. (1999) [[murray_etal1999]], on sait que de deux objets de même poids, le plus petit paraît le plus lourd (illusion taille-poids). Cette illusion est d’abord tactile : les indices de volume de la main suffisent et sont nécessaires, ceux de la vue seulement suffisants, avec un effet plus faible (Ellis et Lederman 1993) [[ellis_lederman1993]] ; elle persiste quand la main a appris la force juste (Flanagan et Beltzner 2000) [[flanagan_beltzner2000]]. La matière sentie (Ellis et Lederman 1999) [[ellis_lederman1999]] ou vue (Buckingham et al. 2009) [[buckingham_etal2009]] et ce qu’on sait de l’objet (Ellis et Lederman 1998) [[ellis_lederman1998]] changent aussi le poids senti ; une revue fait le point sur ces illusions et le rôle des attentes (Buckingham 2014) [[buckingham2014]]. La densité entre dans le jugement du poids lui-même : un objet visible n’est jugé sans illusion qu’à une masse volumique propre à sa matière (Ross 1969) [[ross1969]] ; un modèle infère la densité relative des objets pour produire le poids perçu (Peters et al. 2016) [[peters_etal2016]] ; parmi les objets fabriqués qu’on soulève, les plus petits sont en général plus denses, et les prédictions de poids suivent cette régularité (Peters et al. 2015) [[peters_etal2015]]. Harshfield et DeHardt (1970) [[harshfield_dehardt1970]] lient le jugement de poids à la densité apparente (titre seul lu). Échelles existantes : estimation de grandeur (Stevens 1957) [[stevens1957]] et seuils différentiels (loi de Weber ; revue de Jones 1986 [[jones1986]]), non retenues (rubrique « mesure »). Aucune source trouvée ne fixe des régions perçues du poids, ni ne fait du « poids pour sa taille » une qualité distincte du poids perçu. Détail : docs/bibliographie-par-type.md#groupe-toucher.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-toucher
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:perceivedWeight a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je soulève l’objet » à « je sens ce qu’il pèse dans la main, et s’il est lourd ou léger pour sa taille » change la description (un plateau de balsa ou d’ébène de même taille ; une poignée creuse ou pleine).
transfert: objet conçu oui (une poignée, un outil, un emballage) | tableau non (on ne le soulève pas) | cuisine oui (une casserole, un fruit qu’on soupèse) | high-tech oui (un téléphone, une manette) | architecture non (un mur ne se soulève pas ; une poignée de porte relève de l’objet conçu)
