source_de_la_fiche: 'proposition de famille « Toucher » (docs/famille-toucher-proposition.md (document de travail, non publié), §2.5, premier lot, décisions 3 et 6) ; ticket n° 5 (https://github.com/blomig/PPP-ontologie/issues/5, suggestion de type « Densité », intégrée à ce type : décision de l’éditeur du projet, transmise le 2026-10-27) ; protocole d’échantillons (docs/protocole-echantillons-toucher.md §4.4) ; fiche rédigée le 2026-10-27 par l’équipe, champs à valider par la relecture explicative'
# Série 90 : épisodes proposés « à réaliser » (spec X17 ; décision de l’éditeur du projet du 2026-11-02 pour le principe ; champs et détail du lot : choix de relecture (2026-11-02)) ; ni épreuve faite ni accord entre observateurs ;
# ni observateur, ni date, ni résultat. Objets et prédictions repris du lot 6 (docs/propositions-exemples-lot6-poids-percu.md, révisé : choix de relecture (2026-11-02)).
