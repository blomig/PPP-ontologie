manques:
- 'exemplaires : neuf épisodes proposés « à réaliser » (episodes_a_realiser), à réaliser par au moins cinq observateurs, chacun seul ; à la réalisation, chaque objet est pesé et photographié (photo d’identification, X17 (g)), et l’assertion entre dans fiches/exemplaires.yaml'
- 'aucun épisode de « demande les deux mains » sans doute de son auteur (carton et sac de riz marqués `doute: oui`) : la fiche ne peut viser que le palier 2 tant qu’un tel épisode manque'
bloque_par:
- 'affichage des épisodes à réaliser sur le site : la fiche se publie quand le site montre ses épisodes avec l’étiquette « à réaliser » (choix de relecture (2026-11-02))'
a_relire: []
remarque:
- 'série 87 (2026-10-27) : fiche créée. Le « poids pour sa taille » du ticket n° 5 (balsa contre ébène) n’est pas un type à part : il est fondu dans le poids perçu (décision de l’éditeur du projet, transmise le 2026-10-27) ; l’id provisoire `weightForSize` est abandonné. Manière de l’intégrer : choix de relecture (2026-10-27) : dans la définition, l’identité, le contre-exemple, les repères et la note d’échelle, sans dimension nouvelle. Raisons : un type P1 n’a qu’un espace de valeurs, et une seconde échelle « pour sa taille » en ferait deux qualités dans une fiche ; les travaux lus traitent la taille et la densité comme des choses qui entrent dans le poids senti lui-même (illusion taille-poids, densité inférée), et non comme un second jugement ; les crans restent rapportés au corps (décision 6 de la proposition « Toucher »), et l’écart entre deux objets de même taille se note par comparaison en note d’épisode. Homonymie levée avec la densité perceptive (`ppp:perceptualDensity`). À relire.'
- 'série 87 bis (choix de relecture (2026-10-27), corrections de relecture) : définition et question attentionnelle précisées (le cran se juge à l’effort que demande le poids, non à la prise que la taille impose) ; repère du cran « se soulève du bout des doigts » : le bloc de balsa gros comme le poing, qu’on ne tient pas du bout des doigts à cause de sa taille, remplacé par une baguette de balsa qu’on pince ; note d’échelle ajustée ; Harshfield et DeHardt (1970), Stevens (1957) et Jones (1986), vus en métadonnées seulement, passés à « non vérifiée » ; à relire'
- 'série 88 (2026-11-02, références) : Harshfield et DeHardt (1970), résumé lu sur la page de l’éditeur : statut « vérifiée sur résumé ou source secondaire », rôle « alimente », état de l’art précisé ; Stevens (1957) et Jones (1986) retirées (aucun résumé lisible sur Crossref, OpenAlex, Semantic Scholar, Europe PMC ou PhilPapers ; rien n’en était repris) : les deux méthodes restent non retenues, sans référence ; à relire'
- 'série 90 (2026-11-02) : épisodes proposés « à réaliser » du lot 6 repris dans la fiche (décision de l’éditeur du projet du 2026-11-02 : « B : publier avec des épisodes proposés marqués « à réaliser » ») ; choix de relecture (2026-11-02) : parpaing retiré des épreuves, repère en mots seulement ; cubes de 10 cm (balsa, pin, chêne, buis), buis contrecollé admis s’il est déclaré et pesé, ébène seulement en chute de provenance déclarée ; carton de livres visé à 10 kg, plafond 12 kg, soulevé depuis une table ; sac de riz de 10 kg ; carton et sac jugés yeux ouverts (exception déclarée pour la sécurité), cubes yeux fermés ; aucun nom de marchand. Repère « deux mains », note_echelle et note_conditions mis à jour (EN et empreintes).'
- 'série 90, correctif (choix de relecture (2026-11-02)) : épisodes réalignés sur la version révisée du lot 6 (hors dépôt) : cinq champs explicites par épisode (objet, preparation, consigne, conditions, region_attendue) ; sac de riz de 10 kg ; buis contrecollé déclaré (plis, colle), la masse réelle primant sur la masse estimée ; carton et sac jugés yeux ouverts par exception déclarée, cubes yeux fermés ; à relire'
- 'série 90 bis (choix de relecture (2026-11-02)) : série de comparaison en cubes de 10 cm (balsa, pin, chêne, buis ; ébène retiré des épreuves, repère en mots seulement) ; question attentionnelle et consignes des épisodes reformulées (« Soulevez l’objet sans appui et soupesez-le… ») ; fiche relue en relecture explicative, a_relire vidé ; elle repose sur des épisodes proposés « à réaliser », sans exemplaire observé'
