# Fiche de type PPP — ppp:perceivedWeight — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md, gabarit relu ; pas encore dans PPP_FicheType.md ni lue par la maquette).
# Série 87 (2026-10-27) : fiche en préparation, rédigée sans exemplaire à partir de la proposition « Toucher » (§2.5, décisions 3 et 6) et du ticket n° 5 (https://github.com/blomig/PPP-ontologie/issues/5) ; le « poids pour sa taille » du ticket n’est pas un type à part : il est intégré ici (décision de l’éditeur du projet, transmise le 2026-10-27) ; aucun champ n’est encore relu.
id: ppp:perceivedWeight
label_fr: poids perçu
label_en: perceived weight
label_court: poids
labels_alternatifs:
- poids en main
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- toucher
définition: 'Ce que l’objet paraît peser quand on le soulève à la main et qu’on le soupèse, sans appui : de ce qui se soulève du bout des doigts à ce qui demande les deux mains. Le cran se juge à l’effort que demande le poids, non à la prise que la taille impose : un objet encombrant mais léger, qu’on doit prendre à pleine main ou à deux bras, se range au cran où son poids seul se tiendrait. Ce poids se sent avec la taille et la matière de l’objet tenu : qu’un objet paraisse lourd ou léger pour sa taille (un bloc d’ébène, un bloc de balsa) relève de ce type, pas d’un type à part.'
question_attentionnelle: En soulevant l’objet sans appui, puis en le soupesant, son poids se tiendrait-il du bout des doigts, d’une main, ou faudrait-il les deux mains, quelle que soit la prise que sa taille impose ?
contre_exemple: 'Deux blocs de même taille et de même forme, l’un de balsa, l’autre d’ébène, ne pèsent pas autant dans la main : c’est leur poids perçu qui les sépare, pas leur taille (taille perçue). À l’inverse, de deux objets de même masse, le plus petit paraît souvent le plus lourd : ce que dit la balance n’est pas ce que décrit ce type. Un carton vide assez grand pour demander les deux bras ne demande pas les deux mains par son poids : c’est sa taille qui oblige à le prendre ainsi.'
grandeur_physique_homonyme: 'masse (gramme) et poids au sens de la physique (newton) ; masse volumique (kilogramme par mètre cube), que le ticket n° 5 appelle « densité » : aucune région ne s’en déduit. Voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Des grandeurs physiques liées se mesurent : la masse, à la balance ; la masse volumique, masse divisée par le volume (la « densité » au sens du ticket n° 5) ; et, pour un objet qu’on manie, son inertie de rotation. Aucune ne vise le poids senti : de deux objets de même masse, le plus petit paraît souvent le plus lourd [[flanagan_beltzner2000]] ; un objet visible n’est jugé sans illusion qu’à une masse volumique propre à sa matière [[ross1969]] ; la lourdeur d’un objet caché qu’on manie suit son inertie de rotation [[amazeen_turvey1996]]. Ces résultats ne fixent pas de régions.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: masse_volumique
    nom: masse volumique
    grandeur: masse de l’objet divisée par son volume
    unite_ou_echelle: kilogramme par mètre cube (ou gramme par centimètre cube)
    references: [ross1969]
    proximite: indirecte
    ecart: 'ne dit rien du poids lui-même (un grand bloc de balsa peut peser plus qu’un petit bloc d’ébène) ; ne saisit ni la prise, ni la répartition de la masse, ni la matière sentie sous les doigts, ni ce qu’on attend de l’objet ; à masse volumique égale, des objets de matières différentes ne paraissent pas sans illusion au même point [[ross1969]]'
    conditions: objet homogène, dont on connaît la masse et le volume
    statut_lecture: résumé lu (Ross, 1969, OpenAlex, 2026-10-27) ; texte non lu
  - id: inertie_rotation
    nom: inertie de rotation (tenseur d’inertie)
    grandeur: résistance de l’objet à la rotation quand on le manie autour du poignet
    unite_ou_echelle: kilogramme mètre carré (kg·m²), par axe de rotation
    references: [amazeen_turvey1996]
    proximite: indirecte
    ecart: 'prédit la lourdeur d’un objet qu’on fait tourner dans la main, caché à la vue ; ne vise pas un objet soulevé et tenu sans le faire tourner, ni la matière sentie, ni l’attente ; mesure l’objet, pas l’observateur'
    conditions: objet caché, manié au poignet ; répartition de la masse connue
    statut_lecture: résumé lu (Amazeen et Turvey, 1996, OpenAlex, 2026-10-27) ; texte non lu
  non_retenues:
  - nom: estimation de grandeur de la lourdeur (Stevens)
    references: [stevens1957]
    raison: 'échelle de jugement par jury, sans série de référence physique (spec §9.7 P, point 7) ; l’exposant de la lourdeur soulevée n’a été lu dans aucune source : non vérifié'
    statut_lecture: métadonnées seules (Crossref) ; texte non lu
  - nom: seuil différentiel du poids (loi de Weber)
    references: [jones1986]
    raison: 'mesure le plus petit écart qu’on distingue entre deux poids, pas des régions ; la valeur de la fraction de Weber pour le poids n’a été lue dans aucune source : non vérifiée'
    statut_lecture: métadonnées seules de la revue de Jones (1986) (Crossref) ; rien n’en est repris
modalites:
- toucher
mode_de_presentation: échantillon
conditions_critiques:
- geste
note_conditions: 'le jugement se fait en soulevant l’objet et en le soupesant, sans appuyer le bras ni la main (facette `geste` : `unsupportedHolding`, spec §9.7 H, règle 8) [[klatzky_reed2009]] ; objet tenu en main (`inHand`), durée `glance`. On ne juge pas en portant l’objet : l’effort, la fatigue et la durée s’en mêlent. La prise, la répartition de la masse, la vue et la température de l’objet vont en note d’épisode, sans facette : une prise ferme abolit l’illusion matière-poids pour des objets légers (Ellis et Lederman 1999) [[ellis_lederman1999]] ; la lourdeur d’un objet qu’on manie suit sa répartition de masse (Amazeen et Turvey 1996) [[amazeen_turvey1996]] ; voir l’objet change ce qu’on en attend, mais l’illusion taille-poids naît aussi sans voir (Ellis et Lederman 1993) [[ellis_lederman1993]] ; la température figure parmi les causes d’illusions de poids (Buckingham 2014) [[buckingham2014]]. Épreuve sans voir de préférence, ou yeux ouverts déclarés. Une photo ne dit rien du poids : aucune assertion sur image ; qu’un objet ait l’air lourd est une attente (poids apparent, piste visuelle hors du périmètre actuel), pas une assertion de ce type.'
porteur: 'un objet qu’on peut soulever d’une main ou des deux, pris en entier (pas une partie d’objet ni une matière en général : une boîte de métal mince est légère alors que le métal est lourd pour sa taille)'
arité: 1
condition_NA: 'objet qu’on ne peut pas ou qu’on n’a pas le droit de soulever (un mur, une façade, une œuvre de musée, un meuble fixé, un objet trop lourd pour être soulevé sans risque) ; objet vu seulement en image.'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `fingertipLift` (rang 1) vers `twoHandLift` (rang 3), l’objet paraît de plus en plus lourd dans la main
  numerique: non
  regions:
  - cle: fingertipLift
    label_fr: se soulève du bout des doigts
    label_en: lifts with the fingertips
    rang: 1
    repere: 'on le soulève et on le tient entre le pouce et deux doigts sans effort (une boîte d’allumettes, un bouchon, une baguette de balsa de maquettiste qu’on pince entre deux doigts)'
    exemplaires: []
  - cle: oneHandLift
    label_fr: se soulève d’une main
    label_en: lifts with one hand
    rang: 2
    repere: 'il faut la main entière, mais une seule main suffit (une tasse pleine, un livre épais, un bloc d’ébène gros comme le poing)'
    exemplaires: []
  - cle: twoHandLift
    label_fr: demande les deux mains
    label_en: needs both hands
    rang: 3
    repere: 'son poids oblige à le soulever des deux mains (un carton plein de livres, un parpaing)'
    exemplaires: []
note_echelle: 'trois crans rapportés au corps, comme ceux de la taille perçue (proposition « Toucher », §2.5 ; décision 6 : régions rapportées au corps de préférence) ; les repères sont des illustrations à éprouver, pas des valeurs vérifiées. Les labels des crans nomment une prise, mais le cran se juge à l’effort que demande le poids, non à la prise que la taille impose (définition) : un objet encombrant mais léger ne passe pas au cran « demande les deux mains » à cause de sa taille (contre-exemple). Poids pour sa taille (ticket n° 5 ; intégration : choix de relecture (2026-10-27)) : ce n’est ni un type à part ni une seconde échelle, mais une façon dont ce même poids se sent. Deux blocs de même taille, de balsa et d’ébène, gros comme le poing, tombent dans des crans différents : celui d’ébène demande la main entière (repère ci-dessus) ; celui de balsa, que sa taille oblige à prendre à pleine main, a un poids qui se tiendrait du bout des doigts, comme la baguette de balsa du repère ; quand deux objets de même taille et de même forme tombent dans le même cran, l’écart se note en note d’épisode, par comparaison (« plus lourd pour sa taille que… »), de préférence sur une série de comparaison observable : des blocs de même taille et de même forme (balsa, pin, chêne, ébène) soupesés l’un après l’autre. Le « poids pour sa taille » n’est pas la densité perceptive (`ppp:perceptualDensity`) : en PPP, « densité » désigne une qualité vue, une surface plus ou moins remplie d’éléments ; le sens du ticket (« densité perçue en tenant un objet ») est ici, sous le nom de poids perçu. Position de travail : trois crans, E1 en accord exact (spec §9.7 C).'
identite: 'Ce que l’objet paraît peser, soulevé et soupesé sans appui, sa taille et sa matière senties comprises : qu’il paraisse lourd ou léger pour sa taille en fait partie (ticket n° 5) ; pas sa taille (`ppp:perceivedSize`) ; pas la densité perceptive (`ppp:perceptualDensity`, vue : combien une surface paraît remplie d’éléments), malgré le mot « densité » du ticket ; pas la masse ni la masse volumique mesurées ; pas le poids apparent, jugé à la vue sans toucher (une attente, piste hors du périmètre actuel) ; pas l’effort de porter (fatigue, durée).'
relations:
- type: confusableWith
  cible: ppp:perceivedSize
  note: 'on s’attend à ce qu’un objet plus grand soit plus lourd ; à poids égal, le plus petit paraît souvent le plus lourd : on juge ce que l’objet pèse dans la main, pas sa taille'
