  region_attendue: fingertipLift
  objet: bouchon cylindrique de vin tranquille, en liège naturel, sans marque (format nominal 44 × 24 mm)
  objet_en: cylindrical natural cork stopper for still wine, unbranded (nominal size 44 × 24 mm)
  preparation: un bouchon de liège naturel de 44 × 24 mm, sec, laissé dans la pièce depuis la veille ; le peser au gramme (la masse réelle prime sur l’estimation de 3 à 5 g)
  preparation_en: a 44 × 24 mm natural cork stopper, dry, left in the room since the day before; weigh it to the gram (the real mass takes precedence over the 3 to 5 g estimate)
  consigne: 'Soulevez l’objet sans appui et soupesez-le : rien que pour son poids, suffirait-il du bout des doigts, d’une main, ou faudrait-il les deux mains ?'
  consigne_en: 'Lift the object without support and heft it: for its weight alone, would the fingertips be enough, one hand, or would it take both hands?'
  conditions:
    presentation: inHand
    geste: unsupportedHolding
    temperature_objet: ambient
    duree: glance
    yeux: fermés (ou bandés)
    yeux_en: closed (or blindfolded)
    note: assis face à une table ; objet posé devant soi ; soulevé de quelques centimètres, coude décollé, sans appui ; yeux fermés ou bandés ; une autre personne pose l’objet ; objets dans la pièce depuis la veille ; mains nues et sèches ; main dominante d’abord, main notée
    note_en: seated facing a table; object placed in front of you; lifted a few centimetres, elbow raised, without support; eyes closed or blindfolded; another person puts the object down; objects in the room since the day before; bare, dry hands; dominant hand first, hand noted
  doute: non
  note: 'se pince entre le pouce et deux doigts (repère de la fiche : « un bouchon »)'
  note_en: 'pinched between the thumb and two fingers (reference point of the entry: “a cork stopper”)'
  texte_fr: 'Un bouchon de liège : se soulève du bout des doigts (prédiction, à éprouver).'
  texte_en: 'A cork stopper: lifts with the fingertips (prediction, to be tested).'
