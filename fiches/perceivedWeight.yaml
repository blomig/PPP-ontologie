  reconfirme:
  - champ: question_attentionnelle
    avant: 'En soulevant l’objet sans appui, puis en le soupesant, son poids se tiendrait-il du bout des doigts, d’une main, ou faudrait-il les deux mains, quelle que soit la prise que sa taille impose ?'
    apres: 'Soulevez l’objet sans appui et soupesez-le : rien que pour son poids, suffirait-il du bout des doigts, d’une main, ou faudrait-il les deux mains ?'
    date: '2026-11-02'
    raison: 'choix de relecture (2026-11-02) : consigne à l’impératif, qui demande de soulever puis de soupeser ; « rien que pour son poids » remplace « quelle que soit la prise que sa taille impose », même sens (définition inchangée)'
