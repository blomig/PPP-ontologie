# Registre des familles de lecture (spec §9.7 L, X9 ; point B3 des questions de design).
# Fichier distinct des fiches de type. Les clés sont les valeurs du champ `facettes` des fiches.
# Une famille aide à s'orienter ; ce n'est pas une classification (aucun ppp:specializes).
# Un type peut appartenir à plusieurs familles. Statut : PROPOSITION (introductions à valider
# par la relecture explicative ; liste des familles à confirmer par l’éditeur du projet, QUESTIONS-A-TRANCHER T4).
# v2.3.1 : sept nouveaux candidats rangés (spec 2.3) ; les introductions de forme, couleur et
# matière sont complétées par l’équipe : ajouts à valider par la relecture explicative (champ a_relire ; a_valider avant la série 12).

familles:
  - cle: forme
    label_fr: Forme
    label_en: form
    introduction: >-
      Ce qu'on remarque dans le dessin des choses, indépendamment de leur couleur et de leur
      surface : la netteté des bords, la taille, la symétrie, la différence de taille entre deux
      éléments, et la façon dont deux parties se rejoignent (écart ou différence de niveau au
      joint). On y regarde aussi si les bords et les surfaces sont droits ou courbes, si la
      silhouette entière d'un objet rentre et sort peu ou beaucoup (sa découpure), si les parties
      se divisent à leur tour en parties plus petites, et si ce qu'on voit s'étage en plans, les
      uns devant les autres. On peut enfin compter combien de formes simples (cube, cylindre,
      sphère…) il faudrait pour reconstruire un objet en volume.
    a_relire: []
    relecture_explicative: {date: "2026-10-10", champs: [introduction], reconfirme: [{champ: introduction, date: "2026-10-10", remarque: "complétée par la relecture explicative (série 6) : découpure de la silhouette (outlineIndentation)"}, {champ: introduction, date: "2026-10-11", avant: "Ce qu'on remarque dans le dessin des choses, indépendamment de leur couleur et de leur surface : la netteté des bords, la taille, la symétrie, la différence de taille entre deux éléments, et la façon dont deux parties se rejoignent (écart ou différence de niveau au joint). On y regarde aussi si les bords et les surfaces sont droits ou courbes, si la silhouette entière d'un objet rentre et sort peu ou beaucoup (sa découpure), si les parties se divisent à leur tour en parties plus petites, et si ce qu'on voit s'étage en plans, les uns devant les autres.", apres: "Ce qu'on remarque dans le dessin des choses, indépendamment de leur couleur et de leur surface : la netteté des bords, la taille, la symétrie, la différence de taille entre deux éléments, et la façon dont deux parties se rejoignent (écart ou différence de niveau au joint). On y regarde aussi si les bords et les surfaces sont droits ou courbes, si la silhouette entière d'un objet rentre et sort peu ou beaucoup (sa découpure), si les parties se divisent à leur tour en parties plus petites, et si ce qu'on voit s'étage en plans, les uns devant les autres. On peut enfin compter combien de formes simples (cube, cylindre, sphère…) il faudrait pour reconstruire un objet en volume.", remarque: "validée par la relecture explicative (série 15) : phrase ajoutée en série 12 (ppp:elementaryShapeCount), double « et » supprimé en série 14"}]}
    types: [ppp:contour, ppp:perceivedSize, ppp:symmetry, ppp:scaleContrast, ppp:jointSpacing, ppp:jointLevelOffset,
            ppp:curvature, ppp:partNesting, ppp:perceivedDepth, ppp:outlineIndentation, ppp:elementaryShapeCount]   # 2.5 : outlineIndentation (crash test 02, C6) ; introduction complétée par la relecture explicative (série 6) ; 2.8 : elementaryShapeCount (crash test 03, T37)
  - cle: couleur
    label_fr: Couleur
    label_en: colour
    introduction: >-
      Ce qu'on remarque dans la couleur : la teinte (rouge, bleu…), la clarté (clair ou
      sombre), la saturation (gris ou très coloré), et les différences de teinte ou de clarté
      entre deux zones. Ces qualités se jugent zone par zone, quelle que soit leur forme. Dans une
      même zone, on regarde aussi combien de teintes on voit, et si les teintes, les clartés ou
      les saturations sont toutes pareilles, proches ou éloignées (des bleus et des verts sont des
      teintes proches ; des bleus et des oranges, des teintes éloignées).
    a_relire: []
    relecture_explicative: {date: "2026-10-10", champs: [introduction], reconfirme: [{champ: introduction, date: "2026-10-10", remarque: "complétée par la relecture explicative (série 6) : nombre de teintes, éventails des clartés et des saturations (hueCount, lightnessRange, saturationRange)"}]}
    types: [ppp:hue, ppp:lightness, ppp:saturation, ppp:hueContrast, ppp:lightnessContrast, ppp:hueRange,
            ppp:lightnessRange, ppp:saturationRange, ppp:hueCount]   # 2.5 (crash tests, C6) ; introduction complétée par la relecture explicative (série 6)
  - cle: matiere
    label_fr: Matière
    label_en: material
    introduction: >-
      Ce qu'on remarque à la surface d'une matière, à la vue ou au toucher : la taille de ses
      reliefs, le sens qu'ils suivent (tous dans la même direction, comme un métal brossé, ou
      dans tous les sens), les endroits où elle s'écarte de sa régularité, et la différence de
      texture entre deux surfaces. On y regarde aussi la lumière : ce qu'on voit à travers la
      matière, les reflets de sa surface (du mat au miroir), et l'impression de voir dans son
      épaisseur. On décrit la surface et l'épaisseur de la matière ; la matière elle-même n'est pas
      une qualité.
    a_relire: []
    relecture_explicative: {date: "2026-10-10", champs: [introduction]}
    types: [ppp:texture, ppp:localIrregularity, ppp:textureContrast, ppp:textureDirectionality,
            ppp:translucency, ppp:surfaceGloss, ppp:subsurfaceDepth]
  - cle: organisation
    label_fr: Organisation
    label_en: organisation
    introduction: >-
      Ce qu'on remarque dans la disposition des éléments les uns par rapport aux autres :
      combien il y en a, comment ils se répartissent, si les espaces laissés entre eux se
      lisent comme des formes, et ce qui les distingue deux à deux (contraste, joint).
      Plusieurs qualités de cette famille figurent aussi dans une autre.
    types: [ppp:perceptualDensity, ppp:distribution, ppp:negativeSpace, ppp:symmetry,
            ppp:perceptualContrast, ppp:lightnessContrast, ppp:jointSpacing, ppp:jointLevelOffset,
            ppp:partNesting, ppp:perceivedDepth]
  - cle: toucher
    label_fr: Toucher
    label_en: touch
    introduction: >-
      Ce qu'on remarque en touchant un objet : la taille de ses reliefs et le sens qu'ils
      suivent, la différence de texture entre deux surfaces, les endroits où la surface s'écarte
      de sa régularité, la courbure des surfaces, la marche entre deux parties, et le nombre de
      formes simples qu'on reconnaît sous la main. Au toucher, ces qualités se jugent sur l'objet
      lui-même, jamais sur une image.
    # Série 27 (2026-10-12) : famille décidée par l'éditeur du projet (option C de
    # docs/famille-toucher-proposition.md). Règle d'appartenance : tous les types dont `modalites`
    # contient `toucher`, et eux seuls ; chaque type garde aussi sa famille d'aspect. Les types propres
    # au toucher (dureté, froid, glisse, poids perçu, retour à la forme) n'ont pas encore de fiche.
    # Le champ `facettes` des sept fiches n'est pas encore mis à jour (étape suivante, à relire).
    # Série 28 : introduction réécrite par la relecture explicative (elle n'annonce plus de types sans fiche).
    # 2026-10-12 : introduction validée par la relecture explicative (« à relire » levé).
    a_relire: []
    relecture_explicative: {date: "2026-10-12", champs: [introduction]}
    types: [ppp:texture, ppp:textureContrast, ppp:textureDirectionality, ppp:localIrregularity,
            ppp:curvature, ppp:jointLevelOffset, ppp:elementaryShapeCount, ppp:hardnessToTouch,
            ppp:perceivedWeight]   # série 54 (2026-10-16) : hardnessToTouch, première fiche propre au toucher (en préparation, à relire ; ticket 4) ; série 87 (2026-10-27) : perceivedWeight (en préparation, à relire ; ticket 5, poids pour sa taille intégré)
  - cle: son
    label_fr: Son
    label_en: sound
    statut: en préparation   # série 49 (2026-10-15) : champ nouveau, à la demande de l'éditeur du projet (voir le Son et l'Odorat sur le site) ; build.py le lit (famille montrée « en préparation » sur le site) ; compte.py ne le lit pas (il compte les types, les familles et les introductions à relire)
    introduction: >-
      Ce qu’on remarque en écoutant un objet, quand on le fait sonner (en le frappant, en le
      frottant) ou quand il fonctionne. Une photo ne dit rien du son : elle sert seulement à
      reconnaître l’objet. Un enregistrement publié peut servir d’exemple, sauf pour la force du
      son ; sinon, on décrit l’objet et les conditions d’écoute. Cette famille est en préparation
      : elle n’a encore aucune fiche publiée.
    # Série 49 : famille inscrite sans fiche, à la demande de l'éditeur du projet ; écart avec T4 (« pas de famille vide »,
    # tranché) et avec la décision 1 de la série 43 (famille inscrite avec sa première fiche) : à confirmer par l'éditeur du projet.
    # Règle d'appartenance (série 43, décision 1) : tous les types dont `modalites` contient `audition`, et eux seuls ;
    # chaque type garde aussi sa famille d'aspect. Proposition et décisions : docs/famille-son-proposition.md (document de travail, non publié).
    a_relire: []
    relecture_explicative: {date: "2026-10-15", champs: [introduction]}   # série 49 bis : introduction écrite par la relecture explicative
    types: [ppp:soundAttack, ppp:soundSharpness, ppp:soundDecay, ppp:pitchClarity]   # série 50 : premières fiches, en préparation
  - cle: odorat
    label_fr: Odorat
    label_en: smell
    statut: en préparation   # série 49 (2026-10-15) : champ nouveau, à la demande de l'éditeur du projet (voir le Son et l'Odorat sur le site) ; build.py le lit (famille montrée « en préparation » sur le site) ; compte.py ne le lit pas (il compte les types, les familles et les introductions à relire)
    introduction: >-
      Ce qu’on remarque en sentant un objet de près. Une photo ne dit rien de l’odeur : on décrit
      à la place l’objet et les conditions dans lesquelles on l’a senti. Cette famille est en
      préparation : elle n’a encore aucune fiche publiée.
    # Série 49 : famille inscrite sans fiche, à la demande de l'éditeur du projet ; écart avec T4 (« pas de famille vide »,
    # tranché) et avec la décision 1 de la série 43 (famille inscrite avec sa première fiche) : à confirmer par l'éditeur du projet.
    # Règle d'appartenance (série 43, décision 1) : tous les types dont `modalites` contient `odorat`, et eux seuls ;
    # chaque type garde aussi sa famille d'aspect. Proposition et décisions : docs/famille-odorat-proposition.md (document de travail, non publié).
    a_relire: []
    relecture_explicative: {date: "2026-10-15", champs: [introduction]}   # série 49 bis : introduction écrite par la relecture explicative
    types: [ppp:odourIntensity, ppp:odourCharacter]   # série 50 : premières fiches, en préparation

  - cle: gout
    label_fr: Goût (en bouche)
    label_en: taste (in the mouth)
    statut: en préparation   # série 78 (2026-10-20) : comme le Son et l'Odorat, famille montrée « en préparation » tant qu'aucune fiche n'est publiée
    introduction: >-
      Ce qu’on perçoit en bouche, et non ce qu’on aime : les saveurs, ce qui brûle ou pique, ce qui
      assèche la bouche, la résistance de la bouchée ou l’épaisseur de la gorgée, et, pour l’ensemble de ce qu’on a en bouche,
      combien de composantes on y distingue, leur force, celle qui l’emporte et combien de temps il
      en reste quelque chose. Une photo ne dit rien du goût : on décrit le produit et les conditions
      dans lesquelles on l’a goûté. Cette famille est en préparation : elle n’a encore aucune fiche publiée.
    # Série 78 : famille inscrite avec ses premières fiches (T4). Label : décision 1 de l'éditeur du projet (2026-10-19),
    # « Goût (en bouche) », taste (in the mouth) ; la première phrase écarte le sens de préférence (même décision).
    # Règle d'appartenance (proposition, section 3) : tous les types dont `modalites` contient `bouche`, et eux seuls.
    # Proposition et décisions : docs/famille-gout-proposition.md (document de travail, non publié), sections 2, 3 et 8.
    a_relire: [introduction]
    relecture_explicative: {date: null, champs: []}
    types: [ppp:bitterness, ppp:oralPungency, ppp:astringency, ppp:hardnessInMouth, ppp:oralThickness, ppp:flavourComplexity, ppp:flavourIntensity, ppp:flavourBalance, ppp:tastePersistence]   # série 78 : premier lot et lot CIEL, en préparation

hors_registre:
  - cle: temps
    raison: >-
      Citée par la spec (§9.7 L) et prévue par Q1 (organisation temporelle des séquences
      perçues), mais aucun type V1 n'y appartient. Elle n'entre au registre qu'avec son
      premier type (règle proposée : pas de famille vide dans l'arbre public).
  - cle: attention
    raison: types attentionnels réservés hors V1 (spec §9.9) ; ne pas l'afficher.

correspondance_v02:
  note: >-
    La v0.2 groupait les propriétés en catégories « eidétique » (formes, contours, lignes,
    échelle, texture) et « chromatique ». Elles sont reprises comme familles forme et couleur ;
    la texture passe en matière. Correspondance indicative, sans dépréciation (les noms v0.2
    n'ont pas d'id).
