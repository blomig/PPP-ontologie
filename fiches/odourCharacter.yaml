etat_de_l_art: 'ISO/TS 16922 nomme le caractère d’odeur (édition 2002, annulée, 3.1.2, extraits [[iso_ts16922_2002]] ; édition en vigueur 2022, 3.1.3 [[iso_ts16922_2022]]). Zarzo et Stanton (2006) [[zarzo_stanton2006]]
  notent qu’aucune classification n’est largement acceptée, et proposent en 2009 [[zarzo_stanton2009]] de s’accorder d’abord sur les odorants de référence (résumés lus) ; Castro et al. (2013) [[castro2013]]
  trouvent des dimensions qui s’appliquent par catégories (lu en partie). Noble et al. (1987) [[noble1987]] appuient les descripteurs sur des étalons (résumé lu). Gross-Isseroff et Lancet (1988) [[gross_isseroff_lancet1988]]
  montrent que la qualité perçue change avec la concentration (résumé seulement lu). Détail : docs/bibliographie-par-type.md#groupe-odorat.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-odorat
