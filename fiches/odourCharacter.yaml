manques:
- 'exemplaires : treize épisodes proposés « à réaliser » (episodes_a_realiser), sur des objets décrits (X17), à réaliser par plusieurs observateurs, chacun seul ; à la réalisation, l’assertion entre dans
  fiches/exemplaires.yaml ; aucun épisode pour « autre »'
- 'épisodes sans doute de leur auteur : « fruits » (banane, fraise), « agrumes », « herbe, feuille » (herbe coupée, feuille de tomate), « épices » et « terre » ; « bois », « fleurs », « grillé, fumé »,
  « résine » et « cuir » n’ont que des épisodes marqués `doute: oui`'
- 'repères de région : références olfactives à choisir (étalons, coffret), comme repères, pas comme exemplaires'
