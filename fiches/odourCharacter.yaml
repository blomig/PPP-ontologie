# Série 106 (2026-11-11) : épisodes proposés « à réaliser » (spec X17 ; décision de l’éditeur du projet du 2026-11-02 pour le principe ; champs, détail du lot et codage des facettes : choix de relecture) ;
# ni épreuve faite ni accord entre observateurs ; ni observateur, ni date, ni résultat. Objets et prédictions repris de la proposition de lot 9, révisés (choix de relecture (2026-11-02)) ; ids renumérotés.
episodes_a_realiser:
- id: ppp-a:ep-odourCharacter-01
  realisation: a_realiser
  region_attendue: woody
  objet: un crayon à papier en bois de cèdre (bois nu ou verni de couleur), fraîchement taillé, avec ses copeaux
  objet_en: a cedar-wood graphite pencil (bare or lacquered), freshly sharpened, with its shavings
  preparation: tailler le crayon au taille-crayon juste avant (moins de 5 min), sur le pot ; garder les copeaux au fond ; noter si le bois est nu ou verni et l’essence annoncée (« cèdre » s’il est indiqué)
  preparation_en: sharpen the pencil with a sharpener just before (less than 5 min), over the jar; keep the shavings at the bottom; note whether the wood is bare or lacquered and the announced wood (“cedar”
    if stated)
  consigne: 'Approchez le nez à environ 3 cm du pot ouvert, sans le toucher. Flairez calmement, deux fois au plus, sans inspirer fort. À quoi l’odeur fait-elle penser : bois, fruits, agrumes, fleurs, herbe
    coupée, épices, fumée ou grillé, terre ou cave, résine, cuir, ou autre chose (à décrire) ? Une seule réponse, la plus nette ; « je ne sens rien » est une réponse.'
  consigne_en: 'Bring your nose to about 3 cm from the open jar, without touching it. Sniff calmly, twice at most, without inhaling hard. What does the odour remind you of: wood, fruit, citrus, flowers,
    cut grass, spices, smoke or roasting, earth or cellar, resin, leather, or something else (describe it)? One answer only, the clearest; “I smell nothing” is an answer.'
  conditions:
    presentation: unknown
    distance: near
    duree: glance
    exposition: firstSniff
    air: closed
    yeux: 'ouverts (pot opaque : l’objet n’est pas vu)'
    yeux_en: 'open (opaque jar: the object is not seen)'
    note: 'pot opaque à couvercle, ouvert juste avant, tous les pots identiques ; nez à environ 3 cm du bord du pot, sans le toucher ; deux flairages calmes d’environ 2 s ; pause de 30 s entre deux pots,
      dans la pièce aérée, sans autre neutralisation ; distance, durée et pause : protocole déclaré pour tous les épisodes d’odorat, non sourcé ; objet à la température de la pièce (vers 20 °C, valeur notée
      ; la facette `temperature_objet` est réservée pour l’odorat, règle 10) ; codage des facettes (`near`, `glance`, `firstSniff`, `closed`) : choix de relecture (2026-11-11) ; ordre tiré au sort ; pièce
      aérée puis fermée 10 min avant ; pas de parfum, de crème ni de tabac sur l’observateur ou le préparateur ; aucune autre épreuve d’odeur dans les 20 min précédentes (ISO 5496, 5.2) ; le caractère ne
      se juge que si l’odeur est sentie (base : intensité ≠ « aucune odeur »)'
    note_en: 'opaque lidded jar, opened just before, all jars identical; nose about 3 cm from the rim of the jar, without touching it; two calm sniffs of about 2 s; 30 s pause between two jars, in the aired
      room, with no other neutralisation; distance, duration and pause: protocol declared for all smell episodes, not sourced; object at room temperature (about 20 °C, value noted; the `temperature_objet`
      facet is reserved for smell, rule 10); facet coding (`near`, `glance`, `firstSniff`, `closed`): review choice (2026-11-11); random order; room aired then closed 10 min before; no perfume, cream or
      tobacco on observer or preparer; no other odour test in the previous 20 min (ISO 5496, 5.2); character is judged only if an odour is smelt (base: intensity ≠ “no odour”)'
  doute: oui
  motif_doute: le bois des crayons est souvent un « cèdre » au sens commercial, pas une essence vérifiée ; le vernis et la mine peuvent se sentir ; voisin de « résineux » (voisinage déclaré dans la fiche)
  motif_doute_en: pencil wood is often “cedar” in the trade sense, not a verified species; lacquer and lead may be smelt; neighbour of “resinous” (neighbourhood declared in the entry)
