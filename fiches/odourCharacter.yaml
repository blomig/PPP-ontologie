note_categories: 'Régions catégorielles non ordonnées (décidé le 2026-10-14) ; liste de travail construite à partir des familles que les roues et les coffrets ont en commun, sans en reprendre une telle
  quelle. « Fruité (hors agrumes) » suit Castro et al. (2013) [[castro2013]], où les agrumes forment une dimension à part. Une odeur mêlée se note par plusieurs assertions, une par caractère net. Boisé
  et résineux sont déclarés voisins : Castro et al. (2013) [[castro2013]] les réunissent dans une même dimension (« woody, resinous »).'
identite: Ce que l’odeur rappelle, pas sa force (intensité de l’odeur), pas la matière de l’objet, pas l’agrément.
