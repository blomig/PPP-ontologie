etat_de_l_art: 'ISO 5492 [[iso5492]] fixe le vocabulaire de l’analyse sensorielle (définitions lues par source secondaire), et ISO/TS 16922 nomme le caractère d’odeur, « distinctive and identifiable feature
  of an odour or flavour » (édition en vigueur 2022, 3.1.3, extrait public lu [[iso_ts16922_2022]]). Zarzo et Stanton (2006) [[zarzo_stanton2006]] notent qu’aucune classification n’est largement acceptée,
  et proposent en 2009 [[zarzo_stanton2009]] de s’accorder d’abord sur les odorants de référence (résumés lus) ; Castro et al. (2013) [[castro2013]] trouvent, dans les profils de l’atlas de Dravnieks [[dravnieks1985]],
  des dimensions qui s’appliquent par catégories (article lu en partie ; atlas non lu, notice de l’éditeur seulement). Pour nommer le caractère, il existe des listes et des roues de mots, comme la roue
  des arômes du vin de Noble et al. (1987) [[noble1987]], appuyée sur des étalons proposés (résumé lu), mais aucune échelle à référence physique normalisée. ISO 5496 [[iso5496]] donne des substances pures
  pour apprendre à reconnaître les odeurs, chacune avec ses mots (non lue ; notice de l’éditeur, article 5.2 de l’extrait public et tableau A.2 de l’extrait public de l’amendement 1 seulement) : la fiche
  s’en sert comme repères, pas comme mesure. Gross-Isseroff et Lancet (1988) [[gross_isseroff_lancet1988]] montrent que la qualité perçue change avec la concentration (résumé seulement lu). Détail : docs/bibliographie-par-type.md#groupe-odorat.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-odorat
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
