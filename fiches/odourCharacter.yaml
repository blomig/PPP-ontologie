  - cle: citrus
    label_fr: agrume
    label_en: citrus
    repere: qui rappelle les agrumes (un zeste de citron)
    exemplaires: []
  - cle: floral
    label_fr: floral
    label_en: floral
    repere: qui rappelle les fleurs (une rose)
    exemplaires: []
  - cle: green
    label_fr: vert (herbe, feuille)
    label_en: green (grass, leaf)
    repere: qui rappelle l’herbe coupée, une feuille froissée
    exemplaires: []
  - cle: spicy
    label_fr: épicé
    label_en: spicy
    repere: qui rappelle les épices (un clou de girofle)
    exemplaires: []
  - cle: smokyRoasted
    label_fr: fumé, grillé
    label_en: smoky, roasted
    repere: qui rappelle la fumée ou le grillé (un feu de bois, du pain grillé)
    exemplaires: []
  - cle: earthy
    label_fr: terreux
    label_en: earthy
    repere: qui rappelle une cave humide, de la terre mouillée
    exemplaires: []
  - cle: resinous
    label_fr: résineux
    label_en: resinous
    repere: qui rappelle la résine (une pomme de pin)
    exemplaires: []
  - cle: leathery
    label_fr: cuir
    label_en: leathery
    repere: qui rappelle le cuir
    exemplaires: []
  - cle: other
    label_fr: autre (à décrire)
    label_en: other (to be described)
    repere: une odeur qu’aucune région ne dit ; on la décrit dans la note
    exemplaires: []
note_categories: 'Régions catégorielles non ordonnées (décision de l’éditeur du projet du 2026-10-14, série 43, décision 4) ; liste de travail construite à partir des familles que les roues et les coffrets
  ont en commun, sans en reprendre une telle quelle. « Fruité (hors agrumes) » suit Castro et al. (2013) [[castro2013]], où les agrumes forment une dimension à part. Une odeur mêlée se note par plusieurs
  assertions, une par caractère net. Boisé et résineux sont déclarés voisins : Castro et al. (2013) [[castro2013]] les réunissent dans une même dimension (« woody, resinous »).'
identite: Ce que l’odeur rappelle, pas sa force (intensité de l’odeur), pas la matière de l’objet, pas l’agrément.
