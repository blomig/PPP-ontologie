# Série 111 (2026-11-14) : relecture explicative complète, champ par champ ; a_relire vidé, fiche publiable (choix de relecture (2026-11-14)).
id: ppp:odourCharacter
label_fr: caractère de l’odeur
label_en: odour character
labels_alternatifs:
- qualité de l’odeur
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:odourIntensity
  facteurs_non_perceptuels: []
note_base: 'Base `ppp:odourIntensity`, comme `ppp:pitchClarity` pour `perceivedPitch` (décidé le 2026-10-14) : le caractère ne se juge que si l’intensité n’est pas « aucune odeur » (`noOdour`).'
facettes:
- odorat
définition: Ce à quoi l’odeur fait penser, dite par la source qu’elle rappelle (le bois, les fruits, les fleurs, la fumée…), sans dire que l’objet est fait de cette source.
question_attentionnelle: L’odeur fait-elle penser au bois, aux fruits, aux agrumes, aux fleurs, à l’herbe coupée, aux épices, à la fumée ou au grillé, à la terre ou à la cave, à la résine, au cuir ?
contre_exemple: 'Un plastique moulé peut sentir le bois ; un bois traité peut ne sentir que le vernis : « boisé » ne dit pas que l’objet est en bois. « Agréable », « propre » ou « écœurant » ne sont pas
  des caractères : ce sont des jugements.'
avertissement_label: '« Qualité de l’odeur » (label alternatif) se lit aussi comme un jugement (« une odeur de qualité ») : le label canonique est « caractère de l’odeur », le terme d’ISO/TS 16922. Chaque
  région se lit « qui rappelle … ».'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode de mesure robuste n’est connue pour ce à quoi une odeur fait penser (recherche reprise le 2026-11-14 ; première recherche le 2026-10-16). Le caractère se dit par des mots et
    se juge par un jury ; aucune norme ni méthode instrumentale lue ne le mesure. La roue des arômes du vin [[noble1987]] et l’atlas des profils d’odeur [[dravnieks1985]], cités par l’état de l’art, ne
    sont pas des mesures associées : ce sont des listes de mots sans référence physique normalisée ; les substances d’entraînement d’ISO 5496 [[iso5496]] servent de repères, pas de mesure.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: roue des arômes du vin (Noble et al. 1987)
    references:
    - noble1987
    raison: 'une roue de mots faite pour le vin, avec des étalons proposés pour définir les mots, mais sans référence physique normalisée : elle aide à nommer une odeur, elle ne la mesure pas ; elle nomme
      aussi des défauts du vin'
    statut_lecture: résumé lu (OpenAlex)
  - nom: atlas des profils d’odeur (Dravnieks 1985)
    references:
    - dravnieks1985
    raison: 'des notes données par un jury à une liste de mots, pour environ 160 substances : il dit à quoi chaque substance fait penser, sans série de référence physique pour juger l’odeur d’un objet'
    statut_lecture: non lu, notice de l’éditeur seulement
  - nom: substances d’entraînement à la reconnaissance des odeurs (ISO 5496, amendement 1, tableau A.2)
    references:
    - iso5496
    raison: 'des substances pures, à des dilutions fixées, chacune avec les mots qu’elle évoque : elles servent à entraîner un jury à reconnaître des odeurs, pas à juger l’odeur d’un objet ; la fiche s’en
      sert comme repères, pas comme mesure'
    statut_lecture: non lue ; notice de l’éditeur, article 5.2 de l’extrait public et tableau A.2 de l’extrait public de l’amendement 1 seulement
modalites:
- odorat
mode_de_presentation: échantillon
conditions_critiques:
- distance
note_conditions: 'la distance du nez est critique (facette `distance`, spec §9.7 H, règle 10) : la qualité perçue d’une odeur change avec sa concentration (Gross-Isseroff et Lancet, 1988, résumé seulement
  lu) [[gross_isseroff_lancet1988]] ; l’exposition (règle 10) agit sur l’intensité, son effet sur le caractère n’est pas sourcé ; les autres odeurs présentes et l’état de l’observateur sont notés dans l’épisode.
  Les références olfactives (étalons, coffrets) servent de repères de région, pas d’exemplaires (X17).'
porteur: l’objet ou la partie qu’on sent, à l’air ambiant
arité: 1
condition_NA: 'objet sans odeur sous la condition (intensité `noOdour`, « aucune odeur ») : la base n’est pas remplie.'
