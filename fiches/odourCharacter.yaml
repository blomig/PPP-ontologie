  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « ça sent » à « ça rappelle le bois, la fumée » change la description, sans dire de quoi l’objet est fait.
transfert: objet conçu oui (un cuir, un bois, un savon) | tableau non | cuisine oui (épices, bois, fumée) | high-tech oui (l’odeur d’un plastique neuf) | architecture oui (un intérieur boisé)
