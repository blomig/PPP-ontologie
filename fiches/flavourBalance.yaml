# Fiche de type PPP — ppp:flavourBalance — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:flavourBalance
label_fr: composante dominante
label_en: dominant component
labels_alternatifs:
- équilibre
labels_alternatifs_en:
- balance
note_label_alternatif: '« équilibre » (EN balance) est un label alternatif d’atelier, marqué comme tel ; l’id `flavourBalance` est gardé pour ne pas changer d’id d’un document à l’autre. « Harmonieux »,
  « bien équilibré », « déséquilibré » sont des jugements : ils ne sont ni des régions ni des labels alternatifs, parce qu’ils qualifient une région en bien ou en mal (A10) ; ils vont au lexique d’atelier
  (§9.7 K), qui renvoie « équilibré » au type, jamais à la région `noneDominant`.'
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:bitterness
  - ppp:oralPungency
  - ppp:astringency
  facteurs_non_perceptuels: []
note_base: 'Base proposée (strate semi-formel, à vérifier ; proposition « Goût », 2.8) : la composante dominante se lit sur des composantes perçues. Les valeurs nominales (`sweet`, `sour`…) ne renvoient
  pas à des types : ce sont des valeurs de l’espace de valeurs (choix de relecture, 2026-10-20), et le sucré et l’acide, en réserve, ne bloquent pas la fiche. Seuls des ids définis sont cités (A12) : l’amer,
  le piquant en bouche et l’astringence, tous trois formels (A9). Le sucré, l’acide, le salé, l’umami et l’arôme en bouche sont encore en réserve, sans id : ils entreront dans la base quand leurs fiches
  existeront ; la base déclarée est donc incomplète. Les deux types de texture du premier lot n’y sont pas : la définition exclut la texture de la bouchée (choix de relecture (2026-10-20), série 78 bis).'
facettes:
- gout
définition: 'La composante perçue comme la plus forte parmi les composantes principales de la portion en bouche (sucré, acide, amer, salé, umami, astringence, piquant ou chaleur de l’alcool, arôme en bouche),
  ou aucune si aucune ne l’emporte : laquelle l’emporte, pas de combien.'
question_attentionnelle: 'Laquelle des composantes se fait sentir le plus fort : le sucré, l’acide, l’amer, le salé, l’umami, l’astringence, le piquant ou la chaleur, l’arôme ? Ou aucune ne l’emporte-t-elle
  ?'
contre_exemple: 'On juge la composante perçue comme la plus forte, pas celle qu’on attend de la composition : l’acide peut cacher le sucré. Ce n’est pas la composante qui attire l’attention à un moment
  donné, qui n’est pas forcément la plus forte. « Aucune dominante » n’est pas « bon » : « ce vin a l’acide pour composante dominante, et c’est un défaut » doit pouvoir se dire comme « …et c’est une qualité
  » (un vin blanc vif), et « aucune dominante perçue, et c’est un défaut » (un vin plat) aussi.'
grandeur_physique_homonyme: 'le rapport °Brix / acidité (indice de maturité des fruits) : un rapport de composition, qui n’est pas une définition de ce type ; voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Une mesure associée indirecte existe : le rapport entre le °Brix (ISO 2173) et l’acidité titrable (ISO 750). Elle ne porte que sur deux composantes (sucré et acide), sur la composition et non
    sur la perception ; aucune source lue ne la relie à la composante perçue comme la plus forte (non vérifié). Aucune méthode proche n’est connue (recherche du 2026-10-20). Le score de la grille CIEL (de
    0 à 4) est hors de la rubrique : c’est un jugement de qualité.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: rapport_brix_acidite
    nom: rapport °Brix / acidité titrable
    grandeur: le rapport entre le °Brix (teneur en matières dissoutes, lue au réfractomètre) et l’acidité titrable
    unite_ou_echelle: un rapport sans unité
    references:
    - iso2173
    - iso750
    proximite: indirecte
    ecart: 'deux composantes seulement (sucré et acide), sur la composition et non sur la perception ; les interactions entre saveurs changent la force perçue de chacune ; ni amer, ni astringence, ni chaleur,
      ni arôme ; aucune source lue ne relie ce rapport à la composante perçue comme la plus forte (non vérifié) ; les limites des deux normes s’ajoutent (ISO 2173 : résultat approché quand d’autres substances
      sont dissoutes ; ISO 750 : sans valeur avec du dioxyde de soufre, méthode à indicateur non applicable aux vins)'
    conditions: celles d’ISO 2173 et d’ISO 750
    statut_lecture: extrait d’index (ISO 2173) ; extraits (ISO 750)
  non_retenues:
  - nom: gLMS et estimation de grandeur
    references:
    - green1993lms
    - green1996lms
    - stevens1957
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: résumés (Green et al., 1993 et 1996) ; métadonnées (Stevens, 1957)
  - nom: échelles de panel et notes sur une échelle de complexité, d’intensité ou d’équilibre, dont le questionnaire de complexité de Medel et al. (2009)
    references:
    - medel2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: métadonnées (Medel et al., 2009 ; contenu par source secondaire)
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - pineau2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumé (Pineau et al., 2009)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
- moment
- temperature_bouchee
- avant
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique (avec le nez pincé, l’arôme sort des composantes possibles, et le sucré « par l’odeur » aussi : Lim et Johnson, 2011 [[lim_johnson2011]]) ;
  `moment` est critique (les notes n’ont ni la même durée ni le même pic d’intensité dans la finale : Goodstein et al., 2014 [[goodstein2014]] ; la plus forte peut donc changer, ce qui reste à tester par
  E1) ; `temperature_bouchee` est critique (sucré : Talavera et al., 2005 [[talavera2005]]) ; `avant` est critique (l’astringence est cumulative [[green1993astr]]).'
porteur: la portion en bouche (la gorgée ou la bouchée) d’un produit identifié, voie rétronasale (de l’arrière de la bouche vers le nez) comprise
note_porteur: 'porteur des trois premiers types du lot CIEL (choix de relecture, 2026-10-20 ; proposition « Goût », 2.8) : la portion en bouche, et non le produit identifié, parce que ces jugements portent
  sur ce qui est en bouche à un moment donné et changent pendant la dégustation [[pineau2009]]. L’objet du registre reste le produit identifié ; la portion en est la partie jugée (§9.7 I).'
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
