- 'épreuve d’accord E1 à faire : portions du même lot, au même moment, repères de région goûtés avant de juger (proposition « Goût », section 6, point 2) ; elle suit celle du premier lot (lot CIEL)'
- 'définition de l’équilibre chez Peynaud (chapitre non lu) : non vérifiée'
- aucune source ne teste l’accord sur une dominante en bouche ; liste des valeurs offertes à fixer avant E1
- 'repère du piquant : aucun repère public sûr (à caler, X17, série 90) ; forme de l’alun à déclarer (série 90)'
