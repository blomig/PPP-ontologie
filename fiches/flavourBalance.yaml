  validation: Toute assertion de type ppp:flavourBalance a exactement un ppp:about.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je goûte ce vin » à « je regarde quelle composante l’emporte » change la description (on compare les composantes entre elles au lieu de les suivre une à une).
transfert: objet conçu oui (une recette, un assemblage, une boisson) | tableau non | cuisine oui (une vinaigrette, un jus, un vin) | high-tech non | architecture non
