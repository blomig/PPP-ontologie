etat_de_l_art: 'Peynaud et Blouin (2022) [[peynaud2022]] consacrent un chapitre aux « Interférences et équilibres des saveurs », dont la définition de l’équilibre n’est pas lue (non vérifié). Dans un mélange,
  les saveurs se renforcent, s’additionnent ou se suppriment selon l’intensité (Keast et Breslin, 2003 [[keast_breslin2003]]) ; dans le vin blanc, l’acide supprime le sucré plus que l’inverse (Zamora et
  al., 2006 [[zamora2006]]) ; l’éthanol et le pH changent l’astringence et l’amertume (Fontoin et al., 2008 [[fontoin2008]]) ; à faible degré, l’éthanol est surtout amer, à fort degré surtout brûlant (Nolden
  et Hayes, 2015 [[nolden_hayes2015]]). La TDS définit l’attribut dominant comme celui qui attire l’attention, pas forcément le plus intense (Pineau et al., 2009 [[pineau2009]], cité par Visalli et Galmarini,
  2024 [[visalli2024]]) : cette dominance attentionnelle n’est pas la force relative perçue retenue ici. La liste des réponses offertes change ce qu’on note (Clark et Lawless, 1994 [[clark_lawless1994]]).
  Le rapport °Brix / acidité (ISO 2173:2003 [[iso2173]] ; ISO 750:1998 [[iso750]]) porte sur la composition. Aucune source lue ne teste l’accord sur une dominante en bouche. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
