note_echelle: 'une seule dimension, nominale (choix de relecture, 2026-10-20, série 77 ter ; C7) : la composante perçue comme la plus forte, ou aucune. La dominance est ici la force relative perçue, pas
  la dominance de la TDS, qui est attentionnelle (Pineau et al., 2009 [[pineau2009]], dont la définition complète est connue par Visalli et Galmarini, 2024 [[visalli2024]]). Le degré de dominance (légère
  ; nette ; forte) n’est pas retenu : il part en réserve, comme type distinct éventuel, sans id. Aucun voisinage n’est déclaré entre les valeurs. Les repères sont des solutions goûtées seules pour reconnaître
  chaque composante, pas des exemplaires ; la liste des valeurs doit être fixée avant E1 et contenir l’arôme (Clark et Lawless, 1994 [[clark_lawless1994]]).'
identite: 'Laquelle des composantes l’emporte, pas une force d’ensemble (intensité (goût)) ni la force d’une qualité (types du premier lot) ; pas un rapport de composition (le rapport °Brix / acidité n’en
  est pas une définition) ; pas la composante qui attire l’attention (dominance de la TDS, proche de la saillance) ; pas l’agrément. Les valeurs ne renvoient pas à des types : le sucré, l’acide, le salé,
  l’umami et l’arôme en bouche sont encore en réserve.'
