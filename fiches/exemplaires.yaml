      motif_usage: "série 20 (2026-10-11 ; décision de l’éditeur du projet ; pas un avis juridique) : le site reproduit une photo de l’œuvre, pas l’œuvre ; critère (Q15, X16) : image hébergée sur Wikimedia Commons avec licence et balise indiquées. Rempli : photo « Own work » de Sailko, CC BY-SA 3.0, balise {{self|GFDL|Cc-by-sa-3.0}}, page relue par l’API le 2026-10-11 (AttributionRequired true, Restrictions vide) : reproduite avec la mention complète. Choisie parmi les quatre fichiers de la catégorie Commons « Red square by Malevich (GRM) » (lus le 2026-10-11) : l’ancienne image (https://commons.wikimedia.org/wiki/File:Red_Square._Visual_Realism_of_a_Peasant_Woman_in_Two_Dimensions.jpg, reprise de abcgallery.com, 673 × 700 px, 34 ko, balise {{PD-Art|PD-old-auto-expired|deathyear=1935}}) n’est plus utilisée ; autres candidats écartés : scan du livre « Казимир Малевич в Русском музее » (1654 × 1650 px, PNG de 6,3 Mo, PD-Art, couleurs nettement plus sombres) et photo de shakko (CC BY-SA 4.0, cadre, mur et cartel dans l’image). Limite : la page de la photo ne porte de balise que pour la photo (modèle Art Photo sans champ « artwork license ») ; l’œuvre n’y a pas de balise propre. doute noté, non bloquant (série 20) : pour le pays d’origine (Russie), le modèle {{PD-Russia-expired}} remplace la date de décès par celle d’une réhabilitation posthume ; Malévitch a été arrêté en 1930, dossier classé le 29 novembre 1930 pour absence d’infraction (Otkrytyi spisok, Mémorial) ; aucune source lue ne dit s’il y a eu une réhabilitation après 1935 : doute ni levé ni avéré (en séries 18 et 19, il valait lien seulement ; détail : docs/droits-exemples-2026-10-11.md). UE : domaine public (mort en 1935 ; reproduction fidèle libre, directive (UE) 2019/790, art. 14) ; États-Unis : domaine public selon le modèle (publiée avant 1931)."
