    note_distance: "la distance déclarée (`far`, épisode 05) est celle de la scène montrée, estimée (une voûte vue du sol), pas celle de l'écran ; c'est elle que la taille perçue tient pour critique (spec §9.7 H règle 7, T22)"
    note: on juge la mosaïque dans la scène montrée (la voûte arrondie au fond d'une église), pas la taille de son image (note_reference de la fiche) ; elle dépasse nettement une personne ; la photo, très cadrée, ne montre aucun repère humain, ce sont les bords courbes de la voûte et le fait de savoir qu'il s'agit d'une église qui font juger la taille

