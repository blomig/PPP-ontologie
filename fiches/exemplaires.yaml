# Exemplaires proposés pour les fiches pilotes (ABox, spec §9.3 et §9.7 G).
# Chaque exemplaire est une assertion ordinaire, contestable (§13). Statut : PROPOSITION,
# v2.6 : `doute: oui` marque un exemplaire que son auteur juge discutable (T35) ; il remplace le mot « contestable »
# qui ouvrait la note (migration mécanique, seconde relecture explicative, 2026-10-11).
# à valider par la relecture explicative ; aucun accord inter-observateurs n'est déclaré.
# Objets : uniquement des objets publics (Q12), dont la page a été vérifiée le 2026-10-10
# (API Wikimedia Commons ; pour le bol, API Open Access du Metropolitan Museum of Art).
# Un épisode par objet (A5 : un épisode a une seule cible) ; mêmes conditions pour tous.
# v2.3.1 : facette `angle` ajoutée à chaque épisode (spec §9.7 H), `unknown` (non relevée) ;
# aucun exemplaire ne porte sur un type dont une facette critique est `unknown` (A5).
# v2.3.1 : six assertions neuves (0104, 0501, 0502, 0601, 0701, 0801), deux objets neufs,
# pages Commons vérifiées par l'API de Wikimedia Commons le 2026-10-10 ; à valider par la relecture explicative.
# v2.3.2 : 0103, 0301 et 0502 (Shap Wells) retirées (T24) ; un objet neuf (échantillon bouchardé),
# page Commons vérifiée par l'API le 2026-10-10 ; deux assertions neuves (0105, 0503), à valider par la relecture explicative.
# v2.3.2 : facette `distance` relue selon la règle 7 de la spec §9.7 H (prise de vue, pas écran) ;
# `note_distance` dans chaque épisode (T22).
# Droits des images : règle Q15 (éditeur du projet, 2026-10-11) : une image réellement libre (Commons CC, domaine public avéré,
# série 18 : avéré dans le pays d'origine, l'UE et les États-Unis (critère de l'éditeur du projet) ; série 20 : une image hébergée
# sur Commons avec licence et balise indiquées suffit, le doute sur le pays d'origine ne bloque plus ;
# Met Open Access) est reproduite avec son crédit complet ; sinon, lien seulement (credit.usage, credit.lien_externe). Les ids `app:` d'objets et de parties
# sont des ids d'application (§9.7 I), pas des ids du cœur.

