note_echelle: quatre régions, comme pour l’amer (proposition « Goût », 2.3). ISO 3972 ne donne aucune solution pour le piquant ; aucun repère public sûr n’a été trouvé, et la capsaïcine pure, irritant extrême,
  n’est pas proposée (proposition « Goût », sections 6 et 9).
identite: La force de la brûlure ou du picotement en bouche, par le trijumeau ; pas une saveur (amer), pas le pétillant (en réserve), pas le piquant au nez (en réserve dans la famille Odorat), pas la fraîcheur
  de la menthe (en réserve), pas la chaleur d’un plat chaud, pas l’agrément.
