facettes:
- gout
définition: 'La force de la brûlure ou du picotement ressentis dans la bouche en goûtant une portion du produit (piment, poivre, gingembre) : une sensation du trijumeau (le nerf qui sent la brûlure du piment,
  le froid de la menthe, le picotement), pas une saveur ; ce n’est ni le pétillant ni le piquant au nez.'
question_attentionnelle: Est-ce que ça brûle ou pique en bouche ? À peine, nettement, ou fortement ?
contre_exemple: 'L’eau gazeuse picote, mais c’est le pétillant (mi-saveur, mi-toucher), pas ce type. La moutarde ou le raifort qui montent au nez relèvent du piquant au nez, en réserve dans la famille Odorat.
  Un plat très chaud brûle par sa température, pas par ce qu’il contient. « Fort » n’est pas « trop fort » : « ce plat est nettement piquant, et c’est une qualité » se dit comme « …et c’est un défaut ».'
grandeur_physique_homonyme: 'le « piquant » d’un piment en unités de chaleur Scoville (SHU) ou en teneur en capsaïcinoïdes [[iso7543_2]] [[asta_21_3]] : une conversion chimique d’un extrait, pas la brûlure
  perçue ; aucune région ne s’en déduit. Voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Des mesures associées indirectes existent pour les piments seulement : la teneur en capsaïcinoïdes par chromatographie (ISO 7543-2, ASTA 21.3) et l’indice de Scoville, un seuil de dilution
    par jury (ISO 3513). Elles portent sur un extrait de piment, pas sur la bouchée, et ne valent ni pour le poivre ni pour le gingembre. Aucune méthode proche n’est connue (recherche du 2026-10-19).'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso7543_2
    nom: teneur en capsaïcinoïdes totaux par CLHP (ISO 7543-2:1993)
    grandeur: somme de la capsaïcine, de la nordihydrocapsaïcine et de la dihydrocapsaïcine, exprimée en nonyl acide vanillylamide
    unite_ou_echelle: '% en masse'
    references:
    - iso7543_2
    proximite: indirecte
    ecart: une composition d’extrait de piment, pas la brûlure perçue ; ni le poivre ni le gingembre ; ni l’observateur, ni l’accumulation d’une prise à l’autre
    conditions: piments et oléorésines de piment ; substance de référence à manipuler avec précaution (« strongly irritating »)
    statut_lecture: 'extraits (aperçu public : domaine, principe, calcul ; page de l’ISO : confirmée en 2026)'
  - id: asta_21_3
    nom: piquant des piments par CLHP (méthode ASTA 21.3, révision 2026)
    grandeur: capsaïcinoïdes, convertis en unités de chaleur Scoville
    unite_ou_echelle: unités de chaleur Scoville (SHU)
    references:
    - asta_21_3
    proximite: indirecte
    ecart: une conversion chimique, pas un jugement de jury ; une révision de 2026 corrige les facteurs de réponse ; piments seulement
    conditions: piments et oléorésines de piment
    statut_lecture: extrait d’index (pages de l’ASTA)
  - id: iso3513
    nom: indice de Scoville (ISO 3513:1995)
    grandeur: la plus grande dilution d’un extrait éthanolique de piment, dans une solution de saccharose à 50 g/l, à laquelle un jury de cinq personnes perçoit encore le piquant
    unite_ou_echelle: facteur de dilution
    references:
    - iso3513
    proximite: indirecte
    ecart: un seuil de dilution, comme EN 13725 pour les odeurs, pas la force perçue au-dessus du seuil ; extrait de piment, pas la bouchée
    conditions: extrait éthanolique ; jury de cinq personnes
    statut_lecture: 'extraits (aperçu public : domaine, définition 3.1, principe, réactifs, préparation des dilutions ; page de l’ISO : confirmée en 2024)'
  non_retenues:
  - nom: gLMS
    references:
    - green1993lms
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1), alors même qu’elle a été éprouvée sur l’irritation chimique
    statut_lecture: résumé (OpenAlex)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- avant
note_conditions: 'règle 12 (spec §9.7 H) : `avant` est critique, parce que la brûlure s’accumule d’une prise à l’autre, et que l’irritation par l’éthanol diminue au contraire à force de répéter (Prescott
  et Swain-Campbell, 2000 [[prescott2000]]). `duree` compte : la sensation monte et dure, on ne juge pas à la première seconde ; le temps passé en bouche avant de juger est déclaré. `nez` n’est pas critique
  (ce n’est pas une saveur) ; `temperature_bouchee` est à éprouver (la capsaïcine active un canal qui répond aussi à la chaleur [[caterina1997]]). L’état de l’observateur (supergoûteurs) est une note facultative
  qui n’identifie personne.'
porteur: le produit identifié dont on goûte une portion (nature, origine, lot, date de production ou d’ouverture, conservation, concentration pour une boisson préparée) ; la portion goûtée n’est pas le
  porteur
note_porteur: même porteur que les autres types de saveur et de trijumeau (proposition « Goût », section 6 ; choix de relecture du 2026-10-19, 8.1 point 4).
