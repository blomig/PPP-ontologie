etat_de_l_art: 'Le piquant n’est pas une saveur : il passe par le nerf trijumeau, qui sert aussi au toucher et à la douleur (Viana, 2011 [[viana2011]]) ; la capsaïcine active un canal qui répond aussi à
  la chaleur douloureuse (Caterina et al., 1997 [[caterina1997]]), et Green (1996) [[green1996chem]] en fait une composante de la flaveur (titre seulement). Les supergoûteurs perçoivent plus de brûlure
  (Bartoshuk et al., 1994 [[bartoshuk1994]] ; Bartoshuk, 2000 [[bartoshuk2000]]). L’éthanol active le même récepteur (Trevisani et al., 2002 [[trevisani2002]]), irrite la bouche avec une désensibilisation
  quand on répète (Prescott et Swain-Campbell, 2000 [[prescott2000]]) et devient surtout brûlant à fort degré (Nolden et Hayes, 2015 [[nolden_hayes2015]]). Les mesures connues portent sur un extrait de
  piment : ISO 7543-2:1993 [[iso7543_2]], ASTA 21.3 [[asta_21_3]] et ISO 3513:1995 [[iso3513]] ; la LMS, éprouvée sur l’irritation chimique, reste un jugement de jury (Green et al., 1993 [[green1993lms]]).
  Aucune source lue ne teste l’accord entre observateurs sur des crans de piquant ; aucun repère public sûr n’est connu. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:oralPungency a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je mange ce plat » à « je regarde combien il brûle ou pique » change la description (on suit une sensation qui monte et dure, à part des saveurs).
transfert: objet conçu oui (une recette, une sauce, une boisson) | tableau non | cuisine oui (piment, poivre, gingembre, alcool fort) | high-tech non | architecture non
