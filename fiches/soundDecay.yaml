# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_categories, avertissement_label.
# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:soundDecay
label_fr: résonance
label_en: decay
labels_alternatifs:
- extinction du son
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: 'Ce que fait le son après le geste bref qui l’a produit : il s’éteint aussitôt, résonne un moment, ou résonne longtemps.'
question_attentionnelle: Après le coup, le son s’arrête-t-il tout de suite, résonne-t-il un moment, ou longtemps ?
contre_exemple: 'Dans une salle très réverbérante, un objet qui s’éteint aussitôt paraît résonner : c’est la salle qu’on entend. « Ça sonne métal » n’est pas une résonance : c’est une identification de
  la matière, qui peut se tromper.'
grandeur_physique_homonyme: 'temps de réverbération (celui de la salle, pas de l’objet) ; résonance mécanique ou acoustique (accord d’un système sur une fréquence propre) : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'La vitesse à laquelle le son d’un objet frappé s’éteint (son amortissement) a été étudiée comme indice de la matière entendue [[klatzky2000]] [[giordano_mcadams2006]] : c’est une mesure associée
    proche. Elle se calcule sur un enregistrement ; la réverbération de la salle s’y ajoute, et elle ne saisit ni la distance d’écoute ni l’auditeur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: klatzky2000
    nom: vitesse de décroissance (amortissement)
    grandeur: vitesse à laquelle l’amplitude du son décroît après le choc, selon la fréquence
    unite_ou_echelle: taux de décroissance (par seconde), selon la fréquence
    references:
    - klatzky2000
    - giordano_mcadams2006
    proximite: proche
    ecart: étudiée sur des sons synthétisés de barres frappées (Klatzky et al. 2000) ; sur des sons réels, la durée du signal explique les jugements aussi bien que l’amortissement (Giordano et McAdams 2006)
      ; la décroissance dépend de la fréquence ; se calcule sur un enregistrement où la réverbération de la salle s’ajoute ; ne saisit ni la distance d’écoute ni l’auditeur
    conditions: enregistrement du son après un geste bref ; analyse par bande de fréquence
    statut_lecture: résumé lu (Klatzky et al. 2000, OpenAlex ; Giordano et McAdams 2006, OpenAlex)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
note_conditions: 'un geste bref déclaré (facette `production`, en général `impact`) ; une salle très réverbérante allonge la résonance : la noter dans l’épisode (spec §9.7 H, règle 9). Piège : pour un son
  frappé, l’oreille juge aussi l’attaque par la façon dont le son s’éteint (Chion, 1983, art. 97) [[chion1983]] : la résonance se juge à part de l’attaque.'
porteur: un objet qu’on fait sonner par un geste bref (frappé, pincé)
arité: 1
condition_NA: son continu (une machine en marche, un souffle), ou objet qui ne sonne pas sous le geste déclaré.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `stopsAtOnce` (rang 1) vers `ringsLong` (rang 3), le son dure de plus en plus après le geste
  numerique: non
  regions:
  - cle: stopsAtOnce
    label_fr: s’éteint aussitôt
    label_en: stops at once
    rang: 1
    repere: le son s’arrête tout de suite (un bois plein frappé)
    exemplaires: []
  - cle: ringsAMoment
    label_fr: résonne un moment
    label_en: rings for a moment
    rang: 2
    repere: le son dure un peu (un verre)
    exemplaires: []
  - cle: ringsLong
    label_fr: résonne longtemps
    label_en: rings for a long time
    rang: 3
    repere: le son dure longtemps (une cloche, un gong)
    exemplaires: []
identite: Ce que fait le son après le geste, pas la façon dont il commence (attaque), pas la matière qu’on croit reconnaître, pas la réverbération de la salle.
relations:
- type: confusableWith
  cible: ppp:soundAttack
  note: 'pour un son frappé, l’oreille juge l’attaque en partie par la façon dont le son s’éteint (Chion, 1983, art. 97) [[chion1983]] : on juge la fin et le début à part (réciproque écrite aussi dans soundAttack)'
ontoClean:
  rigidite: +R
  identite_propre: +I
  unite: —
  dependance: +D
references_statut: renseignées
