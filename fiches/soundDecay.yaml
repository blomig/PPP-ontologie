    distance: near
    production: impact
    bruit_de_fond: quiet
    duree: glance
    note: enregistré dans un grand auditorium, avec une paire de micros espacés, des micros au-dessus et un micro proche (d’après la page) ; coup sur une barre de métal, noté `impact` ; casque fermé ou
      enceintes, pièce calme ; écoute complète de 1 s
