etat_de_l_art: 'Klatzky, Pai et Krotkov (2000) [[klatzky2000]] montrent que la vitesse d’extinction décide fortement de la matière perçue d’un son de contact ; Giordano et McAdams (2006) [[giordano_mcadams2006]]
  trouvent que l’amortissement, mais aussi la durée, expliquent l’identification des grandes catégories (résumés lus). PPP en garde la résonance, pas la matière identifiée. Chion (1983, art. 97, lu en traduction)
  [[chion1983]] note que l’oreille juge l’attaque d’un son frappé par son extinction. Aucune source trouvée ne fixe des régions perçues. Détail : docs/bibliographie-par-type.md#groupe-son.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:soundDecay a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « ça sonne métal » à « le son s’éteint-il aussitôt ou résonne-t-il » change la description (on décrit ce qu’on entend, pas ce qu’on devine).
transfert: objet conçu oui (un verre, un bol en métal frappés) | tableau non (sans son) | cuisine oui (une casserole, une planche en bois frappées) | high-tech oui (un boîtier en métal ou en plastique tapoté)
  | architecture oui (un plancher, une rampe métallique frappés)
