nanay: Oui — passer de « ça sonne métal » à « le son s’éteint-il aussitôt ou résonne-t-il » change la description (on décrit ce qu’on entend, pas ce qu’on devine).
transfert: objet conçu oui (un verre, un bol en métal frappés) | tableau non (sans son) | cuisine oui (une casserole, une planche en bois frappées) | high-tech oui (un boîtier en métal ou en plastique tapoté)
  | architecture oui (un plancher, une rampe métallique frappés)
