etat_de_l_art: 'Sources : sur des sons synthétisés de barres frappées, la vitesse de décroissance pèse nettement plus que la fréquence quand on juge la matière (Klatzky, Pai et Krotkov, 2000) [[klatzky2000]]
  ; selon McAdams, Chaigne et Roussarie (2004) [[mcadams2004]], le corrélat le plus probable de l’amortissement perçu est une combinaison de la constante de décroissance de fin de son et du centre de gravité
  spectral (92 à 98 % de la variance des positions perçues). Sur des plaques réelles frappées, Giordano et McAdams (2006) [[giordano_mcadams2006]] trouvent que la durée du signal explique la matière aussi
  bien que l’amortissement, et concluent à un faible appui pour le rôle de l’amortissement ; Lutfi et Oh (1997, résumé lu) [[lutfi_oh1997]] trouvent que les auditeurs donnent trop de poids à la fréquence.
  Sur des sons de 10 à 200 ms, un son qui s’éteint paraît plus court qu’un son qui monte ; une des deux explications avancées par Schlauch, Ries et DiGiovanni (2001, résumé lu) [[schlauch2001]] est que
  l’auditeur ignorerait une partie de la fin, prise pour un écho. Schaeffer [[schaeffer1966]], lu via Chion (1983, art. 61 et 96) [[chion1983]], range le son bref, prolongé ou non par une résonance, parmi
  les entretiens « passifs », et note une loi de décroissance progressive des sons percussion-résonance ; McAdams et al. (1995) [[mcadams1995]] et Peeters et al. (2011) [[peeters2011]] décrivent des mesures
  qui séparent, selon eux, les sons impulsifs des sons entretenus. Aucune source trouvée ne fixe des régions perçues de la résonance, ni des bornes entre elles ; PPP en garde la résonance, pas la matière
  identifiée (détail : docs/bibliographie-par-type.md#groupe-son).'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
