  doute: oui
  motif_doute: 'la page dit seulement « Percussion » : le triangle vient du nom du fichier, et rien ne dit pourquoi le son s’arrête si vite (« HitFM » n’est pas expliqué ; un triangle tenu à la main, peut-être)
    ; « ça sonne métal » peut faire attendre une résonance (contre-exemple de la fiche) ; le fichier finit par un silence numérique'
  motif_doute_en: 'the page only says “Percussion”: the triangle comes from the file name, and nothing says why the sound stops so quickly (“HitFM” is not explained; a triangle held in the hand, perhaps);
    “it sounds like metal” may lead one to expect a resonance (counter-example in the entry); the file ends with digital silence'
  note: 'son au plus fort dès le début, environ 20 dB plus bas vers 60 ms, 40 dB plus bas vers 0,3 s ; silence numérique après environ 0,8 s, quand le son est déjà vers −55 dB (mesure de l’équipe sur l’aperçu
    MP3, enveloppe sur des fenêtres de 10 à 50 ms, indicative). Épisode de contrôle : un objet en métal qui s’éteint aussitôt'
  note_en: 'sound at its loudest from the start, about 20 dB lower at around 60 ms, 40 dB lower at around 0.3 s; digital silence after about 0.8 s, when the sound is already around −55 dB (team measurement
