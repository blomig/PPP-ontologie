# Série 98 : épisodes proposés « à réaliser » (spec X17 ; choix de relecture (2026-11-04)) ; ni épreuve faite ni accord entre observateurs ; ni observateur, ni date, ni résultat.
# Enregistrements CC0 (Creative Commons 0 : lien vers la licence lu sur chaque page), pages vérifiées le 2026-11-04 ; chutes mesurées par l’équipe sur l’aperçu MP3 de chaque page (enveloppe en décibels sous le maximum), indicatives, non vérifiées comme bornes ; aucun enregistrement des épisodes de soundAttack n’est repris.
episodes_a_realiser:
- id: ppp-a:ep-soundDecay-01
  realisation: a_realiser
  region_attendue: stopsAtOnce
  rang_exemplaire: principal
  objet: enregistrement d’un coup doux de baguette sur un wood-block (un bloc de bois creux de percussion), environ 0,5 s, page « Woodblock-soft.wav », par hollandm, sur Freesound (https://freesound.org/people/hollandm/sounds/692828/),
    licence CC0, page vérifiée le 2026-11-04
  objet_en: recording of a soft stroke of a stick on a woodblock (a hollow wooden percussion block), about 0.5 s, page “Woodblock-soft.wav”, by hollandm, on Freesound (https://freesound.org/people/hollandm/sounds/692828/),
    CC0 licence, page checked on 2026-11-04
  preparation: comme l’épisode 03 ; même niveau d’écoute ; écouter l’enregistrement jusqu’au bout, deux ou trois fois, et juger ce que fait le son après le coup
  preparation_en: as in episode 03; same listening level; listen to the recording to the end, two or three times, and judge what the sound does after the stroke
  consigne: Après le coup ou le pincement, le son s’arrête-t-il tout de suite (un coup sourd sur un coussin), résonne-t-il un moment (une cuillère contre une tasse), ou longtemps (une cloche d’église) ?
  consigne_en: After the stroke or the pluck, does the sound stop at once (a dull thud on a cushion), ring for a moment (a spoon against a cup), or ring for a long time (a church bell)?
  conditions:
    presentation: recording
    distance: unknown
    production: impact
    bruit_de_fond: quiet
    duree: glance
    note: enregistré avec un micro à large membrane (d’après la page), distance et salle non dites (`unknown`) ; bois contre bois, noté `impact` ; casque fermé ou enceintes, pièce calme ; écoute complète
      de 0,5 s
    note_en: recorded with a large-diaphragm microphone (according to the page), distance and room not given (`unknown`); wood against wood, recorded as `impact`; closed headphones or loudspeakers, quiet
      room; full listening of 0.5 s
  doute: oui
  motif_doute: 'la page dit qu’une égalisation et une compression ont été ajoutées : une compression peut changer la façon dont le son s’éteint ; l’enregistrement commence au coup, sans silence avant'
  motif_doute_en: 'the page says that equalisation and compression were added: compression can change the way the sound dies away; the recording starts at the stroke, with no silence before it'
  note: 'son au plus fort dès le début, environ 30 dB plus bas vers 40 ms, 40 dB plus bas vers 0,1 s ; le fichier finit bien en dessous (environ −68 dB) (mesure de l’équipe sur l’aperçu MP3, enveloppe sur
    des fenêtres de 10 à 50 ms, indicative) : le son se tait avant la fin du fichier'
  note_en: 'sound at its loudest from the start, about 30 dB lower at around 40 ms, 40 dB lower at around 0.1 s; the file ends well below (about −68 dB) (team measurement on the MP3 preview, envelope over
    10 to 50 ms windows, indicative): the sound falls silent before the end of the file'
  texte_fr: 'Un coup doux sur un wood-block : s’éteint aussitôt (prédiction, à éprouver).'
  texte_en: 'A soft stroke on a woodblock: stops at once (prediction, to be tested).'
