id: ppp:soundDecay
label_fr: extinction du son
label_en: sound decay
labels_alternatifs:
- résonance
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: 'Quand on frappe ou qu’on pince un objet, le son continue un peu après le geste, puis se tait. On décrit combien de temps il continue : il s’arrête aussitôt, résonne un moment, ou résonne longtemps.
  On écoute la fin du son, pas son début.'
question_attentionnelle: Après le coup ou le pincement, le son s’arrête-t-il tout de suite, résonne-t-il un moment, ou résonne-t-il longtemps ?
contre_exemple: 'Dans une salle très réverbérante, un objet qui s’éteint aussitôt paraît résonner : c’est la salle qu’on entend, pas l’objet. « Ça sonne métal » ne dit pas que le son résonne : c’est une
  idée sur la matière, qui peut se tromper (un objet en métal serré dans la main pendant qu’on le frappe s’arrête court).'
grandeur_physique_homonyme: 'temps de réverbération (celui de la salle, pas de l’objet) ; résonance mécanique ou acoustique (accord d’un système sur une fréquence propre) : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'La vitesse à laquelle le son d’un objet frappé s’éteint (son amortissement) a été étudiée comme indice de la matière entendue, sur des sons synthétisés [[klatzky2000]] [[mcadams2004]] et sur
    des sons enregistrés [[giordano_mcadams2006]]. La combinaison de McAdams et al. (2004) [[mcadams2004]] est proposée comme corrélat de l’amortissement perçu : c’est une mesure associée proche. Le paramètre
    d’amortissement de Klatzky et al. [[klatzky2000]], proposé comme propriété de la matière, et la pente de décroissance de l’enveloppe d’énergie [[peeters2011]], un descripteur calculé, sont des mesures
    indirectes. Ces mesures se calculent sur un enregistrement : la réverbération de la salle s’y ajoute, le bruit de fond et la fin du fichier en fixent la fin, et elles ne saisissent ni la distance d’écoute
    ni l’auditeur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: klatzky2000
    nom: vitesse de décroissance (amortissement)
    grandeur: vitesse à laquelle l’amplitude du son décroît après le choc, selon la fréquence
    unite_ou_echelle: 'paramètre d’amortissement τd, sans unité, pris en logarithme : le temps qu’une composante met pour tomber à 1/e de son amplitude vaut τd divisé par sa fréquence'
    references:
    - klatzky2000
    - giordano_mcadams2006
    proximite: indirecte
    ecart: paramètre du modèle de synthèse, proposé par les auteurs comme propriété de la matière indépendante de la forme, pas comme mesure de la durée perçue ; étudié sur des sons synthétisés de barres
      fixées frappées, joués 500 ms puis coupés sans fondu (Klatzky et al. 2000) ; les valeurs critiques de τd trouvées pour classer un son parmi caoutchouc, bois, verre et acier valent pour ce modèle,
      pas comme bornes ; selon les auteurs, l’amortissement y variait sur une plage plus large que la fréquence ; sur des plaques réelles frappées, une mesure de l’amortissement explique les grandes catégories
      de matière, mais la durée du signal les explique aussi bien (Giordano et McAdams 2006) ; se calcule sur un enregistrement où la réverbération de la salle s’ajoute ; ne saisit ni la distance d’écoute
      ni l’auditeur
    conditions: enregistrement du son après un geste bref ; analyse par composante ou par bande de fréquence
    statut_lecture: 'extraits (Klatzky et al. 2000 : méthode, analyses, discussion, version des auteurs à l’université de Colombie-Britannique ; Giordano et McAdams 2006 : méthode, descripteurs, conclusions,
      copie de l’auteur) ; résumés sur Crossref et PubMed'
  - id: mcadams2004
    nom: constante de décroissance de fin de son, avec le centre de gravité spectral
    grandeur: pente de la chute de l’enveloppe d’amplitude sur une fenêtre de 100 ms à la fin du son, combinée au centre de gravité spectral
    unite_ou_echelle: logarithme d’une constante de décroissance (par seconde) ; centre de gravité spectral (une fréquence)
    references:
    - mcadams2004
    proximite: proche
    ecart: 'trouvée sur des sons synthétisés de barres frappées, avec un tube résonateur, d’au plus 1 s (certains coupés à 1 s) : selon les auteurs, cette combinaison est un candidat raisonnable pour porter
      l’amortissement perçu (92 à 98 % de la variance des coordonnées perceptives) ; elle mêle le temps et le spectre ; la fenêtre de calcul est réglée par les auteurs ; se calcule sur un enregistrement
      où la réverbération de la salle s’ajoute ; ne saisit ni la distance d’écoute ni l’auditeur'
    conditions: enregistrement du son après un geste bref ; enveloppe d’amplitude et fenêtre de calcul déclarées
    statut_lecture: 'extraits (McAdams et al. 2004 : descripteurs et discussion, copie mise en ligne par le laboratoire de l’auteur, université McGill) ; résumé sur Crossref'
  - id: peeters2011
    nom: pente de décroissance de l’enveloppe d’énergie
    grandeur: vitesse à laquelle l’énergie du son décroît depuis son maximum, selon un modèle exponentiel
    unite_ou_echelle: coefficient de la décroissance exponentielle (pente du logarithme de l’énergie, par seconde)
    references:
    - peeters2011
    proximite: indirecte
    ecart: descripteur calculé, que la partie lue ne relie à aucun jugement d’écoute ; selon les auteurs, il sépare les sons non entretenus (sons frappés, pizzicato) des sons entretenus ; un seul modèle
      exponentiel depuis le maximum, alors que l’enveloppe d’un son frappé peut avoir deux pentes (McAdams et al. 2004) ; se calcule sur un enregistrement où la réverbération de la salle s’ajoute ; ne saisit
      ni la distance d’écoute ni l’auditeur
    conditions: enregistrement du son ; enveloppe d’énergie calculée depuis son maximum
    statut_lecture: extraits (section sur l’enveloppe d’énergie, Peeters et al. 2011) ; résumé sur le dépôt de l’université McGill
  non_retenues:
  - nom: durée effective (temps passé au-dessus de 40 % du maximum de l’enveloppe d’énergie)
    references:
    - peeters2011
    raison: 'selon les auteurs, elle vise la durée perçue et dépend de la durée de l’événement : elle mêle la durée du geste et la résonance ; le seuil de 40 % est un réglage des auteurs, pas une borne
      entre régions'
    statut_lecture: extraits (Peeters et al. 2011, même section)
  - nom: durées équivalentes (temps passé à moins de 3 ou 10 dB du maximum)
    references:
    - mcadams2004
    - mcadams1995
    raison: 'elles ne regardent que le début de la chute, pas la résonance qui suit ; chez McAdams et al. (1995), la durée à moins de 3 dB du maximum suit une dimension qui, selon les auteurs, sépare les
      sons excités par une impulsion des sons entretenus : elle dit si le son est impulsif, pas comment il s’éteint'
    statut_lecture: extraits (McAdams et al. 2004) ; texte lu en entier (McAdams et al. 1995)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
note_conditions: 'un geste bref déclaré (facette `production` : en général `impact` ; `deformation` pour une corde pincée ; `operation` pour un appareil qu’on déclenche) ; une salle très réverbérante allonge
  la résonance : la noter dans l’épisode (spec §9.7 H, règle 9). Le niveau d’écoute est réglé une fois, puis laissé fixe : la fin d’une résonance faible s’entend plus ou moins longtemps selon le niveau.
  La fin de l’enregistrement compte : un fichier coupé ou fondu avant que le son se taise raccourcit la résonance, et un bruit de fond en masque la fin (Giordano et McAdams (2006) mesurent la durée d’un
  son jusqu’au niveau du bruit de fond) [[giordano_mcadams2006]] ; l’épisode dit si le son se tait avant la fin du fichier. Sur des sons très brefs (10 à 200 ms), un son qui s’éteint paraît plus court qu’un
  son qui monte (Schlauch et al., 2001, résumé) [[schlauch2001]]. Piège : pour un son frappé suivi d’une résonance, l’oreille juge la raideur de l’attaque plus par la façon dont le son s’éteint que par
  la façon dont il apparaît (Chion, 1983, art. 97) [[chion1983]] : on s’efforce de juger la résonance à part de l’attaque.'
porteur: un son produit par un geste bref sur un objet ou un appareil (un coup, un pincement, un déclenchement), dont on écoute la fin (facette `production`)
arité: 1
condition_NA: 'son entretenu, qui dure tant qu’on l’alimente (une machine en marche, un souffle, une voix) : quand l’apport d’énergie cesse, sa fin n’est pas une résonance de l’objet. Chion (1983, art.
  61) range parmi les entretiens actifs les sons prolongés par un apport d’énergie renouvelé (un instrument à vent, un violon à l’archet) ; il n’y cite pas la voix, rangée ici par choix de relecture (2026-11-04).
  Ou objet ou appareil qui ne sonne pas sous le geste déclaré.'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `stopsAtOnce` (rang 1) vers `ringsLong` (rang 3), le son dure de plus en plus après le geste
  numerique: non
  regions:
  - cle: stopsAtOnce
    label_fr: s’éteint aussitôt
    label_en: stops at once
    rang: 1
    repere: le son s’arrête tout de suite (un coup sourd sur un coussin)
    exemplaires: []
  - cle: ringsAMoment
    label_fr: résonne un moment
    label_en: rings for a moment
    rang: 2
    repere: le son dure un peu (une cuillère contre une tasse)
    exemplaires: []
  - cle: ringsLong
    label_fr: résonne longtemps
    label_en: rings for a long time
    rang: 3
    repere: le son dure longtemps (une cloche d’église)
    exemplaires: []
note_categories: 'Trois régions, du son qui s’éteint aussitôt à celui qui résonne longtemps : c’est une position de travail de l’équipe (choix de relecture (2026-11-04)), qu’aucune source ne fixe, sans
  borne en secondes ni en décibels ; les durées données dans les épisodes sont mesurées par l’équipe sur les enregistrements et restent indicatives. Schaeffer [[schaeffer1966]], lu via Chion (art. 61) [[chion1983]],
  distingue deux sortes d’entretien « passif » : le son sans durée propre ou presque (un claquement de fouet, un wood-block) et le son que la résonance prolonge (un piano, une guitare). Cette distinction
  rejoint « s’éteint aussitôt » d’un côté, et les deux régions où le son résonne de l’autre ; elle ne sépare pas une résonance courte d’une longue. Les valeurs critiques de l’amortissement trouvées par
  Klatzky et al. (2000) [[klatzky2000]] séparent des catégories de matière sur des sons synthétisés : ce ne sont pas des bornes de régions.'
identite: Ce que fait le son après le geste, pas la façon dont il commence (attaque du son), pas la matière qu’on croit reconnaître, pas la réverbération de la salle.
