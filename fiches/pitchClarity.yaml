etat_de_l_art: 'Fastl et Zwicker (2007, ch. 5, lu en partie, p. 111-112) [[fastl_zwicker2007]] traitent la pitch strength à part de la hauteur ; Fastl et Stoll (1979) [[fastl_stoll1979]] la jugent sur une
  échelle continue (résumé lu). Schaeffer [[schaeffer1966]], lu via Chion (1983 ; sections IV et V (art. 58 à 100) lues en entier dans la traduction anglaise de Dack et North) [[chion1983]], distingue la
  masse tonique, le son cannelé (art. 91) et le son nodal. Les trois crans de PPP sont plus grossiers que l’échelle de Fastl, sans correspondance chiffrée. Détail : docs/bibliographie-par-type.md#groupe-son.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:pitchClarity a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « j’entends un son » à « pourrais-je le chanter » change la description.
transfert: objet conçu oui (un carillon, une sonnette) | tableau non (sans son) | cuisine oui (le sifflet d’une bouilloire, un minuteur) | high-tech oui (un bip à hauteur nette ou un bruit de souffle) |
  architecture oui (une cloche d’église, une ventilation qui souffle)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques
    (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: la netteté de la hauteur peut varier à acuité constante (deux souffles filtrés, l’un sur une note)
  statut_epistemique: non éprouvé
  epreuve: null
