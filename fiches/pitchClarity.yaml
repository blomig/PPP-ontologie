# Série 50 (2026-10-15) : fiche rédigée sans exemplaire ; séries 94 et 94 bis (2026-11-03) : sources relues, huit épisodes proposés « à réaliser » ; série 95 (2026-11-03) : relecture explicative faite (choix de relecture), fiche publiée (palier 2, épisodes à réaliser, X17).
id: ppp:pitchClarity
label_fr: netteté de la hauteur
label_en: pitch clarity
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: 'À quel point on entend une note dans un son : une note précise, qu’on pourrait chanter ; seulement une note à peu près, qu’on pourrait fredonner sans être sûr de la chanter juste ; ou aucune
  note.'
question_attentionnelle: Pourrait-on chanter ce son juste, seulement le fredonner à peu près, ou n’y a-t-il aucune note à chanter ?
contre_exemple: 'Un son aigu n’a pas pour autant une note nette : le « pschhh » d’une bombe aérosol est aigu, mais on ne peut pas le chanter (c’est l’acuité, une autre fiche). Une note fausse, qui ne tombe
  pas juste sur une gamme, peut être très nette : la justesse n’est pas la netteté.'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode de mesure robuste n’est connue pour la netteté avec laquelle on entend une note (recherche du 2026-10-16). La force de hauteur (pitch strength) se mesure en demandant à des auditeurs de donner un chiffre (estimation de grandeur), en pourcentage de celle d’un son pur [[fastl_stoll1979]] : ce sont des jugements d’auditeurs, sans référence physique ni procédure normalisée, et ils ne sont pas retenus.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: échelle de force de hauteur (pitch strength)
    references:
    - fastl_stoll1979
    raison: 'échelle de jugements d’auditeurs sans référence physique ni procédure normalisée (à la différence de la norme ASTM E544, qui compare une odeur à une gamme de concentrations d’un produit de référence, le butanol) ; elle ne dit pas si une note peut se chanter'
    statut_lecture: résumé lu (Fastl et Stoll 1979 ; relu le 2026-11-03)
  - nom: rapport harmonique sur bruit
    references: []
    raison: se calcule sur un enregistrement (part du son régulier par rapport au bruit) ; aucune source lue ne le relie à la netteté de la note entendue
    statut_lecture: aucune source lue (décisions de relecture du 2026-10-16)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
- bruit_de_fond
note_conditions: 'le bruit de fond masque la note (facette `bruit_de_fond`) ; la façon dont le son est produit compte aussi (facette `production` : un geste sur un objet, un appareil qui fonctionne, une
  voix) : le même objet ne sonne pas pareil frappé ou frotté (spec §9.7 H, règle 9). Pour un enregistrement (`presentation: recording`), ces facettes décrivent la prise de son ; l’écoute (casque ou enceintes,
  niveau réglé une fois) est notée dans l’épisode.'
porteur: un son entendu, produit par un objet, un appareil ou une voix, de la façon déclarée (facette `production`)
arité: 1
condition_NA: rien ne sonne de la façon déclarée (un objet qui ne sonne pas sous le geste déclaré).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `singable` (rang 1) vers `noPitch` (rang 3), la hauteur est de moins en moins repérable
  numerique: non
  regions:
  - cle: singable
    label_fr: une note qu’on pourrait chanter ou retrouver sur un instrument
    label_en: singable
    rang: 1
    repere: une note précise (une note de flûte)
    exemplaires: []
  - cle: approximatePitch
    label_fr: une hauteur approximative
    label_en: approximate pitch
    rang: 2
    repere: une hauteur à peu près (un coup sur une casserole)
    exemplaires: []
  - cle: noPitch
    label_fr: aucune hauteur repérable
    label_en: no pitch
    rang: 3
    repere: aucune note (un froissement de papier, un souffle)
    exemplaires: []
note_categories: 'Les trois régions sont plus grossières que l’échelle en pourcentage de Fastl et Stoll, sans correspondance chiffrée ; elles suivent le même ordre : le son pur vaut 100 % ; les autres sons
  qui ont une hauteur, de 100 à 50 % ; les bruits filtrés ou modulés, de 25 à 0 % [[fastl_stoll1979]]. Vocabulaire de Schaeffer [[schaeffer1966]], lu via Chion [[chion1983]] : `singable` correspond au son
  pur (un son électronique sans timbre ; un diapason en est proche) et au son « tonique », dont on repère la note, comme une note de piano (art. 65 et 89) ; `approximatePitch` est rapproché du son « cannelé
  », fait de notes et de blocs sans hauteur superposés, comme certains sons de tôles, de gongs ou de cloches (art. 91), sans en être l’équivalent ; `noPitch` correspond au son « nodal », un bloc compact
  où l’on ne distingue aucune hauteur précise (art. 90), et au bruit blanc.'
identite: 'À quel point on entend une note, pas la note elle-même (grave ou aiguë : c’est la hauteur perçue), pas l’acuité (un « pschhh » peut être aigu sans aucune note).'
relations: []
