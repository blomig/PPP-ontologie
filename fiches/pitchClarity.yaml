etat_de_l_art: 'Fastl et Zwicker (2007, ch. 5, lu en partie, p. 111-112) [[fastl_zwicker2007]] traitent la force de hauteur (pitch strength : à quel point un son a une hauteur) à part de la hauteur elle-même.
  Fastl et Stoll (1979) [[fastl_stoll1979]] la font estimer par des auditeurs, qui donnent un chiffre à ce qu’ils entendent (estimation de grandeur), en pourcentage du son pur : son pur 100 % (à 125, 250
  et 500 Hz) ; autres sons qui ont une hauteur, de 100 à 50 % ; bruits filtrés ou modulés, de 25 à 0 % (résumé lu). Schaeffer [[schaeffer1966]], lu via Chion (1983 ; sections IV et V (art. 58 à 100) lues
  en entier dans la traduction anglaise de Dack et North) [[chion1983]], distingue le son pur et le son tonique, dont on repère la note (art. 65), le son cannelé, fait de notes et de blocs sans hauteur
  (art. 91), et le son nodal, sans hauteur précise (art. 90). Les trois régions de PPP sont plus grossières que l’échelle de Fastl et Stoll, sans correspondance chiffrée. Détail : docs/bibliographie-par-type.md#groupe-son.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
