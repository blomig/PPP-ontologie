# Fiche de type PPP — ppp:pitchClarity — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_categories, avertissement_label.
# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:pitchClarity
label_fr: netteté de la hauteur
label_en: pitch clarity
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: À quel point on entend dans le son une note précise, qu’on pourrait chanter, ou seulement une hauteur à peu près, ou aucune.
question_attentionnelle: Pourrait-on chanter ce son, en dire seulement à peu près la hauteur, ou n’a-t-il pas de hauteur ?
contre_exemple: 'Un son aigu n’a pas pour autant une hauteur nette : un souffle sifflant est aigu sans note (acuité). La justesse d’une note, par rapport à une gamme, n’est pas la netteté de sa hauteur.'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode de mesure robuste n’est connue pour la netteté avec laquelle on entend une note (recherche du 2026-10-16). La force de hauteur (pitch strength) se mesure par des jugements sur une échelle continue [[fastl_stoll1979]] : ce sont des jugements d’auditeurs, sans référence physique ni procédure normalisée, et ils ne sont pas retenus.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: échelle de force de hauteur (pitch strength)
    references:
    - fastl_stoll1979
    raison: 'échelle de jugements d’auditeurs sans référence physique ni procédure normalisée (à la différence d’ASTM E544 pour les odeurs) ; elle ne dit pas si une note peut se chanter'
    statut_lecture: résumé lu (Fastl et Stoll 1979)
  - nom: rapport harmonique sur bruit
    references: []
    raison: se calcule sur un enregistrement ; aucune source lue ne le relie à la netteté de la note entendue
    statut_lecture: aucune source lue (décisions de relecture du 2026-10-16)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
- bruit_de_fond
note_conditions: le bruit de fond masque la hauteur (facette `bruit_de_fond`) ; le geste qui fait sonner l’objet compte (facette `production`) (spec §9.7 H, règle 9). Les crans sont plus grossiers que l’échelle
  continue de Fastl et Stoll (1979) [[fastl_stoll1979]], sans correspondance chiffrée.
porteur: le son d’un objet, sous un geste ou un fonctionnement déclaré
arité: 1
condition_NA: objet qui ne sonne pas sous le geste déclaré.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `singable` (rang 1) vers `noPitch` (rang 3), la hauteur est de moins en moins repérable
  numerique: non
  regions:
  - cle: singable
    label_fr: une note qu’on pourrait chanter ou retrouver sur un instrument
    label_en: singable
    rang: 1
    repere: une note précise (une note de flûte)
    exemplaires: []
  - cle: approximatePitch
    label_fr: une hauteur approximative
    label_en: approximate pitch
    rang: 2
    repere: une hauteur à peu près (un coup sur une casserole)
    exemplaires: []
  - cle: noPitch
    label_fr: aucune hauteur repérable
    label_en: no pitch
    rang: 3
    repere: aucune note (un froissement de papier, un souffle)
    exemplaires: []
note_categories: 'Les crans sont plus grossiers que l’échelle continue de Fastl (pitch strength), sans correspondance chiffrée. Vocabulaire de Schaeffer [[schaeffer1966]], lu via Chion : `singable` correspond
  à la masse tonique ; `approximatePitch` est rapproché du son cannelé (Chion, 1983, art. 91) [[chion1983]] sans en être l’équivalent ; `noPitch` correspond au son nodal et au bruit blanc.'
identite: À quel point on entend une hauteur, pas la hauteur elle-même (grave ou aigu), pas l’acuité (un son sifflant peut n’avoir aucune hauteur).
relations: []
ontoClean:
  rigidite: +R
  identite_propre: +I
  unite: —
  dependance: +D
