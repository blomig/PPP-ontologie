etat_de_l_art: 'La terminologie acoustique normalisée (norme américaine ANSI/ASA S1.1) [[ansi_s1_1_2013]] définit la hauteur comme ce qui range les sons sur l’échelle de la mélodie, et distingue sa position
  du grave à l’aigu (le registre) de la place de la note dans l’octave (un do reste un do, grave ou aigu) ; ce type ne retient que la première. Shepard (1964) [[shepard1964]] montre, avec des sons construits
  par ordinateur, qu’on ne peut pas toujours ranger les hauteurs sur une seule ligne. La hauteur suit surtout la fréquence fondamentale (la fréquence de base du son), même quand celle-ci manque dans le
  son [[mcdermott_oxenham2008]], et se sépare de la brillance, un aspect du timbre qui dépend de la part des aigus dans le son [[oxenham2023]] ; Fastl et Zwicker (2007, ch. 5, lu en partie) [[fastl_zwicker2007]]
  la traitent à part de la force de hauteur (à quel point un son a une note). L’échelle des mels [[stevens_volkmann_newman1937]] la mesure par des réglages d’auditeurs, mais sa version de 1940 est critiquée
  [[greenwood1997]]. Les trois régions de PPP ne correspondent à aucune bande de fréquence chiffrée. Détail : docs/bibliographie-par-type.md#groupe-son.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:perceivedPitch a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « j’entends une note » à « est-elle grave ou aiguë » change la description, sans dire quel instrument joue.
transfert: objet conçu oui (un carillon, une sonnette, un klaxon) | tableau non (sans son) | cuisine oui (le sifflet d’une bouilloire, une minuterie) | high-tech oui (un bip grave ou aigu) | architecture oui (une cloche d’église, le bourdon d’une ventilation)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales
    (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: 'on peut changer la hauteur sans changer l’acuité, et l’acuité sans changer la hauteur : une même note jouée par une flûte puis par un violon change l’acuité, pas la hauteur ; deux notes proches
    d’un même instrument changent surtout la hauteur'
  statut_epistemique: non éprouvé
  epreuve: null
