# Fiche de type PPP — ppp:perceivedPitch — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_categories, avertissement_label.
# Série 93 (2026-11-02) : fiche rédigée ; série 96 (2026-11-03) : relecture explicative faite (choix de relecture), fiche publiée (palier 2, épisodes à réaliser, X17).
id: ppp:perceivedPitch
label_fr: hauteur perçue
label_en: perceived pitch
labels_alternatifs: []
avertissement_label: 'Ici, « hauteur » veut dire la hauteur d’un son, du grave à l’aigu, et non la taille d’une chose du bas vers le haut (`ppp:perceivedSize`). Ce n’est pas non plus la note exacte, ni le fait qu’elle soit juste.'
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:pitchClarity
  facteurs_non_perceptuels: []
note_base: 'La hauteur ne se juge que si le son a une note, au moins à peu près : elle dépend donc de la netteté de la hauteur (`ppp:pitchClarity`) et ne s’applique pas quand celle-ci est « aucune hauteur
  repérable » (un froissement de papier, un souffle). Un son à hauteur approximative, comme un coup sur une casserole, se range encore du grave à l’aigu. Base vérifiée à la rédaction de la fiche (2026-11-02).'
facettes:
- son
définition: 'Si le son paraît grave ou aigu : sa place entre les sons les plus bas et les plus hauts. Ne vaut que pour un son qui a une note, qu’on pourrait chanter ou au moins fredonner.'
question_attentionnelle: Ce son est-il grave (une contrebasse, une grosse cloche), médium (une voix d’adulte qui parle normalement), ou aigu (un piccolo, une clochette) ?
contre_exemple: 'Le « pschhh » d’une bombe aérosol ou d’un jet de vapeur paraît « aigu » sans avoir de note : c’est l’acuité du son (`ppp:soundSharpness`), et ce type ne s’y applique pas. Un son plus fort
  n’est pas plus aigu : la force du son est une autre qualité. Une même note jouée par une flûte et par un violon a la même hauteur et deux timbres (le timbre est la couleur du son, ce qui fait reconnaître
  l’instrument) : un son peut être sombre et aigu, ou clair et grave.'
grandeur_physique_homonyme: 'fréquence, en hertz (Hz : nombre de vibrations par seconde), et fréquence fondamentale (F0 : la fréquence de base d’un son à note, dont ses composantes sont des multiples) :
  la hauteur en dépend surtout, sans s’y réduire [[mcdermott_oxenham2008]] ; les régions de ce type ne sont pas des bandes de fréquence.'
mesure:
  etat: methodes
  synthese: La hauteur d’un son se rapporte d’abord à sa fréquence fondamentale, qu’on peut mesurer sur un enregistrement [[mcdermott_oxenham2008]], ou nommer comme une note à partir du la du diapason, que
    la norme internationale ISO 16 fixe à 440 Hz [[iso16_1975]]. L’échelle des mels [[stevens_volkmann_newman1937]], unité de la hauteur dans la terminologie acoustique normalisée [[ansi_s1_1_2013]], vise
    la hauteur entendue elle-même, mais sa version de 1940 a été critiquée [[greenwood1997]]. Aucune de ces valeurs ne fixe les limites entre grave, médium et aigu.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: mel
    nom: échelle des mels
    grandeur: hauteur estimée par des auditeurs, qui règlent un son pour qu’il paraisse deux fois moins haut qu’un autre (fractionnement), rapportée à un son pur de référence
    unite_ou_echelle: mel (par définition, un son pur de 1000 Hz, 40 dB au-dessus du seuil d’audition de l’auditeur, vaut 1000 mels ; un son pur est un son électronique d’une seule fréquence, sans timbre)
    references:
    - ansi_s1_1_2013
    - stevens_volkmann_newman1937
    - greenwood1997
    proximite: proche
    ecart: 'vise expressément la hauteur entendue, mais a été établie sur des sons purs, avec peu d’auditeurs (cinq en 1937) ; Greenwood (1997) trouve dans des réglages de 1956 un biais d’ordre (hystérésis
      : les réglages diffèrent selon qu’on parcourt les sons en montant ou en descendant) et en conclut que l’échelle des mels de 1940 (Stevens et Volkmann) a le même biais ; une valeur en mels ne dit pas si
      un son est grave, médium ou aigu'
    conditions: sons purs, niveau fixé, écoute en laboratoire
    statut_lecture: 'résumé lu (Stevens, Volkmann et Newman 1937 ; Greenwood 1997) ; définition 11.02 lue dans la base terminologique de l’éditeur de la norme'
  - id: f0
    nom: fréquence fondamentale mesurée sur un enregistrement
    grandeur: périodicité du son (fréquence fondamentale)
    unite_ou_echelle: hertz (Hz)
    references:
    - mcdermott_oxenham2008
    - oxenham2023
    proximite: indirecte
    ecart: 'grandeur physique, pas un degré perçu : la hauteur est ce qu’on entend de la régularité du son (une vibration qui se répète), mais on entend la même hauteur quand la fondamentale manque, et la brillance
      (un aspect du timbre) varie à part ; au-dessus d’environ 4 kHz (4000 vibrations par seconde), on distingue mal les hauteurs'
    conditions: son à hauteur repérable ; enregistrement ou mesure sur place ; une seule note à la fois
    statut_lecture: 'lu en partie : McDermott et Oxenham 2008, section sur la hauteur et glossaire (manuscrit d’auteur) ; Oxenham 2023, introduction et section sur la hauteur et la brillance (accès libre)'
  - id: note_diapason
    nom: nom de la note, rapporté au diapason
    grandeur: fréquence fondamentale nommée sur la gamme musicale, à partir du la de référence
    unite_ou_echelle: 'nom de note ; la de référence à 440 Hz (ISO 16)'
    references:
    - iso16_1975
    - ansi_s1_1_2013
    proximite: indirecte
    ecart: 'une convention d’accord, pas une mesure de la hauteur entendue : il faut une oreille exercée ou un accordeur, et la note répète son nom à chaque octave (un do reste un do, grave ou aigu), alors
      que ce type ne retient que la position du grave à l’aigu [[ansi_s1_1_2013]]'
    conditions: 'son à hauteur nette (`singable` : une note qu’on pourrait chanter) ; instrument accordé'
    statut_lecture: résumé lu (page de la norme chez l’éditeur)
  non_retenues:
  - nom: échelle des bandes critiques (Bark)
    references: []
    raison: découpe les fréquences en bandes selon la finesse de l’oreille interne (bandes critiques), pas selon la hauteur entendue ; aucune source lue au-delà des métadonnées
    statut_lecture: métadonnées seules (Zwicker 1961, non cité)
  - nom: échelle des largeurs de bande rectangulaires équivalentes (ERB)
    references:
    - glasberg_moore1990
    raison: décrit la largeur des filtres de l’oreille selon la fréquence, pas la hauteur entendue
    statut_lecture: résumé lu (Glasberg et Moore 1990)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
- bruit_de_fond
note_conditions: 'la façon dont le son est produit compte (facette `production` : un geste sur un objet, un appareil qui fonctionne, une voix) ; le bruit de fond masque la note (facette `bruit_de_fond`)
  (spec §9.7 H, règle 9). Pour un enregistrement (`presentation: recording`), ces facettes décrivent la prise de son ; l’écoute se déclare dans la note : casque ou enceintes, jamais le haut-parleur d’un
  téléphone, car beaucoup de petits appareils ne rendent pas les sons graves [[mcdermott_oxenham2008]] ; on entend souvent encore la même note, mais une note très grave peut presque disparaître (choix de
  relecture (2026-11-03)) ; niveau réglé une fois, puis non modifié, pour qu’un son plus fort ne passe pas pour plus aigu.'
porteur: un son entendu, produit par un objet, un appareil ou une voix, de la façon déclarée (facette `production`)
arité: 1
condition_NA: 'rien ne sonne de la façon déclarée (un objet qui ne sonne pas sous le geste déclaré) ; son sans hauteur repérable (`ppp:pitchClarity` en `noPitch` : un froissement de papier, un souffle).'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `low` (rang 1) vers `high` (rang 3), le son paraît de plus en plus aigu
  numerique: non
  regions:
  - cle: low
    label_fr: grave
    label_en: low
    rang: 1
    repere: plus bas qu’une voix d’adulte qui parle normalement (une contrebasse, une grosse cloche)
    exemplaires: []
  - cle: mid
    label_fr: médium
    label_en: mid
    rang: 2
    repere: à peu près à la hauteur d’une voix d’adulte qui parle normalement
    exemplaires: []
  - cle: high
    label_fr: aigu
    label_en: high
    rang: 3
    repere: bien au-dessus d’une voix d’adulte qui parle normalement (un piccolo, une clochette)
    exemplaires: []
note_categories: 'Trois régions, du grave à l’aigu : les repères sont des sons qu’on connaît (une voix d’adulte qui parle normalement, des instruments), pas des fréquences. Aucune source lue ne fixe de
  limite perçue entre grave, médium et aigu : les fréquences données dans les épisodes sont mesurées par l’équipe et restent indicatives, non vérifiées comme bornes. La terminologie acoustique normalisée
  (norme américaine ANSI/ASA S1.1) [[ansi_s1_1_2013]] distingue la hauteur sur une échelle du grave à l’aigu (« pitch height », aussi appelée registre) et la place de la note dans l’octave (un do reste
  un do, grave ou aigu) ; ce type ne retient que la première. Shepard (1964) [[shepard1964]] a construit par ordinateur des sons dont chacun paraît plus aigu que le précédent, alors que la série revient
  à son point de départ : on ne peut donc pas toujours ranger les hauteurs sur une seule ligne.'
identite: Où le son se place du grave à l’aigu ; pas la netteté de cette hauteur (`ppp:pitchClarity`), pas l’acuité du son (clair ou sombre ; `ppp:soundSharpness`, le timbre), pas la force du son, pas la
  note exacte ni sa justesse.
relations:
- type: confusableWith
  cible: ppp:soundSharpness
  note: 'on dit aussi « aigu » d’un son clair, presque sifflant (un « pschhh »), même sans note : c’est l’acuité. Un son qui a une note nette peut être grave et clair, ou aigu et sombre (réciproque écrite
    aussi dans soundSharpness).'
