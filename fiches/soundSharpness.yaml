etat_de_l_art: 'DIN 45692 [[din45692]] décrit l’acuité (Schärfe) comme l’aspect de la perception du timbre lié à la répartition en fréquence de l’enveloppe spectrale (extrait d’index) ; Grey (1977) [[grey1977]]
  et McAdams et al. (1995) [[mcadams1995]] retrouvent une dimension du timbre de cet ordre (résumés lus). Le lien que fait la norme entre acuité et gêne est un jugement, écarté (§0.4). Aucune source trouvée
  ne fixe des régions perçues. Détail : docs/bibliographie-par-type.md#groupe-son.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
