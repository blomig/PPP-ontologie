etat_de_l_art: 'Sources : DIN 45692 [[din45692]] calcule l’acuité (Schärfe) sur le motif de sonie, et la page de l’éditeur la lie à la répartition en fréquence de l’enveloppe spectrale ; l’unité, l’acum,
  est rapportée par Marui et Martens (2006) [[marui_martens2006]] d’après Zwicker et Fastl [[fastl_zwicker2007]]. Selon Kazazis et al. (2021) [[kazazis2021]], von Bismarck (1974, non lu) [[vonbismarck1974]]
  trouve que l’acuité perçue suit le centroïde spectral plutôt que la forme globale du spectre ; Grey (1977, résumé lu) [[grey1977]] et McAdams et al. (1995) [[mcadams1995]] retrouvent une dimension du
  timbre de cet ordre. Sur des sons d’instruments, la brillance jugée suit le centroïde, et une fondamentale plus haute la monte (Schubert et Wolfe, 2006 [[schubert_wolfe2006]] ; Marozeau et de Cheveigné,
  2007, résumé lu [[marozeau_decheveigne2007]]) ; le centroïde se calcule trame par trame selon Peeters et al. (2011) [[peeters2011]]. Schaeffer [[schaeffer1966]], lu via Chion (1983, art. 93) [[chion1983]],
  décrit un timbre plus sombre ou plus clair, sans étalon ; le lien que fait la norme entre acuité et gêne est un jugement, écarté (§0.4). Aucune source trouvée ne fixe des régions perçues ni des bornes
  entre elles (détail : docs/bibliographie-par-type.md#groupe-son).'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:soundSharpness a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « ce son est aigu » à « est-il clair ou sombre, quelle que soit sa hauteur » change la description.
transfert: objet conçu oui (le souffle d’un sèche-cheveux, un tissu froissé) | tableau non (sans son) | cuisine oui (une poêle qui grésille, une hotte) | high-tech oui (le souffle d’un ventilateur d’ordinateur)
  | architecture oui (une ventilation, un courant d’air sous une porte)
