episodes_a_realiser:
- id: ppp-a:ep-soundSharpness-01
  realisation: a_realiser
  region_attendue: dark
  rang_exemplaire: principal
  objet: enregistrement d’un bruit brun (bruit généré, plus fort dans les graves), stéréo, 10 s, page « BROWN_NOISE-10s.wav », par newagesoup, sur Freesound (https://freesound.org/people/newagesoup/sounds/349314/),
    licence CC0, page vérifiée le 2026-11-05
  objet_en: recording of brown noise (generated noise, stronger in the low frequencies), stereo, 10 s, page “BROWN_NOISE-10s.wav”, by newagesoup, on Freesound (https://freesound.org/people/newagesoup/sounds/349314/),
    CC0 licence, page checked on 2026-11-05
  preparation: comme l’épisode 03 ; même niveau d’écoute ; écouter l’enregistrement en entier, deux ou trois fois, et juger le son, pas sa hauteur ni sa force
  preparation_en: as in episode 03; same listening level; listen to the whole recording, two or three times, and judge the sound, not its pitch or its loudness
  consigne: Le son paraît-il sombre (comme à travers une porte ou un coussin), ni sombre ni clair (le souffle régulier d’un ventilateur), ou clair (comme un s prolongé, un jet de vapeur) ?
  consigne_en: Does the sound seem dark (as if through a door or a cushion), neither dark nor bright (the steady whoosh of a fan), or bright (like a drawn-out s, a jet of steam)?
  conditions:
    presentation: recording
    distance: unknown
    production: unknown
    bruit_de_fond: quiet
    duree: exam
    note: 'bruit généré par un logiciel nommé sur la page, sans geste : production notée `unknown` (à relire) ; casque fermé ou enceintes, pièce calme ; écoute complète de 10 s'
    note_en: 'noise generated by software named on the page, with no gesture: production recorded as `unknown` (to be reviewed); closed headphones or loudspeakers, quiet room; full listening of 10 s'
  doute: oui
  motif_doute: '« brun » vient du titre et de la page ; le centroïde d’amplitude (vers 2 570 Hz) est plus haut que celui de la voix « o » de l’épisode 02 (vers 600 Hz), alors que le centroïde de puissance
    tombe vers 180 Hz : le rangement par centroïde d’amplitude ne place donc pas ce bruit sous la voix, et bruits et voix ne se comparent pas avec cette mesure ; enregistré environ 5 dB plus fort que le
    bruit rose de l’épisode 03 (valeur efficace de l’aperçu) : à niveau d’écoute fixe, il s’entend plus fort ; les deux canaux sont presque indépendants (la page parle d’un délai négligeable)'
  motif_doute_en: '“brown” comes from the title and the page; the amplitude centroid (around 2,570 Hz) is higher than that of the “o” voice in episode 02 (around 600 Hz), whereas the power centroid falls
    to around 180 Hz: ranking by amplitude centroid therefore does not place this noise below the voice, and noises and voices do not compare with this measure; recorded about 5 dB louder than the pink
    noise of episode 03 (RMS value of the preview): at a fixed listening level, it is heard louder; the two channels are almost independent (the page mentions a negligible delay)'
  note: 'centroïde médian vers 2 570 Hz (écart interquartile de 2 230 à 3 030 Hz), sur tout le fichier, de 0 à 10 s ; sur le spectre de puissance, il tombe vers 180 Hz : le choix amplitude ou puissance
    pèse beaucoup pour ce bruit (mesure de l’équipe sur l’aperçu MP3, canal gauche s’il y en a deux : centroïde spectral d’amplitude selon Peeters et al. (2011), trames de Hann de 60 ms tous les 15 ms,
    bande de 20 Hz à 16 kHz, trames à moins de 30 dB de la plus forte, spectre du bruit de fond soustrait ; médiane et écart interquartile ; indicative ; acuité en acum non calculée (niveau d’écoute non
    étalonné, norme non lue))'
  note_en: 'median centroid around 2,570 Hz (interquartile range from 2,230 to 3,030 Hz), over the whole file, from 0 to 10 s; on the power spectrum, it falls to around 180 Hz: the choice of amplitude or
    power weighs heavily for this noise (team measurement on the MP3 preview, left channel when there are two: amplitude spectral centroid following Peeters et al. (2011), 60 ms Hann frames every 15 ms,
    band from 20 Hz to 16 kHz, frames within 30 dB of the loudest, background-noise spectrum subtracted; median and interquartile range; indicative; sharpness in acum not computed (listening level not calibrated,
    standard not read))'
  texte_fr: 'Un bruit brun, grave et sourd : sombre (prédiction, à éprouver).'
  texte_en: 'A brown noise, low and dull: dark (prediction, to be tested).'
