# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:soundSharpness
label_fr: acuité du son
label_en: sharpness
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: À quel point le son paraît sifflant ou, au contraire, étouffé, indépendamment de sa force et de sa hauteur.
question_attentionnelle: Le son paraît-il étouffé, comme à travers une porte, ou chuintant, comme un s qu’on prolonge ?
contre_exemple: Une note de piccolo est aiguë (hauteur) sans être sifflante ; un souffle sans hauteur peut être sifflant. Hauteur et acuité sont deux qualités.
grandeur_physique_homonyme: 'acum (DIN 45692) et centroïde spectral : aucune région ne s’en déduit. Homonyme de domaine : l’acuité auditive, finesse de l’ouïe d’une personne, mesurée en audiométrie.'
avertissement_label: '« Acuité du son » ne dit rien de l’ouïe de l’auditeur (acuité auditive). « Brillance » et « clarté » sont écartés comme labels : ils sont déjà pris par la vue (`ppp:surfaceGloss`,
  `ppp:lightness`). « Sifflant » se dit comme un s prolongé, pas un sifflet, qui a une hauteur nette (netteté de la hauteur) ; il ne dit rien de l’agrément.'
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- presentation
- production
note_conditions: aucun obstacle (porte, paroi, tissu) entre l’objet et l’oreille, ou bien il est noté ; pour un enregistrement, la facette `presentation` vaut `recording`, admise seulement avec un casque
  ou des enceintes déclarés (un petit haut-parleur coupe les aigus et les graves) ; la restitution est notée dans l’épisode (spec §9.7 H, règle 9) ; le geste qui fait sonner l’objet compte (facette `production`).
porteur: le son d’un objet, sous un geste ou un fonctionnement déclaré
arité: 1
condition_NA: objet qui ne sonne pas sous le geste déclaré.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `muffled` (rang 1) vers `hissing` (rang 3), le son paraît de plus en plus sifflant
  numerique: non
  regions:
  - cle: muffled
    label_fr: étouffé
    label_en: muffled
    rang: 1
    repere: comme entendu à travers une porte ou un coussin
    exemplaires: []
  - cle: neitherMuffledNorHissing
    label_fr: ni étouffé ni sifflant
    label_en: neither muffled nor hissing
    rang: 2
    repere: ni étouffé ni sifflant (une voix parlée, de près)
    exemplaires: []
  - cle: hissing
    label_fr: sifflant
    label_en: hissing
    rang: 3
    repere: comme un s prolongé, pas un sifflet (un jet de vapeur)
    exemplaires: []
identite: À quel point le son paraît sifflant ou étouffé, pas sa hauteur (un souffle sans hauteur peut être sifflant), pas sa force, pas l’agrément.
relations: []
