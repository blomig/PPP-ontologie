# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:soundSharpness
label_fr: acuité du son
label_en: sharpness
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: À quel point le son paraît sifflant ou, au contraire, étouffé, indépendamment de sa force et de sa hauteur.
question_attentionnelle: Le son paraît-il étouffé, comme à travers une porte, ou chuintant, comme un s qu’on prolonge ?
contre_exemple: Une note de piccolo est aiguë (hauteur) sans être sifflante ; un souffle sans hauteur peut être sifflant. Hauteur et acuité sont deux qualités.
grandeur_physique_homonyme: 'Homonyme de domaine : l’acuité auditive, finesse de l’ouïe d’une personne, mesurée en audiométrie : aucune région ne s’en déduit. L’acum (DIN 45692) et le centroïde spectral relèvent de la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'DIN 45692 fixe un calcul de l’acuité (Schärfe) d’un son, en acum, à partir de la répartition en fréquence de son enveloppe spectrale [[din45692]] : c’est une mesure associée proche. Le centroïde
    spectral, corrélat d’une dimension du timbre [[mcadams1995]], est une mesure associée indirecte. Toutes deux se calculent sur un enregistrement et ne saisissent ni la salle, ni la distance d’écoute,
    ni l’auditeur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: din45692
    nom: acuité calculée (acum, DIN 45692)
    grandeur: 'centre de gravité, sur l’échelle des bandes critiques (Tonheit), d’une répartition pondérée de l’intensité perçue du son selon la fréquence (calcul fixé par DIN 45692, à partir de DIN 45631)'
    unite_ou_echelle: acum
    references:
    - din45692
    proximite: proche
    ecart: 'calculée à partir d’un modèle de sonie (DIN 45631), pas sur l’auditeur ; vise l’aspect du timbre lié à l’enveloppe spectrale ; la page de l’éditeur précise que la structure spectrale fine et l’enveloppe temporelle produisent des différences de timbre que ce calcul ne saisit pas ; se calcule sur un enregistrement : ne saisit ni la salle, ni la distance d’écoute'
    conditions: enregistrement étalonné du son ; système de mesure conforme aux essais de la norme
    statut_lecture: résumé de l’éditeur lu (page DIN Media) ; norme non lue
  - id: mcadams1995
    nom: centroïde spectral
    grandeur: fréquence moyenne du spectre, pondérée par l’amplitude
    unite_ou_echelle: hertz
    references:
    - mcadams1995
    - grey1977
    proximite: indirecte
    ecart: 'corrélat d’une dimension du timbre trouvée sur des sons d’instruments synthétisés (McAdams et al. 1995 ; répartition de l’énergie spectrale chez Grey 1977) ; ne tient pas compte de la sensibilité
      de l’oreille selon la fréquence ; se calcule sur un enregistrement : ne saisit ni la salle, ni la distance d’écoute, ni l’auditeur'
    conditions: enregistrement du son ; analyse spectrale déclarée
    statut_lecture: résumé lu (McAdams et al. 1995, PubMed ; Grey 1977, OpenAlex)
avertissement_label: '« Acuité du son » ne dit rien de l’ouïe de l’auditeur (acuité auditive). « Brillance » et « clarté » sont écartés comme labels : ils sont déjà pris par la vue (`ppp:surfaceGloss`,
  `ppp:lightness`). « Sifflant » se dit comme un s prolongé, pas un sifflet, qui a une hauteur nette (netteté de la hauteur) ; il ne dit rien de l’agrément.'
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- presentation
- production
note_conditions: aucun obstacle (porte, paroi, tissu) entre l’objet et l’oreille, ou bien il est noté ; pour un enregistrement, la facette `presentation` vaut `recording`, admise seulement avec un casque
  ou des enceintes déclarés (un petit haut-parleur coupe les aigus et les graves) ; la restitution est notée dans l’épisode (spec §9.7 H, règle 9) ; le geste qui fait sonner l’objet compte (facette `production`).
porteur: le son d’un objet, sous un geste ou un fonctionnement déclaré
arité: 1
condition_NA: objet qui ne sonne pas sous le geste déclaré.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `muffled` (rang 1) vers `hissing` (rang 3), le son paraît de plus en plus sifflant
  numerique: non
  regions:
  - cle: muffled
    label_fr: étouffé
    label_en: muffled
    rang: 1
    repere: comme entendu à travers une porte ou un coussin
    exemplaires: []
  - cle: neitherMuffledNorHissing
    label_fr: ni étouffé ni sifflant
    label_en: neither muffled nor hissing
    rang: 2
    repere: ni étouffé ni sifflant (une voix parlée, de près)
    exemplaires: []
  - cle: hissing
    label_fr: sifflant
    label_en: hissing
    rang: 3
    repere: comme un s prolongé, pas un sifflet (un jet de vapeur)
    exemplaires: []
identite: À quel point le son paraît sifflant ou étouffé, pas sa hauteur (un souffle sans hauteur peut être sifflant), pas sa force, pas l’agrément.
relations: []
