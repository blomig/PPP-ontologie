# Fiche de type PPP — ppp:soundSharpness — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_categories, avertissement_label.
# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
# Série 99 (2026-11-05) : sources lues et mesures complétées, porteur élargi à l’appareil et à la voix, épisodes proposés « à réaliser » ; relecture explicative à faire.
# Série 99 bis (2026-11-05) : relecture appliquée ; label anglais « sound sharpness », « brillance » en alternatif ; régions « sombre / ni sombre ni clair / clair » ; réciproque confusableWith vers perceivedPitch ; relecture explicative à faire.
id: ppp:soundSharpness
label_fr: acuité du son
label_en: sound sharpness
labels_alternatifs:
- brillance
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: Un son peut paraître sombre, comme entendu à travers une porte, ou clair, comme un s qu’on prolonge. On décrit cette qualité sans regarder si le son est fort ou faible, ni s’il a une note haute
  ou basse.
question_attentionnelle: Le son paraît-il sombre, comme à travers une porte ; ni sombre ni clair ; ou clair, comme un s qu’on prolonge ?
contre_exemple: 'Un son qui a une note nette, qu’on pourrait chanter, n’est pas pour autant clair au sens de cette fiche : la netteté relève de la netteté de la hauteur ; un souffle sans note peut être
  clair. Hauteur et acuité sont deux qualités, mais une note plus aiguë paraît en général plus claire (Schubert et Wolfe, 2006 ; Marozeau et de Cheveigné, 2007, résumé lu) : on compare des sons de hauteur
  voisine, ou l’on note la hauteur.'
grandeur_physique_homonyme: 'Homonyme de domaine : l’acuité auditive, finesse de l’ouïe d’une personne, mesurée en audiométrie : aucune région ne s’en déduit. L’acuité calculée (DIN 45692, en acum) et le
  centroïde spectral relèvent de la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'DIN 45692 fixe un calcul de l’acuité (Schärfe) d’un son à partir de son motif de sonie [[din45692]] : c’est une mesure associée proche ; son unité, l’acum, vaut 1 pour un bruit large d’une
    bande critique, centré sur 1 kHz, à 60 dB (Zwicker et Fastl, d’après Marui et Martens, 2006) [[fastl_zwicker2007]] [[marui_martens2006]]. Le centroïde spectral, corrélat d’une dimension du timbre [[grey1977]]
    [[mcadams1995]] et de la brillance jugée [[schubert_wolfe2006]], est une mesure associée indirecte. Toutes deux se calculent sur un enregistrement et ne saisissent ni la salle, ni la distance d’écoute,
    ni l’auditeur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: din45692
    nom: acuité calculée (DIN 45692)
    grandeur: premier moment, sur l’échelle des bandes critiques (Tonheit), du motif de sonie de DIN 45631, pondéré par une fonction de poids (d’après la page de l’éditeur)
    unite_ou_echelle: acum (unité décrite par Zwicker et Fastl, d’après Marui et Martens 2006 ; la page de l’éditeur de la norme ne la nomme pas)
    references:
    - din45692
    - fastl_zwicker2007
    - marui_martens2006
    proximite: proche
    ecart: 'calculée à partir d’un modèle de sonie (DIN 45631), donc du niveau du son, pas sur l’auditeur ; selon la page de l’éditeur, la structure spectrale fine et l’enveloppe temporelle produisent des
      différences de timbre que ce calcul ne saisit pas ; selon Marui et Martens (2006), une prédiction par le seul premier moment pondéré convient moins bien aux sons à large bande dont l’enveloppe spectrale
      varie ; se calcule sur un enregistrement étalonné : ne saisit ni la salle, ni la distance d’écoute'
    conditions: enregistrement étalonné du son ; système de mesure conforme aux essais de la norme
    statut_lecture: 'page de l’éditeur lue (DIN Media, 2026-11-05) ; norme non lue ; unité et formule lues dans Marui et Martens (2006, introduction, copie de l’auteur), qui citent Zwicker et Fastl ; chapitre
      de Fastl et Zwicker : résumé de l’éditeur seulement'
  - id: mcadams1995
    nom: centroïde spectral
    grandeur: 'fréquence moyenne du spectre, pondérée par l’amplitude (premier moment du spectre normalisé, calculé trame par trame : Peeters et al. 2011)'
    unite_ou_echelle: hertz
    references:
    - mcadams1995
    - grey1977
    - schubert_wolfe2006
    - peeters2011
    - marozeau_decheveigne2007
    proximite: indirecte
    ecart: 'corrélat d’une dimension du timbre trouvée sur des sons d’instruments synthétisés, égalisés en hauteur, sonie et durée (McAdams et al. 1995 : 88 % de la variance de cette dimension ; répartition
      de l’énergie spectrale chez Grey 1977) ; sur des sons d’instruments, la brillance jugée suit le centroïde (r = 0,51), pas le centroïde rapporté à la fondamentale (Schubert et Wolfe 2006) ; il monte
      avec la hauteur, qui déplace aussi la brillance jugée (Marozeau et de Cheveigné 2007, résumé) ; ne tient pas compte de la sensibilité de l’oreille selon la fréquence ; le bruit de fond, la bande analysée
      et le choix amplitude ou puissance le déplacent ; se calcule sur un enregistrement : ne saisit ni la salle, ni la distance d’écoute, ni l’auditeur'
    conditions: enregistrement du son ; analyse spectrale déclarée (fenêtre, bande de fréquences, amplitude ou puissance)
    statut_lecture: textes lus en entier (McAdams et al. 1995 ; Schubert et Wolfe 2006, copie des auteurs) ; extraits (Peeters et al. 2011) ; résumés (Grey 1977 ; Marozeau et de Cheveigné 2007)
  non_retenues:
  - nom: centroïde rapporté à la fondamentale
    references:
    - schubert_wolfe2006
    raison: sur les sons d’instruments de Schubert et Wolfe (2006), la brillance jugée ne le suit pas (r = 0,03), alors qu’elle suit le centroïde lui-même
    statut_lecture: texte lu en entier (Schubert et Wolfe 2006, copie des auteurs)
avertissement_label: '« Acuité du son » ne dit rien de l’ouïe de l’auditeur (acuité auditive), ni de la hauteur (un son aigu). « Brillance », label alternatif, se dit ici d’un son clair ; la vue l’emploie
  déjà (`ppp:surfaceGloss`, brillance de surface) : sur cette fiche, il s’agit toujours du son. « Clarté » est écarté comme label (`ppp:lightness`). Les régions « sombre » et « clair » décrivent le son,
  pas la lumière ; « clair » ne veut pas dire « net » (netteté de la hauteur) ; aucune ne dit rien de l’agrément.'
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- presentation
- production
note_conditions: 'aucun obstacle (porte, paroi, tissu) entre la source et l’oreille, ou bien il est noté ; pour un enregistrement, la facette `presentation` vaut `recording`, admise seulement avec un casque
  ou des enceintes déclarés (un petit haut-parleur coupe les aigus et les graves) ; la restitution est notée dans l’épisode (spec §9.7 H, règle 9) ; le geste ou le fonctionnement qui fait sonner la source
  compte (facette `production`). Le niveau d’écoute est réglé une fois, puis laissé fixe pour tous les sons comparés : l’acuité calculée part du motif de sonie [[din45692]], donc du niveau, même si Schubert
  et Wolfe (2006) n’observent pas d’effet net de la sonie sur leurs sons [[schubert_wolfe2006]]. Piège : la hauteur déplace l’acuité jugée, une note plus aiguë paraissant plus claire [[schubert_wolfe2006]]
  [[marozeau_decheveigne2007]] ; on compare des sons de hauteur voisine, ou l’on note la hauteur.'
porteur: le son d’un objet, d’un appareil ou d’une voix, sous un geste, un fonctionnement ou une émission déclarés
arité: 1
condition_NA: 'objet, appareil ou voix qui ne sonne pas sous le geste, le fonctionnement ou l’émission déclarés. La voix est admise par choix de relecture (2026-11-05) : Schubert et Wolfe (2006) jugent
  une voyelle « i » (anglais « ee ») plus brillante qu’un « ou » (anglais « oo »), et Schaeffer, lu via Chion (1983, art. 93), décrit un timbre plus sombre ou plus clair, « avec un entraînement approprié
  ».'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `dark` (rang 1) vers `bright` (rang 3), le son paraît de plus en plus clair
  numerique: non
  regions:
  - cle: dark
    label_fr: sombre
    label_en: dark
    rang: 1
    repere: comme entendu à travers une porte ou un coussin
    exemplaires: []
  - cle: neitherDarkNorBright
    label_fr: ni sombre ni clair
    label_en: neither dark nor bright
    rang: 2
    repere: ni sombre ni clair (le souffle régulier d’un ventilateur)
    exemplaires: []
  - cle: bright
    label_fr: clair
    label_en: bright
    rang: 3
    repere: comme un s prolongé, pas un sifflet (un jet de vapeur)
    exemplaires: []
note_categories: 'Trois régions, du son sombre au son clair : c’est une position de travail de l’équipe (choix de relecture (2026-11-05)), qu’aucune source ne fixe, sans borne en hertz ni en acum ; les
  centroïdes donnés dans les épisodes sont mesurés par l’équipe sur les enregistrements et restent indicatifs. L’acum fixe un point de référence (1 acum) [[marui_martens2006]], pas des régions. Schaeffer
  [[schaeffer1966]], lu via Chion (art. 93) [[chion1983]], décrit un « site » du timbre harmonique allant du sombre au clair, perçu « avec un entraînement approprié », sans étalon : « il n’y a pas d’étalon
  » pour ces perceptions, et l’auteur reste « très prudent » ; il tient le bruit blanc pour sans timbre harmonique, et ne juge un bruit filtré qu’en « épaisseur » et en « couleur » (art. 92). Les régions
  de cette fiche couvrent aussi les bruits : elles ne reprennent pas cette échelle. Les noms des régions reprennent le site sombre-clair de Schaeffer, lu via Chion (choix de relecture (2026-11-05)), sans
  en reprendre l’échelle ; mots proches : « étouffé » pour sombre, « sifflant » pour clair. « Clair » ne veut pas dire « net » : la netteté d’une note relève de la netteté de la hauteur (`ppp:pitchClarity`).'
identite: À quel point le son paraît clair ou sombre, pas sa hauteur (hauteur perçue), pas sa netteté (netteté de la hauteur), pas sa force, pas l’agrément.
relations:
- type: confusableWith
  cible: ppp:perceivedPitch
  note: 'on dit aussi « aigu » d’un son clair, presque sifflant (un « pschhh »), même sans note : c’est l’acuité du son, pas la hauteur. Un son qui a une note nette peut être grave et clair, ou aigu et
    sombre (réciproque écrite aussi dans perceivedPitch).'
