facettes:
- gout
définition: 'La force de la saveur amère qu’on perçoit en goûtant une portion du produit, nez pincé ou libre selon la facette `nez`, à la température déclarée : une saveur de la langue, et non l’astringence
  ni l’arôme.'
question_attentionnelle: En bouche, est-ce amer ? À peine, nettement, ou fortement ?
contre_exemple: 'Un vin rouge jeune peut assécher la bouche sans être amer : c’est l’astringence, un toucher, pas une saveur. Une odeur de café brûlé n’est pas l’amer : nez pincé, elle disparaît, l’amer
  reste. Le sens figuré du mot (« une remarque amère ») ne s’applique pas. « Ce café est nettement amer, et c’est un défaut » se dit comme « …et c’est une qualité » : l’amer est recherché dans le café,
  le chocolat noir ou l’eau tonique.'
grandeur_physique_homonyme: 'l’« amertume » des brasseurs, en unités d’amertume (BU), est une teneur en iso-alpha-acides du houblon mesurée par absorbance, pas l’amer perçu [[ebc_9_8]] : aucune région ne
  s’en déduit. Voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Une mesure associée indirecte existe pour la bière et le moût seulement : les unités d’amertume (méthode internationale commune de l’EBC et de l’ASBC). Elle dose surtout les iso-alpha-acides
    du houblon, pas l’amer perçu, et ne saisit ni l’observateur, ni la température, ni le nez. Aucune méthode proche n’est connue (recherche du 2026-10-19).'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: ebc_9_8
    nom: unités d’amertume de la bière, méthode internationale (IM) commune (EBC 9.8 ; ASBC Beer-23A)
    grandeur: absorbance à 275 nm d’un extrait à l’isooctane de la bière acidifiée
    unite_ou_echelle: unités d’amertume (BU), soit 50 × A275
    references:
    - ebc_9_8
    - asbc_beer_23a
    proximite: indirecte
    ecart: la méthode dose surtout les iso-alpha-acides du houblon, pas l’amer perçu ; le texte d’EBC 9.8 (2.3, connu par source secondaire) dit lui-même que, pour les bières houblonnées à cru et les bières
      colorées, les BU sont plus élevées que l’amertume perçue ; bière et moût seulement ; ni l’observateur, ni la température, ni le nez
    conditions: bière filtrée, dégazée, vers 20 °C ; résultat faussé par certains additifs (acide sorbique, saccharine…)
    statut_lecture: extrait d’index (page « Master the Method » de l’ASBC ; pages de l’EBC et de BrewUp, mise à jour de 2020) ; texte d’EBC 9.8 par source secondaire (copie tierce)
  non_retenues:
  - nom: gLMS et estimation de grandeur
    references:
    - green1993lms
    - green1996lms
    - bartoshuk2004
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1). Les échelles à étiquettes classiques ne se comparent pas d’un groupe à l’autre ; l’appariement
      à un repère non gustatif (un son) le permet
    statut_lecture: résumés (Green et al., 1993 et 1996, sur OpenAlex ; Bartoshuk et al., 2004)
  - nom: ISO 3972:2011 (sensibilité au goût)
    references:
    - iso3972
    raison: mesure la sensibilité des sujets, pas l’objet ; ses solutions servent de repères de région
    statut_lecture: extraits (aperçu public)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique pour tout type de saveur ; le test du nez pincé sépare l’amer de l’odeur (on goûte nez libre, puis nez pincé, dans le même ordre et à la même
  température) [[lawless2004]]. `temperature_bouchee` et `avant` sont à éprouver pour l’amer. `duree` : le temps passé en bouche avant de juger ; environ 30 s entre deux prises et un rinçage à l’eau après
  chaque série, comme dans ISO 3972:2011 [[iso3972]]. La salive, ce qu’on a mangé avant, avalé ou recraché vont en note d’épisode ; l’état de l’observateur (sensibilité au PROP, âge, tabac) est une note
  facultative qui n’identifie personne (règle 12).'
porteur: le produit identifié dont on goûte une portion (nature, origine, lot, date de production ou d’ouverture, conservation, concentration pour une boisson préparée) ; la portion goûtée n’est pas le
  porteur
note_porteur: 'porteur des types de saveur : le produit identifié (proposition « Goût », section 6, et choix de relecture du 2026-10-19, 8.1 point 4) ; la définition dit pourtant « en goûtant une portion
  du produit » : la portion est ce qu’on goûte, pas ce qui porte la qualité. Pour un produit naturel, le lot ne garantit pas la saveur (maturité, conservation, temps depuis l’ouverture) : ces informations
  vont dans l’épisode.'
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
