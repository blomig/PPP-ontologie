etat_de_l_art: 'Chez les mammifères, des cellules distinctes, chacune avec ses récepteurs, détectent les cinq saveurs de base, dont l’amer (Chandrashekar et al., 2006 [[chandrashekar2006]] ; travail surtout
  mené chez la souris), mais la notion même de saveur de base est discutée (Erickson, 2008 [[erickson2008]]) : l’amer est ici un type à une dimension, pas une coordonnée de toute saveur (résumés lus). L’amer
  varie beaucoup d’une personne à l’autre (Bartoshuk et al., 1994 [[bartoshuk1994]]), et comparer les intensités vécues par deux personnes est un problème de méthode (Bartoshuk, 2000 [[bartoshuk2000]])
  (résumés lus). Le test du nez pincé sépare la saveur de l’odeur qui monte de la bouche vers le nez (Lawless et al., 2004 [[lawless2004]]) ; dans le vin, l’éthanol et le pH changent l’amertume (Fontoin
  et al., 2008 [[fontoin2008]]), et à faible degré l’éthanol est surtout amer (Nolden et Hayes, 2015 [[nolden_hayes2015]]) (résumés lus). Pour situer l’amer, il existe des solutions de caféine normalisées,
  prises ici comme repères de région (ISO 3972:2011 [[iso3972]], aperçu public lu), des échelles de jugement d’un jury sans référence physique (Green et al., 1993 [[green1993lms]] ; Green et al., 1996 [[green1996lms]]
  ; Bartoshuk et al., 2004 [[bartoshuk2004]] ; résumés lus), et les unités d’amertume de la bière, qui dosent surtout des composés du houblon (EBC 9.8 [[ebc_9_8]] ; ASBC Beer-23A [[asbc_beer_23a]] ; notices
  de l’éditeur seulement). Aucune source lue ne teste l’accord entre observateurs sur des crans d’amer à repères égaux. Détail : docs/bibliographie-par-type.md#groupe-gout.'
