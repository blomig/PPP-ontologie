    exemplaires: []
note_echelle: 'quatre régions, clés reprises de `odourIntensity` (proposition « Goût », 2.2). Les repères sont des solutions de référence, pas des exemplaires (X17), et aucune marque n’est citée (décision
  5 de l’éditeur du projet, 2026-10-19). Les concentrations exactes du tableau 3 d’ISO 3972:2011 [[iso3972]] ne sont pas reprises ici : la correspondance entre crans et concentrations est à fixer avant
  l’épreuve.'
identite: 'La force de la saveur amère, perçue sur la langue ; pas l’astringence (un toucher : la bouche qui sèche ou râpe), pas l’odeur en bouche (arôme en bouche, en réserve), pas le piquant (piquant
  en bouche), pas l’agrément.'
relations:
- type: confusableWith
  cible: ppp:astringency
  note: 'dans le vin rouge, l’amer est confondu avec l’astringence : l’amer est une saveur de la langue, l’astringence un état de la bouche qui sèche ou râpe et reste après la gorgée'
