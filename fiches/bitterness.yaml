# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
# Série 113 (2026-11-15) : relecture explicative complète, champ par champ ; a_relire vidé, fiche publiable avec exemplaires incomplets (repères de région ; choix de relecture (2026-11-15)).
id: ppp:bitterness
label_fr: amer
label_en: bitterness
labels_alternatifs: []
labels_alternatifs_en: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- gout
définition: 'La force de la saveur amère qu’on perçoit en goûtant une portion du produit, nez pincé ou libre selon la facette `nez`, à la température déclarée : une saveur de la langue, et non l’astringence
  ni l’arôme.'
question_attentionnelle: En bouche, est-ce amer ? À peine, nettement, ou fortement ?
contre_exemple: 'Un vin rouge jeune peut assécher la bouche sans être amer : c’est l’astringence, un toucher, pas une saveur. Une odeur de café brûlé n’est pas l’amer : nez pincé, elle disparaît, l’amer
  reste. Le sens figuré du mot (« une remarque amère ») ne s’applique pas. « Ce café est nettement amer, et c’est un défaut » se dit comme « …et c’est une qualité » : l’amer est recherché dans le café,
  le chocolat noir ou l’eau tonique.'
grandeur_physique_homonyme: 'l’« amertume » des brasseurs, en unités d’amertume (BU), se mesure par absorbance sur un extrait de la bière : elle dose surtout les iso-alpha-acides du houblon, pas l’amer
  perçu [[ebc_9_8]] : aucune région ne s’en déduit. Voir la rubrique « mesure ».'
mesure:
  etat: methodes
  synthese: 'Une mesure associée indirecte existe pour la bière et le moût seulement : les unités d’amertume (méthode internationale commune de l’EBC et de l’ASBC). Elle dose surtout les iso-alpha-acides
    du houblon, pas l’amer perçu, et ne saisit ni l’observateur, ni la température, ni le nez. Aucune méthode proche n’est connue (recherche du 2026-10-19, reprise le 2026-11-15) : les échelles de jugement
    d’un jury [[green1993lms]] et la méthode de sensibilité au goût [[iso3972]], citées par l’état de l’art, ne sont pas des mesures associées.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: ebc_9_8
    nom: unités d’amertume de la bière, méthode internationale (IM) commune (EBC 9.8 ; ASBC Beer-23A)
    grandeur: absorbance à 275 nm d’un extrait à l’isooctane de la bière acidifiée
    unite_ou_echelle: unités d’amertume (BU), soit 50 × A275
    references:
    - ebc_9_8
    - asbc_beer_23a
    proximite: indirecte
    ecart: la méthode dose surtout les iso-alpha-acides du houblon, et tout ce qui se dissout dans l’isooctane et absorbe à 275 nm, pas l’amer perçu ; pour les bières houblonnées à cru, l’ASBC renvoie elle-même
      à une autre méthode pour approcher l’amer perçu ; bière et moût seulement ; ni l’observateur, ni la température, ni le nez
    conditions: bière ou moût dégazé, acidifié, extrait à l’isooctane ; lecture au spectrophotomètre à 275 nm
    statut_lecture: 'notice de l’éditeur seulement : page « Master the Method » de l’ASBC et résumé de la méthode 9.8 sur le site de l’EBC, relus le 2026-11-15 ; texte des méthodes non lu'
  non_retenues:
  - nom: gLMS et estimation de grandeur
    references:
    - green1993lms
    - green1996lms
    - bartoshuk2004
    raison: 'des notes données par un jury, sans référence physique : elles servent dans l’épreuve d’accord (E1), pas comme mesure associée. Les échelles à étiquettes ordinaires ne se comparent pas d’un
      groupe à l’autre ; comparer à un repère qui n’est pas un goût (un son) le permet'
    statut_lecture: résumés (Green et al., 1993 et 1996, sur OpenAlex ; Bartoshuk et al., 2004)
  - nom: ISO 3972:2011 (sensibilité au goût)
    references:
    - iso3972
    raison: elle mesure la sensibilité des personnes au goût, pas le produit ; ses solutions servent de repères de région
    statut_lecture: extraits (aperçu public)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique pour tout type de saveur ; le test du nez pincé sépare l’amer de l’odeur (on goûte nez libre, puis nez pincé, dans le même ordre et à la même
  température) [[lawless2004]]. `temperature_bouchee` et `avant` sont à éprouver pour l’amer. `duree` : le temps passé en bouche avant de juger ; environ 30 s entre deux prises et un rinçage à l’eau après
  chaque série, comme dans ISO 3972:2011 [[iso3972]]. La salive, ce qu’on a mangé avant, avalé ou recraché vont en note d’épisode ; l’état de l’observateur (sensibilité au PROP, âge, tabac) est une note
  facultative qui n’identifie personne (règle 12).'
porteur: le produit identifié dont on goûte une portion (nature, origine, lot, date de production ou d’ouverture, conservation, concentration pour une boisson préparée) ; la portion goûtée n’est pas le
  porteur
note_porteur: 'porteur des types de saveur : le produit identifié (choix de relecture du 2026-10-19) ; la définition dit pourtant « en goûtant une portion du produit » : la portion est ce qu’on goûte, pas
  ce qui porte la qualité. Pour un produit naturel, le lot ne garantit pas la saveur (maturité, conservation, temps depuis l’ouverture) : ces informations vont dans l’épisode.'
