etat_de_l_art: 'Chez les mammifères, des cellules distinctes, chacune avec ses récepteurs, détectent les cinq saveurs de base, dont l’amer (Chandrashekar et al., 2006 [[chandrashekar2006]] ; travail surtout
  mené chez la souris) ; la notion même de saveur de base est discutée (Erickson, 2008 [[erickson2008]]), et l’amer est donc un type à une dimension, pas une coordonnée d’une décomposition. L’amer varie
  beaucoup d’une personne à l’autre (Bartoshuk et al., 1994 [[bartoshuk1994]]), et comparer les intensités vécues par deux personnes est un problème de méthode (Bartoshuk, 2000 [[bartoshuk2000]]). Le test
  du nez pincé sépare la saveur de l’odeur rétronasale (Lawless et al., 2004 [[lawless2004]]). Les solutions de caféine d’ISO 3972:2011 [[iso3972]] servent de repères ; les échelles de jury (Green et al.,
  1993 [[green1993lms]] ; Green et al., 1996 [[green1996lms]] ; Bartoshuk et al., 2004 [[bartoshuk2004]]) ne sont pas des mesures. Dans le vin, l’éthanol et le pH changent l’amertume (Fontoin et al., 2008
  [[fontoin2008]]) ; à faible degré, l’éthanol est surtout amer (Nolden et Hayes, 2015 [[nolden_hayes2015]]). Aucune source lue ne teste l’accord entre observateurs sur des crans d’amer à repères égaux.
  Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:bitterness a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je goûte ce café » à « je regarde s’il est amer, et combien » change la description (on isole une saveur parmi l’arôme, l’astringence et la chaleur).
transfert: 'objet conçu oui (un aliment ou une boisson conçus : une recette, un produit) | tableau non (rien à goûter) | cuisine oui (café, chocolat noir, endive) | high-tech non | architecture non'
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 produits identifiés (portions du même lot, au même moment), accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à conditions critiques égales (nez
    pincé ; spec §9.7 H, règle 12), les solutions de caféine de référence goûtées avant de juger
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les produits (ceux qui aiment et ceux qui n’aiment pas)
  statut_epistemique: non éprouvé
  epreuve: null
