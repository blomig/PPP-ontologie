# Fiche de type PPP — ppp:elementaryShapeCount — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, remarque (résumés des modifications, non compté comme champ), note_base, note_conditions, note_tolerance, bloque_par.
id: ppp:elementaryShapeCount
label_fr: nombre de formes élémentaires nécessaires
label_en: number of elementary shapes needed
label_court: nombre de formes
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
  - ppp:contour
  facteurs_non_perceptuels:
  - facteur: répertoire de formes simples connu de l’annotateur (géométrie, modélisation en volume)
    lien_perceptible: ppp:contour
note_base: 'Base proposée par le rapport du crash test 03 (position de travail, à trancher) : `ppp:contour` (formel, A9), parce qu’il faut des bords perçus pour voir des volumes. Le « répertoire », c’est
  la liste des formes simples qu’on s’autorise pour décrire l’objet (cube, sphère, cylindre…) ; il est un facteur non perceptuel tant qu’il n’est pas une liste fermée (bloque_par, question 1). Avec cette
  seule base, E3 est déjà mis en défaut (un morceau de sucre et une chaise ont tous deux des bords nets) : la base est à revoir (T37, question 6 : la compléter ou n’en déclarer aucune).'
facettes:
- forme
définition: Nombre de formes simples (élémentaires), comme le cube, la sphère, le cylindre, le cône ou le pavé, qu’il faudrait assembler, ou retirer, pour décrire cet objet en volume, à la tolérance que
  permet le régime déclaré (les conditions dans lesquelles on le regarde). Chaque forme répétée compte une fois de plus ; chaque percement ou creux compte comme une forme.
question_attentionnelle: Pour reconstruire cet objet en volume avec des formes simples (cube, sphère, cylindre…), en faudrait-il une, quelques-unes, beaucoup, ou plus qu’on ne peut en compter ?
contre_exemple: 'Une sphère est très courbe et n’a besoin que d’une forme : la courbure n’est pas le nombre de formes. Un motif imprimé sur un cube ne change pas le nombre de formes du cube. La densité
  n’est pas le nombre de formes : douze briques serrées sur un petit mur et douze briques espacées sur un grand mur demandent le même nombre de formes, douze, mais n’ont pas la même densité.'
grandeur_physique_homonyme: 'nombre de formes de base (« primitives ») qu’un logiciel de modélisation 3D assemble : un compte de l’outil, dont aucune région ne se déduit.'
modalites:
- vision
- toucher
mode_de_presentation: séquence
conditions_critiques:
- distance
- angle
- presentation
note_conditions: 'le compte dépend de ce qu’on voit de l’objet : toutes ses faces (en main, angle `varied`) ou une seule (image, angle `frontal`) ; de loin, les petites formes se fondent dans la masse.
  Deux régimes (l’objet en main, ou vu à quelques mètres) peuvent donner deux régions pour un même objet. Avec un angle `unknown`, l’assertion reste non tranchée. Au toucher, le compte peut différer : il
  est à éprouver à part (T22, à trancher). Le « régime déclaré » de la définition renvoie aux conditions de perception (spec §9.7 H).'
note_tolerance: une forme simple suffit quand l’écart avec la forme réelle est invisible au régime déclaré ; pour l’épreuve, une valeur numérique unique, commune à tous les annotateurs, est à fixer avant
  E1 (rapport du crash test 03, §4.1 ; aucune valeur proposée).
porteur: un objet ou une partie vu dans son ensemble (une seule configuration par assertion)
arité: 1
condition_NA: porteur sans volume perceptible (un trait, un aplat) ; sur une photo, le porteur est l’objet photographié, pas l’image.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `oneShape` (rang 1) vers `beyondCount` (rang 4), il faut davantage de formes simples pour décrire l’objet
  numerique: non
  regions:
  - cle: oneShape
    label_fr: une forme
    label_en: one shape
    rang: 1
    repere: un cube plein (un morceau de sucre), un galet sphérique, une brique pleine ; une brique percée d’un trou compte déjà deux formes
    exemplaires: []
  - cle: fewShapes
    label_fr: quelques formes
    label_en: a few shapes
    rang: 2
    repere: 'de deux à environ cinq formes, percements compris (une table à plateau et à quatre pieds droits : cinq) ; seuil à fixer avant l’épreuve'
    exemplaires: []
  - cle: manyShapes
    label_fr: beaucoup de formes
    label_en: many shapes
    rang: 3
    repere: de six à environ vingt formes, répétitions et percements compris, qu’on peut encore compter une à une ; seuil à fixer avant l’épreuve
    exemplaires: []
  - cle: beyondCount
    label_fr: plus qu’on ne peut en compter
    label_en: more than one can count
    rang: 4
    repere: formes trop nombreuses, ou trop irrégulières, pour être décrites par des formes simples en nombre raisonnable ; la limite n’est pas un nombre (bloque_par, question 5)
    exemplaires: []
identite: Nombre de formes simples nécessaires à une description en volume, pas la courbure d’un tronçon (courbure), pas les niveaux de parties contenues dans des parties (emboîtement), pas la taille perçue
  d’un élément (taille perçue), pas la différence de taille entre deux éléments (contraste d’échelle), pas la quantité d’éléments rapportée à la taille (densité). Deux parties symétriques comptent chacune
  ; une forme symétrique à elle seule (une sphère) reste une forme.
relations:
- type: confusableWith
  cible: ppp:curvature
  note: une sphère est très courbe et tient en une forme ; un amas de cubes (tout en faces planes) en demande beaucoup
- type: confusableWith
  cible: ppp:partNesting
  note: « des formes et des sous-formes » mêle deux idées ; l’emboîtement compte des niveaux, ce type compte des formes, quel que soit leur niveau (bloque_par, question 4)
- type: confusableWith
  cible: ppp:symmetry
  note: 'deux parties symétriques comptent chacune : une forme répétée compte une fois de plus ; une forme symétrique à elle seule (une sphère) reste une forme (décision de l’éditeur du projet, T37)'
- type: confusableWith
  cible: ppp:perceivedSize
  note: 'un grand objet n’a pas besoin de plus de formes : un grand bloc plein (une dalle, un monolithe) tient en une forme'
- type: confusableWith
  cible: ppp:scaleContrast
  note: des formes de tailles très différentes font un contraste d’échelle ; elles peuvent se compter pour peu ou beaucoup de formes
- type: confusableWith
  cible: ppp:perceptualDensity
  note: la densité est un nombre d’éléments perçus pour la taille d’une zone ; ici on compte des volumes pour décrire un objet
- type: separableFrom
  cible: ppp:curvature
  note: 'à éprouver (E2) : un objet de peu de formes très courbes contre un objet de beaucoup de formes droites'
