etat_de_l_art: 'Biederman (1987) [[biederman1987]] décrit la reconnaissance des objets comme un découpage de l’image en un assemblage de volumes simples, tirés d’un petit répertoire (blocs, cylindres, coins,
  cônes) ; voir aussi Hoffman et Richards (1984), « Parts of recognition » (titre seulement, contenu non lu) [[hoffman_richards1984]]. Pour le compte lui-même, les travaux sur la perception du nombre distinguent
  dénombrer, saisir d’un coup un petit nombre et estimer une quantité sans compter : Kaufman et al. (1949) [[kaufman1949]] définissent la « numérosité » comme ce qu’on discrimine d’une collection sans la
  compter ; Mandler et Shebo (1982) [[mandler_shebo1982]] étudient la saisie immédiate d’un petit nombre (titre seulement) ; Dehaene (1992) [[dehaene1992]] en fait la revue. Ces travaux portent sur des
  collections d’éléments séparés, pas sur les volumes qui composent un objet. Aucune source trouvée (recherche du 2026-10-11 sur Crossref, OpenAlex et PubMed) ne fixe des régions perçues du nombre de formes
  simples nécessaires. Détail : docs/bibliographie-par-type.md#groupe-forme.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-forme
