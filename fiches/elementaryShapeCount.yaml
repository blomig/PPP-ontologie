axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:elementaryShapeCount a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois un objet » à « je regarde de combien de formes simples il est fait » change la description (on suit les volumes au lieu de la silhouette ou de la matière).
transfert: objet conçu oui (meuble, vase) | tableau non (pas de volume) | cuisine oui (ustensile, plat) | high-tech oui (boîtier) | architecture oui (bâtiment, volumétrie)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques et à tolérance égale (spec §9.7 H ; note_tolerance)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: on peut faire varier le nombre de formes en tenant la courbure constante (cubes empilés contre cube unique ; une sphère contre un amas de sphères de même taille)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E3
  nature: structure
  enonce: 'deux objets qu’on ne distingue pas par la netteté de leurs bords (`ppp:contour`), vus de la même façon et décrits avec la même liste de formes simples permises (le « répertoire » : cube, sphère,
    cylindre…), ne diffèrent pas sur le nombre de formes ; sinon la base déclarée est incomplète'
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
