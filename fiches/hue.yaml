facettes:
- couleur
définition: Couleur d’une zone au sens de sa place sur le cercle des couleurs (rouge, jaune, bleu…), indépendamment de sa clarté et de sa saturation.
question_attentionnelle: 'De quelle couleur est cette zone : rouge, orange, jaune, vert, bleu ou violet ?'
contre_exemple: 'Un gris n’a pas de teinte (non applicable). Un rose pâle et un rouge sombre ont la même teinte, rouge : ils diffèrent par la clarté et la saturation.'
grandeur_physique_homonyme: '« teinte » désigne aussi, en colorimétrie, l’angle de teinte hab calculé (CIE 1976 a,b hue angle), un corrélat approché de la teinte perçue (voir la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: La colorimétrie donne un angle de teinte calculé à partir de mesures instrumentales (hab de l’espace CIELAB), et le système Munsell une teinte évaluée par comparaison visuelle à des échantillons
    ordonnés. Elles visent un aspect proche de ce type, pour des surfaces opaques sous un éclairage et un observateur de référence ; elles ne tiennent pas compte de ce qui entoure la zone ni de l’éclairage
    réel de l’épisode.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie015
    nom: angle de teinte hab (CIELAB)
    grandeur: angle calculé à partir des coordonnées a* et b*, elles-mêmes calculées sur des valeurs trichromatiques mesurées
    unite_ou_echelle: 'angle de teinte hab = arctan(b*/a*) (définition de la CIE, e-ILV 17-23-076)'
    references:
    - cie015
    - cie_ilv_cielab
    proximite: proche
    ecart: 'un angle continu, là où le type a six régions nommées ; valeur calculée pour un observateur et un illuminant de référence, sur un échantillon isolé : ne tient compte ni de l’entourage ni de
      l’éclairage de l’épisode'
    conditions: géométries d’éclairage et d’observation, observateur et illuminant normalisés
    statut_lecture: résumé public lu (CIE 015:2018) ; e-ILV lu (17-23-076)
  - id: astm_d1535
    nom: teinte Munsell (Munsell hue)
    grandeur: teinte évaluée par comparaison visuelle avec un atlas d’échantillons ordonnés ; la norme prévoit aussi la conversion depuis des données CIE
    unite_ou_echelle: notation Munsell, composante teinte
    references:
    - astm_d1535
    proximite: proche
    ecart: une notation fine par comparaison à un atlas, pour des objets opaques à la lumière du jour ; ne tient compte ni de l’entourage ni d’un autre éclairage que celui de la norme, et ne donne pas une
      région
    conditions: objets opaques (peintures), lumière du jour, comparaison à l’atlas
    statut_lecture: 'lu en partie : page de l’éditeur, Scope section 1.1 (ASTM D1535)'
