note_categories: 'Règle (décision de l’éditeur du projet, 2026-10-11, T6 ; docs/couleur-teinte-etat-de-l-art.md) : les six régions sont les catégories chromatiques de base de Berlin et Kay [[berlin_kay1969]] (les noms de couleur de base qu’ils relèvent ; d''après Kay 2015 [[kay2015]]), moins le brun et le rose. Un brun n''est pas une teinte à part : c''est un orange sombre et terne ; on note `orange`, et le sombre et le terne par la clarté et la saturation (Munsell, glossaire [[munsell1905]] ; Kelly et Judd 1955 [[kelly_judd1955]]). Un rose est un rouge clair et peu vif : on note `red`, le reste par la clarté et la saturation (mêmes sources). Cas limites (confirmés par l’éditeur du projet, 2026-10-11) : un brun qui tire nettement vers le rouge ou le jaune, ou un rose qui tire vers le violet, se note à la teinte voisine la plus proche (`red`, `yellow`, `purple`), comme le suggère le glossaire de Munsell (brun « inclined to red or yellow », rose « inclining toward purple »). Gris, noir, blanc : non applicable (condition_NA) ; Munsell et NCS [[ncs_systeme]] les rangent eux aussi à part, comme des couleurs neutres sans teinte. « Rose » et « brun » sont conservés comme termes de recherche des régions rouge et orange.'
identite: Place sur le cercle des couleurs, pas clair ou sombre (clarté), pas vif ou terne (saturation).
