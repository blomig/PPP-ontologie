etat_de_l_art: 'La teinte est l''une des trois dimensions de Munsell (1905) [[munsell1905]], avec la valeur (la clarté) et le chroma (la saturation) ; Munsell en compte dix, le système suédois NCS [[ncs_systeme]]
  quatre couleurs élémentaires et des intermédiaires (Hård et Sivik 1981, d''après Hering) [[hard_sivik1981]], le dictionnaire américain ISCC-NBS dix-sept plages (Kelly et Judd 1955) [[kelly_judd1955]],
  et la colorimétrie de la CIE [[cie015]] en calcule un correspondant approché, l''angle de teinte (vocabulaire international de l''éclairage, entrée « CIELAB ») [[cie_ilv_cielab]]. Berlin et Kay (1969)
  [[berlin_kay1969]] trouvent onze catégories de couleur de base, dont six chromatiques en plus du brun et du rose (Kay 2015) [[kay2015]] ; Munsell et ISCC-NBS traitent le brun et le rose comme des couleurs
  d''une teinte, sombres ou claires. Détail : docs/couleur-teinte-etat-de-l-art.md et docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
