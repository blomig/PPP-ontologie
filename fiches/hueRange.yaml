# Fiche de type PPP — ppp:hueRange — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:hueRange
label_fr: éventail des teintes
label_en: hue range
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
  - ppp:hue
  facteurs_non_perceptuels: []
facettes:
- couleur
définition: 'Distance qui sépare, sur le cercle des couleurs (rouge, orange, jaune, vert, bleu, violet), les teintes qu’on voit dans une même zone ou une composition : une seule teinte, des teintes proches,
  ou des teintes éloignées, quelles que soient leur clarté et leur saturation.'
question_attentionnelle: Dans cette zone, voit-on une seule teinte, des teintes voisines (des bleus et des verts) ou des teintes éloignées (des bleus et des oranges) ?
contre_exemple: 'Un camaïeu de bleus, du bleu nuit au bleu ciel, ne montre qu’une teinte : il varie en clarté, pas en teinte. Deux zones qu’on montre du doigt, l’une rouge, l’autre verte, se comparent par
  un contraste de teinte ; l’éventail des teintes dit ce qu’on voit dans toute une zone, sans en choisir deux.'
mesure:
  etat: methodes
  synthese: 'Une étendue de teinte peut se calculer de façon indirecte à partir d’une image colorimétrique ou de mesures de plusieurs zones : écart entre la plus faible et la plus forte valeur de l’angle de teinte hab. Aucune norme lue ne fixe ce calcul (choix des zones, résolution, exclusion des reflets) : c’est une mesure associée indirecte, dont le résultat dépend de ces choix.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie_ilv_cielab
    nom: 'étendue des valeurs de l’angle de teinte hab mesurées'
    grandeur: 'écart entre la plus faible et la plus forte valeur de l’angle de teinte hab parmi les zones mesurées'
    unite_ou_echelle: degrés d’angle de teinte (e-ILV 17-23-076)
    references:
    - cie_ilv_cielab
    - cie015
    proximite: indirecte
    ecart: 'calcul sur des valeurs ponctuelles, sans norme pour le choix des zones ; ne saisit ni l’observateur, ni l’éclairage de l’épisode, ni la distance, qui décident des zones qu’on distingue et de leur teinte ; l’angle est mal défini pour les zones grises ; l’angle étant circulaire, l’écart entre plus petite et plus grande valeur est faux de part et d’autre de 0°/360°'
    conditions: image colorimétrique calibrée ou mesures de plusieurs zones, observateur et illuminant normalisés
    statut_lecture: e-ILV lu (17-23-076) ; résumé public lu (CIE 015:2018) ; aucune méthode d’étendue lue
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- presentation
- distance
note_conditions: sur un écran ou un imprimé, les teintes peuvent différer ; de loin, des petites taches de teintes différentes se mêlent
porteur: une zone ou une composition
arité: 1
condition_NA: zone achromatique (blanc, gris, noir).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `singleHue` (rang 1) vers `distantHues` (rang 3), les teintes vues s’éloignent davantage sur le cercle des couleurs
  numerique: non
  regions:
  - cle: singleHue
    label_fr: une seule teinte
    label_en: single hue
    rang: 1
    repere: toutes les couleurs de la zone ont la même teinte (un camaïeu de bleus, un ciel bleu sans nuage)
    exemplaires:
    - ppp-a:pilote-1201
  - cle: neighbouringHues
    label_fr: teintes voisines
    label_en: neighbouring hues
    rang: 2
    repere: des teintes voisines sur le cercle (un sous-bois en verts et jaunes sans feuilles brunes, une mer en bleus et verts)
    exemplaires:
    - ppp-a:pilote-1203
  - cle: distantHues
    label_fr: teintes éloignées
    label_en: distant hues
    rang: 3
    repere: des teintes éloignées ou opposées sur le cercle (un étal de fruits et légumes, un vitrail)
    exemplaires:
    - ppp-a:pilote-1202
note_echelle: 'L’échelle mesure la distance, sur le cercle des couleurs, entre les teintes vues les plus éloignées, pas le nombre de teintes : une zone faite d’un rouge et d’un vert seulement, et une zone
  de six teintes réparties sur tout le cercle, tombent toutes deux dans `distantHues`. Le nombre de teintes n’est pas noté par ce type. Position de travail, révisable par l’éditeur du projet (T31). Sur
  le cercle des six teintes (T6) : des teintes voisines sont à un pas l’une de l’autre ; des teintes éloignées, à deux ou trois pas (trois pas : teintes opposées).'
identite: Écart des teintes vues dans une même zone, pas la teinte elle-même (de quelle couleur est la zone), pas l’écart entre deux zones qu’on compare (contraste de teinte), pas les écarts de clarté (un
  camaïeu).
relations:
- type: confusableWith
  cible: ppp:lightnessContrast
  note: un camaïeu montre de forts écarts de clarté dans une seule teinte
- type: confusableWith
  cible: ppp:hueContrast
  note: deux zones qu’on montre du doigt, l’une rouge, l’autre verte, se comparent par un contraste de teinte ; l’éventail dit l’écart des teintes vues dans toute une zone, sans en choisir deux (réciproque
    écrite aussi dans hueContrast, T31)
- type: confusableWith
  cible: ppp:hue
  note: '« quelle teinte ? » se demande pour une couleur, « quelles teintes, et à quelle distance ? » pour toute une zone : une zone rouge et orange montre deux teintes voisines, pas une seule teinte «
    rouge-orange » ; l’éventail se juge à partir des teintes vues (la teinte est la base de ce type)'
