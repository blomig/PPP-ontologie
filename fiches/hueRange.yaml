etat_de_l_art: 'Le système de Munsell (1905) [[munsell1905]] situe les teintes sur un cercle ; l''éventail des teintes d''une zone s''y lit comme une distance sur ce cercle. Aucune source trouvée ne propose
  une qualité perçue de l''écart des teintes dans une même zone, distincte du contraste entre deux zones et du nombre de couleurs. Les teintes et le cercle sont ceux de la teinte (six teintes, T6, tranché
  par l’éditeur du projet le 2026-10-11). Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:hueRange a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois des couleurs » à « je regarde si leurs teintes sont une seule, proches ou éloignées » change la description (unité ou éclatement de la couleur de la zone).
transfert: objet conçu oui (textile imprimé, céramique peinte) | tableau oui (palette d’une toile) | cuisine oui (ensemble de vaisselle) | high-tech oui (interface colorée)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques
    (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E1b
  nature: existence
  enonce: 'comparaison appariée du pas `singleHue` / `neighbouringHues` (crash test 01, §6 point 6) : on montre côte à côte, sous R-loin puis R-près, un membre jugé `singleHue` et un membre jugé `neighbouringHues`,
    et l’on demande s’ils diffèrent en teintes ; part des observateurs qui voient un écart, au-dessus d’un seuil fixé avant l’épreuve'
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: E3
  nature: structure
  enonce: deux zones dont on juge les teintes une à une identiques ne diffèrent pas en éventail des teintes (sinon la base est incomplète)
  statut_epistemique: non éprouvé
  epreuve: null
