  nature: existence
  enonce: après l’épreuve du premier lot, sur 6 à 10 produits identifiés (portions du même lot, au même moment), accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à `nez`,
    `moment`, `temperature_bouchee` et `avant` égaux (spec §9.7 H, règle 12) ; la proximité avec ce qui attire l’attention (notion réservée hors V1, spec §9.9) est à éprouver dans la même épreuve
  statut_epistemique: non éprouvé
  epreuve: null
