    exemplaires: []
note_echelle: 'ordinal, sur le modèle des types du premier lot ; clés reprises de `odourIntensity` et de `bitterness` (proposition « Goût », 2.8.2). Le repère de région reste à choisir : aucune solution
  d’ISO 3972 ne vaut pour l’ensemble.'
identite: 'La force de l’ensemble de ce qui est perçu en bouche, et non l’intensité propre d’une qualité, qui reste une dimension des types du premier lot (leurs régions) ; pas la somme des intensités ;
  pas le nombre de composantes ; pas l’agrément. Rapprochement avec l’intensité de l’odeur (`ppp:odourIntensity`, famille Odorat : l’odeur au nez, par voie orthonasale), sans relation. Ce n’est pas l’intensité
  perceptive commune à tous les sens (notion mise en attente, T10, spec §9.9).'
