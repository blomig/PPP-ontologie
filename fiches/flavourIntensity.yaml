etat_de_l_art: 'Dans un mélange, l’intensité d’ensemble est en général inférieure à la somme des intensités séparées (Keast et Breslin, 2003 [[keast_breslin2003]]). Une grille de dégustation lue sépare
  des crans d’intensité descriptifs du jugement de qualité (WSET, 2016 [[wset2016]]), alors que la grille CIEL, présentée comme méthode d’évaluation de la qualité, parle de « puissance » (Rousselin, 2023
  [[rousselin2023]], par source secondaire). L’intensité se compare mal d’une personne à l’autre (Bartoshuk, 2000 [[bartoshuk2000]]) ; les échelles d’intensité (échelle de grandeur à étiquettes [[green1993lms]]
  [[green1996lms]] ; estimation de grandeur, Stevens, 1957 [[stevens1957]]) sont des jugements de jury, sans série de référence physique. La force perçue dépend du nez (Lawless et al., 2004 [[lawless2004]]),
  de la température (Talavera et al., 2005 [[talavera2005]] ; Engelen et al., 2003 [[engelen2003]]) et de ce qui précède (accumulation de l’astringence [[green1993astr]] ; Prescott et Swain-Campbell, 2000
  [[prescott2000]]). La complexité jugée va avec la force (Meillon et al., 2010 [[meillon2010]]). L’intensité perceptive commune à tous les sens reste en attente (T10, spec §9.9). Aucune source lue ne teste l’accord sur
  une intensité globale de flaveur. Détail : docs/bibliographie-par-type.md#groupe-gout.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-gout
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:flavourIntensity a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je goûte ce plat » à « je regarde avec quelle force l’ensemble se fait sentir » change la description (on juge le tout, pas une qualité).
transfert: objet conçu oui (une recette, une boisson) | tableau non | cuisine oui (un bouillon, un thé, un vin) | high-tech non | architecture non
enonces_testables:
