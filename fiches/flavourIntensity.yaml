# Fiche de type PPP — ppp:flavourIntensity — format : PPP_FicheType.md (spec v2.8)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_base, note_porteur, note_echelle, note_label_alternatif, mesure (rubrique proposée en série 53, docs/proposition-rubrique-mesure.md).
# Série 78 (2026-10-20) : fiche en préparation de la famille « Goût (en bouche) », rédigée sans exemplaire à partir de la proposition « Goût » ; aucun champ n’est encore relu.
id: ppp:flavourIntensity
label_fr: intensité (goût)
label_en: intensity (taste)
label_court: intensité
labels_alternatifs:
- puissance
labels_alternatifs_en: []
note_label_alternatif: '« puissance » est un jargon d’atelier, marqué comme tel (« puissance des arômes » dans un manuel de dégustation, Rousselin, 2023 [[rousselin2023]], par source secondaire) ; « puissant
  » au sens d’éloge reste au lexique d’atelier (§9.7 K). « Concentration » est écartée : c’est une propriété de l’objet goûté, pas une qualité perçue.'
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:bitterness
  - ppp:oralPungency
  - ppp:astringency
  facteurs_non_perceptuels: []
note_base: 'Base proposée (strate semi-formel, à vérifier ; proposition « Goût », 2.8) : la force du mélange perçu comme un tout (une qualité d’ensemble), dont la base est la liste des composantes en bouche
  (réponse proposée à A9 ; choix de relecture, 2026-10-20). La proximité avec ce qui attire l’attention (notion réservée hors V1, spec §9.9) reste à éprouver par E1. L’intensité perceptive commune à tous les sens (notion mise en attente, T10, spec §9.9) n’est pas rouverte ; si T10 est repris,
  ce type en deviendra la spécialisation pour le goût (piste de ceinture). Seuls des ids définis sont cités (A12) : l’amer, le piquant en bouche et l’astringence, tous trois formels (A9). Le sucré, l’acide,
  le salé, l’umami et l’arôme en bouche sont encore en réserve, sans id : ils entreront dans la base quand leurs fiches existeront ; la base déclarée est donc incomplète. Les deux types de texture du premier
  lot n’y sont pas : la définition exclut la texture de la bouchée (choix de relecture (2026-10-20), série 78 bis).'
facettes:
- gout
définition: 'La force globale de ce qui est perçu dans la portion en bouche, toutes qualités confondues (saveurs, arômes par voie rétronasale (de l’arrière de la bouche vers le nez), sensations du trijumeau
  (le nerf qui sent la brûlure du piment, le froid de la menthe, le picotement), astringence ; la texture de la bouchée n’en fait pas partie), sous le régime déclaré : la force de l’ensemble, pas celle
  d’une qualité.'
question_attentionnelle: Toutes qualités confondues, avec quelle force la portion se fait-elle sentir en bouche ? Rien, à peine, nettement, ou fortement ?
contre_exemple: 'Une seule qualité très forte (un amer, un piquant) ne fait pas à elle seule l’intensité d’ensemble : on juge l’ensemble, pas la qualité la plus forte. Ce n’est pas la somme des intensités
  : un mélange est en général moins intense que la somme de ses parties. Ce n’est pas l’odeur sentie au nez avant de goûter. « Ce thé est d’intensité forte, et c’est un défaut » se dit ; « fade » (au sens
  de manque) et « puissant » (au sens d’éloge) sont exclus.'
grandeur_physique_homonyme: '« intensité » au sens de la grandeur du stimulus, et la concentration d’un produit (un café serré ou allongé) : des propriétés de l’objet goûté, pas une qualité perçue ; aucune
  région ne s’en déduit.'
mesure:
  etat: aucune_methode_robuste
  synthese: 'Aucune méthode robuste n’est connue pour la force globale de ce qui est perçu en bouche (recherche du 2026-10-20). Les teneurs et concentrations (°Brix, unités d’amertume, capsaïcinoïdes, polyphénols)
    sont au mieux indirectes et portent chacune sur une qualité, pas sur l’ensemble ; aucune source lue ne les combine en un indice de force globale. Le score de la grille CIEL (de 0 à 4) est hors de la
    rubrique : c’est un jugement de qualité.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes: []
  non_retenues:
  - nom: gLMS et estimation de grandeur
    references:
    - green1993lms
    - green1996lms
    - stevens1957
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: résumés (Green et al., 1993 et 1996) ; métadonnées (Stevens, 1957)
  - nom: échelles de panel et notes sur une échelle de complexité, d’intensité ou d’équilibre, dont le questionnaire de complexité de Medel et al. (2009)
    references:
    - medel2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: métadonnées (Medel et al., 2009 ; contenu par source secondaire)
  - nom: méthode temps-intensité (ASTM E1909-24) et TDS
    references:
    - astm_e1909
    - pineau2009
    raison: jugements d’un jury sans référence physique ; à reprendre dans le protocole de l’épreuve d’accord (E1)
    statut_lecture: extrait d’index (page de l’ASTM) ; résumé (Pineau et al., 2009)
modalites:
- bouche
mode_de_presentation: échantillon
conditions_critiques:
- nez
- moment
- temperature_bouchee
- avant
note_conditions: 'règle 12 (spec §9.7 H) : `nez` est critique (avec le nez pincé, la part rétronasale disparaît [[lawless2004]]) ; `moment` est critique (l’intensité monte puis baisse) ; `temperature_bouchee`
  est critique (le sucré varie avec la température : Talavera et al., 2005 [[talavera2005]]) ; `avant` est critique (piquant et astringence s’accumulent [[green1993astr]] ; l’irritation par l’éthanol diminue
  d’une prise à l’autre : Prescott et Swain-Campbell, 2000 [[prescott2000]]).'
porteur: la portion en bouche (la gorgée ou la bouchée) d’un produit identifié, voie rétronasale comprise
note_porteur: 'porteur des trois premiers types du lot CIEL (choix de relecture, 2026-10-20 ; proposition « Goût », 2.8) : la portion en bouche, et non le produit identifié, parce que ces jugements portent
  sur ce qui est en bouche à un moment donné et changent pendant la dégustation [[pineau2009]]. L’objet du registre reste le produit identifié ; la portion en est la partie jugée (§9.7 I).'
arité: 1
condition_NA: 'objet non destiné à la bouche (un cuir, un bois verni, un métal : ce n’est ni sûr ni reproductible) ; produit qu’on ne goûte pas (photo, description) : une photo ne compte jamais'
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `none` (rang 1) vers `strong` (rang 4), l’ensemble de ce qui est en bouche se fait sentir de plus en plus fort
  numerique: non
