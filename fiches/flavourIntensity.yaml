manques:
- 'exemplaires : aucun. Décision 5 de l’éditeur du projet (2026-10-19) : pas d’exemplaire en V1 pour le goût, des repères de région à la place. Si des exemples sont cherchés plus tard, ce seront des objets
  publics seulement (produits identifiés, sans marque citée), jamais des objets privés'
- 'épreuve d’accord E1 à faire : portions du même lot, au même moment, repères de région goûtés avant de juger (proposition « Goût », section 6, point 2) ; elle suit celle du premier lot (lot CIEL)'
- repère de région à choisir (aucune solution d’ISO 3972 ne vaut pour l’ensemble)
- aucune source lue ne teste l’accord sur une intensité globale de flaveur
- 'base incomplète : le sucré, l’acide, le salé, l’umami et l’arôme en bouche sont en réserve, sans id ; la fiche ne cite que des ids définis (A12)'
