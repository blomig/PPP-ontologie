définition: Différence perçue de teinte (rouge, jaune, bleu…) entre deux zones, parties ou objets, quelles que soient leur clarté et leur saturation.
question_attentionnelle: Si l’on ne regarde que la teinte (rouge, jaune, bleu…), la différence entre ces deux zones est-elle faible (deux bleus), modérée (un bleu et un vert), évidente (un bleu et un jaune)
  ou maximale (deux teintes opposées sur le cercle des couleurs, comme un bleu et un orange) ?
contre_exemple: 'Un bleu marine et un bleu ciel ont presque la même teinte : leur contraste de teinte est faible, leur contraste de clarté est évident.'
