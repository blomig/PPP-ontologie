  facteurs_non_perceptuels: []
facettes:
- couleur
définition: Différence perçue de teinte (rouge, jaune, bleu…) entre deux zones, parties ou objets, quelles que soient leur clarté et leur saturation.
question_attentionnelle: Si l’on ne regarde que la teinte (rouge, jaune, bleu…), la différence entre ces deux zones est-elle faible (deux bleus), modérée (un bleu et un vert), évidente (un bleu et un jaune)
  ou maximale (deux teintes opposées sur le cercle des couleurs, comme un bleu et un orange) ?
contre_exemple: 'Un bleu marine et un bleu ciel ont presque la même teinte : leur contraste de teinte est faible, leur contraste de clarté est évident.'
mesure:
  etat: methodes
  synthese: 'Une différence de teinte entre deux zones peut se calculer à partir de mesures colorimétriques de chacune : écart entre leurs angles de teinte hab, ou composante de teinte d’une formule de
    différence de couleur comme CIEDE2000. Ces mesures associées visent un aspect proche de ce type sur des échantillons mesurés à part ; elles ne saisissent ni l’entourage, ni l’éclairage de l’épisode,
    ni la distance qui sépare les deux zones.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie_ilv_cielab
    nom: écart d’angle de teinte hab entre deux zones
    grandeur: différence entre les angles de teinte calculés pour chaque zone (CIELAB)
    unite_ou_echelle: degrés d’angle de teinte (hab, e-ILV 17-23-076)
    references:
    - cie_ilv_cielab
    - cie015
    proximite: proche
    ecart: compare deux valeurs calculées pour un observateur et un illuminant de référence, sur des échantillons isolés ; ne saisit ni l’entourage, ni l’éclairage de l’épisode, ni la distance entre les
      zones ; pour un gris ou une couleur très peu saturée, l’angle de teinte est mal défini
    conditions: géométries d’éclairage et d’observation, observateur et illuminant normalisés, pour chacune des deux zones
    statut_lecture: résumé public lu (CIE 015:2018) ; e-ILV lu (17-23-076)
  - id: iso_cie_11664_6
    nom: composante de teinte de la différence CIEDE2000
    grandeur: différence de couleur calculée sur des coordonnées CIELAB, avec des corrections selon la clarté, le chroma et la teinte
    unite_ou_echelle: ΔE00 et ses termes de clarté, de chroma et de teinte
    references:
    - iso_cie_11664_6
    proximite: indirecte
    ecart: formule faite pour la différence de couleur globale, dont la teinte n’est qu’une composante ; ne s’applique ni aux sources de lumière ni aux reflets spéculaires ; ne saisit ni l’entourage, ni
      l’éclairage de l’épisode, ni la distance entre les zones
    conditions: coordonnées CIELAB des deux zones, objets réfléchissants ou transmettants (ou écrans qui les simulent), conditions de référence de la norme
    statut_lecture: résumé public lu (ISO/CIE 11664-6:2022 ; présentation de la CIE)
  non_retenues:
  - nom: différence de couleur ΔE*ab (CIELAB)
    references:
    - cie_ilv_cielab_difference
    raison: 'différence globale de couleur (distance euclidienne dans CIELAB), qui mêle la clarté, le chroma et la teinte : elle ne sépare pas la qualité que juge ce type'
    statut_lecture: e-ILV lu (17-23-077)
  - nom: calcul des tolérances et petites différences de couleur (ASTM D2244)
    references:
    - astm_d2244
    raison: pratique conçue pour des tolérances et de petites différences entre éprouvettes opaques comparées côte à côte, alors que le type va jusqu’aux différences les plus fortes ; la norme note elle-même
      que la proximité des éprouvettes, le brillant et la texture changent le lien entre différence mesurée et acceptabilité
    statut_lecture: 'résumé public lu (Scope sections 1.1 et 1.2, Significance and Use sections 5.1 et 5.2)'
