    date: '2026-10-11'
    avant: 'La coupure entre « évident » (un bleu et un jaune) et « maximal » (un bleu et un orange) dépend du cercle de couleurs retenu pour la teinte (T6). Sur le cercle à six teintes proposé (rouge,
      orange, jaune, vert, bleu, violet), le bleu est à deux pas du jaune d’un côté et à quatre de l’autre : c’est l’orange, à trois pas des deux côtés, qui lui est opposé. Dans la tradition de Hering,
      reprise par NCS, le bleu et le jaune sont souvent donnés comme une paire opposée (non vérifié sur les textes) : sur un tel cercle, un bleu et un jaune relèveraient du contraste « maximal ». Si l’éditeur
      du projet retient un autre cercle en T6, les repères de `marked` et de `strong` sont à revoir (docs/couleur-teinte-etat-de-l-art.md, « Conséquence pour le contraste de teinte »).'
    apres: 'Cercle retenu (décision de l’éditeur du projet, 2026-10-11, T6) : les six teintes de la fiche teinte en cercle, dans l’ordre rouge, orange, jaune, vert, bleu, violet, puis de nouveau rouge.
      L’écart se compte en pas sur ce cercle, par le plus court des deux chemins : zéro pas (même teinte), faible ; un pas (teintes voisines), modéré ; deux pas, évident ; trois pas (teintes opposées),
      maximal. On n’est jamais à plus de trois pas. Le bleu est à deux pas du jaune (par le vert) et à trois pas de l’orange dans les deux sens (par le vert et le jaune, ou par le violet et le rouge) :
      c’est l’orange qui lui est opposé. Dans la tradition de Hering, reprise par NCS, le bleu et le jaune sont souvent donnés comme opposés (non vérifié sur les textes) : ce n’est pas le cercle retenu.
      Un brun se compte comme un orange, un rose comme un rouge (règle de la teinte).'
    raison: 'T6 tranché par l’éditeur du projet (2026-10-11) : la note ne dit plus que la coupure est en attente ; elle donne le cercle retenu et le comptage en pas ; relecture explicative (2026-10-11)
      : « les six teintes de la teinte » devient « les six teintes de la fiche teinte »'
    remarque: re-confirmé en relecture explicative (2026-10-11) ; entrée archivée en série 12 (supprimée par erreur en série 9)
