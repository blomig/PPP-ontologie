note_cercle: 'Cercle retenu (décision de l’éditeur du projet, 2026-10-11, T6) : les six teintes de la fiche teinte en cercle, dans l’ordre rouge, orange, jaune, vert, bleu, violet, puis de nouveau rouge.
  L’écart se compte en pas sur ce cercle, par le plus court des deux chemins : zéro pas (même teinte), faible ; un pas (teintes voisines), modéré ; deux pas, évident ; trois pas (teintes opposées), maximal.
  On n’est jamais à plus de trois pas. Le bleu est à deux pas du jaune (par le vert) et à trois pas de l’orange dans les deux sens (par le vert et le jaune, ou par le violet et le rouge) : c’est l’orange
  qui lui est opposé. Dans la tradition de Hering, reprise par NCS, le bleu et le jaune sont souvent donnés comme opposés (non vérifié sur les textes) : ce n’est pas le cercle retenu. Un brun se compte
  comme un orange, un rose comme un rouge (règle de la teinte).'
identite: Un écart de teinte entre deux termes, pas la teinte d’un seul porteur.
