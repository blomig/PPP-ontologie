  - cle: strong
    label_fr: maximal
    label_en: maximal
    rang: 4
    repere: deux teintes opposées, à trois pas sur le cercle des six teintes (un bleu et un orange, un rouge et un vert, un jaune et un violet)
    exemplaires:
