etat_de_l_art: 'Itten (*Kunst der Farbe*, 1961) [[itten1961]] et Albers (*Interaction of Color*, 1963) [[albers1963]] sont des ouvrages repérés sur la couleur (notices seules, contenu non lu). Le système
  de Munsell (1905) [[munsell1905]] situe les teintes sur un cercle (« a circuit of hues », passage lu), ce qui donne un sens à « teintes éloignées ». Aucune source trouvée ne propose une échelle perçue
  du contraste de teinte entre deux zones ; les labels des régions sont ceux de tous les contrastes (T3). Détail : docs/bibliographie-par-type.md#groupe-contrastes.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-contrastes
axiomes:
- conceptuel: Tout contraste particulier médie exactement deux termes.
  validation: Toute assertion de type ppp:hueContrast a exactement deux ppp:about, chacun avec un ppp:role.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Tout contraste de teinte est un contraste perceptif dont la dimension comparée est ppp:hue.
  validation: Toute assertion de type ppp:hueContrast relève aussi de ppp:perceptualContrast ; elle ne déclare pas de ppp:comparedDimension, ou déclare ppp:hue.
nanay: Oui — passer de « je vois deux couleurs » à « je ne compare que leur teinte » change la description (le clair et le sombre cessent de compter).
