id: ppp:negativeSpace
label_fr: espace négatif
label_en: negative space
labels_alternatifs:
- vide actif (jargon d’atelier)
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
