etat_de_l_art: 'L''espace négatif touche à l''organisation figure-fond. Rubin (1915, *Synsoplevede Figurer*) [[rubin1915]] est un ouvrage classique sur les figures vues (titre ; notice seule, contenu non
  lu) ; Wagemans et al. (2012) [[wagemans2012]] font le bilan des recherches sur le groupement perceptif et l''organisation figure-fond (résumé lu). Aucune source trouvée ne nomme une qualité perçue des
  espaces laissés libres lus comme des formes ; la base reste ouverte (T11). Détail : docs/bibliographie-par-type.md#groupe-organisation.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-organisation
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:negativeSpace a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je regarde les éléments » à « je regarde les espaces laissés libres entre eux » change la description (des formes apparaissent dans les intervalles).
