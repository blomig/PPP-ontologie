  facteurs_non_perceptuels: []
facettes:
- organisation
définition: Degré auquel les espaces laissés libres entre les éléments d’une composition se lisent eux-mêmes comme des formes, et non comme un simple fond.
question_attentionnelle: Les espaces laissés libres entre les éléments se lisent-ils, eux aussi, comme des formes ?
contre_exemple: 'Une page blanche sans rien dessus n’a pas d’espace négatif : sans éléments, il n’y a pas d’intervalles à lire comme des formes (sa densité est « uniforme »). Une page peu dense n’a pas
  pour autant un espace négatif marqué : tout dépend de la forme des intervalles.'
modalites:
- vision
mode_de_presentation: image
porteur: une configuration (composition, objet, façade)
arité: 1
condition_NA: composition sans espace laissé libre entre les éléments.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `none` (rang 1) vers `marked` (rang 3), la lecture des espaces laissés libres comme des formes s’impose davantage
  numerique: non
  regions:
  - cle: none
    label_fr: absent
    label_en: none
    rang: 1
    repere: les espaces laissés libres se lisent comme un simple fond
    exemplaires: []
  - cle: slight
    label_fr: faible
    label_en: slight
    rang: 2
    repere: certains espaces laissés libres se lisent comme des formes, à l’examen
    exemplaires: []
  - cle: marked
    label_fr: marqué
    label_en: marked
    rang: 3
    repere: les espaces laissés libres se lisent d’emblée comme des formes
    exemplaires: []
identite: Lecture des espaces laissés libres comme des formes, pas la région « clairsemé » de la densité.
relations:
- type: confusableWith
  cible: ppp:perceivedDepth
  note: les espaces laissés libres qui se lisent comme des formes restent dans le même plan ; quand les choses paraissent se ranger les unes devant les autres, c’est l’étagement en plans
