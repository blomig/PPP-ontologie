id: ppp:soundAttack
label_fr: attaque du son
label_en: sound attack
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: 'La façon dont un son commence : d’un coup, comme un claquement de mains, ou peu à peu, comme un moteur qui démarre. On n’écoute que le tout début du son, pas la façon dont il s’éteint.'
question_attentionnelle: Le son part-il d’un coup, en claquant ; vite, mais sans claquer ; ou monte-t-il peu à peu ?
contre_exemple: 'Une machine déjà en marche quand on arrive n’a pas d’attaque qu’on puisse entendre : le type ne s’applique pas. Un son fort n’a pas pour autant une attaque abrupte : la force du son est
  une autre qualité. Une cloche qui résonne longtemps n’a pas pour autant une attaque lente : elle part d’un coup, puis s’éteint lentement ; la façon dont le son s’éteint est une autre qualité (l’extinction
  du son).'
mesure:
  etat: methodes
  synthese: 'Le temps de montée de l’enveloppe d’un son, pris en logarithme, est un corrélat acoustique d’une dimension commune du timbre [[mcadams1995]] ; calculé avec des seuils adaptés à chaque son,
    il donne un descripteur plus fiable [[peeters2011]] : ce sont deux mesures associées proches. Le temps d’attaque perçu [[gordon1987]] dit quand l’attaque s’entend, pas comment le son commence : c’est
    une mesure indirecte. Ces mesures se calculent sur un enregistrement ; elles ne saisissent ni la salle, ni la distance d’écoute, ni l’auditeur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: mcadams1995
    nom: temps de montée (en logarithme)
    grandeur: durée de la montée de l’enveloppe d’amplitude du son, au début du son
    unite_ou_echelle: logarithme d’une durée (temps de montée en secondes)
    references:
    - mcadams1995
    proximite: proche
    ecart: 'corrélat trouvé sur 18 sons d’instruments synthétisés ; la montée y est comptée, selon la mesure de Krimphoff et al. (1994) reprise par les auteurs, depuis 2 % du maximum de l’enveloppe jusqu’au
      maximum, et la valeur change si l’on change ces bornes ; se calcule sur un enregistrement : ne saisit ni la salle, ni la distance d’écoute, ni l’auditeur'
    conditions: enregistrement du son ; enveloppe d’amplitude calculée ; bornes de la montée déclarées
    statut_lecture: texte lu (McAdams et al. 1995, version des auteurs à la médiathèque de l’IRCAM)
  - id: peeters2011
    nom: temps d’attaque en logarithme, avec des seuils adaptés à chaque son
    grandeur: durée de la montée de l’enveloppe d’énergie du son, entre un début et une fin choisis pour chaque son
    unite_ou_echelle: logarithme d’une durée (en secondes)
    references:
    - peeters2011
    proximite: proche
    ecart: 'descripteur calculé, dont un réglage a été fixé par les auteurs après des essais sur environ 1 500 sons d’instruments ; selon eux, des seuils fixes (par exemple de 10 % à 100 % du maximum) donnent
      une valeur peu fiable ; se calcule sur un enregistrement : ne saisit ni la salle, ni la distance d’écoute, ni l’auditeur'
    conditions: enregistrement du son ; enveloppe d’énergie calculée ; façon de choisir les seuils déclarée
    statut_lecture: extraits (section sur l’enveloppe d’énergie, Peeters et al. 2011) ; résumé sur le dépôt de l’université McGill
  - id: gordon1987
    nom: temps d’attaque perçu
    grandeur: moment où l’auditeur entend l’attaque, compté depuis le début physique du son
    unite_ou_echelle: durée (en millisecondes)
    references:
    - gordon1987
    proximite: indirecte
    ecart: situe le moment où l’attaque s’entend, pas la façon dont le son commence ; dépend du temps de montée et du niveau d’écoute ; trouvé sur des notes enregistrées d’instruments d’orchestre
    conditions: enregistrement du son ; niveau d’écoute déclaré
    statut_lecture: résumé (Gordon 1987, sur Crossref)
  non_retenues:
  - nom: seuil du début perçu (environ 15 dB sous le maximum de l’enveloppe)
    references:
    - vos_rasch1981
    raison: situe le moment où un son commence à s’entendre, pas la façon dont il commence ; utile seulement pour fixer le niveau d’écoute
    statut_lecture: résumé (Vos et Rasch 1981, page de l’éditeur)
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
note_conditions: 'l’attaque dépend de la façon dont le son est produit (facette `production`, spec §9.7 H, règle 9) : le même objet frappé ou frotté ne commence pas pareil, et une voix peut partir d’un
  coup ou monter peu à peu ; la salle est notée dans l’épisode. Le niveau d’écoute est réglé une fois, puis laissé fixe : le moment où l’on entend le début d’un son change avec le niveau (Vos et Rasch,
  1981 ; Gordon, 1987) [[vos_rasch1981]] [[gordon1987]]. Un enregistrement doit commencer avant le son : un début coupé retire une partie de la montée. Piège : pour un son frappé suivi d’une résonance,
  l’oreille juge la raideur de l’attaque plus par la façon dont le son s’éteint que par la façon dont il apparaît (Chion, 1983, art. 97) [[chion1983]] ; on s’efforce de juger le début du son, et la résonance
  à part.'
porteur: un son qui commence pendant l’écoute, produit par un objet, un appareil ou une voix, de la façon déclarée (facette `production`)
arité: 1
condition_NA: son déjà en cours quand l’écoute commence (une machine en marche), ou rien ne sonne de la façon déclarée (un objet qui ne sonne pas sous le geste déclaré).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `abrupt` (rang 1) vers `gradual` (rang 3), le son met de plus en plus de temps à s’installer
  numerique: non
  regions:
  - cle: abrupt
    label_fr: abrupte
    label_en: abrupt
    rang: 1
    repere: le son part d’un coup (un claquement de mains, une porte qui claque)
    exemplaires: []
  - cle: quick
    label_fr: rapide
    label_en: quick
    rang: 2
    repere: le son part vite, sans claquer (une touche de piano enfoncée doucement)
    exemplaires: []
  - cle: gradual
    label_fr: progressive
    label_en: gradual
    rang: 3
    repere: le son monte peu à peu (une soufflerie ou un aspirateur qui démarre)
    exemplaires: []
note_categories: 'Trois régions, de l’attaque la plus raide à la plus lente : c’est une position de travail de l’équipe (choix de relecture (2026-11-04)), qu’aucune source ne fixe, sans borne en millisecondes
  ; les durées données dans les épisodes sont mesurées par l’équipe sur les enregistrements et restent indicatives. Schaeffer [[schaeffer1966]], lu via Chion (art. 97) [[chion1983]], distingue sept « genres
  d’attaque » (noms lus dans la traduction anglaise : sudden, steep, soft, flat, gentle, sforzando, non-existent) ; les trois régions de PPP sont plus grossières, sans correspondance vérifiée.'
identite: La façon dont le son commence, pas sa force (force du son), pas la façon dont il s’éteint (extinction du son), pas le timbre dans son ensemble (la couleur du son, ce qui fait reconnaître l’instrument).
