etat_de_l_art: 'Sources : chez McAdams et al. (1995) [[mcadams1995]], sur 18 sons d’instruments synthétisés de même hauteur et de même force, le logarithme du temps de montée explique 88 % d’une des trois
  dimensions communes du timbre, une dimension qui, selon les auteurs, suggère une séparation entre les sources mises en vibration par une impulsion brève (un coup, un pincement) et les sources entretenues
  (un souffle, un archet) ; dans ces 18 sons, une attaque raide va souvent avec une extinction immédiate. Chez Grey (1977, résumé lu) [[grey1977]], deux dimensions tiennent au début du son, plutôt à la
  couleur de l’attaque qu’à sa vitesse (des harmoniques aigus plus ou moins simultanés, une énergie faible et aiguë plus ou moins présente) ; Peeters et al. (2011) [[peeters2011]] jugent peu fiable un temps
  d’attaque mesuré avec des seuils fixes sur l’enveloppe, et adaptent les seuils à chaque son. On entend un son commencer quand son enveloppe atteint environ 15 dB sous son maximum, moment qui bouge un
  peu avec le niveau (Vos et Rasch, 1981) [[vos_rasch1981]], et le moment où l’on entend l’attaque dépend du temps de montée et du niveau d’écoute (Gordon, 1987) [[gordon1987]]. Schaeffer [[schaeffer1966]],
  lu via Chion (1983, art. 97, lu en traduction) [[chion1983]], distingue la raideur de l’attaque, sa couleur et sept « genres d’attaque » ; l’oreille juge la raideur par la façon dont l’énergie apparaît
  pour un son entretenu (ses expériences de montage de bande portent sur des apparitions de l’énergie d’environ 3 à 50 ms), plutôt par la façon dont elle disparaît pour un son frappé suivi d’une résonance.
  Aucune source trouvée ne fixe des régions perçues de l’attaque, ni des bornes en millisecondes entre elles (détail : docs/bibliographie-par-type.md#groupe-son).'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-son
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:soundAttack a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « j’entends un son » à « j’écoute comment il commence » change la description (deux sons de même hauteur et de même force peuvent partir tout autrement).
transfert: objet conçu oui (le clic d’un interrupteur, le claquement d’une portière) | tableau non (sans son) | cuisine oui (le déclic d’un couvercle, une bouilloire qui démarre) | high-tech oui (le début
  d’un signal sonore) | architecture oui (une porte qui claque)
