# Série 50 (2026-10-15) : fiche en préparation, rédigée sans exemplaire ; aucun champ n’est encore relu.
id: ppp:soundAttack
label_fr: attaque du son
label_en: attack
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- son
définition: La façon dont le son commence, du son qui part d’un coup à celui qui monte peu à peu.
question_attentionnelle: Le son part-il d’un coup, vite, ou monte-t-il progressivement ?
contre_exemple: 'Une machine déjà en marche quand on arrive n’a pas d’attaque qu’on puisse entendre : le type ne s’applique pas. Un son fort n’a pas pour autant une attaque abrupte : la force du son est
  une autre qualité.'
grandeur_physique_homonyme: 'temps de montée (en millisecondes) : aucune région ne s’en déduit.'
modalites:
- audition
mode_de_presentation: échantillon
conditions_critiques:
- production
note_conditions: 'l’attaque dépend du geste qui fait sonner l’objet (facette `production`, spec §9.7 H, règle 9) : le même objet frappé ou frotté ne commence pas pareil ; la salle est notée dans l’épisode.
  Piège : pour un son frappé, l’oreille juge l’attaque en partie par la façon dont le son s’éteint (Chion, 1983, art. 97) [[chion1983]] ; on juge le début du son, et la résonance à part.'
porteur: un son qui commence pendant l’écoute, produit par un objet sous un geste ou un fonctionnement déclaré
arité: 1
condition_NA: son déjà en cours quand l’écoute commence (une machine en marche), ou objet qui ne sonne pas sous le geste déclaré.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `abrupt` (rang 1) vers `gradual` (rang 3), le son met de plus en plus de temps à s’installer
  numerique: non
  regions:
  - cle: abrupt
    label_fr: abrupte
    label_en: abrupt
    rang: 1
    repere: le son part d’un coup (un claquement de mains, une baguette sur un bois)
    exemplaires: []
  - cle: quick
    label_fr: rapide
    label_en: quick
    rang: 2
    repere: le son part vite, sans éclater (une corde pincée)
    exemplaires: []
  - cle: gradual
    label_fr: progressive
    label_en: gradual
    rang: 3
    repere: le son monte peu à peu (un archet qui attaque doucement, une soufflerie qui démarre)
    exemplaires: []
identite: La façon dont le son commence, pas sa force (force du son), pas la façon dont il s’éteint (résonance), pas le timbre dans son ensemble.
relations:
- type: confusableWith
  cible: ppp:soundDecay
  note: 'pour un son frappé, l’oreille juge l’attaque en partie par la façon dont le son s’éteint (Chion, 1983, art. 97) [[chion1983]] : on juge le début et la fin à part (réciproque écrite aussi dans soundDecay)'
