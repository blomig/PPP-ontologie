# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:symmetry
label_fr: symétrie
label_en: symmetry
labels_alternatifs: []
patron: P1
sorte: qualité
sous_sorte: gestalt
strate: semi-formel
base_dependance:
  types:
  - ppp:contour
  facteurs_non_perceptuels: []
facettes:
- forme
- organisation
définition: Degré auquel une forme ou une composition paraît se correspondre, comme dans un miroir, de part et d’autre d’un axe, ou en tournant autour d’un centre.
question_attentionnelle: La forme paraît-elle symétrique, presque symétrique ou asymétrique ?
contre_exemple: 'Une frise de motifs identiques qui se suivent dans le même sens (une file d’oiseaux tous tournés vers la droite) est une répétition, pas une symétrie : elle relève de la distribution.'
mesure:
  etat: methodes
  synthese: 'En vision par ordinateur, la symétrie se mesure comme une grandeur continue : la distance de symétrie est le plus petit déplacement des points d’une forme qui la rend symétrique [[zabrodsky1995]].
    C’est une mesure associée indirecte, calculée sur des points relevés ; elle ne saisit ni l’orientation de l’axe par rapport à l’observateur, ni la distance de vue, ni l’observateur.'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: zabrodsky1995
    nom: distance de symétrie
    grandeur: plus petit déplacement quadratique moyen des points d’une forme pour obtenir une forme symétrique
    unite_ou_echelle: distance sans dimension (forme normalisée par sa taille)
    references:
    - zabrodsky1995
    proximite: indirecte
    ecart: 'géométrique : elle dépend des points relevés et de leur appariement, choisis par l’opérateur, et ne saisit ni l’orientation de l’axe par rapport à l’observateur, ni la distance de vue, ni l’éclairage,
      ni l’observateur ; méthode de recherche, non normalisée'
    conditions: points ou contour relevés sur la forme ou son image ; type de symétrie (miroir, rotation) choisi
    statut_lecture: résumé lu (Zabrodsky et al. 1995, Crossref et OpenAlex)
modalites:
- vision
mode_de_presentation: image
conditions_critiques:
- angle
note_conditions: vue de biais, une forme symétrique paraît déformée ; l’angle de vue doit être déclaré
porteur: une configuration (forme, objet, composition)
arité: 1
condition_NA: porteur sans configuration de parties perceptibles (un aplat).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `asymmetric` (rang 1) vers `symmetric` (rang 3), la correspondance perçue de part et d’autre augmente
  numerique: non
  regions:
  - cle: asymmetric
    label_fr: asymétrique
    label_en: asymmetric
    rang: 1
    repere: aucune correspondance perçue entre deux moitiés
    exemplaires:
    - ppp-a:pilote-2201
  - cle: nearSymmetric
    label_fr: presque symétrique
    label_en: near-symmetric
    rang: 2
    repere: correspondance d’ensemble, avec des écarts visibles
    exemplaires:
    - ppp-a:pilote-2202
  - cle: symmetric
    label_fr: symétrique
    label_en: symmetric
    rang: 3
    repere: les deux moitiés paraissent se correspondre exactement
    exemplaires:
    - ppp-a:pilote-2203
identite: Correspondance de part et d’autre d’un axe ou d’un centre, pas la régularité d’une répartition (distribution).
relations:
- type: confusableWith
  cible: ppp:distribution
  note: une frise de motifs tournés dans le même sens montre d’abord une répartition régulière (distribution) ; la symétrie au sens de cette fiche demande un axe ou un centre ; savoir si le même motif répété
    en glissant (une translation) est aussi une symétrie reste ouvert (T9)
