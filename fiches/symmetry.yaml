etat_de_l_art: 'La perception de la symétrie a une littérature abondante : Treder (2010) [[treder2010]] en fait la revue, centrée sur la symétrie bilatérale (en miroir, de part et d’autre d’un axe). Koning
  et Wagemans (2009) [[koning_wagemans2009]] montrent que symétrie et répétition se détectent différemment selon qu’elles portent sur un objet ou sur deux, ce qui touche directement T9 (la répétition par
  glissement, ou translation). Wagemans et al. (2012) [[wagemans2012]] situent la symétrie parmi les facteurs de groupement. Détail : docs/bibliographie-par-type.md#groupe-forme.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-forme
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:symmetry a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois la forme » à « je cherche si ses deux moitiés se répondent » change la description (recherche d’un axe ou d’un centre, repérage des écarts).
transfert: objet conçu oui (vase, chaise) | tableau oui (composition centrée ou décentrée) | cuisine oui (vaisselle) | high-tech oui (façade d’un appareil) | architecture oui (façade)
