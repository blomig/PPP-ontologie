  reference_id: hunter1937
  note: une des six sortes de brillance de Hunter, mesurée ; PPP qualifie la netteté des reflets vue, du mat au miroir ; ne fournit pas de régions ; non déclaré exact (spec §9.7 O)
note_labels_regions: 'Labels de région « mat / satiné / brillant / miroir » (décision de l’éditeur du projet, 2026-10-10, T29), après recherche d’une catégorisation reconnue des niveaux de brillance : les sources vérifiées donnent des sortes de brillance (Hunter 1937) [[hunter1937]] ou des géométries de mesure (ISO 2813, ASTM D523) [[iso2813]] [[astm_d523]], pas des niveaux perçus nommés (docs/bibliographie-par-type.md#groupe-matiere). « Brillant » et « brillance » sont de même racine dans le même type, comme « symétrique » et « symétrie » : pas de collision avec le label d’un autre type (A2, §9.7 J) ; le sens « couleur vive » est traité par un avertissement sur le label.'
