      (la lumière qu’une surface émet ou renvoie dans une direction), « désuet » sauf en astronomie (fiche « luminance lumineuse ») ; dans le vocabulaire des peintures, il le donne comme une appellation
      ancienne de la luminosité d’une surface qui émet de la lumière, et en déconseille l’emploi parce qu’on peut confondre « brillance » et « brillant », qui désigne le reflet net (fiche « brillance »,
      1983). L’Académie française note : « on dit plutôt Luminance ». Ces sens parlent de la quantité de lumière, plus proche de la clarté, pas de la netteté des reflets. Ce type ne qualifie que la netteté
      des reflets : c’est pourquoi son nom complet est « brillance de surface », et « brillance » seul ne s’emploie que là où l’on sait qu’on parle de ce type. Position de travail, révisable par l’éditeur
      du projet (T29).'
    raison: 'T33, objection de la relecture explicative (série 6) : l’attribution GDT était mal faite. Pages revérifiées le 2026-10-10 : fiche 8885899 « brillance » (peinture, contrôle de la qualité des
      peintures, 1983) : « appellation ancienne, encore quelquefois utilisée, pour désigner la luminosité d’une surface qui émet un rayonnement lumineux » ; emploi déconseillé « en regard aux confusions
      possibles entre le terme « brillance » qui évoque la réflexion diffuse et le terme « brillant » qui évoque la réflexion régulière » ; fiche 8876545 « luminance lumineuse » (photométrie, 1993) : «
      brillance », terme « désuet », « La luminance lumineuse était appelée autrefois brillance », « reste toujours utilisé en astronomie ». Avertissement simplifié : sans nom de relation, de clé de région
      ni de renvoi à la spec. T29 : rappel que « brillant » désigne ici les reflets'
    remarque: 're-confirmé par la relecture explicative (vérification finale de la série 6) : chaque affirmation correspond aux fiches GDT 8885899 et 8876545 relues le 2026-10-10 (« appellation ancienne…
      luminosité d’une surface qui émet un rayonnement lumineux », déconseillé pour la confusion avec « brillant » qui évoque la réflexion régulière ; « La luminance lumineuse était appelée autrefois brillance
      », désuet, « toujours utilisé en astronomie » ; luminance : lumière « émise » ou « renvoyée » dans une direction) et à l’article de l’Académie (« on dit plutôt Luminance »), relu le même jour ; texte
      clair pour un profane'
  - champ: identite
    date: '2026-10-11'
    avant: Netteté des reflets d’une surface, pas la vivacité de sa couleur (saturation), pas sa clarté, pas ce qu’on voit à travers (vue à travers). La matité est le pôle bas de ce type, pas un autre type.
    apres: Netteté des reflets d’une surface, pas la vivacité de sa couleur (saturation), pas sa clarté, pas ce qu’on voit à travers (transparence). La matité est le pôle bas de ce type, pas un autre type.
    raison: 'T28 tranché par l’éditeur du projet le 2026-10-11 : label canonique de ppp:translucency « transparence » (« vue à travers » en label alternatif) ; seul le nom du type change'
