- 'labels de région : « mat / satiné / brillant / miroir », tranchés (T29, décision de l’éditeur du projet, 2026-10-10 ; clés inchangées)'
- 'ne s’explique pas sans aide (relecture explicative, série 6) : exemple concret : l’avertissement est lourd et « brillant » est ambigu (couleur vive ou reflet net) ; au 2026-10-14, les quatre régions
  ont un exemplaire relu ; reste un exemple concret, en tête de fiche, qui montre la différence entre « brillant » (reflet net) et « vif » (saturation) ; le 2026-11-15 : épisodes proposés pour cet exemple
  (des pigments très vifs et mats, l’intérieur d’un bol à glaçure presque noire et brillant ; en présence, un papier rouge vif et un carreau noir émaillé) ; reste à les réaliser ou à entrer un exemplaire'
- 'frontière entre « brillant » et « miroir » : la fiche oppose le reflet net de la source et des images nettes, sans dire à partir de quand une image est nette (un émail très tendu, un noir poli) ; laissée
  à l’épreuve d’accord (E1) (choix de relecture (2026-11-15))'
