  - champ: espace_valeurs.regions.matte.repere
    date: '2026-11-15'
    avant: aucun reflet, sous aucun angle (un plâtre, un papier buvard)
    apres: aucun reflet, même en bougeant la tête ou l’objet (un plâtre, un papier buvard)
    raison: 'lot 14 : « sous aucun angle » ne se vérifie pas ; le critère dit le geste de la question attentionnelle ; choix de relecture (2026-11-15)'
  - champ: note_conditions
    date: '2026-11-15'
    avant: les reflets dépendent de la lumière et de l’angle de vue ; un jugement fait sur une photo dont l’angle et la lumière de prise de vue sont inconnus est « non tranché » (spec §9.7 H, règle 4 ; A5)
    apres: 'les reflets dépendent de la lumière et de l’angle de vue ; un jugement fait sur une photo dont l’angle et la lumière de prise de vue sont inconnus est « non tranché » (spec §9.7 H, règle 4 ; A5).
      Sur une image, on ne peut ni bouger la tête ni tourner l’objet : on demande « Sur cette image, voit-on sur cette surface aucun reflet, un reflet doux et étalé, le reflet net d’une lampe ou d’une fenêtre,
      ou des images comme dans un miroir ? », et la réponse dit seulement ce que l’image montre, sous l’angle et la lumière de la prise de vue.'
    raison: 'lot 14 : sur une photo, on ne peut pas bouger la tête ; la consigne sur image est écrite dans la fiche ; choix de relecture (2026-11-15)'
