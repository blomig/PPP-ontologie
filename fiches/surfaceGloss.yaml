- relation: skos:relatedMatch
  cible: distinctness-of-reflected-image gloss (Hunter 1937)
  reference: Hunter, R. S. (1937). Methods of determining gloss. Journal of Research of the National Bureau of Standards, 18(1), 19 et suiv. doi:10.6028/jres.018.006
  reference_id: hunter1937
  note: une des six sortes de brillance de Hunter, mesurée ; PPP qualifie la netteté des reflets vue, du mat au miroir ; ne fournit pas de régions ; non déclaré exact (spec §9.7 O)
note_labels_regions: 'Labels de région « mat / satiné / brillant / miroir » (décision de l’éditeur du projet, 2026-10-10, T29), après recherche d’une catégorisation reconnue des niveaux de brillance : les
  sources vérifiées donnent des sortes de brillance (Hunter 1937) [[hunter1937]] ou des géométries de mesure (ISO 2813, ASTM D523) [[iso2813]] [[astm_d523]], pas des niveaux perçus nommés (docs/bibliographie-par-type.md#groupe-matiere).
  « Brillant » et « brillance » sont de même racine dans le même type, comme « symétrique » et « symétrie » : pas de collision A2 au sens de §9.7 J (qui vise un label d’un autre type) ; le sens « couleur
  vive » est traité par avertissement_label.'
