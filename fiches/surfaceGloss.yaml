etat_de_l_art: 'La brillance perçue a une littérature récente : Pellacini, Ferwerda et Greenberg (2000) [[pellacini2000]] dégagent ses dimensions perçues à partir de jugements humains ; Motoyoshi et al.
  (2007) [[motoyoshi2007]] relient le brillant perçu à des mesures simples calculées sur l''image ; Fleming (2014) [[fleming2014]] soutient que la vue reconnaît les matériaux à leur aspect, sans retrouver
  leurs propriétés physiques. Hunter (1937) [[hunter1937]] distingue six sortes de brillance, dont la netteté de l''image réfléchie, voisine de ce type ; Leloup et al. (2014) [[leloup2014]] rappellent que
  la mesure de brillant faite par un appareil ne prédit pas bien la brillance vue, et Fleming, Dror et Adelson (2003) [[fleming2003]] que le jugement dépend de l''éclairage. Dans ce qui en a été lu (résumés,
  pages d''éditeur), aucune ne nomme des niveaux perçus. La mesure de brillant des normes (ISO 2813, ASTM D523) [[iso2813]] [[astm_d523]] porte le même nom sans être ce type ; le mot « brillance » est aussi
  l''ancien nom de la luminance (OQLF, Académie française) [[oqlf_brillance]] [[academie_brillance]]. Détail : docs/bibliographie-par-type.md#groupe-matiere.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-matiere
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:surfaceGloss a exactement un ppp:about.
- conceptuel: Les 4 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 4 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 4 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une surface » à « je regarde ses reflets en bougeant » change la description (ce que la surface renvoie de la pièce, changement d’aspect avec le point de vue).
transfert: objet conçu oui (émail, vernis, métal) | tableau oui (un vernis, ou une toile laissée sans vernis) | cuisine oui (inox poli, faïence) | high-tech oui (coque mate ou laquée, écran)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs à une région près, au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques (spec §9.7 H)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: on peut faire varier la brillance de surface en tenant la clarté constante (des surfaces de même clarté, du mat au miroir)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
- id: surfaceGloss-1
  nature: structure
  enonce: sous une lumière dirigée, une surface de la région `mirror` montre entre reflets et zones voisines un contraste de clarté au moins « évident » (région `marked` de `ppp:lightnessContrast`) (tendsToProduce)
  statut_epistemique: non éprouvé
  epreuve: null
