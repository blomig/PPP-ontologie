# Série 114 ter (2026-11-15) : épisodes du lot 14 : anglais de la préparation, de la note et du motif de doute ; crédits des images ; identifiants internes remplacés par des mots dans les textes des épisodes (choix de relecture (2026-11-15)).
id: ppp:surfaceGloss
label_fr: brillance de surface
label_en: surface gloss
label_court: brillance
labels_alternatifs: []
avertissement_label: '« Brillance » et « brillant » ont d’autres sens que ce type. En français courant, « une couleur brillante » veut souvent dire une couleur vive : c’est la saturation, pas ce type. Ici,
  « brillant » désigne une surface qui renvoie un reflet net de la lumière. « Brillance » a aussi un sens technique ancien. Le Grand dictionnaire terminologique de l’OQLF le donne comme l’ancien nom de
  la luminance (la lumière qu’une surface émet ou renvoie dans une direction), « désuet » sauf en astronomie (fiche « luminance lumineuse ») ; dans le vocabulaire des peintures, il le donne comme une appellation
  ancienne de la luminosité d’une surface qui émet de la lumière, et en déconseille l’emploi parce qu’on peut confondre « brillance » et « brillant », qui désigne le reflet net (fiche « brillance », 1983).
  L’Académie française note : « on dit plutôt Luminance ». Ces sens parlent de la quantité de lumière, plus proche de la clarté, pas de la netteté des reflets. Ce type ne qualifie que la netteté des reflets
  : c’est pourquoi son nom complet est « brillance de surface », et « brillance » seul ne s’emploie que là où l’on sait qu’on parle de ce type. Position de travail, révisable par l’éditeur du projet (T29).'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: 'Netteté des reflets que montre une surface : de la surface sans aucun reflet à celle où l’on voit, comme dans un miroir, des images nettes de ce qui l’entoure.'
question_attentionnelle: En bougeant un peu la tête ou l’objet, voit-on sur cette surface aucun reflet, un reflet doux et étalé, le reflet net d’une lampe ou d’une fenêtre, ou des images comme dans un miroir
  ?
contre_exemple: 'Une couleur vive n’est pas brillante pour autant : un papier rouge vif peut être tout à fait mat ; ce qui est vif, c’est sa saturation. Et une surface claire ne renvoie pas plus de reflets
  qu’une sombre : un carrelage noir poli montre des reflets nets, un plâtre blanc n’en montre aucun.'
grandeur_physique_homonyme: '« brillance » désigne aussi la brillance spéculaire mesurée au brillancemètre, en unités de brillance (voir la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: 'Le brillant des surfaces se mesure au brillancemètre (brillance spéculaire) et, pour les surfaces très brillantes, par la netteté de l’image réfléchie. Ces mesures visent un aspect proche de
    ce type, sur des échantillons plans, mais une valeur ne donne pas un degré perçu : la perception du brillant a plusieurs dimensions [[leloup2014]].'
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso2813
    nom: brillance spéculaire (brillancemètre)
    grandeur: lumière renvoyée dans la direction spéculaire, rapportée à un étalon
    unite_ou_echelle: unités de brillance (GU), géométries 20°, 60° et 85°
    references:
    - iso2813
    - astm_d523
    proximite: proche
    ecart: 'mesure la quantité de lumière renvoyée dans une direction, pas la netteté des reflets ; ASTM D523 note que peu de résultats publiés relient les intervalles mesurés aux intervalles perçus, tout en signalant un bon accord avec les classements visuels pour des revêtements (section 5.3)'
    conditions: revêtement non texturé sur substrat plan et opaque ; angle fixé par la norme
    statut_lecture: 'lu en partie : ISO 2813 : résumé public lu ; ASTM D523 : sections 1.1 et 5.1 à 5.4 lues sur la page de l’éditeur'
  - id: astm_d5767
    nom: netteté de l’image réfléchie (distinctness of image, DOI)
    grandeur: netteté de l’image d’une fente réfléchie par la surface
    unite_ou_echelle: 'valeur de netteté d’image, de 0 à 100 (100 : netteté parfaite, ASTM D5767 section 4.5)'
    references:
    - astm_d5767
    - astm_e430
    proximite: proche
    ecart: 'mesure la netteté de l’image réfléchie, que la brillance spéculaire ne note pas de façon satisfaisante (ASTM D5767 section 4.2) ; ne vaut que pour des surfaces très brillantes et planes : ASTM E430 la dit inadaptée aux finitions diffuses (section 1.1)'
    conditions: surfaces planes ou rendues planes ; revêtements (D5767) ; surfaces très brillantes, 20° ou 30° (E430)
    statut_lecture: 'lu en partie : pages de l’éditeur, sections 1.1 à 1.3 et 4.2 à 4.5 (D5767), sections 1.1 à 1.3 (E430)'
modalites:
- vision
mode_de_presentation: échantillon
conditions_critiques:
- lumiere
- angle
note_conditions: 'les reflets dépendent de la lumière et de l’angle de vue ; un jugement fait sur une photo dont l’angle et la lumière de prise de vue sont inconnus est « non tranché » (spec §9.7 H, règle
  4 ; A5). Sur une image, on ne peut ni bouger la tête ni tourner l’objet : on demande « Sur cette image, voit-on sur cette surface aucun reflet, un reflet doux et étalé, le reflet net d’une lampe ou d’une
  fenêtre, ou des images comme dans un miroir ? », et la réponse dit seulement ce que l’image montre, sous l’angle et la lumière de la prise de vue.'
ancrage:
  dimension: espace
  dimension_en: space
  note_ancrage: 'la netteté des reflets se lit dans les images que la surface renvoie de ce qui l’entoure, une configuration étendue'
  note_ancrage_en: 'the sharpness of the reflections is read in the images the surface returns of its surroundings, an extended configuration'
  empreinte: '5769284c'
