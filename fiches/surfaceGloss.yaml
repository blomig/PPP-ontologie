# Fiche de type PPP — ppp:surfaceGloss — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par, note_labels_regions.
id: ppp:surfaceGloss
label_fr: brillance de surface
label_en: surface gloss
label_court: brillance
labels_alternatifs: []
avertissement_label: '« Brillance » et « brillant » ont d’autres sens que ce type. En français courant, « une couleur brillante » veut souvent dire une couleur vive : c’est la saturation, pas ce type. Ici,
  « brillant » désigne une surface qui renvoie un reflet net de la lumière. « Brillance » a aussi un sens technique ancien. Le Grand dictionnaire terminologique de l’OQLF le donne comme l’ancien nom de
  la luminance (la lumière qu’une surface émet ou renvoie dans une direction), « désuet » sauf en astronomie (fiche « luminance lumineuse ») ; dans le vocabulaire des peintures, il le donne comme une appellation
  ancienne de la luminosité d’une surface qui émet de la lumière, et en déconseille l’emploi parce qu’on peut confondre « brillance » et « brillant », qui désigne le reflet net (fiche « brillance », 1983).
  L’Académie française note : « on dit plutôt Luminance ». Ces sens parlent de la quantité de lumière, plus proche de la clarté, pas de la netteté des reflets. Ce type ne qualifie que la netteté des reflets
  : c’est pourquoi son nom complet est « brillance de surface », et « brillance » seul ne s’emploie que là où l’on sait qu’on parle de ce type. Position de travail, révisable par l’éditeur du projet (T29).'
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: 'Netteté des reflets que montre une surface : de la surface sans aucun reflet à celle où l’on voit, comme dans un miroir, des images nettes de ce qui l’entoure.'
question_attentionnelle: En bougeant un peu la tête ou l’objet, voit-on sur cette surface aucun reflet, un reflet doux et étalé, le reflet net d’une lampe ou d’une fenêtre, ou des images comme dans un miroir
  ?
contre_exemple: 'Une couleur vive n’est pas brillante pour autant : un papier rouge vif peut être tout à fait mat ; ce qui est vif, c’est sa saturation. Et une surface claire ne renvoie pas plus de reflets
  qu’une sombre : un carrelage noir poli montre des reflets nets, un plâtre blanc n’en montre aucun.'
grandeur_physique_homonyme: 'brillance spéculaire mesurée en unités de brillance (GU) au brillancemètre, sous les géométries 20°, 60° et 85° d’ISO 2813 (« Paints and varnishes — Determination of gloss value
  at 20°, 60° and 85° ») ; la norme ASTM D523, qui emploie les mêmes géométries, note que peu de résultats publiés relient les intervalles mesurés aux intervalles perçus (« Little information about the
  relation of numerical-to-perceptual intervals of specular gloss has been published », § 5.3) : aucune région ne s’en déduit.'
modalites:
- vision
mode_de_presentation: échantillon
conditions_critiques:
- lumiere
- angle
note_conditions: les reflets dépendent de la lumière et de l’angle de vue ; un jugement fait sur une photo dont l’angle et la lumière de prise de vue sont inconnus est « non tranché » (spec §9.7 H, règle
  4 ; A5)
porteur: une surface, celle d’un objet ou d’une partie
arité: 1
condition_NA: porteur sans surface perceptible (une lumière, un son).
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `matte` (rang 1) vers `mirror` (rang 4), les reflets deviennent plus nets
  numerique: non
  regions:
  - cle: matte
    label_fr: mat
    label_en: matte
    rang: 1
    repere: aucun reflet, sous aucun angle (un plâtre, un papier buvard)
    exemplaires:
    - ppp-a:pilote-1801
  - cle: satin
    label_fr: satiné
    label_en: satin
    rang: 2
    repere: un reflet doux et étalé, sans bord net (une coquille d’œuf, une peinture satinée)
    exemplaires:
    - ppp-a:pilote-1802
    - ppp-a:pilote-1803
  - cle: lustrous
    label_fr: brillant
    label_en: lustrous
    rang: 3
    repere: un reflet net de la source de lumière, mais pas d’image (une céramique émaillée, une pomme frottée)
    exemplaires:
    - ppp-a:pilote-1805
    labels_alternatifs:
    - à reflet net
    - lustré
  - cle: mirror
    label_fr: miroir
    label_en: mirror
    rang: 4
    repere: on voit des images nettes de ce qui entoure (un miroir, un métal poli, une eau calme)
    exemplaires:
    - ppp-a:pilote-1804
    labels_alternatifs:
    - comme un miroir
identite: Netteté des reflets d’une surface, pas la vivacité de sa couleur (saturation), pas sa clarté, pas ce qu’on voit à travers (transparence). La matité est le pôle bas de ce type, pas un autre type.
