  note: 'en français courant, « une couleur brillante » veut souvent dire une couleur vive : c’est la saturation'
- type: separableFrom
  cible: ppp:lightness
  note: 'à éprouver (E2) : des surfaces de même clarté, du mat au miroir (un carrelage noir mat et un noir poli)'
- type: tendsToProduce
  cible: ppp:lightnessContrast
  depuis: mirror
  sous_conditions:
  - 'lumiere: directional'
  note: sous une lumière dirigée, une surface qui reflète comme un miroir montre des reflets très clairs à côté de zones sombres ; énoncé de structure surfaceGloss-1
- type: separableFrom
  cible: ppp:translucency
  note: 'à éprouver (E2) : un verre dépoli laisse passer la lumière sans reflet net ; un carrelage noir poli ne laisse rien passer mais montre des reflets nets ; sur un verre ou une vitre, ce qu’on voit
    à travers peut cacher un reflet ou passer pour un reflet : on ne juge que ce que la surface renvoie'
- type: confusableWith
  cible: ppp:subsurfaceDepth
  note: un vernis épais montre souvent des reflets nets et laisse voir dans son épaisseur ; les reflets et l’épaisseur visible se jugent séparément ; la lumière qui ressort de l’intérieur d’une matière
    (l’ambre, un savon translucide) peut passer pour un reflet doux ou net
