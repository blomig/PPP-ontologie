id: ppp:lightness
label_fr: clarté
label_en: lightness
labels_alternatifs:
- valeur
patron: P1
sorte: qualité
sous_sorte: —
strate: formel
base_dependance:
  types: []
  facteurs_non_perceptuels: []
facettes:
- couleur
définition: Degré auquel une zone paraît claire ou sombre, indépendamment de sa teinte.
question_attentionnelle: Cette zone paraît-elle très sombre, sombre, moyenne, claire ou très claire ?
contre_exemple: '« Le texte noir se détache de la page blanche » parle de l’écart entre deux zones : c’est un contraste de clarté. La clarté se dit d’une seule zone (la page est très claire, le texte très
  sombre).'
grandeur_physique_homonyme: '« clarté » désigne aussi, en colorimétrie, la clarté L* calculée (CIE 1976 lightness), un corrélat approché de la clarté perçue (voir la rubrique « mesure ») : aucune région ne s’en déduit.'
mesure:
  etat: methodes
  synthese: La colorimétrie donne des échelles de clarté calculées à partir de mesures instrumentales (L* de l’espace CIELAB) ou évaluées par comparaison visuelle à des échantillons ordonnés (valeur Munsell).
    Elles visent un aspect proche de ce type, pour des surfaces opaques sous un éclairage et un observateur de référence ; elles ne tiennent pas compte de ce qui entoure la surface ni de l’éclairage réel
    de l’épisode.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: cie015
    nom: clarté L* (CIELAB)
    grandeur: clarté calculée à partir de valeurs trichromatiques mesurées (spectrophotomètre ou colorimètre)
    unite_ou_echelle: L*, 0 pour le noir, 100 pour le blanc de référence (définition de la CIE, e-ILV 17-23-076)
    references:
    - cie015
    - cie_ilv_cielab
    proximite: proche
    ecart: valeur calculée pour un observateur et un illuminant de référence, sur un échantillon isolé ; la clarté perçue dépend aussi de l’entourage et de l’éclairage de l’épisode, que L* ne prend pas
      en compte
    conditions: géométries d’éclairage et d’observation, observateur et illuminant normalisés
    statut_lecture: résumé public lu (CIE 015:2018) ; e-ILV lu (17-23-076)
  - id: astm_d1535
    nom: valeur Munsell (Munsell value)
    grandeur: clarté évaluée par comparaison visuelle avec un atlas d’échantillons ordonnés ; la norme prévoit aussi la conversion depuis des données CIE
    unite_ou_echelle: notation Munsell, composante valeur (de 0 à 10)
    references:
    - astm_d1535
    - nist_munsell_value
    proximite: proche
    ecart: une notation fine par comparaison à un atlas, pour des objets opaques à la lumière du jour ; ne tient compte ni de l’entourage ni d’un autre éclairage que celui de la norme, et ne donne pas une
      région
    conditions: objets opaques (peintures), lumière du jour, comparaison à l’atlas
    statut_lecture: 'lu en partie : page de l’éditeur, Scope section 1.1 (ASTM D1535) ; glossaire NIST lu (valeur de 0 à 10)'
