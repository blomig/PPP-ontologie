  citation: 'CIE (2018). CIE 015:2018 Colorimetry, 4th Edition. Vienne : Commission Internationale de l''Éclairage.'
  doi_ou_url: https://doi.org/10.25039/TR.015.2018
  role: contraste
  statut_verification: vérifiée sur résumé ou source secondaire
  verifie_le: '2026-10-10'
  verifie_sur: métadonnées et résumé Crossref (observateurs de référence, illuminants, coordonnées d'espace couleur, écarts de couleur) ; texte payant non lu
  reprend: rien
  ne_reprend_pas: tout son contenu (non lu) ; la clarté L*, cité dans grandeur_physique_homonyme, est vérifié sur le vocabulaire de la CIE (cie_ilv_cielab) ; aucune région ne s’en déduit
- id: cie_ilv_cielab
  citation: 'CIE S 017:2020, ILV : International Lighting Vocabulary, 2e éd., entrée 17-23-076 « CIE 1976 L*a*b* colour space ». Vienne : CIE (accès libre en ligne, e-ILV).'
  doi_ou_url: https://cie.co.at/eilvterm/17-23-076
  role: contraste
  statut_verification: vérifiée sur la source
  verifie_le: '2026-10-10'
  verifie_sur: 'entrée lue en ligne le 2026-10-10 : espace couleur CIELAB, coordonnées L*, a*, b* ; note 1 : correspondants approchés de la clarté (L*, « CIE 1976 lightness »), du chroma (« CIE 1976 a,b
    chroma ») et de la teinte (« CIE 1976 a,b hue angle », h_ab = arctan(b*/a*))'
  reprend: 'rien : L* y est un correspondant approché, calculé, de la clarté ; il est cité dans grandeur_physique_homonyme comme grandeur mesurée homonyme'
  ne_reprend_pas: l’espace CIELAB et ses formules ; aucune région ne s’en déduit
etat_de_l_art: 'La clarté correspond à la valeur du système de Munsell (1905) [[munsell1905]], « la quantité de lumière » d''une couleur selon lui, et la colorimétrie de la CIE [[cie015]] en calcule un
  correspondant approché, L* (vocabulaire international de l''éclairage [[cie_ilv_cielab]]). Gilchrist (2006) [[gilchrist2006]] consacre un livre à la perception du clair et du sombre ; son résumé rappelle
  que la lumière renvoyée par une surface ne dit pas, à elle seule, si elle est blanche, grise ou noire, puisqu''elle dépend de l''éclairage (livre non lu). PPP ne reprend aucune échelle mesurée : les régions
  sont des repères perçus. Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
