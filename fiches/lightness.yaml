définition: Degré auquel une zone paraît claire ou sombre, indépendamment de sa teinte.
question_attentionnelle: Cette zone paraît-elle très sombre, sombre, moyenne, claire ou très claire ?
contre_exemple: '« Le texte noir se détache de la page blanche » parle de l’écart entre deux zones : c’est un contraste de clarté. La clarté se dit d’une seule zone (la page est très claire, le texte très
  sombre).'
grandeur_physique_homonyme: 'luminance mesurée ; clarté L* (CIELAB) : aucune région ne s’en déduit.'
