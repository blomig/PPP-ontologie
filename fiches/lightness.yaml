  verifie_le: '2026-10-10'
  verifie_sur: 'métadonnées Crossref et résumé de l’éditeur lu (OpenAlex, 2026-10-10) : la lumière renvoyée par une surface ne révèle pas sa nuance de gris ; selon l’éclairage, une surface de n’importe
    quel gris peut renvoyer n’importe quelle quantité de lumière ; le livre fait l’historique des recherches et des théories de la clarté ; contenu non lu'
  reprend: le fait, dit dans le résumé, que la clarté vue d'une surface ne se lit pas dans la lumière qu'elle renvoie
  ne_reprend_pas: la théorie de l’auteur et le reste du livre (non lus)
