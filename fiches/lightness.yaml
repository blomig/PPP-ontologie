etat_de_l_art: 'La clarté correspond à la valeur du système de Munsell (1905) [[munsell1905]], « la quantité de lumière » d''une couleur selon lui, et la colorimétrie de la CIE [[cie015]] en calcule un
  correspondant approché, L* (vocabulaire international de l''éclairage [[cie_ilv_cielab]]). Gilchrist (2006) [[gilchrist2006]] consacre un livre à la perception du clair et du sombre ; son résumé rappelle
  que la lumière renvoyée par une surface ne dit pas, à elle seule, si elle est blanche, grise ou noire, puisqu''elle dépend de l''éclairage (livre non lu). PPP ne reprend aucune échelle mesurée : les régions
  sont des repères perçus. Détail : docs/bibliographie-par-type.md#groupe-couleur.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-couleur
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:lightness a exactement un ppp:about.
- conceptuel: Les 5 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 5 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 5 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une couleur » à « je regarde si elle est claire ou sombre » change la description (ce qui ressort la nuit, en photo noir et blanc).
transfert: objet conçu oui (céramique claire ou sombre) | tableau oui (zones claires et sombres) | cuisine oui (plan de travail) | high-tech oui (mode clair ou sombre d’un écran)
