# Fiche de type PPP — ppp:textureDirectionality — format : PPP_FicheType.md (spec v2.4)
# Champs de travail hors patron : a_relire, relecture_explicative (date, champs relus en langage courant ; a_reconfirmer), manques, source_de_la_fiche, statut_note, note_joint, avertissement_label, note_categories, note_reference, note_dimension, note_conditions, note_echelle, note_porteur, note_base, bloque_par.
id: ppp:textureDirectionality
label_fr: orientation de la texture
label_en: texture directionality
labels_alternatifs:
- directionnalité
patron: P1
sorte: qualité
sous_sorte: —
strate: semi-formel
base_dependance:
  types:
  - ppp:texture
  - ppp:contour
  facteurs_non_perceptuels: []
facettes:
- matiere
définition: Degré auquel les reliefs d’une surface (stries, sillons, côtes) paraissent aller tous dans le même sens, comme les fines stries d’un métal brossé ou les côtes d’un velours côtelé, à l’opposé
  d’un crépi où aucun sens ne se dégage.
question_attentionnelle: Les reliefs de cette surface vont-ils tous dans le même sens, seulement par endroits, ou dans tous les sens ?
contre_exemple: 'Une rangée de piquets alignés va dans un sens, mais ce sont des objets distincts : cela relève de leur distribution, pas de l’orientation d’une texture. Un métal brossé et un velours côtelé
  vont tous deux dans un sens, l’un à reliefs fins, l’autre à reliefs plus gros : la taille des reliefs relève de la texture. Et que les stries soient horizontales ou verticales ne change rien à ce degré.
  Un motif imprimé ou peint sans relief, même orienté (les veines d’un stratifié imprimé « bois »), n’a pas d’orientation de texture : la main n’y sent aucun relief, c’est un motif de teinte et de clarté.'
mesure:
  etat: methodes
  synthese: La métrologie des surfaces calcule, sur une surface relevée, si le relief a une direction privilégiée (rapport d’aspect de la texture, Str) et laquelle (direction de la texture, Std), selon
    ISO 25178-2. Ce sont des mesures associées proches de ce type ; elles se font sur un petit échantillon, à une échelle fine, et ne saisissent ni la distance de vue, ni l’éclairage, ni l’observateur.
  regions_indispensables: 'Les régions de cette fiche restent perceptives : elles décrivent ce qu’un observateur voit, entend, sent ou touche dans les conditions déclarées. Une mesure associée peut éclairer
    une observation, mais elle ne définit pas les bornes des régions et ne remplace pas l’examen.'
  methodes:
  - id: iso_25178_2
    nom: rapport d’aspect et direction de la texture (Str, Std)
    grandeur: 'rapport entre la plus courte et la plus longue distance sur laquelle le relief cesse de se ressembler à lui-même, selon la direction (Str, de 0 à 1) ; direction dominante du relief (Std)'
    unite_ou_echelle: Str entre 0 et 1, sans dimension ; Std, angle en degrés
    references:
    - iso_25178_2
    - npl_gpg116
    proximite: proche
    ecart: calculés sur une petite surface relevée, à une échelle souvent plus fine que celle qu’on voit ou qu’on sent ; ne saisissent ni la distance de vue, ni l’éclairage (une lumière rasante dans le
      sens des stries les fait ressortir ou disparaître), ni l’observateur, ni, au toucher, le sens du geste
    conditions: surface relevée par un instrument surfacique ; zone d’évaluation et filtres fixés par l’opérateur et la norme
    statut_lecture: 'résumé public lu (page de l’ISO ; sommaire de l’extrait public, sections 4.3.3 et 4.3.4) ; symboles d’après NPL, Measurement Good Practice Guide No. 116 (2010), table 1, fondé sur le projet ISO 25178-2 ; noms confirmés par le sommaire public de l’édition 2021'
modalites:
- vision
- toucher
mode_de_presentation: échantillon
conditions_critiques:
- distance
note_conditions: de loin, des reliefs fins cessent de se voir ; la lumière rasante les révèle à la vue, mais n’est pas critique au toucher (T22)
porteur: une surface, celle d’un objet ou d’une partie
arité: 1
condition_NA: surface sans relief perceptible (un verre poli, un stratifié imprimé lisse) ; un motif imprimé ou peint sans relief ne rend pas le type applicable.
espace_valeurs:
  echelle: ordinale
  sens_croissant: de `nonOriented` (rang 1) vers `oriented` (rang 3), une direction commune des reliefs s’impose davantage
  numerique: non
  regions:
  - cle: nonOriented
    label_fr: sans orientation
    label_en: non-oriented
    rang: 1
    repere: aucune direction ne se dégage (un crépi projeté, du papier de verre)
    exemplaires:
    - ppp-a:pilote-0503
  - cle: partlyOriented
    label_fr: en partie orientée
    label_en: partly oriented
    rang: 2
    repere: une direction se dégage par endroits (des coups de pinceau en relief qui suivent à peu près le même sens)
    exemplaires: []
  - cle: oriented
    label_fr: orientée
    label_en: oriented
    rang: 3
    repere: toute la surface suit une même direction (un métal brossé, un velours côtelé)
    exemplaires:
    - ppp-a:pilote-0501
identite: Direction commune des reliefs d’une surface, pas leur taille (texture), pas la répartition d’éléments distincts (distribution), pas l’orientation d’un motif imprimé sans relief (teinte, clarté).
relations:
- type: confusableWith
  cible: ppp:distribution
  note: des éléments distincts alignés relèvent de la distribution ; l’orientation de la texture qualifie une surface
- type: separableFrom
  cible: ppp:texture
  note: 'à éprouver (E2) : une texture fine peut être orientée (un métal brossé), une grosse sans orientation (un crépi)'
- type: confusableWith
  cible: ppp:localIrregularity
  note: une surface « en partie orientée » perd sa direction par endroits ; l’irrégularité locale dit qu’une surface régulière s’écarte par endroits de sa régularité (une éraflure isolée en travers d’un
    métal brossé)
