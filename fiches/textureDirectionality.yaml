etat_de_l_art: 'La direction commune des reliefs est l''une des six dimensions de Tamura, Mori et Yamawaki (1978) [[tamura1978]], mesurée sur une image (*directionality*). Liu et Picard (1996) [[liu_picard1996]]
  en font l''une des trois composantes d''un modèle d''image (périodicité, direction, caractère aléatoire). Aucune source trouvée ne limite l''orientation aux reliefs, comme le fait PPP (T26). Détail :
  docs/bibliographie-par-type.md#groupe-texture.'
etat_de_l_art_renvoi: docs/bibliographie-par-type.md#groupe-texture
axiomes:
- conceptuel: Toute qualité particulière de ce type inhère à exactement un porteur.
  validation: Toute assertion de type ppp:textureDirectionality a exactement un ppp:about.
- conceptuel: Les 3 régions sont deux à deux disjointes et totalement ordonnées par rang.
  validation: Les 3 ppp:Region de l’échelle du type ont des ppp:rank distincts, de 1 à 3 ; une assertion a au plus un ppp:inRegion.
- conceptuel: Une région de cet espace n’est pas un sous-type du type.
  validation: Aucune ppp:Region n’est sujet ou objet de ppp:specializes.
nanay: Oui — passer de « je vois une surface striée » à « je regarde si ses reliefs suivent tous un même sens » change la description (sens dans lequel la main glisse, reflet qui file le long des stries).
transfert: objet conçu oui (métal brossé, bois raboté) | tableau oui (coups de pinceau en relief) | cuisine oui (inox brossé) | high-tech oui (coque en aluminium brossé)
enonces_testables:
- id: E1
  nature: existence
  enonce: sur 6 à 10 objets publics, accord inter-observateurs exact (échelle à trois régions ou moins, spec §9.7 C, v2.5), au-dessus du seuil fixé avant l’épreuve, à régime égal sur les facettes critiques
    (spec §9.7 H) ; vision et toucher éprouvés séparément
  statut_epistemique: non éprouvé
  epreuve: null
- id: E2
  nature: structure
  enonce: on peut faire varier l’orientation en tenant la taille des reliefs constante (une même tôle, brossée dans un sens ou en tous sens)
  statut_epistemique: non éprouvé
  epreuve: null
- id: E4
  nature: existence
  enonce: l’accord ne baisse pas significativement entre observateurs en désaccord de goût sur les objets
  statut_epistemique: non éprouvé
  epreuve: null
