# Formulaire de ticket « correction » (spec §13, docs/gouvernance.md 2.4). Modèle pour .github/ISSUE_TEMPLATE/ du dépôt public.
# Syntaxe : GitHub Docs, « Syntax for issue forms » et « Syntax for GitHub's form schema » (consultés le 2026-10-11).
name: Signaler une erreur
description: Une référence fautive, un crédit d’image, une coquille, un lien mort (ouvert à tous).
title: '[correction] '
labels:
- correction
body:
- type: markdown
  attributes:
    value: 'Ce ticket est **public**. N''y mettez ni adresse électronique ni donnée personnelle : un pseudonyme suffit. Format et traitement : `docs/gouvernance.md` (reçu, recevable, traité, réponse dans
      la semaine).'
- type: input
  id: cible
  attributes:
    label: Fiche ou page, champ ou id
    description: 'Par exemple : fiche ppp:hue, référence munsell1905.'
  validations:
    required: true
- type: dropdown
  id: erreur
  attributes:
    label: Erreur
    options:
    - référence fautive
    - statut de vérification surévalué
    - crédit d’image
    - coquille
    - lien mort
    - autre
  validations:
    required: true
- type: textarea
  id: explication
  attributes:
    label: Ce qui est faux
    description: Décrivez l’erreur.
  validations:
    required: true
- type: input
  id: source
  attributes:
    label: Source qui la montre (facultatif)
    description: Lien ou référence.
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: Version de la spécification
    description: Affichée en pied de page du site, par exemple 2.8.
    placeholder: '2.8'
  validations:
    required: true
- type: input
  id: pseudonyme
  attributes:
    label: Pseudonyme (facultatif)
    description: Repris dans le champ `auteur` du ticket. Jamais d'adresse électronique.
  validations:
    required: false
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: J'accepte que ma contribution soit versée sous les licences du projet (contenu CC BY 4.0, code MIT), sans accord à signer.
      required: true
