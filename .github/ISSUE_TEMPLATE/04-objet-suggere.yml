# Formulaire de ticket « objet-suggere » (spec §13, docs/gouvernance.md 2.4). Modèle pour .github/ISSUE_TEMPLATE/ du dépôt public.
# Syntaxe : GitHub Docs, « Syntax for issue forms » et « Syntax for GitHub's form schema » (consultés le 2026-10-11).
name: Suggérer un objet
description: Proposer un objet public pour les épreuves (ouvert à tous).
title: '[objet-suggere] '
labels:
- objet-suggere
- reçu
body:
- type: markdown
  attributes:
    value: 'Ce ticket est **public**. N''y mettez ni adresse électronique ni donnée personnelle : un pseudonyme suffit. Format et traitement : `docs/gouvernance.md` (reçu, recevable, précision demandée,
      traité ; réponse dans la semaine).'
- type: markdown
  attributes:
    value: 'L''objet peut être **une image** : une photo, une affiche, une gravure. Dans ce cas, l''exemple est l''image elle-même, pas ce qu''elle montre : « Qui l''a fait ? » désigne son auteur, « Quelle
      version exactement ? » le lien précis de l''image, et le crédit de l''image est obligatoire. Vous n''avez pas besoin d''identifier ce que la photo montre. Une photo ne sert que pour ce qui se voit,
      jamais pour le toucher ; pour la taille perçue, l''équipe vérifie le repère d''échelle. Pour une photo, le même lien suffit dans les trois champs de lien (« Quelle version exactement ? », « Une page publique qui le montre », « Une image »). Pour un **objet naturel** proposé lui-même (un arbre, une pierre, un coquillage), dites où il se trouve, ou dans quelle collection.'
- type: input
  id: nom
  attributes:
    label: Nom de l'objet
    description: 'Son titre ou son nom courant. Exemple : Pont du Gard.'
  validations:
    required: true
- type: input
  id: createur
  attributes:
    label: Qui l'a fait ?
    description: 'L''auteur de l''objet lui-même : artiste, architecte, fabricant… ou tapez « je ne sais pas ». Pour un objet naturel, tapez « objet naturel ». Ne mettez pas ici l''auteur d''une photo de
      l''objet : il a son propre champ plus bas.'
  validations:
    required: false
- type: input
  id: date
  attributes:
    label: Quand ?
    description: 'Une date ou une période suffit. Pour une photo : la date de la photo, si vous la connaissez. Pour un objet naturel : la date où vous l''avez observé, si vous la connaissez. Vous pouvez
      taper « je ne sais pas », mais seulement si votre réponse à « Quelle version exactement ? » permet de retrouver l''objet (pour une photo, son lien précis suffit) ; sinon, nous ne pourrons pas retenir
      la suggestion.'
    placeholder: Ier siècle
  validations:
    required: false
- type: textarea
  id: variante
  attributes:
    label: Quelle version exactement ?
    description: 'Ce qui permet de savoir quel objet précis vous avez vu : l''exemplaire de quel musée, quelle édition, quel modèle ou quelle couleur, avant ou après une restauration. Cette réponse permet
      à d''autres de retrouver exactement le même objet, et de le regarder à leur tour. Si vous ne connaissez pas la date, cette réponse doit suffire, à elle seule, à retrouver l''objet. Si l''objet est
      une photo : le lien précis de la page de l''image (pas une recherche ni une galerie).'
    placeholder: le pont tel qu'il est en 2026
  validations:
    required: true
- type: textarea
  id: objet_naturel
  attributes:
    label: Que montre l'image, ou où trouver l'objet naturel ?
    description: 'Facultatif. Si vous proposez une photo, vous pouvez dire ce qu''elle montre, si vous le savez : ce n''est pas obligatoire. Si vous proposez un objet naturel lui-même (pas en photo), dites
      où le trouver : le lieu (commune, parc, adresse, coordonnées), ou la collection qui le conserve avec son numéro s''il en a un, et l''espèce si vous la connaissez. « Un chêne » désigne une catégorie
      : pour un objet naturel proposé lui-même, il faut ce spécimen précis.'
    placeholder: platane du parc X à Lyon, près de l'entrée nord ; ou muséum Y, spécimen n° …
  validations:
    required: false
- type: input
  id: lien
  attributes:
    label: Une page publique qui le montre
    description: 'Une page que tout le monde peut ouvrir : musée, encyclopédie en ligne, médiathèque libre, fabricant.'
  validations:
    required: true
- type: input
  id: images
  attributes:
    label: Une image
    description: Facultatif. Un lien vers une image, pas un fichier. L'équipe vérifie toujours elle-même la licence avant de reprendre une image.
  validations:
    required: false
- type: dropdown
  id: image_libre
  attributes:
    label: Savez-vous si elle est libre ?
    description: Seulement si vous donnez une image.
    options:
    - Oui, une licence libre est indiquée sur la page
    - Gratuite à réutiliser, mais avec sa propre licence (par exemple Unsplash)
    - Je ne sais pas
    - Non
  validations:
    required: false
- type: input
  id: credit_image
  attributes:
    label: Qui a fait l'image, et sous quelle licence ?
    description: 'Obligatoire si l''objet proposé est une image ; sinon, seulement si vous donnez une image. L''auteur de la photo (ou du scan) et la page où elle se trouve sont obligatoires ; la licence, si vous la voyez. Ce n''est pas l''auteur de l''objet : la photo d''un tableau a son propre auteur. Si l''objet proposé est l''image elle-même, répétez ici son auteur.'
    placeholder: photo de …, licence CC BY-SA 4.0, Wikimedia Commons
  validations:
    required: false
- type: dropdown
  id: presentation
  attributes:
    label: Comment l'avez-vous vu ?
    options:
    - Sur place
    - En main
    - Posé sur une table
    - Au mur ou en vitrine
    - À l'écran, en photo
    - Sur une image imprimée
    - En le parcourant de l'intérieur, une pièce, un bâtiment
    - Je ne sais plus
  validations:
    required: false
- type: dropdown
  id: distance
  attributes:
    label: À quelle distance ?
    description: 'Si vous l''avez vu en photo : sur la photo, l''objet tient-il dans la main, remplit-il un pan de mur, ou est-ce une façade vue du sol ? Nous en déduirons une distance approximative.'
    options:
    - Assez près pour le toucher
    - À moins d'un mètre
    - Dans la même pièce, à quelques mètres
    - De loin, à plus de 5 mètres
    - Je ne sais pas
  validations:
    required: false
- type: dropdown
  id: lumiere
  attributes:
    label: Quelle lumière ?
    options:
    - Douce et égale
    - Venant d'un côté, soleil ou lampe
    - 'Rasante : elle fait ressortir les reliefs'
    - 'À contre-jour : la lumière vient de derrière l''objet'
    - Je ne sais pas
  validations:
    required: false
- type: dropdown
  id: angle
  attributes:
    label: Sous quel angle ?
    options:
    - De face
    - De biais
    - Presque à ras de la surface
    - En tournant autour, ou en le tournant dans les mains
    - Je ne sais pas
  validations:
    required: false
- type: dropdown
  id: duree
  attributes:
    label: Combien de temps ?
    description: Facultatif.
    options:
    - Un coup d'œil, quelques secondes
    - Environ une minute
    - Longtemps, plus de cinq minutes
    - Je ne sais pas
  validations:
    required: false
- type: textarea
  id: remarques
  attributes:
    label: Ce que vous remarquez
    description: 'Facultatif. Ce qu''on voit : formes, couleurs, matière, organisation. Décrivez sans juger : « beau » ou « réussi » ne décrivent rien.'
  validations:
    required: false
- type: input
  id: pseudonyme
  attributes:
    label: Pseudonyme
    description: Facultatif. Le nom sous lequel vous voulez apparaître. Jamais d'adresse électronique.
  validations:
    required: false
- type: dropdown
  id: langue
  attributes:
    label: Langue / Language
    description: Langue du ticket (facultatif) / Language of the ticket (optional).
    options:
    - fr
    - en
    default: 0
  validations:
    required: false
- type: checkboxes
  id: licence
  attributes:
    label: Licence
    options:
    - label: J'accepte que ma contribution soit versée sous les licences du projet (contenu CC BY 4.0, code MIT), sans accord à signer.
      required: true
